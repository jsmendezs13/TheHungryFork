<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hungry Fork — Menu &amp; Ratings | Seb's Analytics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1a18a0;
    --navy-dark: #12107a;
    --navy-light: #e8ebf7;
    --white: #ffffff;
    --off-white: #f7f8fc;
    --text: #1a1a2e;
    --muted: #5a5a7a;
    --border: #d0d4e8;
    --star-on: #f59e0b;
    --star-off: #d0d4e8;
    --green: #16a34a;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); background: var(--off-white); line-height: 1.6; }

  /* NAV */
  nav { background: var(--navy); position: sticky; top: 0; z-index: 100; }
  .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .nav-logo { font-size: 0.95rem; font-weight: 700; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; }
  .nav-back { color: rgba(255,255,255,0.7); font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .nav-back:hover { color: #fff; }

  /* RESTAURANT HERO */
  .rest-hero { background: var(--navy); color: #fff; padding: 3rem 2rem 2.5rem; text-align: center; }
  .rest-badge { display: inline-block; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 4px 14px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.8); margin-bottom: 1rem; }
  .rest-name { font-size: clamp(2rem, 5vw, 3rem); font-weight: 700; margin-bottom: 0.5rem; }
  .rest-meta { display: flex; align-items: center; justify-content: center; gap: 1.5rem; flex-wrap: wrap; font-size: 0.88rem; color: rgba(255,255,255,0.65); margin-bottom: 1.5rem; }
  .rest-meta span { display: flex; align-items: center; gap: 5px; }
  .overall-rating { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.12); border-radius: 10px; padding: 0.6rem 1.25rem; }
  .overall-num { font-size: 1.6rem; font-weight: 700; color: #fff; }
  .overall-stars { color: var(--star-on); font-size: 1.1rem; letter-spacing: 2px; }
  .overall-count { font-size: 0.78rem; color: rgba(255,255,255,0.55); }

  /* FILTER BAR */
  .filter-bar { background: var(--white); border-bottom: 0.5px solid var(--border); padding: 0.75rem 2rem; position: sticky; top: 60px; z-index: 90; }
  .filter-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--white); color: var(--muted); font-size: 0.82rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .filter-btn:hover:not(.active) { border-color: var(--navy); color: var(--navy); }

  /* MENU GRID */
  .menu-section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }
  .category-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.25rem; padding-bottom: 0.5rem; border-bottom: 0.5px solid var(--border); }
  .dishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; margin-bottom: 3rem; }

  /* DISH CARD */
  .dish-card { background: var(--white); border-radius: 14px; border: 0.5px solid var(--border); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
  .dish-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(26,24,160,0.08); }
  .dish-img { height: 160px; background: var(--navy-light); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; position: relative; }
  .dish-img .dish-rating-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 3px 8px; font-size: 0.78rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 4px; }
  .dish-rating-badge .star { color: var(--star-on); }
  .dish-body { padding: 1rem 1.25rem 1.25rem; }
  .dish-name { font-size: 1rem; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .dish-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.75rem; }
  .dish-footer { display: flex; align-items: center; justify-content: space-between; }
  .dish-price { font-size: 1.1rem; font-weight: 700; color: var(--navy); }
  .dish-review-count { font-size: 0.75rem; color: var(--muted); }
  .rate-btn { padding: 7px 14px; border-radius: 8px; background: var(--navy-light); color: var(--navy); border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .rate-btn:hover { background: var(--navy); color: #fff; }

  /* MODAL OVERLAY */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,40,0.55); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 18px; width: 100%; max-width: 500px; overflow: hidden; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-hero { background: var(--navy-light); height: 140px; display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; }
  .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.8); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
  .modal-body { padding: 1.5rem; }
  .modal-dish-name { font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
  .modal-dish-desc { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; }
  .modal-section-label { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }

  /* STAR PICKER */
  .star-picker { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .star-pick { font-size: 2rem; cursor: pointer; color: var(--star-off); transition: color 0.1s, transform 0.1s; }
  .star-pick:hover, .star-pick.selected { color: var(--star-on); transform: scale(1.15); }

  /* REVIEW INPUT */
  .review-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.9rem; font-family: inherit; color: var(--text); resize: vertical; min-height: 90px; outline: none; transition: border-color 0.2s; }
  .review-input:focus { border-color: var(--navy); }
  .name-input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.9rem; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; margin-bottom: 1rem; }
  .name-input:focus { border-color: var(--navy); }
  .submit-review-btn { width: 100%; background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 0.9rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 1rem; transition: background 0.2s; }
  .submit-review-btn:hover { background: var(--navy-dark); }
  .submit-review-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* REVIEWS LIST */
  .reviews-divider { border: none; border-top: 0.5px solid var(--border); margin: 1.25rem 0; }
  .reviews-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; padding-right: 4px; }
  .review-item { background: var(--off-white); border-radius: 10px; padding: 0.75rem 1rem; }
  .review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .reviewer-name { font-size: 0.85rem; font-weight: 600; color: var(--navy); }
  .review-stars { color: var(--star-on); font-size: 0.85rem; }
  .review-text { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
  .review-date { font-size: 0.72rem; color: var(--border); margin-top: 3px; }
  .no-reviews { font-size: 0.85rem; color: var(--muted); text-align: center; padding: 1rem 0; }

  /* TOAST */
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--green); color: #fff; padding: 0.75rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; z-index: 300; transition: transform 0.3s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .dishes-grid { grid-template-columns: 1fr; }
    .rest-meta { gap: 0.75rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Seb's Analytics LLC</a>
    <a href="index.html" class="nav-back">← Back to main site</a>
  </div>
</nav>

<div class="rest-hero">
  <div class="rest-badge">Partner Restaurant · New York, NY</div>
  <h1 class="rest-name">The Hungry Fork</h1>
  <div class="rest-meta">
    <span>🍽️ American · Bistro</span>
    <span>📍 123 Stone St, Manhattan, NY</span>
    <span>🕐 Mon–Sun 12pm–11pm</span>
  </div>
  <div class="overall-rating">
    <div class="overall-num" id="overall-num">—</div>
    <div>
      <div class="overall-stars" id="overall-stars">☆☆☆☆☆</div>
      <div class="overall-count" id="overall-count">No ratings yet</div>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="filter-btn active" onclick="filterDishes('all', this)">All dishes</button>
    <button class="filter-btn" onclick="filterDishes('starters', this)">Starters</button>
    <button class="filter-btn" onclick="filterDishes('entree', this)">Entrées</button>
    <button class="filter-btn" onclick="filterDishes('salads', this)">Salads</button>
    <button class="filter-btn" onclick="filterDishes('sides', this)">Sides</button>
    <button class="filter-btn" onclick="filterDishes('top-rated', this)">⭐ Top rated</button>
  </div>
</div>

<div class="menu-section">
  <div id="menu-container"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-hero" id="modal-emoji">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <span id="modal-dish-emoji" style="font-size:4rem;">🍽️</span>
    </div>
    <div class="modal-body">
      <div class="modal-dish-name" id="modal-name"></div>
      <div class="modal-dish-desc" id="modal-desc"></div>

      <div class="modal-section-label">Your rating</div>
      <div class="star-picker" id="star-picker">
        <span class="star-pick" data-val="1" onclick="pickStar(1)">★</span>
        <span class="star-pick" data-val="2" onclick="pickStar(2)">★</span>
        <span class="star-pick" data-val="3" onclick="pickStar(3)">★</span>
        <span class="star-pick" data-val="4" onclick="pickStar(4)">★</span>
        <span class="star-pick" data-val="5" onclick="pickStar(5)">★</span>
      </div>

      <input class="name-input" id="reviewer-name" type="text" placeholder="Your name (optional)">
      <div class="modal-section-label">Your review</div>
      <textarea class="review-input" id="review-text" placeholder="What did you think of this dish? (optional)"></textarea>
      <button class="submit-review-btn" id="submit-btn" onclick="submitReview()">Post review</button>

      <hr class="reviews-divider">
      <div class="modal-section-label" id="reviews-label">Reviews</div>
      <div class="reviews-list" id="reviews-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Review posted!</div>

<script>
const DISHES = [
  { id: 'korean-bbq-wing', name: 'Korean BBQ Wing', desc: 'Mango Habanero Sauce', price: 16, emoji: '🍗', category: 'starters' },
  { id: 'steak-frites', name: 'Steak Frites', desc: 'Grilled Hanger Steak, French Fries, House Salad, Steak Sauce', price: 26, emoji: '🥩', category: 'entree' },
  { id: 'lobster-ravioli', name: 'Lobster Ravioli', desc: 'Shaved Fennel, Cherry Tomato, Pink Sauce', price: 25, emoji: '🦞', category: 'entree' },
  { id: 'atlantic-salmon', name: 'Pan Seared Atlantic Salmon', desc: 'Shaved Fennel, Cherry Tomato, Pink Sauce', price: 25, emoji: '🐟', category: 'entree' },
  { id: 'burrata-salad', name: 'Burrata Mozzarella Salad', desc: 'Heirloom Tomato, Fresh Basil, Cherry Demi Glaze', price: 20, emoji: '🥗', category: 'salads' },
  { id: 'french-fries', name: 'French Fries', desc: 'Classic golden fries, crispy outside, fluffy inside', price: 8, emoji: '🍟', category: 'sides' },
  { id: 'sweet-potato-fries', name: 'Sweet Potato Fries', desc: 'Lightly seasoned, naturally sweet', price: 8, emoji: '🍠', category: 'sides' },
];

const CATEGORIES = [
  { key: 'starters', label: 'Starters' },
  { key: 'entree', label: 'Entrées' },
  { key: 'salads', label: 'Salads' },
  { key: 'sides', label: 'Sides' },
];

let ratings = {};
let currentDishId = null;
let selectedStar = 0;
let activeFilter = 'all';

function storageKey(dishId) { return 'hf_reviews_' + dishId; }

function loadRatings() {
  DISHES.forEach(d => {
    try {
      const raw = localStorage.getItem(storageKey(d.id));
      ratings[d.id] = raw ? JSON.parse(raw) : [];
    } catch(e) { ratings[d.id] = []; }
  });
}

function saveRatings(dishId) {
  try { localStorage.setItem(storageKey(dishId), JSON.stringify(ratings[dishId])); } catch(e) {}
}

function avgRating(dishId) {
  const r = ratings[dishId];
  if (!r || r.length === 0) return null;
  return r.reduce((s, x) => s + x.stars, 0) / r.length;
}

function starsHtml(avg, size) {
  if (avg === null) return '<span style="color:var(--border)">☆☆☆☆☆</span>';
  const full = Math.floor(avg);
  const half = avg - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  const s = size || '1em';
  return `<span style="color:var(--star-on);font-size:${s}">` +
    '★'.repeat(full) + (half ? '½' : '') + '<span style="color:var(--star-off)">★'.repeat(empty) + '</span></span>';
}

function renderMenu(filter) {
  const container = document.getElementById('menu-container');
  container.innerHTML = '';

  let groups = [];
  if (filter === 'top-rated') {
    const sorted = [...DISHES].filter(d => avgRating(d.id) !== null).sort((a,b) => avgRating(b.id) - avgRating(a.id));
    if (sorted.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:3rem 0;">No rated dishes yet — be the first to review!</p>';
      return;
    }
    groups = [{ label: 'Top rated dishes', dishes: sorted }];
  } else if (filter === 'all') {
    groups = CATEGORIES.map(c => ({ label: c.label, dishes: DISHES.filter(d => d.category === c.key) })).filter(g => g.dishes.length > 0);
  } else {
    groups = [{ label: CATEGORIES.find(c => c.key === filter)?.label || filter, dishes: DISHES.filter(d => d.category === filter) }];
  }

  groups.forEach(g => {
    const section = document.createElement('div');
    section.innerHTML = `<div class="category-label">${g.label}</div><div class="dishes-grid" id="grid-${g.label}"></div>`;
    container.appendChild(section);
    const grid = section.querySelector('.dishes-grid');
    g.dishes.forEach(d => {
      const avg = avgRating(d.id);
      const count = ratings[d.id]?.length || 0;
      const card = document.createElement('div');
      card.className = 'dish-card';
      card.innerHTML = `
        <div class="dish-img">
          <span>${d.emoji}</span>
          ${avg !== null ? `<div class="dish-rating-badge"><span class="star">★</span>${avg.toFixed(1)}</div>` : ''}
        </div>
        <div class="dish-body">
          <div class="dish-name">${d.name}</div>
          <div class="dish-desc">${d.desc}</div>
          <div class="dish-footer">
            <div>
              <div class="dish-price">$${d.price}</div>
              <div class="dish-review-count">${count > 0 ? `${count} review${count > 1 ? 's' : ''} · ${avg.toFixed(1)} avg` : 'No reviews yet'}</div>
            </div>
            <button class="rate-btn" onclick="openModal('${d.id}', event)">Rate & Review</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  });

  updateOverallRating();
}

function updateOverallRating() {
  const allReviews = DISHES.flatMap(d => ratings[d.id] || []);
  const numEl = document.getElementById('overall-num');
  const starsEl = document.getElementById('overall-stars');
  const countEl = document.getElementById('overall-count');
  if (allReviews.length === 0) {
    numEl.textContent = '—';
    starsEl.innerHTML = '☆☆☆☆☆';
    countEl.textContent = 'No ratings yet';
  } else {
    const avg = allReviews.reduce((s, r) => s + r.stars, 0) / allReviews.length;
    numEl.textContent = avg.toFixed(1);
    const full = Math.floor(avg), half = avg - full >= 0.5 ? 1 : 0, empty = 5 - full - half;
    starsEl.innerHTML = '★'.repeat(full) + (half ? '½' : '') + '<span style="color:rgba(255,255,255,0.25)">★</span>'.repeat(empty);
    countEl.textContent = `${allReviews.length} review${allReviews.length > 1 ? 's' : ''} across all dishes`;
  }
}

function filterDishes(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu(filter);
}

function openModal(dishId, e) {
  e.stopPropagation();
  currentDishId = dishId;
  selectedStar = 0;
  const dish = DISHES.find(d => d.id === dishId);
  document.getElementById('modal-dish-emoji').textContent = dish.emoji;
  document.getElementById('modal-name').textContent = dish.name;
  document.getElementById('modal-desc').textContent = `$${dish.price} · ${dish.desc}`;
  document.getElementById('review-text').value = '';
  document.getElementById('reviewer-name').value = '';
  document.querySelectorAll('.star-pick').forEach(s => s.classList.remove('selected'));
  document.getElementById('submit-btn').disabled = true;
  renderReviews(dishId);
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeModalOnOverlay(e) { if (e.target === document.getElementById('modal')) closeModal(); }

function pickStar(val) {
  selectedStar = val;
  document.querySelectorAll('.star-pick').forEach(s => {
    s.classList.toggle('selected', parseInt(s.dataset.val) <= val);
  });
  document.getElementById('submit-btn').disabled = false;
}

function renderReviews(dishId) {
  const list = document.getElementById('reviews-list');
  const revs = ratings[dishId] || [];
  const label = document.getElementById('reviews-label');
  label.textContent = `Reviews (${revs.length})`;
  if (revs.length === 0) {
    list.innerHTML = '<div class="no-reviews">No reviews yet. Be the first!</div>';
    return;
  }
  list.innerHTML = [...revs].reverse().map(r => `
    <div class="review-item">
      <div class="review-header">
        <span class="reviewer-name">${r.name || 'Anonymous'}</span>
        <span class="review-stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</span>
      </div>
      ${r.text ? `<div class="review-text">${r.text}</div>` : ''}
      <div class="review-date">${r.date}</div>
    </div>`).join('');
}

function submitReview() {
  if (!selectedStar) return;
  const name = document.getElementById('reviewer-name').value.trim();
  const text = document.getElementById('review-text').value.trim();
  const review = {
    stars: selectedStar,
    name: name || 'Anonymous',
    text: text,
    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
  };
  ratings[currentDishId].push(review);
  saveRatings(currentDishId);
  closeModal();
  renderMenu(activeFilter);
  showToast('Review posted! Thank you ⭐');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

loadRatings();
renderMenu('all');
</script>
</body>
</html>
