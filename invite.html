<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>An Invite · The Hungry Fork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red: #B01015; --red-dark: #7E0A0E; --red-light: #F7E3E1;
    --white: #FCF9F4; --off-white: #F5EEE3; --text: #2B211A;
    --muted: #8A7B6E; --border: #E9E0D3; --green: #4C7A4C; --ink: #2B211A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --shadow-sm: 0 1px 3px rgba(43,33,26,.06);
    --shadow-md: 0 10px 30px rgba(43,33,26,.10);
    --shadow-lg: 0 20px 50px rgba(43,33,26,.18);
  }
  body { font-family:var(--sans); color:var(--text); background:var(--off-white); line-height:1.65; -webkit-font-smoothing:antialiased; }
  .m-topbar { position:sticky; top:0; z-index:120; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; background:rgba(21,13,9,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .m-home { color:rgba(252,249,244,.8); text-decoration:none; font-size:.8rem; letter-spacing:.06em; white-space:nowrap; }
  .m-topbar-title { font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--white); }
  .m-topbar-spacer { width:64px; }
  .i-wrap { max-width:460px; margin:0 auto; padding:2rem 1rem 3rem; }
  .m-card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:1.8rem 1.4rem 1.5rem; box-shadow:var(--shadow-md); margin-bottom:1rem; text-align:center; }
  .m-eyebrow { font-size:.66rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:.6rem; }
  .i-gift { width:64px; height:64px; border-radius:50%; margin:0 auto 1rem; display:flex; align-items:center; justify-content:center; font-size:1.9rem; background:var(--red-light); }
  .i-gift.ok { background:#E4EFE4; color:var(--green); }
  .i-what { font-family:var(--serif); font-size:2.1rem; font-weight:600; line-height:1.15; }
  .i-dish-img { width:100%; max-width:300px; aspect-ratio:4/3; object-fit:cover; border-radius:14px; display:block; margin:0 auto 1rem; background:var(--off-white); }
  .i-off { display:inline-block; margin-top:.5rem; background:var(--red-light); color:var(--red-dark); border-radius:999px; padding:.3rem .85rem; font-size:.86rem; font-weight:600; }
  .i-where { font-family:var(--serif); font-size:1.25rem; color:var(--muted); margin-top:.2rem; }
  .i-from { font-size:.86rem; color:var(--text); margin-top:1rem; }
  .i-when { background:var(--off-white); border-radius:10px; padding:.8rem 1rem; font-size:.82rem; color:var(--text); margin:1.1rem 0 1.2rem; line-height:1.55; }
  .m-sub { font-size:.84rem; font-weight:300; color:var(--muted); line-height:1.6; }
  .m-err { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.85rem 1rem; font-size:.85rem; margin-bottom:1rem; }
  .m-btn { width:100%; background:var(--ink); color:var(--white); border:none; border-radius:999px; padding:1rem 1.6rem; font-size:.82rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .m-btn-ghost { display:block; width:100%; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:999px; padding:.85rem; font-size:.78rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); margin-top:.6rem; text-decoration:none; }
  .i-terms { display:inline-block; margin:-.4rem 0 1rem; font-size:.78rem; font-weight:600; color:#2F5DA8; text-decoration:underline; text-underline-offset:2px; padding:.2rem 0; }
  .i-terms-box { margin:-.5rem 0 1rem; }
  .i-terms-box .hf-l-terms { font-size:.78rem; }
  /* r35: no code in the link: the friend types it */
  .i-code { width:100%; border:1px solid var(--border); border-radius:10px; padding:.85rem 1rem; font-size:1.35rem; letter-spacing:.3em; text-align:center; font-weight:600; font-family:var(--sans);
            text-transform:uppercase; color:var(--text); background:#fff; outline:none; margin:.9rem 0 1rem; }
  .i-code:focus { border-color:var(--red); }
  .i-legal { font-size:.68rem; color:var(--muted); font-weight:300; line-height:1.5; text-align:center; padding:0 .5rem; }
  .m-skel { height:260px; background:linear-gradient(90deg,#fff 25%,var(--off-white) 50%,#fff 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:16px; border:1px solid var(--border); }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>
<link rel="stylesheet" href="/taster.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
<div class="m-topbar">
  <a href="/" class="m-home">&#8249; Site</a>
  <div class="m-topbar-title">An Invite</div>
  <span class="m-topbar-spacer"></span>
</div>
<div class="i-wrap" id="i-wrap"><div class="m-skel"></div></div>
<div class="toast" id="toast"></div>
<script>window.TASTER={successLabel:'Continue',onSuccess:function(){boot();}};</script>
<script src="/taster.js"></script>
<script>
// ── invite.html (r31) ──
//
// What a friend opens from an invite link: who sent it, which restaurant, what
// the restaurant offers, and when it works. Saving it needs an account (their
// own phone number): once saved the invite is theirs, nobody else can take it,
// and the friend who shared it cannot use it themselves. Everything is decided
// in /api/checkins; this page only shows the answers.
let CODE = null, INVITE = null, WANT_SAVE = false, TYPED = false;

// r35: /invite with no code in it (a camera that would not read the QR, a code
// read aloud): the friend types the eight characters under their friend's QR.
function askCode(err){
  wrap().innerHTML='<div class="m-card">'
    + '<div class="i-gift">&#127873;</div>'
    + '<div class="m-eyebrow">An invite from a friend</div>'
    + '<div class="i-what" style="font-size:1.6rem;">Type the invite code</div>'
    + '<div class="m-sub" style="margin-top:.5rem;">The eight characters under your friend\'s QR code.</div>'
    + (err?'<div class="m-err" style="margin-top:.9rem;margin-bottom:0;">'+esc(err)+'</div>':'')
    + '<input class="i-code" id="i-code" maxlength="12" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="A2C4E6G8" aria-label="Invite code">'
    + '<button class="m-btn" onclick="typedCode()">Open the invite</button>'
    + '<a class="m-btn-ghost" href="/">See the restaurant</a>'
    + '</div>';
  const box=document.getElementById('i-code');
  if(box){ box.focus(); box.addEventListener('keydown',function(e){ if(e.key==='Enter') typedCode(); }); }
}
function typedCode(){
  const raw=((document.getElementById('i-code')||{}).value||'').replace(/[^0-9A-Za-z]/g,'').toUpperCase();
  if(raw.length!==8){ askCode('An invite code is eight characters.'); return; }
  CODE=raw; TYPED=true;
  wrap().innerHTML='<div class="m-skel"></div>';
  boot();
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function wrap(){return document.getElementById('i-wrap');}
function day(iso){
  const d=new Date(String(iso).length===10?iso+'T12:00:00Z':iso);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'America/New_York'});
}
async function api(body, auth){
  const headers={'Content-Type':'application/json'};
  if(auth&&currentSession)headers.Authorization='Bearer '+currentSession;
  const res=await fetch('/api/checkins',{method:'POST',headers,body:JSON.stringify(body)});
  let data=null; try{data=await res.json();}catch(e){}
  return {res, data:data||{}};
}
// r32: an invite is for a dish the friend recommends: its photo, its name, and
// the restaurant's discount on it. Invites made before r32 have no dish.
function dishImg(v){
  if(!v.dishImage) return '';
  // The menu's own way (hfImgSrc in taster.js): Vercel's copy, or the photo itself.
  return '<img class="i-dish-img" src="'+esc(hfImgSrc(v.dishImage,300))+'" data-orig="'+esc(v.dishImage)+'" alt="'+esc(v.dishName||'')+'" onerror="if(!hfImgBack(this))this.remove()">';
}
function what(v){
  return v.dishName
    ? '<div class="i-what">'+esc(v.dishName)+'</div><div class="i-off">'+esc(v.discount)+' on this dish</div>'
    : '<div class="i-what">'+esc(v.discount)+'</div>';
}
// r33: the restaurant's own terms for its invites. r35 (Sebastian, 16 Oct): they
// open right here, under the link (taster.js hfTermsLink), not on another page.
function termsLink(v){
  return '<div class="i-terms-box">'+hfTermsLink(v.restaurantId,'invite')+'</div>';
}
function legal(name){
  return '<div class="i-legal">This discount is offered and given by '+esc(name||'the restaurant')
    +'. Seb&rsquo;s Analytics and Fork&rsquo;s Rating do not give or pay for it.</div>';
}

async function boot(){
  if(CODE===null){
    CODE=(new URLSearchParams(location.search).get('c')||'').trim();
  }
  if(!CODE){ askCode(); return; }
  const {res, data}=await api({action:'pass_preview', code:CODE});
  if(!res.ok){
    // r35: a typed code that did not work: ask again, with the reason
    if(TYPED){ askCode(data.error||'Could not open this invite.'); return; }
    wrap().innerHTML='<div class="m-card"><div class="m-err">'+esc(data.error||'Could not open this invite.')+'</div>'
      +'<a class="m-btn-ghost" href="/">Go to the site</a></div>';
    return;
  }
  INVITE=data.invite;
  if(WANT_SAVE&&currentSession){ WANT_SAVE=false; save(); return; }
  render();
}

function render(note){
  const v=INVITE;
  const dead = v.status==='used' ? 'This invite was already used.'
             : v.status==='expired' ? 'This invite has run out.'
             : (v.saved ? 'This invite is already saved to an account. If it is yours, open My Visits.' : '');
  wrap().innerHTML=
    '<div class="m-card">'
  + (v.dishImage ? dishImg(v) : '<div class="i-gift">&#127873;</div>')
  + '<div class="m-eyebrow">'+esc(v.from)+(v.dishName?' recommends':' invited you')+'</div>'
  + what(v)
  + '<div class="i-where">at '+esc(v.restaurant)+'</div>'
  + '<div class="i-when">Use it once, from <b>'+esc(day(v.usableFrom))+'</b> until <b>'+esc(day(v.expiresAt))+'</b>. '
  +   'Save it to your account, then show it to your waiter from <b>My Visits</b>.</div>'
  + termsLink(v)
  + (note?'<div class="m-err">'+esc(note)+'</div>':'')
  + (dead
      ? '<div class="m-sub" style="margin-bottom:1rem;">'+esc(dead)+'</div>'
        + (v.saved&&currentSession?'<button class="m-btn" onclick="openMyVisits()">Open My Visits</button>':'')
      : '<button class="m-btn" id="i-save" onclick="save()">'+(currentSession?'Save it to my account':'Log in or sign up to save it')+'</button>'
        + '<div class="m-sub" style="margin-top:.7rem;">With your own phone number. It takes a minute.</div>')
  + '<a class="m-btn-ghost" href="/">See the restaurant</a>'
  + '</div>'
  + legal(v.restaurant);
}

async function save(){
  if(!currentSession){ WANT_SAVE=true; openTasterModal(); return; }
  const btn=document.getElementById('i-save');
  if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  const {res, data}=await api({action:'pass_claim', code:CODE}, true);
  if(res.status===401){ logout(); render('Please log in again.'); return; }
  if(!res.ok){ render(data.error||'Could not save it.'); return; }
  const v=data.invite;
  wrap().innerHTML=
    '<div class="m-card">'
  + '<div class="i-gift ok">&#10003;</div>'
  + '<div class="m-eyebrow">Saved to your account</div>'
  + what(v)
  + '<div class="i-where">at '+esc(v.restaurant)+'</div>'
  + '<div class="i-when">'+(v.usableToday?'It works today':'It works from <b>'+esc(day(v.usableFrom))+'</b>')
  +   ' until <b>'+esc(day(v.expiresAt))+'</b>. At the restaurant, open <b>My Visits</b> and tap <b>Show my invite</b>.</div>'
  + termsLink(v)
  + '<button class="m-btn" onclick="openMyVisits()">Open My Visits</button>'
  + '<a class="m-btn-ghost" href="/">See the restaurant</a>'
  + '</div>'
  + legal(v.restaurant);
}

loadSession();
boot();
</script>
</body>
</html>
