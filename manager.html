<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manager · The Hungry Fork</title>
<!-- r38 (Sebastian, 16 Oct): this page as an app on the staff's phones. Share → Add to Home Screen (iPhone) or
     ⋮ → Add to Home screen / Install app (Android) puts the "HF Staff" icon on the phone; it opens this page full
     screen, without the browser's bars. Only this page offers it: the guests' pages stay as they are. The clock
     bar on top stays black (it never covers the page). staff-app.json says the rest (name, icons, colors). -->
<link rel="manifest" href="/staff-app.json">
<link rel="apple-touch-icon" href="/staff-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HF Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red: #B01015; --red-dark: #7E0A0E; --red-light: #F7E3E1;
    --white: #FCF9F4; --off-white: #F5EEE3; --text: #2B211A;
    --muted: #8A7B6E; --border: #E9E0D3; --star-on: #D9A441;
    --star-off: #DCD2C4; --green: #4C7A4C; --ink: #2B211A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --shadow-sm: 0 1px 3px rgba(43,33,26,.06);
    --shadow-md: 0 10px 30px rgba(43,33,26,.10);
    --shadow-lg: 0 20px 50px rgba(43,33,26,.18);
  }
  body { font-family:var(--sans); color:var(--text); background:var(--off-white); line-height:1.65; -webkit-font-smoothing:antialiased; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6.5rem); }   /* r29: room under the last card for the round chat button */

  .m-topbar { position:sticky; top:0; z-index:120; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; background:rgba(21,13,9,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .m-home { color:rgba(252,249,244,.8); text-decoration:none; font-size:.8rem; letter-spacing:.06em; white-space:nowrap; }
  .m-topbar-title { font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--white); }
  .m-topbar-spacer { width:64px; }

  .m-wrap { max-width:720px; margin:0 auto; padding:1.5rem 1rem 0; }

  .m-card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:1.4rem 1.2rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; }
  .m-eyebrow { font-size:.66rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:.5rem; }
  .m-h { font-family:var(--serif); font-size:1.6rem; font-weight:600; line-height:1.2; margin-bottom:.4rem; }
  .m-sub { font-size:.86rem; font-weight:300; color:var(--muted); line-height:1.6; }

  .m-btn { background:var(--ink); color:var(--white); border:none; border-radius:999px; padding:.85rem 1.6rem; font-size:.78rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); transition:background .2s, transform .15s; }
  .m-btn:hover { background:#463629; transform:translateY(-1px); }
  .m-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }

  .m-select { width:100%; border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; }
  .m-select:focus { border-color:var(--red); }

  .m-role { display:inline-block; flex:none; font-size:.6rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; padding:.3rem .7rem; border-radius:999px; background:var(--off-white); color:var(--muted); border:1px solid var(--border); text-align:center; white-space:nowrap; line-height:1.4; }
  .m-role.platform { background:var(--ink); color:var(--white); border-color:var(--ink); }
  .m-role.owner { background:var(--red-light); color:var(--red-dark); border-color:rgba(176,16,21,.25); }

  /* ── DISH ROW ── */
  .m-dish { background:var(--white); border:1px solid var(--border); border-radius:14px; margin-bottom:.7rem; box-shadow:var(--shadow-sm); overflow:hidden; transition:opacity .2s; }
  .m-dish.is-hidden { opacity:.55; }
  .m-dish-head { display:flex; align-items:center; gap:.85rem; padding:.95rem 1rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-dish-emoji { font-size:1.6rem; line-height:1; flex:none; }
  /* r29 (Sebastian, 12 Oct): the dish's own small photo instead of the emoji (the emoji comes back if the photo cannot be loaded) */
  .m-dish-thumb { flex:none; width:54px; height:54px; border-radius:12px; overflow:hidden; background:var(--off-white); border:1px solid var(--border); display:block; }
  .m-dish-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .m-dish-id { flex:1; min-width:0; }
  .m-dish-name { font-family:var(--serif); font-size:1.15rem; font-weight:600; line-height:1.25; }
  .m-dish-meta { font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .m-dish-caret { color:var(--muted); font-size:.8rem; flex:none; transition:transform .25s; }
  .m-dish.open .m-dish-caret { transform:rotate(90deg); }

  .m-flags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.35rem; }
  .m-flag { font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; }
  .m-flag.sold { background:#F6E2E1; color:var(--red-dark); }
  .m-flag.hid  { background:var(--off-white); color:var(--muted); }
  .m-flag.pick { background:#EDE3C9; color:#7A5B12; }

  .m-dish-body { display:none; padding:0 1rem 1.1rem; border-top:1px solid var(--border); }
  .m-dish.open .m-dish-body { display:block; }

  .m-switch-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 0; border-bottom:1px solid var(--border); }
  .m-switch-label { font-size:.88rem; }
  .m-switch-note { font-size:.72rem; color:var(--muted); line-height:1.5; margin-top:.1rem; }
  .m-switch { flex:none; width:50px; height:29px; border-radius:999px; border:none; background:var(--star-off); position:relative; cursor:pointer; transition:background .22s; padding:0; }
  .m-switch::after { content:''; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.28); transition:transform .22s; }
  .m-switch.on { background:var(--green); }
  .m-switch.on::after { transform:translateX(21px); }
  .m-switch.on.warn { background:var(--red); }
  .m-switch:disabled { opacity:.5; cursor:not-allowed; }

  .m-field { margin-top:.95rem; }
  .m-field-label { font-size:.66rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem; }
  .m-input, .m-textarea { min-width:0; max-width:100%; width:100%; border:1px solid var(--border); border-radius:10px; padding:.65rem .85rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; transition:border-color .2s; }
  .m-input:focus, .m-textarea:focus { border-color:var(--red); }
  .m-textarea { resize:vertical; min-height:80px; line-height:1.6; }
  .m-count { font-size:.68rem; color:var(--muted); text-align:right; margin-top:.2rem; }
  .m-count.over { color:var(--red); font-weight:600; }

  .m-actions { display:flex; align-items:center; gap:.7rem; margin-top:1rem; }
  .m-save { background:var(--red); color:#fff; border:none; border-radius:999px; padding:.7rem 1.4rem; font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-save:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .m-revert { background:none; border:none; color:var(--muted); font-size:.76rem; text-decoration:underline; cursor:pointer; font-family:var(--sans); }

  /* ── ALLERGEN CHECKLIST ── */
  .m-group { border-top:1px solid var(--border); margin-top:1.1rem; padding-top:.9rem; }
  .m-group-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-group-title { font-family:var(--serif); font-size:1.02rem; font-weight:600; }
  .m-group-sum { font-size:.7rem; color:var(--muted); }
  .m-group-caret { color:var(--muted); font-size:.75rem; transition:transform .25s; }
  .m-group.open .m-group-caret { transform:rotate(90deg); }
  .m-group-body { display:none; padding-top:.7rem; }
  .m-group.open .m-group-body { display:block; }

  .m-alg-note { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.75rem .85rem; font-size:.76rem; line-height:1.6; margin-bottom:.9rem; }
  .m-alg-sub { font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:.9rem 0 .5rem; }
  .m-alg-sub:first-child { margin-top:0; }
  .m-alg-grid { display:grid; grid-template-columns:1fr 1fr; gap:.4rem .6rem; }
  @media (max-width:420px) { .m-alg-grid { grid-template-columns:1fr; } }
  .m-alg { display:flex; align-items:center; gap:.5rem; padding:.42rem .55rem; border:1px solid var(--border); border-radius:9px; background:#fff; cursor:pointer; font-size:.82rem; -webkit-tap-highlight-color:transparent; }
  .m-alg input { accent-color:var(--red); width:16px; height:16px; flex:none; margin:0; }
  .m-alg.on { border-color:rgba(176,16,21,.45); background:#FDF4F3; font-weight:500; }
  .m-alg.major { border-left:3px solid var(--red); }

  .m-alg-count { display:inline-block; font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; background:#F6E2E1; color:var(--red-dark); }
  .m-alg-count.none { background:var(--off-white); color:var(--muted); }

  .m-locked { margin-top:1rem; padding:.8rem .9rem; background:var(--off-white); border-radius:10px; font-size:.76rem; color:var(--muted); line-height:1.65; }

  /* ── PEOPLE ── */
  .m-person { display:flex; align-items:center; gap:.8rem; padding:.75rem 0; border-bottom:1px solid var(--border); }
  .m-person:last-child { border-bottom:none; }
  .m-person-id { flex:1; min-width:0; }
  .m-person-name { font-size:.92rem; font-weight:500; }
  .m-person-sub { font-size:.72rem; color:var(--muted); margin-top:.1rem; }
  .m-person-x { flex:none; background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:.3rem .75rem; font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-person-x:hover { border-color:var(--red); color:var(--red); }
  .m-person-x:disabled { opacity:.4; cursor:not-allowed; }
  .m-add-row { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .m-add-row .m-input { flex:1 1 160px; }
  .m-add-row .m-select { flex:0 1 130px; }
  .m-codes { display:flex; align-items:center; gap:.45rem; font-size:.7rem; color:var(--muted); margin-top:.25rem; }
  .m-codes input { accent-color:var(--red); margin:0; }

  .m-empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.9rem; }
  .m-err { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.85rem 1rem; font-size:.85rem; margin-bottom:1rem; }

  .m-skel { height:74px; background:linear-gradient(90deg,#fff 25%,var(--off-white) 50%,#fff 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px; margin-bottom:.7rem; border:1px solid var(--border); }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── HEADER, TABS ── */
  body.rv-mode { padding-bottom:0; }
  .m-head-card { padding:1rem 1.1rem; }
  .m-head-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
  .m-head-row .m-h { margin:0; font-size:1.35rem; }
  .m-head-row .m-eyebrow { margin-bottom:.2rem; }
  .m-tabs { display:flex; align-items:center; gap:.4rem; margin:0 0 .9rem; }
  .m-tabbar { flex:1; display:flex; background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px; }
  .m-tab { flex:1 1 auto; text-align:center; border:none; background:none; font-family:var(--sans); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:.6rem .55rem; border-radius:999px; color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-tab.on { background:var(--ink); color:var(--white); }
  .m-gear { flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; -webkit-tap-highlight-color:transparent; }
  .m-gear.on { background:var(--ink); color:var(--white); border-color:var(--ink); }
  /* r34: a red dot on the settings button: support messages not read yet */
  .m-gear { position:relative; }
  .m-gear-dot { position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding:0 4px; border-radius:999px; background:var(--red); color:#fff; border:2px solid var(--white);
                font-size:.6rem; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; font-family:var(--sans); box-sizing:border-box; }
  /* r34: Settings → the sanitary inspection grade */
  .rv-g-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:.85rem 0 .5rem; }
  .rv-g-tile { height:98px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px solid #E2D6C6; background:#fff;
               color:var(--text); font-family:var(--sans); font-size:.72rem; font-weight:500; cursor:pointer; padding:4px 0; min-width:0; -webkit-tap-highlight-color:transparent; }
  .rv-g-tile img { width:56px; height:56px; object-fit:contain; display:block; }
  .rv-g-tile .rv-g-none { width:50px; height:50px; margin:3px 0; border-radius:50%; border:1.5px dashed #CDBFAE; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .rv-g-tile.on { border:1.5px solid var(--red); background:var(--red-light); color:var(--red-dark); font-weight:600; }
  .rv-g-tile:disabled { cursor:default; }
  .rv-g-sees { font-size:.78rem; color:var(--text); margin:.15rem 0 .2rem; }
  .rv-g-note { font-size:.74rem; color:var(--muted); line-height:1.55; margin:.45rem 0 .2rem; }
  .rv-g-note a { color:var(--blue); font-weight:600; }
  /* r34: Settings → Support: the restaurant's conversation with Seb's Analytics */
  .sp-sub { font-size:.82rem; color:var(--muted); line-height:1.55; margin-top:.3rem; }
  .sp-msgs { max-height:440px; overflow-y:auto; background:var(--off-white); border-radius:12px; padding:.75rem .7rem; margin:.85rem 0 .75rem; display:flex; flex-direction:column; gap:.5rem; overscroll-behavior:contain; }
  .sp-msgs .mg-bub { max-width:88%; }
  .sp-empty { color:var(--muted); font-size:.82rem; line-height:1.55; text-align:center; padding:1.1rem .6rem; }
  .sp-seen { align-self:flex-end; font-size:.62rem; color:var(--muted); margin-top:-.3rem; }
  .sp-text { display:block; width:100%; min-height:96px; resize:vertical; font-family:var(--sans); font-size:.88rem; line-height:1.5; padding:.65rem .8rem;
             border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); }
  .sp-text:focus { outline:none; border-color:var(--red); }
  .sp-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-top:.55rem; }
  .sp-count { font-size:.7rem; color:var(--muted); }
  .sp-count.over { color:var(--red); font-weight:600; }
  .sp-waiting { margin-top:.75rem; font-size:.76rem; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; }
  .sp-wait { font-family:var(--sans); font-size:.76rem; font-weight:600; border:1px solid rgba(176,16,21,.35); background:var(--red-light); color:var(--red-dark); border-radius:999px; padding:.35rem .75rem; cursor:pointer; }
  .sp-foot { font-size:.72rem; color:var(--muted); line-height:1.55; margin-top:.75rem; }

  /* The corner menu's list is invisible while it is closed, but it is still a
     tall box in the top-right corner, and it swallowed taps on the gear and the
     › arrow under it. menu.html has the same two lines. */
  #hf-corner:not(.open), #hf-corner:not(.open) .hf-corner-items { pointer-events:none; }
  #hf-corner .hf-corner-toggle { pointer-events:auto; }

  /* ── RESERVATIONS: THE DAYS ── */
  :root { --blue:#2F5DA8; --blue-light:#E4ECF8; --amber:#8A5A0B; --amber-light:#F6EBD6; }
  .rv-car { display:flex; align-items:center; gap:.35rem; margin-bottom:.35rem; }
  .rv-arrow { flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:#fff; font-size:1.05rem; line-height:1; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 0 2px; font-family:var(--sans); }
  .rv-arrow:disabled { opacity:.3; cursor:default; }
  /* The days swipe like the evening: a strip that scrolls sideways and snaps,
     the day in the middle bigger and dark. Every day is the same width, so the
     snapping never shifts; "bigger" is a transform, painted as it rolls. */
  .rv-strip { position:relative; flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden; padding:.75rem 0; min-width:0;
              scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
              -webkit-mask-image:linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
                      mask-image:linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); }
  .rv-strip::-webkit-scrollbar { display:none; }
  .rv-strip-pad { flex:none; width:1px; height:1px; }
  .rv-cday { flex:none; width:54px; text-align:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:.4rem 0; font-family:var(--sans); color:var(--text); cursor:pointer;
             scroll-snap-align:center; transform-origin:50% 50%; will-change:transform, opacity; -webkit-tap-highlight-color:transparent; }
  .rv-cday b { display:block; font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-cday span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-cday i { display:block; font-style:normal; font-size:.56rem; color:var(--red); font-weight:600; margin-top:.1rem; white-space:nowrap; }
  .rv-cday i.shut { color:var(--muted); font-weight:500; }
  .rv-cday.on { background:var(--ink); border-color:var(--ink); color:var(--white); box-shadow:0 8px 20px rgba(43,33,26,.25); }
  .rv-cday.on span { color:rgba(252,249,244,.75); } .rv-cday.on i { color:#FF9C92; } .rv-cday.on i.shut { color:rgba(252,249,244,.6); }
  /* r27 (Sebastian, 12 Oct): today is blue here too, as in Messages, so where we are is easy to find.
     Light blue when another day is shown; solid blue when today is the day in the middle. */
  .m-eyebrow .reviewer-handle { text-transform:none; letter-spacing:.02em; }   /* "Signed in as SANTIAGO (Santi_V)": the handle keeps its own letters */
  .rv-cday.today { z-index:1; background:var(--blue-light); border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .rv-cday.today span { color:var(--blue); font-weight:700; }
  .rv-cday.today b { color:var(--blue); }
  .rv-cday.today i, .rv-cday.today i.shut { color:#1F3F75; }
  .rv-cday.today.on { background:var(--blue); border-color:var(--blue); box-shadow:0 8px 20px rgba(47,93,168,.4); }
  .rv-cday.today.on span, .rv-cday.today.on b, .rv-cday.today.on i, .rv-cday.today.on i.shut { color:#fff; }
  .rv-dateline { text-align:center; font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.7rem; }

  .rv-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-bottom:.8rem; }
  .rv-tile { background:#fff; border:1px solid var(--border); border-radius:12px; padding:.55rem .3rem; text-align:center; font-family:var(--sans); color:var(--text); }
  button.rv-tile { cursor:pointer; }
  .rv-tile b { display:block; font-family:var(--serif); font-size:1.45rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-tile span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-tile.red b { color:var(--red); }

  .rv-grab { width:44px; height:5px; border-radius:999px; background:var(--border); margin:0 auto .8rem; }
  .rv-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.6rem; }
  .rv-sheet-head .m-h { font-size:1.35rem; margin:0; }
  .rv-x { border:none; background:none; font-size:1.5rem; line-height:1; color:var(--muted); cursor:pointer; padding:.2rem .4rem; }
  .rv-rq { border:1px solid var(--border); border-radius:14px; padding:.85rem .9rem; margin-bottom:.7rem; background:#fff; }
  .rv-rq-when { font-size:.8rem; margin-top:.2rem; }
  .rv-rq-form { margin-top:.7rem; padding-top:.7rem; border-top:1px solid var(--border); }
  /* r29 (Sebastian, 12 Oct: "they look laid over each other"): minmax(0,1fr) and min-width:0 — a phone's date or time field
     has a width of its own, and a plain 1fr column grows to hold it and runs under its neighbour. */
  .rv-form-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.5rem; }
  .rv-form-row > .m-field, .rv-room-grid > .m-field { min-width:0; }
  .rv-public { margin:.55rem 0 .2rem; padding:.55rem .75rem; border-radius:10px; background:var(--blue-light); color:var(--text); font-size:.76rem; line-height:1.5; }
  .rv-public b { color:var(--blue); font-weight:600; }
  .rv-form-row[hidden] { display:none; }   /* "Closed all day" hides Opens/Closes: the grid above would beat hidden */
  .rv-form-row .m-field { margin-top:.6rem; }

  /* ── SETTINGS AND NUMBERS ── */
  .rv-back { border:none; background:none; color:var(--red); font-family:var(--sans); font-size:.74rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; padding:.2rem 0 .8rem; }
  .rv-nums { width:100%; border-collapse:collapse; font-size:.8rem; margin-top:.3rem; }
  .rv-nums th { font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:right; padding:.3rem .2rem; }
  .rv-nums th:first-child, .rv-nums td:first-child { text-align:left; white-space:nowrap; }
  .rv-nums td { padding:.45rem .2rem; border-top:1px solid var(--border); text-align:right; font-variant-numeric:tabular-nums; }
  .rv-nums td b { font-weight:600; }
  /* r31: the rewards card */
  .rv-l-group { background:var(--off-white); border-radius:10px; padding:.2rem .8rem .6rem; margin:.1rem 0 .7rem; }
  /* r33 (Sebastian, 14 Oct): the prize is picked from five tiles (his choice,
     option B), and every reward has the restaurant's own terms. */
  .rv-l-pick { margin:.6rem 0 .1rem; }
  .rv-l-tiles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .rv-l-tile { height:70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid #E2D6C6; background:#fff; color:var(--text); font-family:var(--sans); font-size:.69rem; font-weight:500; cursor:pointer; padding:0; min-width:0; -webkit-tap-highlight-color:transparent; }
  .rv-l-tile svg { flex:none; margin:0; }
  .rv-l-tile.on { border:1.5px solid var(--red); background:var(--red-light); color:var(--red-dark); font-weight:600; }
  .rv-l-tile:disabled { cursor:default; opacity:1; }
  .rv-l-sees { font-size:.76rem; color:var(--muted); margin:.45rem 0 .1rem; }
  .rv-l-sees b { color:var(--text); font-weight:600; }
  .rv-l-terms { margin:.75rem 0 .2rem; }
  .rv-l-terms textarea { display:block; width:100%; min-height:112px; resize:vertical; font-family:var(--sans); font-size:.84rem; line-height:1.5; padding:.6rem .75rem; border:1px solid var(--border); border-radius:10px; background:#fff; color:var(--text); }
  .rv-l-terms textarea:disabled { background:var(--off-white); color:var(--muted); }
  .rv-l-terms-note { font-size:.72rem; color:var(--muted); line-height:1.5; margin-top:.3rem; }
  .rv-l-terms-page { display:inline-block; font-size:.78rem; font-weight:600; color:var(--blue); padding:.3rem 0; }
  .rv-l-group .rv-rule:last-child { border-bottom:none; }
  .rv-l-text { margin:.5rem 0 .2rem; }
  .rv-l-stat { font-size:.78rem; color:var(--muted); line-height:1.6; padding-top:.3rem; }
  .rv-l-stat b { color:var(--text); }
  .rv-l-list { margin-top:.8rem; border-top:1px solid var(--border); }
  .rv-l-item { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.8rem; }
  .rv-l-item b { display:block; font-weight:500; }
  .rv-l-item span { display:block; color:var(--muted); font-size:.74rem; }
  .rv-l-item em { font-style:normal; font-size:.66rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; padding:.25rem .55rem; border-radius:999px; background:var(--off-white); color:var(--muted); }
  .rv-l-item em.rv-l-ready { background:var(--red-light); color:var(--red-dark); }
  .rv-l-item em.rv-l-used { background:#E4EFE4; color:#2F5A2F; }
  .rv-l-legal { font-size:.7rem; margin-top:.8rem; }
  .rv-rule { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.6rem 0; border-bottom:1px solid var(--border); }
  .rv-rule:last-of-type { border-bottom:none; }
  .rv-rule label { font-size:.84rem; line-height:1.4; }
  .rv-rule small { display:block; font-size:.7rem; color:var(--muted); }
  .rv-rule .m-input, .rv-rule .m-select { width:88px; flex:none; text-align:center; padding:.5rem .4rem; }
  .rv-day { padding:.6rem 0; border-bottom:1px solid var(--border); }
  .rv-day:last-of-type { border-bottom:none; }
  .rv-day-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; font-size:.86rem; font-weight:500; }
  .rv-svc { display:flex; align-items:center; gap:.35rem; margin-top:.4rem; font-size:.8rem; color:var(--muted); }
  .rv-svc .m-input { width:auto; flex:1; min-width:0; padding:.45rem .5rem; font-size:.84rem; }
  .rv-codebar { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin:0 0 .9rem; padding:.5rem .6rem .5rem .85rem; background:var(--white);
                border:1px dashed #DCCFBE; border-radius:12px; font-size:.76rem; color:var(--muted); }
  .rv-code-link { display:inline-flex; align-items:center; gap:.4rem; text-decoration:none; color:var(--text); padding:.4rem .8rem; }
  .rv-mini { border:1px solid var(--border); background:#fff; color:var(--muted); border-radius:999px; padding:.28rem .7rem; font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); flex:none; }
  .rv-mini.red { color:var(--red-dark); border-color:rgba(176,16,21,.35); }
  .rv-mini.armed { background:var(--red); color:#fff; border-color:var(--red); }
  .rv-closed { color:var(--muted); font-style:italic; font-size:.8rem; }
  .rv-hol { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.84rem; }
  .rv-hol small { display:block; color:var(--muted); font-size:.72rem; }
  .rv-hol small.warn { color:var(--red-dark); font-weight:500; }
  .rv-room { padding:.7rem 0; border-bottom:1px solid var(--border); }
  .rv-room-grid { display:grid; grid-template-columns:minmax(0,1fr) 70px 70px; gap:.4rem; align-items:end; }
  .rv-room-grid .m-field { margin-top:0; }
  .rv-room-foot { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-top:.5rem; font-size:.78rem; color:var(--muted); }
  .rv-readonly { font-size:.74rem; color:var(--muted); background:var(--off-white); border-radius:10px; padding:.6rem .8rem; margin-bottom:1rem; line-height:1.55; }

  /* ═══ GUEST MESSAGES (r21, Sebastian 8 Oct: pictures 13 and 17) ═══ */
  /* The card: the code moves beside the time; the chat sign takes the right of the name line. */
  .rv-when { justify-content:flex-start; gap:.7rem; }
  .rv-name { display:flex; align-items:flex-start; gap:.5rem; }
  .rv-name-text { flex:1; min-width:0; }
  .rv-chat-sign { flex:none; position:relative; width:38px; height:38px; margin:-6px -4px -4px 0; border-radius:50%; border:1px solid rgba(176,16,21,.35);
                  background:#fff; color:var(--red); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; }
  .rv-chat-sign svg { width:20px; height:20px; }
  .rv-chat-sign.new { background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 4px 12px rgba(176,16,21,.35); }
  .rv-chat-sign.shut { color:var(--muted); border-color:var(--border); }
  .rv-chat-sign b, .mg-bubble b, .mg-n { min-width:20px; height:20px; padding:0 5px; border-radius:999px; font-size:.66rem; font-weight:700; line-height:1; letter-spacing:0;
                  display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .rv-chat-sign b { position:absolute; top:-6px; right:-6px; background:#fff; color:var(--red); border:2px solid var(--red); }
  /* The bubble: the way in to every conversation, bottom right, like Messenger's. */
  .mg-bubble { position:fixed; right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:280; width:62px; height:62px; border-radius:50%;
               border:none; background:var(--red); color:#fff; box-shadow:0 10px 26px rgba(176,16,21,.45); display:flex; align-items:center; justify-content:center;
               cursor:pointer; padding:0; -webkit-tap-highlight-color:transparent; transition:transform .15s; }
  .mg-bubble:active { transform:scale(.94); }
  /* r29 (Sebastian, 12 Oct: it covered the Tables field and a dish name): on a phone the button steps aside while the page
     moves and while a field is being written in, and comes back a moment after. */
  .mg-bubble { transition:transform .18s, opacity .18s; }
  @media (max-width:700px) { .mg-bubble.away { transform:translateX(calc(100% + 24px)); opacity:0; pointer-events:none; } }
  @media (prefers-reduced-motion:reduce) { .mg-bubble { transition:none; } }
  .mg-bubble[hidden] { display:none; }
  .mg-bubble svg { width:29px; height:29px; }
  .mg-bubble b { position:absolute; top:-3px; right:-3px; min-width:24px; height:24px; background:#fff; color:var(--red); border:2px solid var(--red); font-size:.74rem; }
  /* The window */
  .mg-sheet { height:min(88vh, 860px); max-height:none; display:flex; flex-direction:column; overflow:hidden; padding-bottom:calc(env(safe-area-inset-bottom,0px) + .8rem); }
  .mg-sheet > * { flex:none; }
  #mg-sheet-host .rv-scrim { z-index:310; } #mg-sheet-host .rv-sheet { z-index:311; }   /* r30: a request's chat opens over the requests */
  .mg-who { font-size:.74rem; color:var(--muted); background:var(--off-white); border-radius:10px; padding:.45rem .7rem; margin-top:.45rem; line-height:1.45; }
  .mg-tabs { display:flex; gap:.35rem; background:var(--off-white); border-radius:999px; padding:.25rem; margin-bottom:.4rem; }
  .mg-tab { flex:1; border:none; background:none; border-radius:999px; padding:.55rem .5rem; font-family:var(--sans); font-size:.7rem; font-weight:600; letter-spacing:.14em;
            text-transform:uppercase; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:.4rem; }
  .mg-tab.on { background:#fff; color:var(--text); box-shadow:0 2px 8px rgba(43,33,26,.12); }
  .mg-days { display:flex; align-items:center; gap:.35rem; }
  /* r22: a swiping strip like the evening's — the day in the middle is the day. */
  .mg-strip { position:relative; flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden; padding:.6rem 0 .55rem; scrollbar-width:none; min-width:0;
              scroll-snap-type:x mandatory; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
              -webkit-mask-image:linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
                      mask-image:linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
  .mg-strip::-webkit-scrollbar { display:none; }
  .mg-pad { flex:none; width:1px; height:1px; }
  .mg-day { position:relative; flex:none; width:50px; text-align:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:.35rem 0 .3rem; font-family:var(--sans);
            color:var(--text); cursor:pointer; scroll-snap-align:center; -webkit-tap-highlight-color:transparent; }
  .mg-day span { display:block; font-size:.54rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .mg-day b { display:block; font-family:var(--serif); font-size:1.15rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .mg-day i { display:block; font-style:normal; font-size:.54rem; color:var(--muted); min-height:.8rem; white-space:nowrap; }
  .mg-day.on { background:var(--ink); border-color:var(--ink); color:var(--white); box-shadow:0 6px 16px rgba(43,33,26,.25); }
  .mg-day.on span, .mg-day.on i { color:rgba(252,249,244,.75); }
  .mg-day span.dot { position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:50%; background:var(--red); border:2px solid var(--white); box-sizing:border-box; }
  /* r26 (Sebastian, 12 Oct): today's chip is a little bigger and blue, so where we are is easy to find.
     It grows with transform, not width: a day stays one 56px slot (MG_SLOT), so the strip's maths is the same. */
  .mg-day.today { z-index:1; transform:scale(1.14); background:var(--blue-light); border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .mg-day.today span { color:var(--blue); font-weight:700; }
  .mg-day.today b { color:var(--blue); }
  .mg-day.today i { color:#1F3F75; }
  .mg-day.today.on { background:var(--blue); border-color:var(--blue); box-shadow:0 6px 16px rgba(47,93,168,.4); }
  .mg-day.today.on span, .mg-day.today.on b, .mg-day.today.on i { color:#fff; }
  .mg-scroll { flex:1 1 auto !important; min-height:0; overflow-y:auto; margin:0 -1.1rem; padding:0 1.1rem .4rem; overscroll-behavior:contain; }
  .mg-row { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--border); border-radius:14px; padding:.7rem .8rem; margin-bottom:.5rem;
            font-family:var(--sans); color:var(--text); }
  .mg-row-main { display:block; width:100%; background:none; border:none; padding:0; margin:0; text-align:left; font:inherit; color:inherit; cursor:pointer; }
  .mg-row-top, .mg-row-last { display:flex; }
  .mg-row-last { display:block; }
  .mg-live { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .mg-row.new { border-color:rgba(176,16,21,.45); box-shadow:0 0 0 1px rgba(176,16,21,.15); }
  .mg-row-top { display:flex; align-items:center; gap:.5rem; }
  .mg-row-top b { font-weight:600; font-size:.95rem; flex:1; min-width:0; line-height:1.25; overflow-wrap:anywhere; }   /* r26: the name and its handle both show; a long one wraps */
  .mg-row-top b .reviewer-handle { white-space:normal; overflow-wrap:anywhere; }   /* a very long handle breaks inside the name's own room, never under the time */
  .mg-row-top span { font-size:.68rem; color:var(--muted); white-space:nowrap; }
  .mg-row-top .mg-n, .mg-tab .mg-n { background:var(--red); color:#fff; }
  .mg-row-last { font-size:.82rem; color:var(--text); margin-top:.2rem; line-height:1.45; overflow-wrap:anywhere; }
  .mg-row-last em { font-style:normal; color:var(--muted); }
  .mg-row-foot { display:flex; align-items:center; justify-content:space-between; gap:.5rem; margin-top:.35rem; font-size:.66rem; color:var(--muted); }
  .mg-closed { font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); }
  .mg-closed.staff { color:var(--muted); }
  .mg-where { margin-top:.8rem; display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; align-items:center; }
  .mg-where > span { flex-basis:100%; font-size:.78rem; }
  .mg-jump { font:inherit; font-size:.8rem; font-weight:600; color:var(--ink); background:var(--white); border:1px solid var(--border); border-radius:999px; padding:.35rem .8rem; cursor:pointer; }
  .mg-empty { text-align:center; color:var(--muted); font-size:.85rem; line-height:1.6; padding:1.6rem .8rem; border:1px dashed var(--border); border-radius:14px; background:var(--white); }
  .mg-foot { font-size:.68rem; color:var(--muted); text-align:center; margin-top:.5rem; line-height:1.5; }
  /* One conversation */
  .mg-back { display:block; border:none; background:none; color:var(--red); font-family:var(--sans); font-size:.68rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; padding:.1rem 0 .35rem; }
  .mg-sub { font-size:.76rem; color:var(--muted); line-height:1.5; }
  .mg-bar { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin:.55rem 0 .45rem; }
  .mg-state { font-size:.62rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--green); }
  .mg-shut { background:var(--blue-light); border:1px solid rgba(47,93,168,.35); color:#1F3F75; border-radius:12px; padding:.6rem .75rem; font-size:.8rem; line-height:1.45; margin:.5rem 0; }
  .mg-shut.staff { background:var(--off-white); border-color:var(--border); color:var(--text); }
  .mg-shut button { display:block; margin-top:.45rem; }
  .mg-msgs { display:flex; flex-direction:column; gap:.5rem; padding:.3rem 0 .5rem; }
  .mg-bub { max-width:84%; padding:.5rem .7rem .55rem; border-radius:14px; font-size:.9rem; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; }
  .mg-bub.guest { align-self:flex-start; background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px; }
  .mg-bub.staff { align-self:flex-end; background:var(--ink); color:var(--white); border-bottom-right-radius:4px; }
  .mg-bub-who { display:block; font-size:.62rem; font-weight:600; letter-spacing:.04em; margin-bottom:.12rem; white-space:normal; }
  .mg-bub.guest .mg-bub-who { color:var(--red); }
  .mg-bub.staff .mg-bub-who { color:rgba(252,249,244,.75); text-align:right; }
  .mg-bub-who i { font-style:normal; font-weight:400; opacity:.75; }
  .mg-bub-who .reviewer-handle { color:inherit; opacity:.75; font-size:inherit; font-weight:400; margin-left:.25rem; letter-spacing:inherit; }   /* r27: the handle beside a name in a bubble, readable on red and on dark */
  .mg-warn { font-size:.72rem; color:var(--amber); background:var(--amber-light); border-radius:10px; padding:.45rem .6rem; margin:.1rem 0 .4rem; line-height:1.45; }
  .mg-form { display:flex; gap:.45rem; align-items:flex-end; padding-top:.55rem; border-top:1px solid var(--border); }
  .mg-input { flex:1; min-width:0; min-height:44px; max-height:140px; resize:none; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text);
              font-family:var(--sans); font-size:1rem; line-height:1.4; padding:.6rem .75rem; outline:none; }
  .mg-input:focus { border-color:var(--ink); }
  .mg-send { flex:none; width:44px; height:44px; border-radius:50%; border:none; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .mg-send svg { width:20px; height:20px; }
  .mg-send:disabled { opacity:.5; cursor:wait; }
  /* r42 (Sebastian, 22 Oct): the restaurant starts a conversation on any table — the sign on a card nobody has written about */
  .rv-chat-sign.start { color:var(--muted); border:1px dashed rgba(43,33,26,.38); }
  .rv-chat-sign.start i { position:absolute; right:-4px; bottom:-4px; width:17px; height:17px; border-radius:50%; background:var(--red); color:#fff;
                          font-style:normal; font-size:.8rem; font-weight:700; line-height:17px; text-align:center; border:2px solid var(--white); box-sizing:content-box; }
  .rv-mailto { color:var(--red); text-decoration:none; font-weight:500; overflow-wrap:anywhere; }
  .rv-meta.rv-email { display:flex; align-items:center; gap:.35rem; margin-top:.15rem; }
  .rv-meta.rv-email svg { flex:none; width:14px; height:14px; color:var(--muted); }
  .mg-fresh { font-size:.78rem; color:var(--text); background:var(--off-white); border:1px dashed var(--border); border-radius:12px; padding:.6rem .75rem; margin:.5rem 0 .4rem; line-height:1.5; }
  .mg-fresh b { font-weight:600; }
  /* r42: photos and PDFs in a conversation */
  .mg-bub .mg-photo { display:block; margin:.2rem 0 .15rem; border-radius:10px; overflow:hidden; background:var(--off-white); width:220px; max-width:100%; min-height:90px; }
  .mg-bub .mg-photo img { display:block; width:100%; height:auto; max-height:300px; object-fit:cover; }
  .mg-bub .mg-photo span { display:block; padding:2rem .6rem; text-align:center; font-size:.72rem; color:var(--muted); white-space:normal; }
  .mg-bub .mg-pdf { display:flex; align-items:center; gap:.55rem; margin:.2rem 0 .15rem; padding:.5rem .65rem; border-radius:10px; text-decoration:none; color:inherit;
                    background:var(--off-white); border:1px solid var(--border); white-space:normal; max-width:260px; }

  /* ── r48: "+" a room ── */

  /* ── r48: the camera inside the page ── */
  .cam { position:fixed; inset:0; z-index:900; background:#0E0A08; color:#fff; display:flex; flex-direction:column; }
  .cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

    box-shadow:0 0 0 2000px rgba(14,10,8,.45); outline:3px solid rgba(255,255,255,.92); outline-offset:-3px; pointer-events:none; }
  .cam-top { position:relative; padding:calc(env(safe-area-inset-top, 0px) + 1rem) 1.2rem .8rem; text-align:center; display:flex; flex-direction:column; gap:.3rem;
    background:linear-gradient(rgba(14,10,8,.75), rgba(14,10,8,0)); }

  .cam-foot { position:absolute; left:0; right:0; bottom:0; display:flex; gap:.6rem; padding:1rem 1.2rem calc(env(safe-area-inset-bottom, 0px) + 1.1rem);
    background:linear-gradient(rgba(14,10,8,0), rgba(14,10,8,.8)); }
  .cam-btn { flex:1; text-align:center; text-decoration:none; border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.08); color:#fff; border-radius:999px;
    padding:.8rem 1rem; font-family:var(--sans); font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .cam-btn.main { background:#fff; color:var(--ink); border-color:#fff; }
  /* ── r49: Map | Timeline ── */
  .mp-mode { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--white); border:1px solid var(--border); border-radius:999px; margin:.1rem 0 .6rem; }
  .mp-mode-b { border:none; border-radius:999px; padding:.55rem 0; background:none; color:var(--text); font-family:var(--sans); font-size:.68rem; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; cursor:pointer; }
  .mp-mode-b.on { background:var(--ink); color:var(--white); }
  .tl-rooms { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.4rem; }
  .tl-rooms .mp-room { flex:1 1 auto; min-width:3.6rem; }
  .tl-note { font-size:.74rem; color:#6F6255; text-align:center; margin:.1rem 0 .5rem; }
  .tl-scroll { height:max(380px, calc(100vh - 300px)); height:max(380px, calc(100dvh - 300px)); overflow:auto; background:var(--white); border:1px solid var(--border);
    border-radius:18px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .tl-grid { position:relative; padding-bottom:8px; }

    box-sizing:border-box; border-right:1px solid var(--border); }

  .tl-hours { position:relative; flex:none; }
  .tl-h { position:absolute; top:7px; font-size:.62rem; font-weight:600; letter-spacing:.08em; color:#6F6255; white-space:nowrap; padding-left:5px; border-left:1px solid #D9CDBD; line-height:1; }
  .tl-cap { position:absolute; top:26px; height:20px; border-radius:6px; background:#F3ECE2; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .tl-cap i { position:absolute; left:0; top:0; bottom:0; opacity:.9; }

  .tl-group { position:relative; z-index:2; height:28px; display:flex; align-items:center; background:var(--off-white); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .tl-group span { position:sticky; left:0; padding-left:12px; font-size:.6rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:#6F6255; white-space:nowrap; }
  .tl-group.red span { color:var(--red-dark); }
  .tl-row { position:relative; z-index:2; display:flex; height:40px; border-bottom:1px solid #F1EADF; }
  .tl-n { position:sticky; left:0; z-index:5; width:62px; flex:none; border-right:1px solid var(--border); background:var(--white); display:flex; align-items:baseline;

  /* ── r49: "In use now" as a tile on the day ── */
  .rv-tiles.five { grid-template-columns:repeat(5,1fr); gap:.3rem; }
  /* 2 Nov 11:21 (his picture): every tile the same way — the number at the top, the word under it, all on one line
     (Requests is a button: a button centres what is in it, so it sat lower when "In use" made the row taller) */
  .rv-tiles .rv-tile { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  button.rv-tile { line-height:inherit; letter-spacing:inherit; font-size:inherit; margin:0; }

  .cap-mini { display:block; align-self:stretch; height:4px; border-radius:999px; background:#EFE7DC; overflow:hidden; margin:.3rem .35rem .15rem; }
  .cap-mini i { display:block; height:100%; border-radius:999px; }
  .rv-tile.cap-tile small { display:block; font-size:.5rem; color:var(--muted); letter-spacing:.02em; margin-top:.05rem; white-space:nowrap; }

  /* ── r50: event tickets ── */

  .ev-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:.9rem 1rem .8rem; margin-bottom:.75rem; box-shadow:var(--shadow-sm); }

  .ev-meta { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem .55rem; font-size:.78rem; color:var(--muted); }

  .ev-chip.draft { background:#EEF3FB; color:#1F3F75; } .ev-chip.not_on_sale { background:#FBF3E4; color:#7A5310; }
  .ev-room { font-size:.62rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#1F3F75; }
  .ev-bar { height:6px; border-radius:999px; background:#EFE7DC; overflow:hidden; margin:.65rem 0 .35rem; }
  .ev-bar i { display:block; height:100%; border-radius:999px; background:var(--green); }
  .ev-card.sold_out .ev-bar i { background:var(--red); }
  .ev-nums { font-size:.78rem; color:var(--muted); } .ev-nums b { color:var(--text); } .ev-nums em { color:var(--red-dark); font-style:normal; font-weight:600; }
  .ev-acts { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.7rem; }

    letter-spacing:.1em; text-transform:uppercase; color:var(--text); cursor:pointer; }
  .ev-act.main { background:var(--ink); border-color:var(--ink); color:var(--white); }
  .ev-past-h { display:flex; align-items:center; gap:.4rem; width:100%; background:none; border:none; padding:.6rem .2rem; font-family:var(--sans); font-size:.68rem;
    font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
  .ev-past-h[aria-expanded="true"] .mg-caret { transform:rotate(90deg); }
  .ev-conflicts { background:#FBF3E4; border:1px solid #E6D2A8; color:#7A5310; border-radius:12px; padding:.75rem .9rem; margin-bottom:.8rem; font-size:.8rem; line-height:1.45; }
  .ev-conflicts .rv-link { display:block; margin-top:.4rem; }
  .ev-form .m-h { margin-bottom:.6rem; }
  .ev-f { display:block; margin:.55rem 0 0; }
  .ev-f > span { display:block; font-size:.62rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:.25rem; }
  .ev-f .m-input, .ev-f .m-select { width:100%; box-sizing:border-box; }
  .ev-f textarea.m-input { resize:vertical; font-family:var(--sans); }

  .ev-row.two { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; } .ev-row.two > .ev-err { grid-column:1 / -1; }
  .ev-err { color:var(--red-dark); font-size:.76rem; margin-top:.3rem; }
  .ev-hint { color:var(--muted); font-size:.74rem; margin-top:.3rem; }
  .ev-sw { display:flex; align-items:center; justify-content:space-between; gap:.8rem; width:100%; margin:.7rem 0 0; padding:.65rem .8rem; background:var(--off-white);
    border:1px solid var(--border); border-radius:12px; font-family:var(--sans); text-align:left; color:var(--text); cursor:pointer; }
  .ev-sw-t b { display:block; font-size:.82rem; } .ev-sw-t small { display:block; font-size:.72rem; color:var(--muted); margin-top:.1rem; }
  .ev-sw i { flex:none; width:42px; height:24px; border-radius:999px; background:#D8CDBE; position:relative; transition:background .15s; }

  .ev-sw.on i { background:var(--green); } .ev-sw.on i::after { left:21px; }
  .ev-btns { display:grid; grid-template-columns:1fr 1fr; gap:.55rem; margin-top:1rem; } .ev-btns .m-btn { margin:0; padding-left:.6rem; padding-right:.6rem; }
  .ev-btns .m-btn:only-child { grid-column:1 / -1; }
  .m-btn.quiet { background:#fff; color:var(--text); border:1px solid var(--border); }
  .ev-cancel { display:block; margin:1rem auto 0; background:none; border:none; color:var(--red-dark); font-family:var(--sans); font-size:.76rem; text-decoration:underline; cursor:pointer; }
  .ev-g-h { margin:.3rem 0 .8rem; }
  .ev-order { background:#fff; border:1px solid var(--border); border-radius:14px; padding:.7rem .85rem; margin-bottom:.55rem; }

  .ev-o-top { display:flex; justify-content:space-between; gap:.6rem; font-size:.9rem; } .ev-o-top span { color:var(--muted); font-size:.78rem; }
  .ev-o-sub { font-size:.76rem; color:var(--muted); margin-top:.15rem; word-break:break-word; }

  .ev-tix { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.55rem; }
  .ev-tk { display:inline-flex; align-items:center; gap:.35rem; font-size:.74rem; border-radius:999px; padding:.3rem .55rem; background:var(--off-white); }
  .ev-tk.in { background:#E3F1E6; color:#2E7D4F; font-weight:600; } .ev-tk.void { color:var(--muted); text-decoration:line-through; }
  .ev-tk.void .rv-link { text-decoration:none; }
  .ev-let { border:none; background:var(--ink); color:#fff; border-radius:999px; padding:.4rem .75rem; font-family:var(--sans); font-size:.66rem; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .ev-day { display:flex; flex-direction:column; align-items:flex-start; gap:.1rem; width:100%; margin:.55rem 0 0; padding:.6rem .85rem; text-align:left; background:#EEF3FB;
    border:1px solid #C9D7EE; border-radius:12px; color:#10284F; font-family:var(--sans); cursor:pointer; }
  .ev-day b { font-size:.86rem; } .ev-day span { font-size:.74rem; color:#3A5788; }
  .ev-day-k { font-size:.58rem !important; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#1F3F75 !important; }
  .mp-ev { display:flex; flex-direction:column; gap:.1rem; margin:0 0 .6rem; padding:.6rem .85rem; background:#EEF3FB; border:1px solid #C9D7EE; border-radius:12px; color:#10284F; }
  .mp-ev.now { background:#1F3F75; border-color:#1F3F75; color:#fff; } .mp-ev.now span, .mp-ev.now .ev-day-k { color:#DCE7F7 !important; }
  .mp-ev b { font-size:.86rem; } .mp-ev span { font-size:.74rem; color:#3A5788; }
  .tl-row.tl-ev-row .tl-n { font-size:.56rem; font-weight:700; letter-spacing:.12em; color:#1F3F75; line-height:40px; }
  .tl-evbar { position:absolute; top:6px; height:28px; box-sizing:border-box; border-radius:8px; background:repeating-linear-gradient(135deg, #DCE7F7 0 8px, #EEF3FB 8px 16px);
    border:1.5px solid #8FB0E0; color:#10284F; font-size:.7rem; font-weight:700; padding:0 8px; line-height:25px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-sheet .mp-sheet-t { font-size:1.6rem; }
  .ev-door.go .mp-sheet-t { color:#2E7D4F; } .ev-door.stop .mp-sheet-t { color:var(--red-dark); }
  .ev-door { padding-bottom:.2rem; }

  .sq-line { font-size:.86rem; margin:.25rem 0; } .sq-line.ok { color:#2E7D4F; font-weight:700; } .sq-line.test { color:#1F3F75; font-size:.78rem; }

  /* four tabs now (Events): on a small phone they share the row with the gear */

  @media (max-width:340px){ .m-tabbar .m-tab { letter-spacing:.02em; padding:.6rem .2rem; font-size:.58rem; } }

  /* ── r51 · month / day / year and AM / PM boxes (the browser's own box stays underneath, hidden) ── */
  .us-native { position:absolute !important; width:1px !important; height:1px !important; opacity:0 !important; pointer-events:none !important;
               margin:0 !important; padding:0 !important; border:0 !important; overflow:hidden; }

  .us-box .m-select { width:auto; min-width:0; padding-right:1.6rem; }
  .us-date .us-m { flex:1.7 1 0; } .us-date .us-dd { flex:.9 1 0; } .us-date .us-y { flex:1.15 1 0; }
  .us-time { display:flex; } .us-time .us-tm { flex:1 1 auto; width:100%; }

  /* ── r51 · the event's photo in the form ── */

  window.hfBackFrom=from?NAMES[page(from.pathname)]:null;
  window.hfBackCan=function(){return !!from&&H.length>depth+1;};
  window.hfBack=function(){
    if(!from){location.href='/';return;}
    if(H.length<=depth+1){if(newTab){try{window.close();}catch(e){}}setTimeout(go,newTab?300:0);return;}
    var t=setTimeout(go,900);
    window.addEventListener('pagehide',function(){clearTimeout(t);});
    H.go(-(depth+1));
  };
  function paint(){
    var els=document.querySelectorAll('[data-hf-back]');
    for(var i=0;i<els.length;i++){
      var a=els[i],name=window.hfBackFrom;
      if(from)a.setAttribute('href',from.href);
      if(a.getAttribute('data-hf-back')==='icon')a.setAttribute('aria-label',name?'Back to '+name:'Home');
      else a.textContent='‹ '+(name||'Site');
      if(!a.hfBack){a.hfBack=1;a.addEventListener('click',function(ev){if(!from||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey)return;ev.preventDefault();window.hfBack();});}
    }
  }
  paint();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',paint);
})();
</script>

async function callApi(path, options){
  const res = await fetch(path, options);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){}
  if(data === null && !res.ok){
    const snippet = text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
    throw new Error('The server returned '+res.status+' instead of data'

let TR = { rid:null, loaded:false, ready:true, failed:false, top:null, last:{}, error:'', note:'', timer:null, busy:false, again:false };

function trCardHtml(){ return '<div class="m-card tr-card" id="tr-card">'+trInner()+'</div>'; }

// r30 (Sebastian, 13 Oct: "not all mixed together"): the dishes in groups, in the menu's own order — Starters,
// Entrées, Salads, Sides, Drinks — each under its heading with how many dishes it has. Inside a group the
// menu's order (sort_order) stays. A category the menu does not know yet gets its own group at the end.
const DISH_GROUPS = [['chefs-pick', "Chef's Pick"], ['starters', 'Appetizers'], ['appetizers', 'Appetizers'], ['entree', 'Entrées'], ['salads', 'Salads'],
                     ['sides', 'Sides'], ['desserts', 'Desserts'], ['drinks', 'Drinks']];
// r36 (Sebastian, 16 Oct, option B): "Change the order" beside a group's name puts that group in order mode:
// each dish a short card with ☰; hold ☰ and drag the dish where it goes; "Done" saves. The menu shows each
// part in that order (the fish before the steak).
const dishKeyOf = d => String(d.restaurant_category || '').trim().toLowerCase();
// r40 (Sebastian, 19 Oct 22:14: "separate drinks and food"): the food in its parts, the drinks in theirs — Wines,
// Cocktails, Beers, Spirits (gin, whiskey, tequila, vodka, rum, other) — as the menu's drinks' carousel shows them.
const DRINK_GROUPS = [['drinks:wines', 'Wines', ['wine']], ['drinks:cocktails', 'Cocktails', ['cocktail']], ['drinks:beers', 'Beers', ['beer']],
                      ['drinks:spirits', 'Spirits', ['gin', 'whiskey', 'tequila', 'vodka', 'rum', 'spirit']], ['drinks:shots', 'Shots', ['shot']]];   // r40: Shots
const SPIRIT_ORDER = ['gin', 'whiskey', 'tequila', 'vodka', 'rum', 'spirit'];
function menuGroups(rows){
  const known = DISH_GROUPS.map(g => g[0]);
  const label = k => k ? k.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Other';
  const extra = [...new Set(rows.map(dishKeyOf).filter(k => known.indexOf(k) < 0))];
  const food = DISH_GROUPS.filter(g => g[0] !== 'drinks').concat(extra.map(k => [k, label(k)]))
    .map(g => ({ key:g[0], label:g[1], side:'food', list:rows.filter(d => dishKeyOf(d) === g[0]) }));
  const drinks = rows.filter(isDrinkRow);
  const kinds = [].concat(...DRINK_GROUPS.map(g => g[2]));
  const dg = DRINK_GROUPS.map(g => ({ key:g[0], label:g[1], side:'drinks',
      list:drinks.map((d, i) => ({ d, i })).filter(x => g[2].indexOf(x.d.drink_kind) >= 0)
                 .sort((a, b) => (g[0] === 'drinks:spirits' ? SPIRIT_ORDER.indexOf(a.d.drink_kind) - SPIRIT_ORDER.indexOf(b.d.drink_kind) : 0) || a.i - b.i)
                 .map(x => x.d) }))
    .concat([{ key:'drinks:other', label:'Other drinks', side:'drinks', list:drinks.filter(d => kinds.indexOf(d.drink_kind) < 0) }]);
  return { food:food.filter(g => g.list.length), drinks:dg.filter(g => g.list.length) };
}
function groupOf(key){ const g = menuGroups(DISHES_ROWS); return g.food.concat(g.drinks).find(x => x.key === key) || null; }
// A part of the menu: its name and count, and its dishes. In the list (not a search) a tap on the name folds or
// unfolds it, and a switch shows its cave on the menu or takes it off (Sebastian, 20 Oct 01:02).
function groupHtml(g, foldable){
  const list = g.list;
  const arranging = ARR && ARR.key === g.key;
  const open = !foldable || arranging || !!MG_OPEN[g.key] || list.some(d => String(d.id) === String(openDishId));
  const btn = list.length < 2 ? ''
    : arranging ? '<button type="button" class="dg-arrange done" id="dg-done" onclick="arrDone()"'+(ARR.saving?' disabled':'')+'>'+(ARR.saving?'Saving…':'Done')+'</button>'
    : '<button type="button" class="dg-arrange" data-group="'+esc(g.key)+'" onclick="arrStart(this.dataset.group)">Change the order</button>';
  const id = ' id="dg-'+esc(g.key.replace(':', '-'))+'"';
  const cave = caveKeyOfGroup(g.key), hideable = foldable && CAVE_HIDEABLE.indexOf(cave) >= 0, shown = CAVE_HIDDEN.indexOf(cave) < 0;

  const title = foldable
    ? '<button type="button" class="mg-g-name" aria-expanded="'+open+'" onclick="mgFoldTap(\''+esc(g.key)+'\')"><span class="mg-caret" aria-hidden="true">▸</span>'+name+'</button>'
    : name;
  const sw = hideable
    ? '<button type="button" class="m-switch mg-g-sw'+(shown?' on':'')+'" id="cs-'+esc(cave)+'" role="switch" aria-checked="'+shown+'" aria-label="'+esc(g.label)+' on the menu"'
      + ' title="'+(shown ? 'On the menu. Tap to hide this cave.' : 'Hidden from the menu. Tap to show this cave.')+'" onclick="caveShow(\''+esc(cave)+'\')"'+(CO_READY && !CS.busy ? '' : ' disabled')+'></button>'
    : '';
  const head = '<div class="m-dish-group has-btn mg-g'+(open?' open':'')+(hideable && !shown?' is-off':'')+'"'+id+'>'+title+sw+btn+'</div>';
  if(!open) return head;
  if(!arranging){
    if(g.key !== 'drinks:spirits') return head + list.map(dishCard).join('');
    // the spirits, kind by kind (Gin, Whiskey…), as the menu's Spirits cave shows them
    return head + SPIRIT_ORDER.map(k => { const l = list.filter(d => d.drink_kind === k); return l.length
      ? '<div class="mg-subkind">'+esc(k === 'spirit' ? 'Other spirits' : DRINK_KIND_LABEL[k])+' <small>'+l.length+'</small></div>' + l.map(dishCard).join('') : ''; }).join('');
  }
  const byId = {}; list.forEach(d => { byId[d.id] = d; });
  return head
    + '<div class="arr-hint" id="arr-hint">Hold <b>☰</b> and drag a dish to its place. Tap <b>Done</b> to save.</div>'
    + (ARR.error ? '<div class="arr-err" id="arr-err">'+esc(ARR.error)+'</div>' : '')
    + '<div class="arr-list" id="arr-list">' + ARR.ids.map(id => byId[id] ? arrCard(byId[id]) : '').join('') + '</div>';

// r41 (Sebastian, 21 Oct 10:13): Food and Drinks show the restaurant's own photos — the Chef's Pick and the
// Bartender's Pick — instead of the 🍽️ and 🍸 icons. No pick, no photo, or a photo that does not load: the icon.
function mgSidePic(k, ic){

}
function mgListHtml(G, side){
  const q = mgNorm(MG_Q).trim();

    const hit = G.food.concat(G.drinks).map(g => Object.assign({}, g, { list:g.list.filter(d => mgNorm(d.name).indexOf(q) >= 0) })).filter(g => g.list.length);
    return hit.length ? hit.map(g => groupHtml(g, false)).join('') : '<div class="m-empty">No dish or drink called “'+esc(MG_Q)+'”.</div>';
  }

  const list = G[side].slice().sort((a, b) => caveRank(order, a.key) - caveRank(order, b.key));
  return caveStripHtml(side) + list.map(g => groupHtml(g, true)).join('');

async function mgSide(s){
  if(MG_SIDE === s) return;

  const G = menuGroups(DISHES_ROWS); l.innerHTML = mgListHtml(G, MG_SIDE === 'drinks' && G.drinks.length ? 'drinks' : 'food'); }

// ── THE CAVES: WHAT COMES FIRST, AND WHICH ARE ON THE MENU (r40) ──
// The menu's carousel and the drinks' carousel in small, as guests see them: "Change the order", then hold a cave
// and drag it to its place (the arrow keys too); Done saves. A cave taken off the menu shows dimmed here.
const CAVE_LABEL = { 'chefs-pick':"Chef's Pick", starters:'Appetizers', appetizers:'Appetizers', entree:'Entrées', salads:'Salads', sides:'Sides', desserts:'Desserts',
  drinks:'Drinks', 'top-starters':'Top Rated Appetizers', 'top-entree':'Top Rated Entrées', 'top-salads':'Top Rated Salads', 'bartenders-pick':"Bartender's Pick",
  wines:'Wines', cocktails:'Cocktails', beers:'Beers', spirits:'Spirits', shots:'Shots', 'drinks-other':'More Drinks', 'top-drinks':'Top Rated Drinks' };
const CAVE_EMOJI = { 'chefs-pick':'👨‍🍳', drinks:'🍸', 'bartenders-pick':'🍸', 'top-starters':'⭐', 'top-entree':'⭐', 'top-salads':'⭐', 'top-drinks':'⭐' };
const CAVE_HIDEABLE = ['starters', 'entree', 'salads', 'sides', 'desserts', 'wines', 'cocktails', 'beers', 'spirits', 'shots', 'drinks-other'];
let CAVE_ORDER = { food:[], drinks:[] };               // what the manager saved (empty: the menu's own order)
let CAVE_HIDDEN = [];                                   // the caves taken off the menu
let CO_READY = false;                                   // migration 27 is in: the order and the switches can change
const CO_IDLE = () => ({ side:null, ui:false, keys:[], orig:[], saving:false, error:'' });
let CO = CO_IDLE();
let CS = { busy:false };
const caveKeyOfGroup = k => k === 'drinks:other' ? 'drinks-other' : k.indexOf('drinks:') === 0 ? k.slice(7) : k;
function caveRank(order, groupKey){ const i = order.indexOf(caveKeyOfGroup(groupKey)); return i < 0 ? 999 : i; }
function cavesFor(side){
  const top = (TR && TR.top) || {};
  let base;
  if(side === 'drinks'){
    const drinks = DISHES_ROWS.filter(d => isDrinkRow(d) && !d.is_hidden), has = l => drinks.some(d => l.indexOf(d.drink_kind) >= 0);
    base = [].concat(drinks.some(d => d.is_bartenders_pick) ? ['bartenders-pick'] : [],
      DRINK_GROUPS.filter(g => has(g[2])).map(g => g[0].slice(7)),
      drinks.some(d => [].concat(...DRINK_GROUPS.map(g => g[2])).indexOf(d.drink_kind) < 0) ? ['drinks-other'] : [],
      top.drinks > 0 ? ['top-drinks'] : []);
  } else {
    base = ['chefs-pick', 'starters', 'entree', 'salads', 'sides', 'desserts', 'drinks']
      .concat(['starters', 'entree', 'salads'].filter(k => top[k] > 0).map(k => 'top-'+k));
  }
  const saved = (CAVE_ORDER[side] || []).filter(k => base.indexOf(k) >= 0);
  return saved.concat(base.filter(k => saved.indexOf(k) < 0));
}
function caveFirstDish(k){
  const rows = DISHES_ROWS.filter(d => !d.is_hidden);
  if(k === 'chefs-pick') return rows.find(d => d.is_chefs_pick) || null;
  if(k === 'bartenders-pick') return rows.find(d => d.is_bartenders_pick) || null;
  if(k === 'drinks'){ const c = cavesFor('drinks').find(x => CAVE_HIDDEN.indexOf(x) < 0 && x.indexOf('top-') < 0); return c ? caveFirstDish(c) : rows.find(isDrinkRow) || null; }
  if(k.indexOf('top-') === 0) return null;
  const g = groupOf(k === 'drinks-other' ? 'drinks:other' : DRINK_GROUPS.some(x => x[0] === 'drinks:'+k) ? 'drinks:'+k : k);
  return g ? g.list.find(d => !d.is_hidden && (d.image || d.image_open)) || null : null;
}
function caveIcon(k){
  const d = caveFirstDish(k);
  if(d && (d.image || d.image_open)) return dishThumb(d).replace(' loading="lazy"', '');
  return '<span class="m-dish-emoji co-emoji">'+(CAVE_EMOJI[k] || '🍽️')+'</span>';
}
function caveStripHtml(side){
  const editing = CO.side === side && CO.ui, keys = editing ? CO.keys : cavesFor(side);
  const what = side === 'drinks' ? 'The drinks’ carousel' : 'The menu’s carousel';
  const btn = !CO_READY ? ''
    : editing ? '<button type="button" class="dg-arrange done" id="co-done" onclick="coDone()"'+(CO.saving ? ' disabled' : '')+'>'+(CO.saving ? 'Saving…' : 'Done')+'</button>'
    : '<button type="button" class="dg-arrange" id="co-start" onclick="coStart(\''+side+'\')">Change the order</button>';
  return '<div class="co-strip-card'+(editing ? ' editing' : '')+'" id="co-card">'
    + '<div class="co-strip-head"><span>'+what+'</span>'+btn+'</div>'
    + (editing ? '<div class="co-hint">Hold a cave and drag it left or right to its place. Tap <b>Done</b> to save.</div>' : '')
    + (CO.error ? '<div class="co-err" id="co-err">'+esc(CO.error)+'</div>' : '')
    + (!CO_READY && TR.loaded ? '<div class="co-hint">Changing the order and hiding a cave are not set up yet: Seb\'s Analytics has to run migration 27.</div>' : '')
    + '<div class="co-strip" id="co-strip">' + keys.map((k, i) => {
        const off = CAVE_HIDDEN.indexOf(k) >= 0, top = k.indexOf('top-') === 0, label = CAVE_LABEL[k] || k;
        return '<div class="co-arch'+(off ? ' off' : '')+'" data-k="'+esc(k)+'"'
          + (editing ? ' tabindex="0" role="button" aria-label="'+esc(label)+', place '+(i + 1)+' of '+keys.length+' (drag left or right, or the arrow keys)" onpointerdown="coDown(event)" onkeydown="coKey(event,'+i+')"' : '')
          + '><div class="co-arch-in"><div class="co-arch-title">'+(top ? '<span>Top Rated</span>'+esc(label.replace(/^Top Rated /, '')) : esc(label))+'</div>'
          + '<div class="co-arch-open">'+caveIcon(k)+(top ? '<span class="co-star" aria-hidden="true">⭐</span>' : '')+'</div></div>'
          + (off ? '<div class="co-arch-off">Hidden</div>' : '')+'</div>';
      }).join('') + '</div>'
    + '<div class="co-bar none" id="co-bar" onpointerdown="coBarDown(event)"><div class="co-bar-thumb" id="co-bar-thumb" tabindex="0" role="scrollbar" aria-controls="co-strip"'
    + ' aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Move the caves left or right" onkeydown="coBarKey(event)"></div></div></div>';

// r41: the scrollbar under the caves. It follows the line (scrolled by a finger, by the drag of a cave near an end, or
// by the bar itself) and the line follows it. Shown only when the caves do not all fit.
function coBarSync(){
  const s = document.getElementById('co-strip'), bar = document.getElementById('co-bar'), th = document.getElementById('co-bar-thumb');
  if(!s || !bar || !th) return;
  const max = s.scrollWidth - s.clientWidth;
  bar.classList.toggle('none', max <= 1);
  if(max <= 1) return;
  const bw = bar.clientWidth, tw = Math.max(40, Math.round(bw * s.clientWidth / s.scrollWidth));
  const x = Math.round((bw - tw) * Math.min(1, Math.max(0, s.scrollLeft / max)));
  th.style.width = tw + 'px'; th.style.transform = 'translateX(' + x + 'px)';
  th.setAttribute('aria-valuenow', String(Math.round(100 * s.scrollLeft / max)));
}
let CO_BAR = null;
function coBarDown(ev){
  if(ev.button !== undefined && ev.button > 0) return;
  const s = document.getElementById('co-strip'), bar = ev.currentTarget, th = document.getElementById('co-bar-thumb');
  if(!s || !th) return;
  ev.preventDefault();
  const max = s.scrollWidth - s.clientWidth, bw = bar.clientWidth, tw = th.offsetWidth, room = Math.max(1, bw - tw);
  if(ev.target !== th){                                                 // a tap on the bar: the handle jumps there (its middle)
    const b = bar.getBoundingClientRect();
    s.scrollLeft = Math.round(max * Math.min(1, Math.max(0, (ev.clientX - b.left - tw / 2) / room)));
    coBarSync();
  }
  try{ bar.setPointerCapture(ev.pointerId); }catch(e){}

async function setKind(id, kind){

function pairField(d, which){
  const col = which==='wine' ? 'pair_wine_id' : 'pair_cocktail_id';

  if(!DRINKS_READY) return '<div class="m-field"><div class="m-field-label">'+title+'</div><div class="pk-note">Choosing from your drinks is not set up yet: Seb\'s Analytics has to run migration 26.</div></div>';
  const chosen = d[col] ? String(d[col]) : '';
  const drinks = DISHES_ROWS.filter(x => isDrinkRow(x) && x.drink_kind === which && (!x.is_hidden || String(x.id) === chosen));
  const tile = (x) => {
    const on = String(x.id) === chosen;
    const file = String(x.image || '');
    const img = file ? '<img src="'+esc(typeof hfImgSrc==='function' ? hfImgSrc(file, 96) : file)+'" data-orig="'+esc(file)+'" data-emoji="'+esc(x.emoji||'🍷')+'" alt="" loading="lazy" onerror="pkImgBad(this)">' : '<span class="pk-emoji">'+esc(x.emoji||'🍷')+'</span>';
    return '<button type="button" class="pk-tile'+(on?' on':'')+'" aria-pressed="'+(on?'true':'false')+'" onclick="setPair('+d.id+',\''+which+'\','+x.id+')">'+img+'<span>'+esc(x.name)+(x.is_hidden?' <em>(hidden)</em>':'')+'</span></button>';
  };
  const none = '<button type="button" class="pk-tile none'+(chosen?'':' on')+'" aria-pressed="'+(chosen?'false':'true')+'" onclick="setPair('+d.id+',\''+which+'\',null)">None</button>';
  const typed = which==='wine' ? d.wine : d.cocktail;
  const note = !drinks.length ? 'No '+(which==='wine'?'wines':'cocktails')+' on your menu yet. Message Seb\'s Analytics to add them.'
    : (!chosen && typed ? 'Typed before: “'+esc(typed)+'”. Tap one of your '+(which==='wine'?'wines':'cocktails')+' to choose it instead.'
    : 'Slide to see your '+(which==='wine'?'wines':'cocktails')+'. Tap one to choose it; “None” leaves it empty.');
  return '<div class="m-field"><div class="m-field-label">'+title+'</div>'
    + '<div class="pk-tiles" id="pk-'+d.id+'-'+which+'">'+none+drinks.map(tile).join('')+'</div>'
    + '<div class="pk-note">'+note+'</div></div>';

function pkImgBad(img){
  if(typeof hfImgBack === 'function' && hfImgBack(img)) return;          // the original file, once
  const s = document.createElement('span'); s.className = 'pk-emoji'; s.textContent = img.getAttribute('data-emoji') || '🍷';
  img.replaceWith(s);
}
async function setPair(id, which, drinkId){

  if(String(d[col]||'') === String(drinkId||'') && (drinkId || !(which==='wine' ? d.wine : d.cocktail))) return;
  // The choice replaces whatever was typed before r39.
  const saved = await save(id, { [col]: drinkId, [which]: null });
  if(!saved) return;
  const x = drinkId ? rowFor(drinkId) : null;
}

    ? '<div class="m-add-row">'

      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
