}
function rwGroupHtml(f, kind, title, cats, drink){
  const list = RW.dishes.filter(d => d.drink === drink);
  const ids = list.map(d => d.id);
  const open = RW.open[kind];
  const count = rwCount(f, 'dishes', it => it.t === kind);
  let h = '<div class="rw-row" style="margin-top:.6rem">'
    + '<button type="button" class="rw-ck" data-group="'+kind+'" onclick="rwPickIds(\''+kind+'\',null)">'+rwBox(rwState(f, ids))+'<span class="lbl rw-grp">'+title+'</span><span class="n">'+count+'</span></button>'
    + '<button type="button" class="rw-arrow red" data-fold="'+kind+'" aria-label="'+(open ? 'Fold' : 'Open')+' the '+title.toLowerCase()+'" onclick="rwFold(\''+kind+'\')">'+rwArrow(open)+'</button></div>';
  if(!open){
    const n = rwPicked(f, ids);
    return h + '<div class="rw-sum" data-sum="'+kind+'">'+(!f.dishes || n === ids.length ? 'All '+title.toLowerCase() : n === 0 ? 'None chosen' : n+' of '+ids.length+' '+title.toLowerCase()+' chosen')+'</div>';
  }
  h += '<div class="rw-l1">';
  cats.forEach(function(c){
    const inCat = list.filter(d => d.group === c[0]);
    if(!inCat.length) return;
    const cid = kind + ':' + c[0], cids = inCat.map(d => d.id), copen = RW.cats[cid] !== false;
    const n = rwCount(f, 'dishes', it => it.t === kind && cids.includes(Number(it.r.dish)));
    h += '<div class="rw-row"><button type="button" class="rw-ck" data-cat="'+cid+'" onclick="rwPickIds(\''+kind+'\',\''+c[0]+'\')">'+rwBox(rwState(f, cids))+'<span class="lbl rw-cat">'+esc(c[1])+'</span><span class="n">'+n+'</span></button>'
      + '<button type="button" class="rw-arrow" data-cfold="'+cid+'" aria-label="'+(copen ? 'Fold ' : 'Open ')+esc(c[1])+'" onclick="rwFoldCat(\''+cid+'\')">'+rwArrow(copen)+'</button></div>';
    if(copen){
      h += '<div class="rw-l2">' + inCat.map(function(d){
        const m = rwCount(f, 'dishes', it => it.t === kind && Number(it.r.dish) === d.id);
        const on = !f.dishes || f.dishes.includes(d.id);
        return '<button type="button" class="rw-ck" data-dish="'+d.id+'" onclick="rwPickDish('+d.id+')">'+rwBox(on ? 'on' : 'off')+rwThumb(d, 36)+'<span class="lbl">'+esc(d.name)+'</span><span class="n">'+m+'</span></button>';
      }).join('') + '</div>';
    }
  });
  return h + '</div>';
}
function rwKind(k){ RW.draft.kinds[k] = !RW.draft.kinds[k]; rwPaintPage(); }
function rwStar(n){ const s = RW.draft.stars, i = s.indexOf(n); if(i >= 0) s.splice(i, 1); else s.push(n); if(s.length === 5) RW.draft.stars = []; rwPaintPage(); }
function rwReplyPick(w){ RW.draft.reply[w] = !RW.draft.reply[w]; rwPaintPage(); }
function rwFold(kind){ RW.open[kind] = !RW.open[kind]; rwPaintPage(); }
function rwFoldCat(cid){ RW.cats[cid] = RW.cats[cid] === false; rwPaintPage(); }
function rwAllIds(){ return RW.dishes.map(d => d.id); }
function rwSetPicked(ids){ const all = rwAllIds(); RW.draft.dishes = ids.length === all.length && all.every(id => ids.includes(id)) ? null : ids; }
// A whole group (Dishes, Drinks) or one category: all on when some are off, all off when all are on.
function rwPickIds(kind, cat){
  const ids = RW.dishes.filter(d => d.drink === (kind === 'drink') && (cat === null || d.group === cat)).map(d => d.id);
  const now = RW.draft.dishes ? RW.draft.dishes.slice() : rwAllIds();
  const allOn = ids.every(id => now.includes(id));
  rwSetPicked(allOn ? now.filter(id => !ids.includes(id)) : now.concat(ids.filter(id => !now.includes(id))));
  rwPaintPage();
}
function rwPickDish(id){
  const now = RW.draft.dishes ? RW.draft.dishes.slice() : rwAllIds();
  rwSetPicked(now.includes(id) ? now.filter(x => x !== id) : now.concat([id]));
  rwPaintPage();
}

// ── the calendar: tap the first day, then the last; the days between turn red ──
function rwOpenCal(which){ RW.cal = { from:RW.draft.from, to:RW.draft.to, picking:which }; RW.page = 'calendar'; rwPaintPage(true); }
function rwCalPick(day){
  const c = RW.cal;
  if(c.picking === 'from' || !c.from){ c.from = day; if(c.to && c.to < day) c.to = null; c.picking = 'to'; }
  else if(day < c.from){ c.from = day; }
  else { c.to = day; c.picking = 'from'; }
  rwPaintPage();
}
function rwCalQuick(k){
  const t = rwToday(), c = RW.cal;
  if(k === 'today'){ c.from = t; c.to = t; }
  if(k === '7'){ c.from = rwAddDays(t, -6); c.to = t; }
  if(k === '30'){ c.from = rwAddDays(t, -29); c.to = t; }
  if(k === 'month'){ c.from = t.slice(0,8)+'01'; c.to = t; }
  if(k === 'all'){ c.from = null; c.to = null; }
  c.picking = 'from';
  rwPaintPage(true);
}
function rwCalUse(){ RW.draft.from = RW.cal.from; RW.draft.to = RW.cal.to; RW.page = 'filters'; RW.cal = null; rwPaintPage(true); }
// ── r53 · moderation (Sebastian, 5–9 Nov; the window as approved in picture r52-3 v3) ──
// The owner, Seb's Analytics, and the managers the owner chose (Team → "Can moderate reviews") see the visit dots, the
// Moderate review button (once Seb's Analytics switched moderation on at this restaurant), "Show it again" and the log.
// Other managers see hidden reviews greyed with their reason, and nothing more.
const RW_VISIT_WORDS = { day:'Visit that day', other:'Visit on another day', none:'No visit' };
const RW_FTC_RULE = 'https://www.ftc.gov/system/files/ftc_gov/pdf/r311003consumerreviewstestimonialsfinalrulefrn.pdf';
function rwMod(){ return (RW.data && RW.data.moderation) || { ready:false, on:false, canModerate:false, platform:false, reasons:[] }; }
function rwVisitKind(it){ return it.visit && (it.visit.dot === 'day' || it.visit.dot === 'other') ? it.visit.dot : 'none'; }
function rwDotHtml(v){
  if(!v || !v.dot) return '';
  return '<span class="rw-dot '+(v.dot === 'day' ? 'day' : 'other')+'" title="'+(v.dot === 'day' ? 'Visit that day' : 'Visit on another day')+'" aria-label="'+(v.dot === 'day' ? 'Visit that day' : 'Visit on another day')+'"></span>';

function rwVisitLine(v){

function rwTalkBtn(it){

// ── r53c: the author's conversation about a hidden review — the same sheet as a table's conversation ──
// Opened from "Messages" on the review, the line at the top of Reviews, or a notification (#go=reviews&talk=<review>).
// The owner and the managers who moderate answer; "Show it again" is here too. Read every few seconds while open.
let RVT = { open:false, id:null, data:null, error:null, asking:false, pend:null, sending:false, timer:null }, RVT_AT = null;
function rvtOpen(id){
  Object.assign(RVT, { open:true, id:Number(id), data:null, error:null, pend:null, sending:false });
  rvtPaint(true);
  rvtLoad(true);
  if(!RVT.timer) RVT.timer = setInterval(function(){ if(RVT.open && document.visibilityState === 'visible' && !RVT.asking) rvtLoad(false); }, 4000);
}
function rvtHide(){
  RVT.open = false; RVT.id = null; RVT.data = null;
  if(RVT.timer){ clearInterval(RVT.timer); RVT.timer = null; }
  const h = document.getElementById('rvt-host'); if(h) h.innerHTML = '';
}
async function rvtLoad(first){
  const id = RVT.id; RVT.asking = true;
  try{
    const d = await rvApi({ action:'rvc_staff_thread', reviewId:id });
    if(RVT.id !== id) return;
    const had = RVT.data; RVT.data = d; RVT.error = null;
    rvtPaint(!had);
    // What waited is read now (Seb's Analytics' opening reads nothing): the list's count goes.
    if(first && !rwMod().platform){
      const it = RW.items.find(x => x.key === 'r'+id);
      if(it && it.talk && it.talk.unread){ it.talk.unread = 0; rwPaint(); }
    }
  }catch(e){
    if(RVT.id !== id) return;
    if(e.status !== 401){ RVT.error = e.message || 'Could not read the conversation.'; if(!RVT.data) rvtPaint(true); }
  }
  RVT.asking = false;
}

    + '<div class="mg-who">'+whoHtml(first, v.handle)+' reads your answers in My Tastings on the website, and the bell tells them.</div>';

function rvtPaint(full){

  if(!RVT.open){ host.innerHTML = ''; return; }
  const d = RVT.data;
  const sc0 = host.querySelector('.mg-scroll');
  const atEnd = !sc0 || sc0.scrollHeight - sc0.scrollTop - sc0.clientHeight < 40;
  if(!full && d && host.querySelector('.mg-form')){

    + '<div class="rv-sheet mg-sheet rvt-sheet" role="dialog" aria-modal="true" aria-label="Messages about a hidden review"><div class="rv-grab"></div>'
    + '<div class="rv-sheet-head"><div style="min-width:0;"><div class="m-h">'+(d ? whoHtml(d.review.name, d.review.handle) : 'Messages')+'</div></div>'

      : '<div class="mg-top">'+rvtTopHtml(d)+'</div>'
        + '<div class="mg-scroll"><div class="mg-msgs">'+msgBubblesHtml(d)+'</div><p class="mg-foot">'+esc(d.foot || '')+'</p></div>'
        + '<p class="mg-live" aria-live="polite"></p><div class="mg-pend" hidden></div>'
        + '<div class="mg-form"'+(d.review.deleted ? ' hidden' : '')+'>'
        + '<button type="button" class="mg-clip" aria-label="Attach a photo or a PDF" onclick="this.nextElementSibling.click()">'+MSG_CLIP+'</button>'
        + '<input type="file" class="mg-file-in" accept="image/*,application/pdf" hidden onchange="rvtPicked(this)">'
        + '<textarea class="mg-input" rows="1" maxlength="1000" aria-label="Your answer" placeholder="Write your answer…" oninput="msgGrow(this)"'
        + ' onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey)){event.preventDefault();rvtSend();}"></textarea>'
        + '<button type="button" class="mg-send" aria-label="Send" onclick="rvtSend()">'+MSG_SEND+'</button></div>')
    + '</div>';
  const sc = host.querySelector('.mg-scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  rvtFiles();
}
async function rvtFiles(){
  const d = RVT.data;
  if(!d || RVT.linking) return;
  const need = d.messages.filter(m => m.file && !msgLinkOf(m.file.id)).map(m => Number(m.file.id)).slice(0, 40);
  if(!need.length) return;
  RVT.linking = true;
  const id = RVT.id;
  try{
    const data = await rvApi({ action:'rvc_staff_files', reviewId:id, fileIds:need });
    const until = Date.now() + Math.max(60, (Number(data.expiresIn) || 3600) - 300) * 1000;
    need.forEach(k => { const url = data.links && data.links[k]; MSG.links[k] = url ? { url:url, until:until } : { url:null, gone:true, until:Date.now() + 120000 }; });
  }catch(e){ RVT.linking = false; return; }
  RVT.linking = false;
  if(id !== RVT.id || !RVT.open) return;
  const box = document.querySelector('#rvt-host .mg-msgs'); if(box) box.innerHTML = msgBubblesHtml(RVT.data);
}
function rvtPicked(input){
  const file = input.files && input.files[0]; input.value = '';
  if(!file) return;
  hfFilePrepare(file).then(function(prep){
    RVT.pend = prep;
    const p = document.querySelector('#rvt-host .mg-pend');
    if(p){ p.hidden = false; p.innerHTML = '<span class="mg-pend-pdf">'+MSG_PDF+'</span><div class="mg-pend-t"><b>'+esc(prep.name)+'</b><small>'+esc(hfFileSize(prep.size))+' · goes with your next message</small></div>'
      + '<button type="button" class="mg-pend-x" aria-label="Remove the file" onclick="rvtUnpick()">&times;</button>'; }
  }, function(e){ showToast(e.message); });
}
function rvtUnpick(){ RVT.pend = null; const p = document.querySelector('#rvt-host .mg-pend'); if(p){ p.hidden = true; p.innerHTML = ''; } }
async function rvtSend(){
  const host = document.getElementById('rvt-host'), input = host && host.querySelector('.mg-input');
  if(!input || RVT.sending) return;
  const text = input.value.trim(), prep = RVT.pend, id = RVT.id;
  if(!text && !prep){ showToast('Write the answer first.'); return; }
  RVT.sending = true;
  const btn = host.querySelector('.mg-send'); if(btn) btn.disabled = true;
  try{
    let fileId = null;
    if(prep){
      const slot = await rvApi({ action:'rvc_staff_upload', reviewId:id, name:prep.name, mime:prep.mime, size:prep.size });
      await hfFileUpload(slot.uploadUrl, prep);
      fileId = slot.file.id;
    }
    const d = await rvApi({ action:'rvc_staff_send', reviewId:id, body:text, fileId:fileId });
    if(RVT.id !== id) return;
    input.value = ''; input.style.height = ''; rvtUnpick();
    RVT.data = d; rvtPaint(false);
    const sc = host.querySelector('.mg-scroll'); if(sc) sc.scrollTop = sc.scrollHeight;
  }catch(e){ if(e.status !== 401) showToast(e.message || 'The answer was not sent. Please try again.'); }
  RVT.sending = false; if(btn) btn.disabled = false;
}
async function rvtSet(what){
  const id = RVT.id, d = RVT.data;
  const seen = d ? Math.max(0, ...d.messages.filter(m => m.fromGuest).map(m => Number(m.id))) : 0;
  try{ RVT.data = await rvApi({ action:'rvc_staff_'+(what === 'close' ? 'close' : 'reopen'), reviewId:id, seen:seen }); if(RVT.id === id) rvtPaint(false); }
  catch(e){ if(e.status !== 401) showToast(e.message); }
  const it = RW.items.find(x => x.key === 'r'+id); if(it && it.talk){ it.talk.open = what !== 'close'; }
}
async function rvtShowAgain(){
  const id = RVT.id, b = document.getElementById('rvt-show'); if(b) b.disabled = true;
  try{ await rvApi({ action:'mod_show', reviewId:id }); showToast('Shown again. The author is told.'); }
  catch(e){ if(e.status !== 401) showToast(e.message); if(b) b.disabled = false; return; }
  await rvtLoad(false);
  rwLoad();
}
function rwHiddenBox(it){
  const h = it.hidden;
  if(!h) return '';
  if(h.team) return '<div class="rw-hid" data-hidden="team"><b>Hidden automatically</b> · '+esc(h.label)+'</div>';
  const when = h.at ? new Date(h.at).toLocaleDateString('en-US', { timeZone:(RW.data && RW.data.timezone) || 'America/New_York', month:'short', day:'numeric' }) : '';
  return '<div class="rw-hid" data-hidden="'+esc(h.reason)+'"><b>Hidden · '+esc(h.label)+'</b>'+(h.by || when ? ' · by '+esc(h.by || 'the restaurant')+(when ? ', '+esc(when) : '') : '')
    + (h.details ? '<q>'+esc(h.details)+'</q>' : '')
    + (h.alerted ? '<div style="margin-top:.2rem;color:#1F3F73">Fork\'s Rating was told.</div>' : '')
    + '</div>';
}
function rwHiddenIds(it){
  const rs = it.t === 'room' ? it.reviews : [it.r];
  return rs.filter(x => x.hidden && !x.hidden.team).map(x => x.id);
}
function rwHiddenActs(it){
  const M = rwMod(), acts = [];
  if(rwTalkBtn(it)) acts.push(rwTalkBtn(it));                                                     // r53c
  if(it.deleted) return acts.length ? '<div class="rw-acts">'+acts.join('')+'</div>' : '';       // r53c: the record: nothing to do
  if(M.canModerate && !it.hidden.team && rwHiddenIds(it).length) acts.push('<button type="button" class="rw-act" data-show="'+it.key+'" onclick="rwShowAgain(\''+it.key+'\')">Show it again</button>');
  if(it.t !== 'room' && it.dish && it.dish.slug) acts.push('<a class="rw-act" href="/menu?dish='+encodeURIComponent(it.dish.slug)+'" target="_blank" rel="noopener">Open '+(it.t === 'drink' ? 'drink' : 'dish')+'</a>');
  return acts.length ? '<div class="rw-acts">'+acts.join('')+'</div>' : '';
}
function rwVisitPick(k){ RW.draft.visit[k] = !RW.draft.visit[k]; rwPaintPage(); }
function rwHiddenPick(){ RW.draft.hidden = !RW.draft.hidden; rwPaintPage(); }
function rwDeletedPick(){ RW.draft.deleted = !RW.draft.deleted; rwPaintPage(); }                // r53c

// The top of the tab: Seb's Analytics' switch; "off" for the moderators; the dots' legend and the log.
function rwTopHtml(){
  const M = rwMod();
  if(!M.ready) return '';
  let h = '';
  if(M.platform){
    const when = M.at ? new Date(M.at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
    h += '<div class="rw-switch" id="rw-switch"><div><b>Moderation here: '+(M.on ? 'On' : 'Off')+'</b>'
      + '<small>'+(M.on ? 'Switched on'+(when ? ' '+esc(when) : '')+(M.by ? ' by '+esc(M.by) : '')+'. ' : '')
      + 'Switch it on only after this restaurant signs the Review and Data Addendum. Only Seb\'s Analytics sees this.</small></div>'
      + (M.on ? '<button type="button" class="m-btn quiet" id="rw-switch-btn" onclick="rwSwitch(false)">Switch off</button>'
              : '<button type="button" class="m-save" id="rw-switch-btn" onclick="rwSwitch(true)">Switch on</button>')
      + '</div>';
  }else if(M.canModerate && !M.on){
    h += '<div class="rw-note" id="rw-mod-off" style="margin:0 0 .7rem">Moderation is off here. Seb\'s Analytics switches it on once the restaurant signs the Review and Data Addendum.</div>';
  }
  // r53c: the authors' messages about hidden reviews that wait for an answer
  const waiting = M.canModerate ? RW.items.filter(it => it.talk && it.talk.unread > 0 && it.t !== 'room') : [];
  if(waiting.length){
    const n = waiting.reduce((x, it) => x + Number(it.talk.unread), 0), first = waiting[0];
    h += '<div class="rw-talknote" id="rw-talknote"><span>'+n+' new message'+(n === 1 ? '' : 's')+' about '+(waiting.length === 1 ? 'a hidden review' : waiting.length+' hidden reviews')+'</span>'
      + '<button type="button" class="m-save" onclick="rvtOpen('+Number(first.r.id)+')">Open</button></div>';
  }
  if(M.canModerate){
    h += '<div class="rw-legend" id="rw-legend"><span><i class="rw-dot day"></i>Visit that day</span><span><i class="rw-dot other"></i>Visit on another day</span>'
      + '<button type="button" class="rw-loglink" id="rw-loglink" onclick="rwLogOpen()">Moderation log</button></div>';
  }
  return h;
}
async function rwSwitch(on){
  const btn = document.getElementById('rw-switch-btn');
  if(btn) btn.disabled = true;
  try{
    const d = await rvApi({ action:'mod_switch', on:on });
    if(RW.data) RW.data.moderation = Object.assign({}, RW.data.moderation, d.moderation);
    showToast(on ? 'Moderation is on at this restaurant.' : 'Moderation is off at this restaurant.');
    rwPaint();
  }catch(e){ if(e.status !== 401) showToast(e.message || 'Could not save that.'); if(btn) btn.disabled = false; }
}

// ── the Moderate review page ──
function rwModOpen(key){
  const it = rwFind(key);
  if(!it) return;
  RW.mod = { key:key, reason:null, details:{}, sending:false };
  RW.page = 'moderate';
  rwPaintPage(true);
}
function rwModClose(){ rwClosePage(); }
function rwModPick(code){
  if(!RW.mod) return;
  const box = document.getElementById('rw-mod-details');
  if(box && RW.mod.reason) RW.mod.details[RW.mod.reason] = box.value;
  RW.mod.reason = code;
  rwPaintPage();
  const t = document.getElementById('rw-mod-details');
  if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
}
function rwModType(v){
  if(!RW.mod) return;
  RW.mod.details[RW.mod.reason] = v;
  const b = document.getElementById('rw-mod-hide');
  if(b) b.disabled = !v.trim() || RW.mod.sending;
}
function rwModIds(it){
  const rs = it.t === 'room' ? it.reviews : [it.r];
  return rs.filter(x => !x.hidden).map(x => x.id);
}
function rwModHtml(){
  const m = RW.mod, it = m ? rwFind(m.key) : null;
  if(!it) return '';
  const M = rwMod(), r = it.r;
  const back = rwArrow(false).replace('M9 6l6 6-6 6','M15 6l-6 6 6 6');
  let h = '<div class="rw-ptop"><button type="button" class="rw-ptitle" onclick="rwModClose()" aria-label="Back to the reviews">'+back+'Moderate review</button></div><div class="rw-pbody">';
  // the review
  const stars = it.t === 'room' ? rwRound(r.roomStars) : it.stars;
  const words = it.t === 'room' ? (it.comments.join('\n') || '') : (r.dishComment || '');
  h += '<div class="rw-msum" id="rw-msum"><div><b>'+whoHtml(r.name, r.handle)+'</b>'+rwDotHtml(it.visit)+' <span class="rw-st">'+rwStarRow(stars)+'</span></div>'
    + '<div class="rw-small" style="margin-top:.1rem">'+(it.t === 'room' ? 'About the restaurant' : esc(it.dish ? it.dish.name : 'A dish'))+' · '+esc(rwWhen(it.at))+'</div>'
    + (words ? '<div class="rw-text" style="margin-top:.3rem">“'+esc(words)+'”</div>' : '<div class="rw-none" style="margin-top:.3rem">No comment, only stars.</div>')
    + rwVisitLine(it.visit)
    + (it.visit && it.visit.dot === 'day' ? '<div class="rw-small">A visit doesn\'t prove every word is true.</div>' : '')
    + '</div>';
  const ids = rwModIds(it);
  if(it.t === 'room' && ids.length > 1) h += '<div class="rw-note" id="rw-mod-group" style="margin:0 0 .4rem">This hides '+esc(String(r.name || 'this guest').split(' ')[0])+'\'s '+ids.length+' reviews from that visit (the dishes and drinks too): the comment about the restaurant is part of each one.</div>';
  h += '<p class="rw-mintro">These reasons follow the <a href="'+RW_FTC_RULE+'" target="_blank" rel="noopener">U.S. Federal Trade Commission (FTC) rule on consumer reviews, 16 CFR 465.7</a>. Hide a review only for a reason you would use the same way for a 5-star review.</p>';
  const row = function(x){
    const on = m.reason === x.code;
    let out = '<button type="button" class="rw-radio" data-reason="'+x.code+'" aria-pressed="'+on+'" onclick="rwModPick(\''+x.code+'\')"><span class="rw-rb'+(on ? ' on' : '')+'"></span><span>'+esc(x.label)+'</span></button>';
    if(on){
      out += '<div class="rw-mdet"><label for="rw-mod-details">'+(x.code === 'other' ? 'Details (the author reads these)' : 'Details')+'</label>'
        + '<textarea id="rw-mod-details" maxlength="1000" placeholder="Write the details…" oninput="rwModType(this.value)">'+esc(m.details[x.code] || '')+'</textarea>'
        + (x.code === 'illegal' ? '<div class="rw-mblue" id="rw-mod-alert">Fork\'s Rating is told at once. If a child could be at risk, US law requires Fork\'s Rating to report it.</div>' : '')
        + '</div>';
    }
    return out;
  };
  const list = M.reasons || [];
  h += '<div class="rw-pg">Named in the FTC rule</div>' + list.filter(x => x.group === 'ftc').map(row).join('');
  h += '<div class="rw-pg">Other neutral reasons</div>' + list.filter(x => x.group !== 'ftc').map(row).join('');
  h += '<p class="rw-msame">Use the same rules for a 5-star review as for a 1-star review.</p>';
  const ready = m.reason && (m.details[m.reason] || '').trim() && !m.sending;
  h += '</div><div class="rw-pfoot"><button type="button" class="m-save" id="rw-mod-hide"'+(ready ? '' : ' disabled')+' onclick="rwModSend()">Hide review</button>'
    + '<button type="button" class="m-btn quiet" onclick="rwModClose()">Cancel</button></div>';
  return h;
}
async function rwModSend(){
  const m = RW.mod, it = m ? rwFind(m.key) : null;
  if(!it || !m.reason || m.sending) return;
  const box = document.getElementById('rw-mod-details');
  const details = (box ? box.value : (m.details[m.reason] || '')).trim();
  if(!details){ showToast('Write the details first.'); return; }
  m.sending = true;
  const b = document.getElementById('rw-mod-hide'); if(b) b.disabled = true;
  try{
    await rvApi({ action:'mod_hide', reviewIds: rwModIds(it), reason: m.reason, details: details });
    rwClosePage();
    showToast('Hidden: the comment and the stars. The author will be told the reason. You can un-hide it at any time.');
    rwLoad();
  }catch(e){
    m.sending = false;
    if(e.status !== 401) showToast(e.message || 'Could not hide that review.');
    const bb = document.getElementById('rw-mod-hide'); if(bb) bb.disabled = !details;
  }
}
async function rwShowAgain(key){
  const it = rwFind(key);
  if(!it) return;
  const ids = rwHiddenIds(it);
  if(!ids.length) return;
  const b = document.querySelector('[data-show="'+key+'"]'); if(b) b.disabled = true;
  try{
    await rvApi({ action:'mod_show', reviewIds: ids });
    showToast('Shown again. It counts in the rating, and the author is told.');
    rwLoad();
  }catch(e){ if(e.status !== 401) showToast(e.message || 'Could not show it again.'); if(b) b.disabled = false; }
}

// ── the moderation log (moderators) ──
const RW_LOG_WORDS = { hide:'Hidden', show:'Shown again', 'team-hide':'Hidden by the team rule', 'team-show':'Shown again (team rule)' };
async function rwLogOpen(){
  RW.log = { loading:true, entries:null, error:null };
  RW.page = 'log'; rwPaintPage(true);
  try{
    const d = await rvApi({ action:'mod_log' });
    RW.log = { loading:false, entries:d.entries || [], error:null };
  }catch(e){
    if(e.status === 401) return;
    RW.log = { loading:false, entries:null, error:e.message || 'Could not read the log.' };
  }
  if(RW.page === 'log') rwPaintPage(true);
}
function rwLogHtml(){
  const back = rwArrow(false).replace('M9 6l6 6-6 6','M15 6l-6 6 6 6');
  let h = '<div class="rw-ptop"><button type="button" class="rw-ptitle" onclick="rwClosePage()" aria-label="Back to the reviews">'+back+'Moderation log</button></div><div class="rw-pbody" id="rw-log">';
  const L = RW.log || {};
  if(L.loading) h += '<div class="m-skel"></div><div class="m-skel"></div>';
  else if(L.error) h += '<div class="m-err">'+esc(L.error)+'</div>';
  else if(!L.entries.length) h += '<div class="rw-empty">Nothing hidden or shown again yet.</div>';
  else{
    h += '<div class="rw-note" style="margin:.6rem 0 .3rem">Every hide and every “Show it again”, kept for 5 years. Nobody can change or erase it.</div>';
    h += L.entries.map(function(e){
      const st = Array.isArray(e.stars) ? e.stars : [];
      return '<div class="rw-log" data-log="'+e.id+'"><div class="h">'+esc(RW_LOG_WORDS[e.action] || e.action)+' · '+esc(e.dish || 'a dish')+' <span>· '+esc(rwWhen(e.at))+'</span></div>'
        + (e.label ? '<div>Reason: '+esc(e.label)+'</div>' : '')
        + '<div>By '+esc(e.by || 'the restaurant')+(e.alerted ? ' · Fork\'s Rating was told' : '')+'</div>'
        + (e.details ? '<q>'+esc(e.details)+'</q>' : '')
        + (st.length ? '<div class="rw-small">Stars: dish '+st.slice(0,3).map(x => x || '–').join(' ')+' · restaurant '+st.slice(3).map(x => x || '–').join(' ')
                       +(e.visit ? ' · '+(e.visit === 'day' ? 'visit that day' : 'visit on another day') : '')+'</div>' : '')
        + '</div>';
    }).join('');
  }
  return h + '</div>';
}

function rwCalHtml(){
  const c = RW.cal, t = rwToday();
  const quick = [['today','Today', c.from === t && c.to === t], ['7','Last 7 days', c.from === rwAddDays(t,-6) && c.to === t], ['30','Last 30 days', c.from === rwAddDays(t,-29) && c.to === t],
                 ['month','This month', c.from === t.slice(0,8)+'01' && c.to === t], ['all','All time', !c.from && !c.to]];
  let h = '<div class="rw-ptop" style="flex-direction:column;align-items:stretch;gap:.5rem">'
    + '<div style="display:flex;justify-content:space-between;align-items:center"><button type="button" class="rw-ptitle" onclick="rwBack()" aria-label="Back to the filters">'+rwArrow(false).replace('M9 6l6 6-6 6','M15 6l-6 6 6 6')+'Dates</button>'
    + '<button type="button" class="rw-pclear" onclick="rwCalQuick(\'all\')">Clear</button></div>'
    + '<div class="rw-ft"><div'+(c.picking === 'from' ? ' class="act"' : '')+'><label>From</label><button type="button" id="rw-cal-from" onclick="RW.cal.picking=\'from\';rwPaintPage()">'+(c.from ? rwDayWords(c.from, true) : 'The first review')+'</button></div>'
    + '<div'+(c.picking === 'to' ? ' class="act"' : '')+'><label>To</label><button type="button" id="rw-cal-to" onclick="RW.cal.picking=\'to\';rwPaintPage()">'+(c.to ? rwDayWords(c.to, true) : 'Today')+'</button></div></div>'
    + '<div class="rw-quick">'+quick.map(q => '<button type="button" data-quick="'+q[0]+'" class="'+(q[2] ? 'on' : '')+'" onclick="rwCalQuick(\''+q[0]+'\')">'+q[1]+'</button>').join('')+'</div>'
    + '</div><div class="rw-pbody">';
  // from the first review's month (at most three years back, at least three months) to this month
  const first = RW.items.reduce((m, it) => it.day && it.day < m ? it.day : m, t);
  let y = Number(first.slice(0,4)), mo = Number(first.slice(5,7));
  const ty = Number(t.slice(0,4)), tm = Number(t.slice(5,7));
  const back = (ty - y) * 12 + (tm - mo);
  if(back > 36){ y = ty - 3; mo = tm; }
  if(back < 2){ mo = tm - 2; y = ty; while(mo < 1){ mo += 12; y -= 1; } }
  const to = c.to || (c.from ? c.from : null);
  while(y < ty || (y === ty && mo <= tm)){
    const key = y + '-' + String(mo).padStart(2,'0');
    const name = new Date(Date.UTC(y, mo-1, 1, 12)).toLocaleDateString('en-US', { timeZone:'UTC', month:'long' });
    h += '<div class="rw-month" data-month="'+key+'">'+name+' <small>'+y+'</small></div><div class="rw-grid">'
      + ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => '<span class="h">'+d+'</span>').join('');
    const lead = new Date(Date.UTC(y, mo-1, 1, 12)).getUTCDay(), days = new Date(Date.UTC(y, mo, 0, 12)).getUTCDate();
    for(let i = 0; i < lead; i++) h += '<span class="blank"></span>';
    for(let d = 1; d <= days; d++){
      const day = key + '-' + String(d).padStart(2,'0'), wd = (lead + d - 1) % 7;
      const cls = ['d'];
      if(wd === 0 || wd === 6) cls.push('we');
      if(c.from && day === c.from) cls.push('s');
      if(to && day === to && c.to) cls.push('e');
      if(c.from && c.to && day > c.from && day < c.to) cls.push('in');
      if(day === t) cls.push('today');
      h += '<button type="button" class="'+cls.join(' ')+'" data-day="'+day+'"'+(day > t ? ' disabled' : ' onclick="rwCalPick(\''+day+'\')"')+'><span>'+d+'</span></button>';
    }
    h += '</div>';
    mo += 1; if(mo > 12){ mo = 1; y += 1; }
  }
  h += '</div><div class="rw-pfoot"><button type="button" class="m-btn quiet" onclick="rwBack()">Cancel</button><button type="button" class="m-save" id="rw-cal-use" onclick="rwCalUse()">Use these dates</button></div>';
  return h;
}

loadSession();
boot();
</script>
