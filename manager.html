// 18:44 "I love the pictures you chose".
// 1 · Every date and time box of this page shows month / day / year and AM/PM, whatever the browser's language: the
//     browser's own box stays underneath (it keeps the value the code reads, YYYY-MM-DD and HH:MM), hidden, and
//     three lists (or one, for a time) sit on it. Boxes drawn later are dressed too (a watcher on the page).
// 2 · The event's photo: made on the phone (two JPEGs: the photo, and 1200 × 630 for link previews), sent straight to
//     Storage, checked by the server (api/_lib/evphoto.js).
// 3 · "Share the link": a picture of the event (its photo, name, day, price) goes with the link; on a computer, a
//     small window with the picture, Copy the link and Save the picture.

// ── 1 · month / day / year, AM / PM ──
const US_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];   // short: they fit a 320-px phone (the day in words under them)
const usPad = n => String(n).padStart(2, '0');
function usTimeWords(v){
  const m = /^(\d{2}):(\d{2})/.exec(String(v || '')); if(!m) return '';
  const h = Number(m[1]);
  return (h % 12 || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM');
}
function usDateWords(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(v || ''))) return '';
  const d = new Date(v + 'T12:00:00');
  return isNaN(d) ? '' : d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
const usDaysIn = (y, m) => new Date(y || 2024, m, 0).getDate();   // m: 1..12 (no year yet: 29 days in February)
function usDateHtml(inp){
  const v = /^(\d{4})-(\d{2})-(\d{2})$/.exec(inp.value || '');
  const y = v ? Number(v[1]) : 0, m = v ? Number(v[2]) : 0, d = v ? Number(v[3]) : 0;
  const now = new Date().getFullYear(), minY = /^\d{4}/.test(inp.min || '') ? Number(inp.min.slice(0, 4)) : now;
  const years = []; for(let k = Math.min(y || now, minY, now); k <= Math.max(y || now, now + 2); k++) years.push(k);
  const opt = (val, words, on) => '<option value="'+val+'"'+(on ? ' selected' : '')+'>'+words+'</option>';
  const label = inp.getAttribute('aria-label') || 'Day';
  return '<select class="m-select us-m" aria-label="'+esc(label)+': month">'+opt('', 'Month', !m)+US_MONTHS.map((w, i) => opt(i + 1, w, m === i + 1)).join('')+'</select>'
    + '<select class="m-select us-dd" aria-label="'+esc(label)+': day">'+opt('', 'Day', !d)+Array.from({ length:usDaysIn(y, m || 1) }, (_, i) => opt(i + 1, i + 1, d === i + 1)).join('')+'</select>'
    + '<select class="m-select us-y" aria-label="'+esc(label)+': year">'+opt('', 'Year', !y)+years.map(k => opt(k, k, y === k)).join('')+'</select>'
    + '<small class="us-w">'+esc(usDateWords(inp.value))+'</small>';
}
function usTimeHtml(inp){
  const v = /^\d{2}:\d{2}/.test(inp.value || '') ? inp.value.slice(0, 5) : '';
  const list = []; for(let k = 0; k < 24 * 60; k += 15) list.push(usPad(Math.floor(k / 60)) + ':' + usPad(k % 60));
  if(v && !list.includes(v)){ list.push(v); list.sort(); }
  return '<select class="m-select us-tm" aria-label="'+esc(inp.getAttribute('aria-label') || 'Time')+'">'
    + (v ? '' : '<option value="" selected>Time</option>')
    + list.map(t => '<option value="'+t+'"'+(t === v ? ' selected' : '')+'>'+usTimeWords(t)+'</option>').join('') + '</select>';
}
function usSet(inp, value){
  inp._usSelf = true;
  inp.value = value;
  inp.dispatchEvent(new Event('input', { bubbles:true }));
  inp.dispatchEvent(new Event('change', { bubbles:true }));
  inp._usSelf = false;
}
function usDress(inp){
  if(inp.dataset.us || inp.closest('[data-no-us]')) return;
  inp.dataset.us = '1';
  inp.classList.add('us-native'); inp.tabIndex = -1; inp.setAttribute('aria-hidden', 'true');
  const box = document.createElement('span');
  box.className = 'us-box ' + (inp.type === 'date' ? 'us-date' : 'us-time');
  inp.insertAdjacentElement('afterend', box);
  const draw = () => { box.innerHTML = inp.type === 'date' ? usDateHtml(inp) : usTimeHtml(inp); };
  draw();
  box.addEventListener('change', ev => {
    if(inp.type === 'time'){ usSet(inp, ev.target.value); return; }
    const pick = c => box.querySelector(c).value;
    const y = Number(pick('.us-y')), m = Number(pick('.us-m'));
    let d = Number(pick('.us-dd'));
    if(y && m && d) d = Math.min(d, usDaysIn(y, m));
    const role = ['us-m','us-dd','us-y'].find(c => ev.target.classList.contains(c));
    usSet(inp, y && m && d ? y + '-' + usPad(m) + '-' + usPad(d) : '');
    if(!box.isConnected) return;                          // the change drew the form again (a new box is on the new box)
    if(!(y && m && d)){                                     // not whole yet: keep what was chosen, and the day's list right for the month
      const keep = { m:pick('.us-m'), dd:pick('.us-dd'), y:pick('.us-y') };
      draw();
      box.querySelector('.us-m').value = keep.m; box.querySelector('.us-y').value = keep.y;
      const days = box.querySelector('.us-dd');
      days.innerHTML = '<option value="">Day</option>' + Array.from({ length:usDaysIn(Number(keep.y), Number(keep.m) || 1) }, (_, i) => '<option value="'+(i + 1)+'">'+(i + 1)+'</option>').join('');
      days.value = keep.dd && Number(keep.dd) <= days.options.length - 1 ? keep.dd : '';
    } else draw();
    const again = role && box.querySelector('.' + role); if(again) again.focus();
  });
  const outside = () => { if(!inp._usSelf && box.isConnected) draw(); };
  inp.addEventListener('input', outside);
  inp.addEventListener('change', outside);
}
function usDressAll(root){ (root || document).querySelectorAll('input[type="date"]:not([data-us]), input[type="time"]:not([data-us])').forEach(usDress); }
(function usWatch(){
  const go = () => {
    usDressAll(document);
    try{ new MutationObserver(() => usDressAll(document)).observe(document.body, { childList:true, subtree:true }); }catch(e){ /* an old browser: its own boxes */ }
  };
  if(document.body) go(); else document.addEventListener('DOMContentLoaded', go);
})();

// ── 2 · the event's photo ──
function evLoadImage(file){
  return new Promise((ok, bad) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); bad(new Error('That photo can not be opened here. Please choose a JPG or PNG photo.')); };
    img.src = url;
  });
}
function evCanvasBlob(c, q){ return new Promise(ok => c.toBlob(b => ok(b), 'image/jpeg', q)); }
// the photo (at most 1600 px, under maxBytes) or, with h, a w × h cut from its middle (link previews: 1200 × 630)
async function evJpeg(img, w, h, maxBytes){
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  if(!iw || !ih) throw new Error('That photo can not be opened here. Please choose a JPG or PNG photo.');
  const c = document.createElement('canvas'), g = c.getContext('2d');
  if(h){
    c.width = w; c.height = h;
    const k = Math.max(w / iw, h / ih), sw = w / k, sh = h / k;
    g.fillStyle = '#170E0B'; g.fillRect(0, 0, w, h);
    g.drawImage(img, (iw - sw) / 2, Math.max(0, (ih - sh) * 0.42), sw, sh, 0, 0, w, h);
  } else {
    const k = Math.min(1, w / Math.max(iw, ih));
    c.width = Math.max(1, Math.round(iw * k)); c.height = Math.max(1, Math.round(ih * k));
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);   // a see-through PNG: white underneath
    g.drawImage(img, 0, 0, c.width, c.height);
  }
  for(const q of [0.86, 0.8, 0.72, 0.62, 0.5, 0.4]){
    const b = await evCanvasBlob(c, q);
    if(b && b.size <= maxBytes) return b;
  }
  throw new Error('That photo is too big. Please choose another one.');
}
async function evPhotoPrepare(file){
  if(!file) throw new Error('Please choose a photo.');
  if(file.type && !/^image\//.test(file.type)) throw new Error('That file is not a photo. Please choose a photo (JPG or PNG).');
  if(file.size > 40 * 1024 * 1024) throw new Error('That photo is too big. Please choose another one.');
  const img = await evLoadImage(file);
  const main = await evJpeg(img, 1600, 0, 2.8 * 1024 * 1024);
  const og = await evJpeg(img, 1200, 630, 560 * 1024);
  return { main, og, url:URL.createObjectURL(main) };
}
async function evPhotoPicked(input){
  const f = EV.form, file = input && input.files && input.files[0];
  if(!f || !file) return;
  evKeep(); EV.photoBusy = true; if(EV.fieldErr && EV.fieldErr.field === 'photo') EV.fieldErr = null; evPaint();
  try{
    const prep = await evPhotoPrepare(file);
    if(EV.form !== f){ URL.revokeObjectURL(prep.url); return; }
    if(f.photoNew) URL.revokeObjectURL(f.photoNew.url);
    f.photoNew = prep; f.photoRemove = false;
  }catch(e){ if(EV.form === f) EV.fieldErr = { field:'photo', error:e.message }; }
  EV.photoBusy = false; evPaint();
}
function evPhotoDrop(){
  const f = EV.form; if(!f) return;
  evKeep();
  if(f.photoNew){ URL.revokeObjectURL(f.photoNew.url); f.photoNew = null; }
  f.photoRemove = !!f.photo;
  if(EV.fieldErr && EV.fieldErr.field === 'photo') EV.fieldErr = null;
  evPaint();
}
function evPhotoField(f, err){
  const shown = f.photoNew ? f.photoNew.url : (f.photoRemove ? null : f.photo);
  const pick = '<input type="file" accept="image/*" hidden data-photo-input onchange="evPhotoPicked(this)">';
  return '<div class="ev-f ev-photo'+(err.field === 'photo' ? ' bad' : '')+'"><span>Photo</span>'
    + (EV.photoBusy ? '<div class="ev-ph-add busy" aria-live="polite">Preparing the photo…</div>'
      : shown ? '<div class="ev-ph" role="img" aria-label="The event’s photo" style="background-image:url(&quot;'+esc(shown)+'&quot;)"></div>'
          + '<div class="ev-ph-acts"><label class="ev-ph-btn">Change photo'+pick+'</label><button type="button" class="ev-ph-rm" onclick="evPhotoDrop()">Remove</button></div>'
        : '<label class="ev-ph-add">+ Add a photo'+pick+'</label>')
    + '<small class="ev-hint">Optional. A wide photo looks best: guests see it on the event page, on the shared picture and in the WhatsApp preview.</small>'
    + '</div>' + (err.field === 'photo' ? '<div class="ev-err" role="alert">'+esc(err.error)+'</div>' : '');
}
async function evPhotoUpload(id, prep){
  const slot = await rvApi({ action:'ev_photo_slot', id:id });
  for(const [url, blob] of [[slot.upload.photo, prep.main], [slot.upload.og, prep.og]]){
    let r;
    try{ r = await fetch(url, { method:'PUT', headers:{ 'content-type':'image/jpeg', 'x-upsert':'false' }, body:blob }); }
    catch(e){ throw new Error('The photo could not be sent. Check the connection and try again.'); }
    if(!r.ok) throw new Error('The photo could not be sent. Please try again.');
  }
  return rvApi({ action:'ev_photo_set', id:id, name:slot.name });
}
// after the event is saved: its photo (new, or taken away). Returns a problem in words, or null.
async function evPhotoAfterSave(f, id){
  try{
    if(f.photoNew){ await evPhotoUpload(id, f.photoNew); URL.revokeObjectURL(f.photoNew.url); f.photoNew = null; }
    else if(f.photoRemove && f.photo) await rvApi({ action:'ev_photo_remove', id:id });
    return null;
  }catch(e){ return e.message || 'The photo could not be saved.'; }
}

// ── 3 · the shared picture ──
function evImg(src){
  return new Promise(ok => { if(!src) return ok(null); const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}
function evRound(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function evWrap(g, text, width, most){
  const words = String(text).split(/\s+/), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if(g.measureText(t).width <= width || !cur) cur = t; else { lines.push(cur); cur = w; } });
  if(cur) lines.push(cur);
  if(lines.length > most){ const keep = lines.slice(0, most); let last = keep[most - 1]; while(last && g.measureText(last + '…').width > width) last = last.slice(0, -1); keep[most - 1] = last.trimEnd() + '…'; return keep; }
  return lines;
}
// The picture: the photo, the day and hours, the name, the restaurant · room · 21+, the price; at the bottom the restaurant,
// its address and "Tickets: <site>", and the link's QR code with the logo (3 Nov 20:25: "the qr code … and the location too").
async function evShareCard(e, info){
  const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  try{ await Promise.all(['700 100px "Cormorant Garamond"', '600 40px "Cormorant Garamond"', '600 28px Inter', '400 30px Inter'].map(f => document.fonts.load(f))); }catch(err){ /* the fallback fonts */ }
  const bg = g.createRadialGradient(W / 2, 0, 40, W / 2, 0, H * 0.9); bg.addColorStop(0, '#3A1E16'); bg.addColorStop(1, '#140D0A');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const px = 44, py = 44, pw = W - 88, phh = 560;
  const [photo, qr] = await Promise.all([evImg(e.photo), evImg(info && info.qr)]);
  g.save(); evRound(g, px, py, pw, phh, 34); g.clip();
  if(photo){
    const k = Math.max(pw / photo.naturalWidth, phh / photo.naturalHeight), sw = pw / k, sh = phh / k;
    g.drawImage(photo, (photo.naturalWidth - sw) / 2, Math.max(0, (photo.naturalHeight - sh) * 0.42), sw, sh, px, py, pw, phh);
  } else {
    const p = g.createLinearGradient(px, py, px + pw, py + phh); p.addColorStop(0, '#4A1A12'); p.addColorStop(0.6, '#22120D'); p.addColorStop(1, '#170E0B');
    g.fillStyle = p; g.fillRect(px, py, pw, phh);
  }
  g.restore();
  g.strokeStyle = 'rgba(252,249,244,.14)'; g.lineWidth = 2; evRound(g, px, py, pw, phh, 34); g.stroke();
  let y = py + phh + 76;
  g.fillStyle = '#F08C7F'; g.font = '600 30px Inter, "Segoe UI", sans-serif'; g.textBaseline = 'alphabetic';
  try{ g.letterSpacing = '5px'; }catch(err){ /* not everywhere */ }
  g.fillText((e.short + ' · ' + e.hours).toUpperCase(), px, y);
  try{ g.letterSpacing = '0px'; }catch(err){ /* not everywhere */ }
  g.fillStyle = '#FCF9F4'; g.font = '700 112px "Cormorant Garamond", Georgia, serif';
  let lines = evWrap(g, e.name, pw, 2), step = 112;
  if(lines.length > 1){ g.font = '700 92px "Cormorant Garamond", Georgia, serif'; lines = evWrap(g, e.name, pw, 2); step = 94; }
  lines.forEach(l => { y += step; g.fillText(l, px, y); });
  y += 58; g.fillStyle = '#B9AC9F'; g.font = '400 32px Inter, "Segoe UI", sans-serif';
  g.fillText(evWrap(g, [RESTAURANT && RESTAURANT.name, e.room, e.adultsOnly ? '21 and over' : null].filter(Boolean).join(' · '), pw, 1)[0] || '', px, y);
  y += lines.length > 1 ? 80 : 92; g.fillStyle = '#FCF9F4'; g.font = '700 72px "Cormorant Garamond", Georgia, serif';
  g.fillText(e.price, px, y);
  const pwid = g.measureText(e.price).width;
  g.fillStyle = '#B9AC9F'; g.font = '600 40px "Cormorant Garamond", Georgia, serif';
  g.fillText(' per person' + (e.taxMode === 'added' ? ' + tax' : e.taxMode === 'included' ? ', tax included' : ''), px + pwid + 8, y);
  // the bottom: the restaurant, its address, the site · the QR code
  const top = H - 290, qs = 232, qx = W - px - qs, qy = H - px - qs;
  g.strokeStyle = 'rgba(252,249,244,.14)'; g.beginPath(); g.moveTo(px, top); g.lineTo(W - px, top); g.stroke();
  const left = qr ? qx - px - 36 : pw;
  g.fillStyle = '#E9E0D3'; g.font = '600 46px "Cormorant Garamond", Georgia, serif';
  g.fillText(evWrap(g, (info && info.restaurant) || (RESTAURANT && RESTAURANT.name) || '', left, 1)[0] || '', px, top + 82);
  let ay = top + 82;
  if(info && info.address){
    g.fillStyle = '#B9AC9F'; g.font = '400 30px Inter, "Segoe UI", sans-serif';
    evWrap(g, '📍 ' + evAddress(info.address), left, 2).forEach(l => { ay += 42; g.fillText(l, px, ay); });
  }
  let host = ''; try{ host = new URL(e.link).host; }catch(err){ host = ''; }
  g.fillStyle = '#E9E0D3'; g.font = '600 30px Inter, "Segoe UI", sans-serif';
  g.fillText('Tickets: ' + host, px, H - px - 6);
  if(qr){
    g.fillStyle = '#FFFFFF'; evRound(g, qx - 10, qy - 10, qs + 20, qs + 20, 18); g.fill();
    g.drawImage(qr, qx, qy, qs, qs);
  }
  const blob = await evCanvasBlob(c, 0.9);
  if(!blob) throw new Error('The picture could not be made.');
  return blob;
}
// "17 Stone St, New York, NY, 10004" → "17 Stone St, New York, NY 10004" (as Share the table writes it)
const evAddress = a => String(a || '').trim().replace(/,\s*(\d{5}(?:-\d{4})?)$/, ' $1');
const evMapQuery = a => encodeURIComponent(a).replace(/%20/g, '+').replace(/%2C/g, ',');
// The message that goes with the picture: the event, the day, the price, 📍 the address with both maps, the tickets link.
function evShareText(e, info){
  const lines = ['🎟 ' + e.name, (info && info.restaurant) || (RESTAURANT && RESTAURANT.name) || '',
    (e.day || e.short) + ' · ' + e.hours + (e.room ? ' · ' + e.room : ''),
    e.price + ' per person' + (e.taxMode === 'added' ? ' + tax' : e.taxMode === 'included' ? ', tax included' : '') + (e.adultsOnly ? ' · 21 and over' : '')];
  if(info && info.address){
    const a = evAddress(info.address), q = evMapQuery(a);
    lines.push('', '📍 ' + a, 'Google Maps: https://www.google.com/maps/search/?api=1&query=' + q, 'Apple Maps: https://maps.apple.com/?q=' + q);
  }
  lines.push('', 'Tickets: ' + e.link);
  return lines.filter((l, i) => l !== '' || i > 0).join('\n');
}
const evSlug = s => String(s || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'event';
const evTouch = () => { try{ return matchMedia('(pointer: coarse)').matches; }catch(e){ return false; } };
async function evShare(id){
  const e = EV.list.find(x => x.id === id); if(!e) return;
  const b = document.querySelector('[data-share="'+id+'"]');
  if(b){ b.disabled = true; b.textContent = 'Preparing…'; }
  let info = null, file = null;
  try{ info = await rvApi({ action:'ev_share', id:id }); }catch(err){ info = null; }      // without it: the picture and words, no QR or address
  try{ file = new File([await evShareCard(e, info)], evSlug(e.name) + '.jpg', { type:'image/jpeg' }); }catch(err){ file = null; }
  if(b && b.isConnected){ b.disabled = false; b.textContent = 'Share the link'; }
  const text = evShareText(e, info);
  if(evTouch()){
    try{
      if(file && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:e.name, text:text }); return; }
      if(navigator.share){ await navigator.share({ title:e.name, text:text }); return; }
    }catch(err){ if(err && err.name === 'AbortError') return; }
  }
  evShareSheet(e, file, text);
}
// a computer (or a phone that can not share): the picture, Copy the link, Save the picture
function evShareSheet(e, file, text){
  evShareClose();
  const url = file ? URL.createObjectURL(file) : null;
  const box = document.createElement('div');
  box.className = 'ev-share-wrap'; box.id = 'ev-share';
  box.innerHTML = '<div class="ev-share" role="dialog" aria-modal="true" aria-label="Share the event">'
    + '<div class="ev-share-h"><b>Share “'+esc(e.name)+'”</b><button type="button" class="ev-share-x" aria-label="Close" onclick="evShareClose()">×</button></div>'
    + (url ? '<img class="ev-share-img" alt="The picture of the event: its photo, name, day, price, address and the QR code of its link" src="'+url+'">' : '')
    + '<div class="ev-share-btns"><button type="button" class="m-btn" data-copy-msg>Copy the message</button>'
    + (url ? '<a class="m-btn quiet" data-save download="'+esc(file.name)+'" href="'+url+'">Save the picture</a>' : '') + '</div>'
    + '<div class="ev-share-link"><span>'+esc(e.link)+'</span> <button type="button" class="rv-link" data-copy>Copy only the link</button></div>'
    + '<small class="ev-hint">Send the picture and the message together (WhatsApp, Instagram, email). The message has the address with Google Maps and Apple Maps.</small></div>';
  box.addEventListener('click', ev => { if(ev.target === box) evShareClose(); });
  const copier = (sel, what, idle) => box.querySelector(sel).addEventListener('click', async ev => {
    const btn = ev.currentTarget;
    try{ await navigator.clipboard.writeText(what); btn.textContent = 'Copied ✓'; }
    catch(err){ btn.textContent = 'Could not copy'; }
    setTimeout(() => { if(btn.isConnected) btn.textContent = idle; }, 2500);
  });
  copier('[data-copy-msg]', text || e.link, 'Copy the message');
  copier('[data-copy]', e.link, 'Copy only the link');
  box._url = url;
  document.body.appendChild(box);
  const first = box.querySelector('[data-copy-msg]'); if(first) first.focus();
}
function evShareClose(){
  const box = document.getElementById('ev-share'); if(!box) return;
  if(box._url) setTimeout(() => URL.revokeObjectURL(box._url), 1000);
  box.remove();
}
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') evShareClose(); });

// ── GUEST MESSAGES (r21) ──
//
// Sebastian, 8 Oct (pictures 13 and 17): a red bubble at the bottom right, like
// Messenger's, opens the guests' messages; a chat sign on a guest's card opens
// that guest's conversation. No ready-made answers: people write. Open and
// Closed on top, and a day strip like the reservations one — the window shows
// the conversations of one day (the table's day), so yesterday's are a tap away.
// A conversation closes by itself when the guest arrives; staff can close it
// and open it again at any time in the 90 days it is kept. Owners, managers and
// Sebastian answer; crew only when a manager has switched it on in Team. The
// server checks all of that again on every request (api/_lib/messages.js).
// kind: 'table' (a booking's conversation) or 'request' (r30: a big-party request's, opened from its card).
const MSG = { known: null, unread: 0, open: false, view: 'list', kind: 'table', tab: 'open', date: null, today: null, data: null, error: null,
              threadId: null, thread: null, threadError: null, seq: 0, gen: 0, timer: null, lastList: 0, sending: false, busy: false,
              asking: 0, askedAt: 0, wokeAt: 0, stripDates: null, stripToday: null, stripAim: null, stripTouch: false, stripMoved: 0, stripWatch: null, stripChose: null,
              pending: null, links: {} };     // r42: a file chosen and not sent yet; links to files (one hour), by file id
const MSG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M4.5 5.5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5v-3.5h-1a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></svg>';
const MSG_SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>';
const MSG_CLIP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M20.5 11.5 12.3 19.7a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>';
const MSG_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 15.5h7M8.5 12h4"/></svg>';
const MAIL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>';

// The chat sign on a card whose guest has written: red with the count when
// something is unread, outlined when read, grey when the conversation is closed.
function msgSign(b){
  // r42 (Sebastian, 22 and 26 Oct: "I want to be able to open a conversation with any reservation"): nobody has
  // written yet, the table is still kept, and this account answers guests — a sign to start one.
  if(!b.chat && b.canWrite) return '<button type="button" class="rv-chat-sign start" aria-label="Write to '+esc(whoText(b.name, b.handle))+'">'+MSG_ICON+'<i aria-hidden="true">+</i></button>';
  if(!b.chat) return '';
  const n = Number(b.chat.unread) || 0;
  const cls = n ? ' new' : (b.chat.open ? '' : ' shut');
  return '<button type="button" class="rv-chat-sign'+cls+'" aria-label="Messages from '+esc(whoText(b.name, b.handle))+(n ? ' ('+n+' new)' : '')+'">'
    + MSG_ICON + (n ? '<b>'+(n>99?'99+':n)+'</b>' : '') + '</button>';
}

// staff_day says whether this account answers guests here, and how many wait.
function msgFromDay(day){
  if(day.messages === null || day.messages === undefined){ MSG.known = false; MSG.unread = 0; }
  else { MSG.known = true; MSG.unread = Number(day.messages.unread) || 0; }
  msgBubble();
}
// The round button steps aside (CSS: phones only) while the page scrolls and while a field has the cursor, and returns 0.9 s after.
function msgBubbleAside(b){
  let t = null;
  const writing = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
  const back = () => { if(!writing()) b.classList.remove('away'); };
  window.addEventListener('scroll', function(){ b.classList.add('away'); clearTimeout(t); t = setTimeout(back, 900); }, {passive:true});
  document.addEventListener('focusin', function(e){ if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) b.classList.add('away'); });
  document.addEventListener('focusout', function(){ clearTimeout(t); t = setTimeout(back, 300); });
}
function msgBubble(){
  let b = document.getElementById('mg-bubble');
  if(!b){
    b = document.createElement('button');
    b.type = 'button'; b.id = 'mg-bubble'; b.className = 'mg-bubble'; b.hidden = true;
    b.addEventListener('click', function(){ msgOpen(); });
    document.body.appendChild(b);
    msgBubbleAside(b);
  }
  b.hidden = !(currentSession && MSG.known && !MSG.open);
  b.innerHTML = MSG_ICON + (MSG.unread ? '<b>'+(MSG.unread>99?'99+':MSG.unread)+'</b>' : '');
  b.setAttribute('aria-label', 'Guest messages'+(MSG.unread ? ' ('+MSG.unread+' new)' : ''));
}

// Another restaurant, or the session ended: nothing of the last one stays.
function msgReset(){
  MSG.gen += 1;
  Object.assign(MSG, { known: null, unread: 0, view: 'list', tab: 'open', date: null, today: null, data: null, error: null,
                       threadId: null, thread: null, threadError: null, sending: false, busy: false, links: {} });
  msgPendClear(true);
  msgHide();
}
function msgHide(){
  MSG.open = false;
  msgPendClear(true);                                   // r42: a file chosen and not sent stays on this phone only until the window closes
  clearInterval(MSG.timer); MSG.timer = null;
  const host = document.getElementById('mg-sheet-host');
  if(host) host.innerHTML = '';
  msgBubble();
}

// From the role icon (#messages). Someone at two restaurants lands on the one
// whose guests are waiting.
async function msgOpenFromHash(){
  if(history.replaceState) history.replaceState(null, '', window.location.pathname + window.location.search + '#' + TAB);
  if(ACCESS && ACCESS.restaurants.length > 1){
    try{
      const box = await rvApi({action:'inbox', staff:true});
      const by = box.staff && box.staff.byRestaurant ? box.staff.byRestaurant : {};
      let best = null;
      ACCESS.restaurants.forEach(r => { if((by[r.id]||0) > 0 && (!best || by[r.id] > by[best.id])) best = r; });
      if(best && String(best.id) !== String(RESTAURANT.id)) switchRestaurant(best.id);
    }catch(e){ /* open where we are */ }
  }
  msgOpen();
}
function msgOpen(){
  if(!RESTAURANT || !currentSession) return;
  // The server picks the day: today, or the day of the newest message waiting.
  MSG.open = true; MSG.view = 'list'; MSG.kind = 'table'; MSG.date = null; MSG.tab = 'open'; MSG.data = null;
  msgBubble(); msgPaint();
  msgLoadList();
  msgTimer();
}
function msgOpenThread(id){
  if(!RESTAURANT || !currentSession) return;
  if(MSG.threadId !== Number(id) || MSG.kind !== 'table') msgPendClear(true);
  MSG.open = true; MSG.view = 'thread'; MSG.kind = 'table'; MSG.threadId = Number(id); MSG.thread = null; MSG.threadError = null;
  msgBubble(); msgPaint();
  msgLoadThread(true);
  msgTimer();
}
// r30 (Sebastian, 13 Oct): a big-party request's own conversation, from the chat button on its card. It opens over
// the requests; closing it goes back to them.
function rqChatOpen(id){
  if(!RESTAURANT || !currentSession) return;
  if(MSG.threadId !== Number(id) || MSG.kind !== 'request') msgPendClear(true);
  MSG.open = true; MSG.view = 'thread'; MSG.kind = 'request'; MSG.threadId = Number(id); MSG.thread = null; MSG.threadError = null;
  msgBubble(); msgPaint();
  msgLoadThread(true);
  msgTimer();
}
// The table or the request a conversation is about (the two answers name it differently).
function msgSubject(t){ return t ? (t.booking || t.request || null) : null; }
// Closing the window: the day behind it catches up (chat signs, counts).
function msgClose(){ msgHide(); if(TAB==='reservations' && RV.day && RV.view==='day') rvLoadDay(RV.date, {quiet:true}); }

// While the window is open and on screen: the open conversation every 3
// seconds, the day's list every 6 (r22: were 8 and 30 — Sebastian, 8 Oct,
// "the messages are slow to arrive"). A question still on its way is not
// asked twice, and coming back to the page asks at once.
const MSG_THREAD_EVERY = 3000, MSG_LIST_EVERY = 6000;
function msgTimer(){
  if(MSG.timer) return;
  MSG.timer = setInterval(function(){ msgTick(false); }, 1000);      // looks every second; asks as often as msgTick says
}
// Nobody touching the page for a while: slower (hfPace, taster.js), but a
// staff page keeps asking: the open conversation every 30 seconds at most,
// the list every minute.
function msgTick(now){
  if(!MSG.open || !currentSession){ clearInterval(MSG.timer); MSG.timer = null; return; }
  if(document.visibilityState !== 'visible' || MSG.sending || MSG.busy) return;
  if(MSG.asking && Date.now() - MSG.askedAt < 15000) return;
  const pace = function(fast, slowest){ return typeof hfPace === 'function' ? hfPace(fast, slowest) : fast; };
  if(MSG.view === 'thread'){ if(now || Date.now() - MSG.askedAt >= pace(MSG_THREAD_EVERY, 30000) - 400) msgLoadThread(false); }
  else if(now || Date.now() - Math.max(MSG.lastList, MSG.askedAt) >= pace(MSG_LIST_EVERY, 60000) - 400) msgLoadList(true);
}
// Back on the page (another app, another tab, the phone unlocked): what is
// open catches up now, and the evening's chat signs too.
function msgWake(){
  if(document.visibilityState !== 'visible' || !currentSession) return;
  if(Date.now() - MSG.wokeAt < 2000) return;          // coming back fires two events: one catch-up
  MSG.wokeAt = Date.now();
  if(MSG.open) msgTick(true);
  else if(TAB==='reservations' && RV.view==='day' && RV.day && !RV.sheet && !RV.armed && !RV.busy
          && Date.now() - (RV.fetchedAt || 0) > 15000 && Date.now() - RV.lastScroll > 4000) rvLoadDay(RV.date, {quiet:true});
}
document.addEventListener('visibilitychange', msgWake);
window.addEventListener('focus', msgWake);
window.addEventListener('pageshow', function(e){ if(e.persisted) msgWake(); });
window.hfOnWake = msgWake;                            // a touch after a quiet minute (taster.js)
// taster.js asks the server what is new every few seconds (the role icon's
// count). When this restaurant's count of guest messages changes, the bubble
// follows at once, and the list or the evening's chat signs catch up.
window.hfOnInbox = function(data){
  if(!data || !data.staff || !RESTAURANT || !currentSession || MSG.known !== true) return;
  const here = (data.staff.restaurants || []).map(String);
  if(here.indexOf(String(RESTAURANT.id)) < 0) return;
  const n = Number((data.staff.byRestaurant || {})[RESTAURANT.id]) || 0;
  if(n === MSG.unread) return;
  MSG.unread = n; msgBubble();
  if(MSG.open){ if(MSG.view === 'list' && !(MSG.asking && Date.now() - MSG.askedAt < 15000)) msgLoadList(true); return; }
  if(TAB==='reservations' && RV.view==='day' && RV.day && !RV.sheet && !RV.armed && !RV.busy && Date.now() - RV.lastScroll > 4000) rvLoadDay(RV.date, {quiet:true});
};

async function msgLoadList(quiet){
  const seq = ++MSG.seq, gen = MSG.gen;
  MSG.asking = seq; MSG.askedAt = Date.now();
  try{
    const body = {action:'staff_msgs'};
    if(MSG.date) body.date = MSG.date;
    const data = await rvApi(body);
    if(MSG.asking === seq) MSG.asking = 0;
    if(seq !== MSG.seq || gen !== MSG.gen) return;
    const changed = JSON.stringify(data) !== JSON.stringify(MSG.data);
    MSG.data = data; MSG.date = data.date; MSG.today = data.today; MSG.lastList = Date.now(); MSG.error = null;
    MSG.known = true; MSG.unread = data.unreadCount;
    msgBubble();
    if(MSG.open && MSG.view === 'list' && changed) msgPaint();
  }catch(e){
    if(MSG.asking === seq) MSG.asking = 0;
    if(seq !== MSG.seq || gen !== MSG.gen) return;
    if(e.status === 403){ MSG.known = false; msgBubble(); }
    if(!quiet || !MSG.data){ MSG.error = e.message; if(MSG.open && MSG.view === 'list') msgPaint(); }
  }
}

async function msgLoadThread(first){
  const seq = ++MSG.seq, gen = MSG.gen, id = MSG.threadId;
  MSG.asking = seq; MSG.askedAt = Date.now();
  try{
    const kind = MSG.kind;
    const data = await rvApi(kind === 'request' ? {action:'staff_req_thread', requestId: id} : {action:'staff_msg_thread', id: id});
    if(MSG.asking === seq) MSG.asking = 0;
    if(seq !== MSG.seq || gen !== MSG.gen || id !== MSG.threadId || kind !== MSG.kind || MSG.sending) return;
    const changed = JSON.stringify(data) !== JSON.stringify(MSG.thread);
    msgAnnounce(MSG.thread, data);
    MSG.thread = data; MSG.threadError = null;
    if(data.booking && data.booking.serviceDate) MSG.date = data.booking.serviceDate;
    if(changed || first) msgPaint(first);
    msgSignRead(id);
    // Read now: the role icon's count in the header catches up too.
    if(first && typeof hfInboxSeen === 'function') hfInboxSeen();
  }catch(e){
    if(MSG.asking === seq) MSG.asking = 0;
    if(seq !== MSG.seq || gen !== MSG.gen || id !== MSG.threadId) return;
    if(first || !MSG.thread){ MSG.threadError = e.message; msgPaint(); }
  }
}

// Opened: that card's chat sign has nothing unread any more, and the bubble's count drops.
function msgSignRead(id){
  if(!RV.day) return;
  if(MSG.kind === 'request'){
    const q = (RV.day.requests || []).find(x => x.id === Number(id));
    if(q && q.chat && q.chat.unread){ q.chat = Object.assign({}, q.chat, {unread: 0}); if(RV.sheet) rvPaintSheet(); rvPaintTop(); }
    return;
  }
  const b = RV.day.bookings.find(x => x.id === Number(id));
  if(!b || !b.chat || !b.chat.unread) return;
  MSG.unread = Math.max(0, MSG.unread - b.chat.unread);
  b.chat = Object.assign({}, b.chat, {unread: 0});
  rvRepaintCard(b.id);
  msgBubble();
}

function msgPaint(first){
  let host = document.getElementById('mg-sheet-host');
  if(!host){ host = document.createElement('div'); host.id = 'mg-sheet-host'; document.body.appendChild(host); }
  if(!MSG.open){ host.innerHTML = ''; host.dataset.view = ''; return; }
  const scroller = host.querySelector('.mg-scroll');
  const atEnd = !scroller || scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 40;
  // A conversation already on screen: only its top and its messages change.
  // The answer box is left exactly as it is — rebuilding it would close the
  // keyboard on a phone in the middle of a sentence.
  const key = (MSG.kind === 'request' ? 'r' : 't') + MSG.threadId;
  if(MSG.view === 'thread' && MSG.thread && host.dataset.view === key && host.querySelector('.mg-form')){
    host.querySelector('.mg-top').innerHTML = msgTopHtml(MSG.thread);
    host.querySelector('.mg-msgs').innerHTML = msgBubblesHtml(MSG.thread);
    const ph = MSG.thread.fresh ? 'Write your message…' : 'Write your answer…', inp = host.querySelector('.mg-input');
    if(inp && inp.placeholder !== ph) inp.placeholder = ph;
    MSG.stick = first || atEnd;
    if(first || atEnd) scroller.scrollTop = scroller.scrollHeight;
    msgFilesFill();
    return;
  }
  if(MSG.view === 'list' && MSG.data && host.dataset.view === 'list' && msgPatchList(host)) return;
  const sameList = MSG.view === 'list' && host.dataset.view === 'list' && host.dataset.date === String(MSG.date);
  const keepTop = sameList && scroller ? scroller.scrollTop : 0;
  host.innerHTML = '<div class="rv-scrim" onclick="msgClose()"></div>'
    + '<div class="rv-sheet mg-sheet" role="dialog" aria-modal="true" aria-label="Guest messages"><div class="rv-grab"></div>'
    + (MSG.view === 'thread' ? msgThreadHtml() : msgListHtml())
    + '</div>';
  host.dataset.view = MSG.view === 'thread' ? (MSG.thread ? key : '') : 'list';
  host.dataset.date = String(MSG.date);
  const sc = host.querySelector('.mg-scroll');
  if(sc && MSG.view === 'thread'){ sc.scrollTop = sc.scrollHeight; MSG.stick = true; msgPendPaint(); msgFilesFill(); }
  if(sc && MSG.view === 'list') sc.scrollTop = keepTop;
  if(MSG.view === 'list'){
    const strip = host.querySelector('.mg-strip');
    if(strip) msgStripMake(strip);
  }
}

// A screen reader hears a new message once, not the whole conversation again.
function msgAnnounce(before, after){
  if(!before || !after || !msgSubject(before) || !msgSubject(after) || msgSubject(before).id !== msgSubject(after).id) return;
  const fresh = after.messages.filter(m => m.fromGuest && !before.messages.some(x => x.id === m.id));
  const live = document.querySelector('#mg-sheet-host .mg-live');
  if(fresh.length && live) live.textContent = 'New message from '+whoText(fresh[fresh.length-1].who, fresh[fresh.length-1].handle)+': '+fresh[fresh.length-1].body;
}

function msgHead(title, back){
  return '<div class="rv-sheet-head"><div style="min-width:0;">'
    + (back === 'requests' ? '<button type="button" class="mg-back" onclick="msgClose()">&#8249; Big-party requests</button>'
       : back ? '<button type="button" class="mg-back" onclick="msgBackToList()">&#8249; All conversations</button>' : '')
    + '<div class="m-h">'+title+'</div></div>'
    + '<button type="button" class="rv-x" aria-label="Close" onclick="msgClose()">&times;</button></div>';
}

function msgListHtml(){
  const d = MSG.data;
  if(!d) return msgHead('Messages') + (MSG.error ? '<div class="m-err">'+esc(MSG.error)+'</div>' : '<div class="m-skel"></div><div class="m-skel"></div>');
  return msgHead('Messages')
    + '<div class="mg-tabs" role="tablist">'
    +   '<button type="button" role="tab" class="mg-tab'+(MSG.tab==='open'?' on':'')+'" aria-selected="'+(MSG.tab==='open')+'" onclick="msgTab(\'open\')">Open'
    +     (d.openCount ? ' <b class="mg-n">'+d.openCount+'</b>' : '')+'</button>'
    +   '<button type="button" role="tab" class="mg-tab'+(MSG.tab==='closed'?' on':'')+'" aria-selected="'+(MSG.tab==='closed')+'" onclick="msgTab(\'closed\')">Closed'
    +     (d.closedUnread ? ' <b class="mg-n" title="Closed, with a message not read yet">'+d.closedUnread+'</b>' : '')+'</button>'
    + '</div>'
    + '<div class="mg-days"><button type="button" class="rv-arrow" aria-label="Previous day" onclick="msgStep(-1)">&#8249;</button>'
    +   msgStripHtml(d)
    +   '<button type="button" class="rv-arrow" aria-label="Next day" onclick="msgStep(1)">&#8250;</button></div>'
    + '<div class="rv-dateline mg-dateline">'+esc(rvLong(d.date))+(d.date===d.today ? ' · today' : '')+'</div>'
    + '<div class="mg-scroll">'+msgRowsHtml(d)+'</div>'
    + '<p class="mg-foot">Conversations are kept 3 years after the table (older ones: 90 days). After 90 days they can be read, not written in.</p>';
}
function msgRowsHtml(d){
  const list = (d.threads || []).filter(t => MSG.tab === 'open' ? t.open : !t.open);
  return !d.threads ? '<div class="m-skel"></div><div class="m-skel"></div>'
    : list.length ? list.map(msgRow).join('')
    : '<div class="mg-empty">'+(MSG.tab === 'open' ? 'No open conversations' : 'No closed conversations')+' for '+esc(rvLong(d.date))+'.'
      + (MSG.tab === 'open' && d.openCount ? '<br>Days with something new have a red dot.' : '')
      + msgWhereHtml(d)+'</div>';
}
// r23: "Open 4" but nothing on this day: the days that have the open conversations, one tap each.
function msgWhereHtml(d){
  if(MSG.tab !== 'open') return '';
  const days = (d.days || []).filter(x => x.open > 0 && x.date !== d.date);
  if(!days.length) return '';
  return '<div class="mg-where"><span>Open conversations are on:</span>'
    + days.slice(0, 10).map(x => '<button type="button" class="mg-jump" onclick="msgPick(\''+esc(x.date)+'\')">'
        + esc(rvShort(x.date))+' · '+Number(x.open)+'</button>').join('')
    + (days.length > 10 ? '<span>…and '+(days.length - 10)+' more days</span>' : '')+'</div>';
}
// The tabs' words and numbers, changed where they are (a keyboard on a tab keeps it).
function msgTabsPatch(box, d){
  const tabs = box.querySelectorAll('.mg-tab');
  if(tabs.length !== 2) return;
  [['open', 'Open', d.openCount, ''], ['closed', 'Closed', d.closedUnread, ' title="Closed, with a message not read yet"']].forEach((t, k) => {
    const on = MSG.tab === t[0];
    tabs[k].classList.toggle('on', on);
    tabs[k].setAttribute('aria-selected', String(on));
    tabs[k].innerHTML = t[1] + (t[2] ? ' <b class="mg-n"'+t[3]+'>'+t[2]+'</b>' : '');
  });
}

// ── THE MESSAGES' DAY STRIP (r22) ──
// Like the evening's: the day in the middle is the day — a swipe, the arrows
// or a tap. It holds every day a conversation can be on, from 91 days ago
// (r53c: or the oldest day with a conversation, kept up to 3 years) to two months ahead (further if a
// table is), and is built once when the list opens. After that only its
// numbers and dots change, so a new message never moves it under a finger.
const MG_SLOT = 56;            // one day: 50px wide + 6px gap
function msgStripDates(d){
  let from = rvAddDays(d.today, -91), to = rvAddDays(d.today, 61);
  (d.days || []).forEach(x => { if(x.date > to) to = x.date; if(x.date < from) from = x.date; });
  if(d.date < from) from = d.date;
  if(d.date > to) to = d.date;
  const out = [];
  for(let date = from; date <= to && out.length < 1300; date = rvAddDays(date, 1)) out.push(date);   // r53c: kept 3 years
  return out;
}
function msgStripHtml(d){
  MSG.stripDates = msgStripDates(d); MSG.stripToday = d.today; MSG.stripAim = null;
  return '<div class="mg-strip"><div class="mg-pad"></div>'
    + MSG.stripDates.map(date => '<button type="button" class="mg-day'+(date===d.today ? ' today' : '')+'" data-date="'+date+'" aria-label="'+esc(rvLong(date))+'">'
        + '<span class="mg-wd">'+(date===d.today ? 'Today' : rvFmt(date, {weekday:'short'}))+'</span><b>'+Number(date.slice(8))+'</b><i>&nbsp;</i></button>').join('')
    + '<div class="mg-pad"></div></div>';
}
// The counts under the days (open or closed, as the tab) and the red dots.
function msgFillStrip(strip){
  const d = MSG.data;
  if(!strip || !d) return;
  const info = {};
  (d.days || []).forEach(x => { info[x.date] = x; });
  strip.querySelectorAll('.mg-day').forEach(cell => {
    const date = cell.dataset.date, x = info[date];
    const n = x ? (MSG.tab === 'open' ? x.open : x.closed) : 0;
    const line = n ? n+(n===1?' chat':' chats') : '\u00a0';
    const i = cell.querySelector('i');
    if(i.textContent !== line) i.textContent = line;
    let dot = cell.querySelector('.dot');
    const red = !!(x && x.unread);
    if(red && !dot){ dot = document.createElement('span'); dot.className = 'dot'; cell.insertBefore(dot, cell.firstChild); }
    if(dot && !red) dot.remove();
    cell.setAttribute('aria-label', rvLong(date) + (red ? ', new messages' : ''));
  });
  msgPaintStrip(strip);
}
// Dark in the middle: the day shown, or the one a finger is bringing there.
function msgPaintStrip(strip){
  if(!strip || !MSG.stripDates || !strip.clientWidth) return;
  const k = Math.max(0, Math.min(MSG.stripDates.length - 1, Math.round(strip.scrollLeft / MG_SLOT)));
  strip.querySelectorAll('.mg-day').forEach((cell, i) => {
    const on = i === k;
    if(cell.classList.contains('on') !== on) cell.classList.toggle('on', on);
    if(on) cell.setAttribute('aria-current', 'date'); else cell.removeAttribute('aria-current');
    if(cell.tabIndex !== (on ? 0 : -1)) cell.tabIndex = on ? 0 : -1;
  });
}
function msgStripBusy(strip){
  return !!(MSG.stripTouch || (strip && strip._anim) || Date.now() - (MSG.stripMoved || 0) < 400);
}
function msgStripPlace(strip){
  const k = MSG.stripDates.indexOf(MSG.date);
  if(k >= 0) strip.scrollLeft = k * MG_SLOT;
  msgPaintStrip(strip);
}
function msgStripMake(strip){
  if(MSG.stripWatch) MSG.stripWatch.disconnect();
  MSG.stripTouch = false; MSG.stripAim = null;
  stripFit(strip, '.mg-pad');
  strip._w = strip.clientWidth;
  msgStripPlace(strip);
  msgFillStrip(strip);
  let timer = null, raf = 0;
  const later = function(){ clearTimeout(timer); timer = setTimeout(function(){ msgStripSettled(strip); }, 160); };
  strip.addEventListener('scroll', function(){
    MSG.stripMoved = Date.now();
    if(!raf) raf = requestAnimationFrame(function(){ raf = 0; msgPaintStrip(strip); });
    later();
  }, {passive:true});
  strip.addEventListener('touchstart', function(){ MSG.stripTouch = true; MSG.stripAim = null; stripStop(strip); clearTimeout(timer); }, {passive:true});
  const up = function(e){
    if(e && e.touches && e.touches.length) return;
    MSG.stripTouch = false; later();
    // An iPhone may glide on and stop without a word: look at the middle again.
    [600, 1200, 2200].forEach(function(ms){ setTimeout(function(){ msgStripSettled(strip); }, ms); });
  };
  strip.addEventListener('touchend', up, {passive:true});
  strip.addEventListener('touchcancel', up, {passive:true});
  strip.addEventListener('wheel', function(e){ if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ MSG.stripAim = null; stripStop(strip); } }, {passive:true});
  // Only the day shown takes Tab; ‹ › keys move a day.
  strip.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    msgStep(e.key === 'ArrowLeft' ? -1 : 1);
    const cell = MSG.stripAim !== null ? strip.querySelectorAll('.mg-day')[MSG.stripAim] : null;
    if(cell) cell.focus({preventScroll:true});
  });
  strip.addEventListener('click', function(e){
    const cell = e.target.closest('.mg-day');
    if(!cell) return;
    const k = MSG.stripDates.indexOf(cell.dataset.date);
    if(k < 0) return;
    if(Math.round(strip.scrollLeft / MG_SLOT) === k && !strip._anim){ msgPick(cell.dataset.date); return; }
    MSG.stripAim = k; stripGlide(strip, k * MG_SLOT, true);
  });
  // The phone turned, or the window changed width: padded again, back on the day.
  if(window.ResizeObserver){
    MSG.stripWatch = new ResizeObserver(function(){
      if(!strip.isConnected || MSG.stripTouch || !strip.clientWidth || strip.clientWidth === strip._w) return;
      stripStop(strip); stripFit(strip, '.mg-pad'); strip._w = strip.clientWidth;
      MSG.stripAim = null; msgStripPlace(strip);
    });
    MSG.stripWatch.observe(strip);
  }
}
// The strip stopped (the finger let go, or the glide ended): the day in the middle is the day.
function msgStripSettled(strip){
  if(!strip.isConnected || MSG.stripTouch || strip._anim || !MSG.stripDates) return;
  MSG.stripAim = null;
  const k = Math.max(0, Math.min(MSG.stripDates.length - 1, Math.round(strip.scrollLeft / MG_SLOT)));
  const date = MSG.stripDates[k];
  if(date && date !== MSG.date) msgPick(date, true);
}
// The list already on screen: the tabs, the day's line, the rows and the
// strip's numbers change where they are, and the strip is not moved while a
// finger (or its glide) is on it. False when it has to be built again.
function msgPatchList(host){
  const d = MSG.data, strip = host.querySelector('.mg-strip'), sc = host.querySelector('.mg-scroll');
  const tabs = host.querySelector('.mg-tabs'), line = host.querySelector('.mg-dateline');
  if(!d || !strip || !sc || !tabs || !line || !MSG.stripDates || MSG.stripToday !== d.today) return false;
  const first = MSG.stripDates[0], last = MSG.stripDates[MSG.stripDates.length - 1];
  if(d.date < first || d.date > last || (d.days || []).some(x => x.date < first || x.date > last)) return false;
  const same = host.dataset.date === String(d.date);
  const keepTop = same ? sc.scrollTop : 0;
  msgTabsPatch(tabs, d);
  line.textContent = rvLong(d.date) + (d.date===d.today ? ' · today' : '');
  sc.innerHTML = msgRowsHtml(d);
  sc.scrollTop = keepTop;
  host.dataset.date = String(d.date);
  msgFillStrip(strip);
  const k = MSG.stripDates.indexOf(d.date);
  if(!msgStripBusy(strip) && Math.round(strip.scrollLeft / MG_SLOT) !== k){
    // The strip chose this day and moved on by itself (an iPhone gliding on
    // without a word): the day in the middle is the day. Otherwise the day was
    // chosen elsewhere (the server's day at opening): the strip goes there.
    if(MSG.stripChose === d.date) setTimeout(function(){ msgStripSettled(strip); }, 0);
    else { MSG.stripAim = null; msgStripPlace(strip); }
  }
  return true;
}

function msgLinkOf(id){ const l = MSG.links[id]; return l && l.until > Date.now() ? l : null; }

async function msgFilesFill(){
  const t = MSG.thread;
  if(!t || !MSG.open || MSG.view !== 'thread' || MSG.linking) return;
  const need = t.messages.filter(m => m.file && !msgLinkOf(m.file.id)).map(m => Number(m.file.id)).slice(0, 40);
  if(!need.length) return;
  MSG.linking = true;
  const gen = MSG.gen, id = MSG.threadId, kind = MSG.kind;
  try{
    const data = await rvApi(kind === 'request' ? {action:'staff_req_files', requestId: id, fileIds: need} : {action:'staff_msg_files', id: id, fileIds: need});
    if(gen !== MSG.gen) return;
    const until = Date.now() + Math.max(60, (Number(data.expiresIn) || 3600) - 300) * 1000;
    need.forEach(k => {
      const url = data.links && data.links[k];
      MSG.links[k] = url ? { url: url, until: until } : { url: null, gone: true, until: Date.now() + 120000 };
    });
  }catch(e){ MSG.linking = false; return; }
  MSG.linking = false;
  if(id !== MSG.threadId || kind !== MSG.kind || !MSG.open) return;
  const host = document.getElementById('mg-sheet-host'), box = host && host.querySelector('.mg-msgs');
  if(!box) return;
  const sc = host.querySelector('.mg-scroll');
  const atEnd = !sc || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60;
  MSG.stick = atEnd;
  box.innerHTML = msgBubblesHtml(MSG.thread);
  if(sc && atEnd) sc.scrollTop = sc.scrollHeight;
}

function msgStep(n){
  const strip = document.querySelector('#mg-sheet-host .mg-strip');
  if(strip && MSG.stripDates){
    // From where the strip is already heading, so three quick taps are three days.
    const from = MSG.stripAim !== null && MSG.stripAim !== undefined ? MSG.stripAim : MSG.stripDates.indexOf(MSG.date);
    const k = from + n;
    if(from >= 0 && k >= 0 && k < MSG.stripDates.length){ MSG.stripAim = k; stripGlide(strip, k * MG_SLOT, true); return; }
  }
  if(MSG.date) msgPick(rvAddDays(MSG.date, n));

async function msgSend(){
  const host = document.getElementById('mg-sheet-host');
  const input = host && host.querySelector('.mg-input'), send = host && host.querySelector('.mg-send');
  if(!input || MSG.sending || MSG.preparing) return;
  const text = input.value.trim();
  const pending = MSG.pending;
  if(!text && !pending){ input.focus(); return; }
  MSG.sending = true; send.disabled = true;
  const clip = host.querySelector('.mg-clip'); if(clip) clip.disabled = true;
  const gen = MSG.gen, id = MSG.threadId, isReq = MSG.kind === 'request';
  try{
    const body = isReq ? {action:'staff_req_send', requestId: id, body: text} : {action:'staff_msg_send', id: id, body: text};
    // r42: a file goes first, straight to the storage (a place for it, then the file), then the message names it.
    if(pending){
      if(!pending.fileId){
        const slot = await rvApi(isReq ? {action:'staff_req_upload', requestId: id, name: pending.name, mime: pending.mime, size: pending.size}
                                       : {action:'staff_msg_upload', id: id, name: pending.name, mime: pending.mime, size: pending.size});
        await hfFileUpload(slot.uploadUrl, pending);
        pending.fileId = slot.file.id;
      }
      body.fileId = pending.fileId;
    }
    const data = await rvApi(body);
    if(gen !== MSG.gen || id !== MSG.threadId) return;
    MSG.seq += 1;                                   // an older answer still on its way is not drawn
    MSG.thread = data;
    input.value = ''; msgGrow(input);
    if(pending) msgPendClear();
    MSG.sending = false;
    msgPaint(true);
  }catch(e){
    // A file the server refused (not a photo, too late): it is chosen again, not sent again.
    if(pending && e.data && /^file_(bad|gone)$/.test(e.data.reason || '')) msgPendClear();
    showToast(e.message);
  }
  finally{
    MSG.sending = false;
    const again = document.querySelector('#mg-sheet-host .mg-send'); if(again) again.disabled = false;
    const c = document.querySelector('#mg-sheet-host .mg-clip'); if(c) c.disabled = false;
  }
}

function msgCloseThread(btn){

  // up to the last one drawn as read, so no "new" is left on a chat nobody has to open again.
  const seen = MSG.thread && MSG.thread.messages ? MSG.thread.messages.reduce((n, m) => m.fromGuest ? Math.max(n, Number(m.id) || 0) : n, 0) : 0;
  return msgState('staff_msg_close', MSG.threadId, btn, 'Closed', seen ? { seen: seen } : null);
}

function msgReopen(id, btn){ return msgState('staff_msg_reopen', id, btn, 'Open again'); }
async function msgState(action, id, btn, done, extra){
  if(MSG.busy) return;
  MSG.busy = true; if(btn) btn.disabled = true;
  const gen = MSG.gen;
  try{
    const data = await rvApi(Object.assign({action: action, id: Number(id)}, extra || {}));

}

function rwDefault(){ return { kinds:{ dish:true, drink:true, room:true }, stars:[], dishes:null, reply:{ none:false, replied:false }, from:null, to:null,
                              visit:{ day:false, other:false, none:false }, hidden:false, deleted:false }; }     // r53: the visit dots; hidden reviews (off: not listed); r53c: deleted (Seb's Analytics' record)
function rwCopy(f){ return { kinds:Object.assign({}, f.kinds), stars:f.stars.slice(), dishes:f.dishes ? f.dishes.slice() : null,
                            reply:Object.assign({}, f.reply), from:f.from, to:f.to, visit:Object.assign({}, f.visit), hidden:f.hidden, deleted:!!f.deleted }; }

async function rwStart(){
  if(!RESTAURANT) return;
  if(RW.rid !== RESTAURANT.id) RW = rwFresh(RESTAURANT.id);
  rwLoad();
}
async function rwLoad(){
  const gen = ++RW.gen, rid = RW.rid;
  RW.loading = true; RW.error = null;
  rwPaint();
  try{
    const d = await rvApi({ action:'rv_list' });
    if(gen !== RW.gen || RW.rid !== rid) return;
    RW.data = d; rwBuild(d); RW.loaded = true;
  }catch(e){
    if(gen !== RW.gen || RW.rid !== rid) return;
    if(e.status !== 401) RW.error = e.message || 'Could not read the reviews. Please try again.';
  }
  RW.loading = false;
  rwPaint();
  if(RW.loaded && RVT_AT){ const id = RVT_AT; RVT_AT = null; rvtOpen(id); }                    // r53c: from a notification
}

// ── the list's rows: one for each dish or drink review, one for each guest's visit (their words about the restaurant) ──
function rwAvg(a){ const v = (a||[]).filter(x => Number.isFinite(x) && x >= 1); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; }
function rwRound(a){ const v = rwAvg(a); return v === null ? null : Math.min(5, Math.max(1, Math.round(v))); }
function rwDrinkGroup(kind){ const g = RW_DRINK.find(x => x[2].includes(kind)); return g ? g[0] : 'other'; }
function rwFoodGroup(cat){ return RW_FOOD.some(x => x[0] === cat) ? cat : 'other'; }
function rwBuild(d){
  const dishes = new Map((d.dishes||[]).map(x => [Number(x.id), x]));
  const items = [], groups = new Map(), reviewed = new Set();
  (d.reviews||[]).forEach(function(r){
    const dish = dishes.get(Number(r.dish)) || null;
    reviewed.add(Number(r.dish));
    items.push({ t: dish && dish.category === 'drinks' ? 'drink' : 'dish', key:'r'+r.id, r:r, dish:dish, stars:rwRound(r.dishStars), day:r.day, at:r.at,
                 hidden:r.hidden || null, visit:r.visit, deleted:r.deleted || null, talk:r.talk || null });   // r53; r53c
    const gk = r.guest + '|' + r.day + (r.deleted ? '|deleted' : '');                             // r53c: a deleted visit stays apart
    let g = groups.get(gk);
    if(!g){ g = { t:'room', key:'g'+r.id, reviews:[], day:r.day, at:r.at }; groups.set(gk, g); items.push(g); }
    g.reviews.push(r);
  });
  groups.forEach(function(g){
    g.r = g.reviews.find(x => x.roomComment) || g.reviews[0];        // the review the words about the restaurant came with
    g.comments = [...new Set(g.reviews.map(x => x.roomComment).filter(Boolean))];
    g.stars = rwRound(g.r.roomStars);
    g.dishList = g.reviews.map(x => ({ dish: dishes.get(Number(x.dish)) || null, stars: rwRound(x.dishStars) }));
    // r53: the visit is hidden when every review of it is (the words about the restaurant are part of each one)
    g.hidden = g.reviews.every(x => x.hidden) ? (g.reviews.find(x => x.roomComment && x.hidden) || g.reviews[0]).hidden : null;
    g.visit = g.r.visit;
    g.deleted = g.reviews.every(x => x.deleted) ? g.r.deleted : null;                              // r53c
  });
  RW.items = items;
  // The menu, as the Filters page lists it: what is on it, and anything with a review even if it is hidden now.
  RW.dishes = (d.dishes||[]).filter(x => !x.hidden || reviewed.has(Number(x.id))).map(function(x){
    const drink = x.category === 'drinks';
    return { id:Number(x.id), name:x.name, img:x.img, slug:x.slug, drink:drink, group: drink ? rwDrinkGroup(x.kind) : rwFoodGroup(x.category) };
  });
}

// ── what matches ──
function rwNorm(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function rwHay(it){
  if(it._hay) return it._hay;
  const rs = it.t === 'room' ? it.reviews : [it.r];
  const parts = [];
  rs.forEach(r => { parts.push(r.name, r.handle); r.replies.forEach(x => parts.push(x.text)); });
  if(it.t === 'room') parts.push(it.comments.join(' '), it.dishList.map(x => x.dish ? x.dish.name : '').join(' '));
  else parts.push(it.r.dishComment, it.dish ? it.dish.name : '');
  return (it._hay = rwNorm(parts.filter(Boolean).join(' ')));
}
function rwReplied(it){ return (it.t === 'room' ? it.r : it.r).replies.some(x => x.side === 'restaurant'); }
function rwMatch(it, f, skip){
  if(skip !== 'kinds' && !f.kinds[it.t]) return false;
  if(skip !== 'stars' && f.stars.length && !f.stars.includes(it.stars)) return false;
  if(skip !== 'dishes' && f.dishes && it.t !== 'room' && !f.dishes.includes(Number(it.r.dish))) return false;
  if(skip !== 'reply' && f.reply.none !== f.reply.replied){
    const has = rwReplied(it);
    if(f.reply.none && has) return false;
    if(f.reply.replied && !has) return false;
  }
  if(skip !== 'dates'){ if(f.from && it.day < f.from) return false; if(f.to && it.day > f.to) return false; }
  if(skip !== 'hidden' && !f.hidden && it.hidden && !f.deleted) return false;                     // r53
  if(skip !== 'deleted' && !!f.deleted !== !!it.deleted) return false;                            // r53c: only Seb's Analytics' record
  if(skip !== 'visit' && (f.visit.day || f.visit.other || f.visit.none) && !f.visit[rwVisitKind(it)]) return false;
  if(RW.q){ const h = rwHay(it); if(!rwNorm(RW.q).split(/\s+/).filter(Boolean).every(w => h.includes(w))) return false; }
  return true;
}
function rwShown(f){ return RW.items.filter(it => rwMatch(it, f)); }

// ── words ──
function rwDayAt(ms){ const tz = (RW.data && RW.data.timezone) || 'America/New_York';
  return new Intl.DateTimeFormat('en-CA', { timeZone:tz, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ms - 5*3600*1000)); }
function rwToday(){ return rwDayAt(Date.now()); }
function rwAddDays(day, n){ const t = new Date(day + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); }
function rwDayWords(day, withYear){
  const t = new Date(day + 'T12:00:00Z');
  return t.toLocaleDateString('en-US', { timeZone:'UTC', month:'short', day:'numeric', year: withYear ? 'numeric' : undefined });
}
function rwWhen(at){
  const tz = (RW.data && RW.data.timezone) || 'America/New_York', t = new Date(at);
  if(!Number.isFinite(t.getTime())) return '';
  const time = t.toLocaleTimeString('en-US', { timeZone:tz, hour:'numeric', minute:'2-digit' });
  const day = rwDayAt(t.getTime()), today = rwToday();
  if(day === today) return 'Today, ' + time;
  if(day === rwAddDays(today, -1)) return 'Yesterday, ' + time;
  const sameYear = day.slice(0,4) === today.slice(0,4);
  return t.toLocaleDateString('en-US', { timeZone:tz, month:'short', day:'numeric', year: sameYear ? undefined : 'numeric' }) + ', ' + time;
}
function rwStarRow(n){ const k = Number(n) || 0; return '★'.repeat(k) + '<i>' + '★'.repeat(5 - k) + '</i>'; }
function rwThumb(dish, w){
  const file = dish && dish.img;
  if(file){
    const src = typeof hfImgSrc === 'function' ? hfImgSrc(file, w||52) : file;
    return '<img src="'+esc(src)+'" data-orig="'+esc(file)+'" alt="" loading="lazy" onerror="rwImgErr(this)">';
  }
  return '<img src="/hungry-fork-logo.png" alt="" loading="lazy">';
}
function rwImgErr(img){
  if(typeof hfImgBack === 'function' && hfImgBack(img)) return;
  img.onerror = null; img.src = '/hungry-fork-logo.png';
}
function rwPlural(n, one, many){ return n + ' ' + (n === 1 ? one : (many || one + 's')); }

// ── the tab ──
function rwPaint(){
  const root = document.getElementById('rw-root');
  if(!root) return;
  if(RW.error && !RW.loaded){ root.innerHTML = '<div class="m-err">'+esc(RW.error)+'</div><button type="button" class="m-btn quiet" onclick="rwLoad()">Try again</button>'; return; }
  if(!RW.loaded){ root.innerHTML = '<div class="m-skel"></div><div class="m-skel"></div><div class="m-skel"></div>'; return; }
  const n = rwActive().length;
  root.innerHTML = '<div class="rw-bar">'
      + '<input class="rw-search" id="rw-q" type="search" placeholder="Search a name, a dish or a word…" value="'+esc(RW.q)+'" oninput="rwSearch(this.value)" aria-label="Search the reviews">'
      + '<button type="button" class="rw-fbtn" id="rw-fbtn" onclick="rwOpenFilters()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>Filters'+(n ? ' ('+n+')' : '')+'</button>'
    + '</div>'
    + rwTopHtml()
    + '<div id="rw-list">'+rwListHtml()+'</div>';
}
function rwSearch(v){ RW.q = v; RW.shown = RW_STEP; const l = document.getElementById('rw-list'); if(l) l.innerHTML = rwListHtml(); }
function rwMore(){ RW.shown += RW_STEP; const l = document.getElementById('rw-list'); if(l) l.innerHTML = rwListHtml(); }
// The filters chosen, as chips under the search; ✕ takes one away.
function rwActive(){
  const f = RW.f, out = [];
  const kinds = ['dish','drink','room'].filter(k => f.kinds[k]);
  if(kinds.length < 3) out.push(['kinds', kinds.length ? kinds.map(k => RW_KIND_WORDS[k]).join(' + ') : 'No comments']);
  if(f.stars.length){
    const s = f.stars.slice().sort((a,b)=>a-b);
    const run = s.length > 1 && s[s.length-1] - s[0] === s.length - 1;
    out.push(['stars', run ? s[0]+'–'+s[s.length-1]+'★' : s.map(x => x+'★').join(', ')]);
  }
  if(f.dishes){
    const names = RW.dishes.filter(d => f.dishes.includes(d.id));
    out.push(['dishes', names.length === 1 ? names[0].name : rwPlural(names.length, 'dish or drink', 'dishes and drinks')]);
  }
  if(f.reply.none !== f.reply.replied) out.push(['reply', f.reply.none ? 'No reply yet' : 'Replied']);
  const vk = ['day','other','none'].filter(k => f.visit[k]);                                        // r53
  if(vk.length && vk.length < 3) out.push(['visit', vk.map(k => RW_VISIT_WORDS[k]).join(' + ')]);
  if(f.hidden) out.push(['hidden', 'Hidden shown too']);
  if(f.deleted) out.push(['deleted', 'Deleted by the author (only you)']);                       // r53c
  if(f.from || f.to){
    const y = (f.from||f.to).slice(0,4) !== rwToday().slice(0,4);
    out.push(['dates', f.from && f.to ? (f.from === f.to ? rwDayWords(f.from, y) : rwDayWords(f.from, y)+' – '+rwDayWords(f.to, y))
                                      : f.from ? 'Since '+rwDayWords(f.from, y) : 'Until '+rwDayWords(f.to, y)]);
  }
  return out;
}
function rwDrop(k){
  const d = rwDefault();
  if(k === 'kinds') RW.f.kinds = d.kinds;
  if(k === 'stars') RW.f.stars = [];
  if(k === 'dishes') RW.f.dishes = null;
  if(k === 'reply') RW.f.reply = d.reply;
  if(k === 'dates'){ RW.f.from = null; RW.f.to = null; }
  if(k === 'visit') RW.f.visit = d.visit;
  if(k === 'hidden') RW.f.hidden = false;
  if(k === 'deleted') RW.f.deleted = false;                                                       // r53c
  RW.shown = RW_STEP;
  rwPaint();
}
function rwListHtml(){
  const chips = rwActive();
  const all = rwShown(RW.f), list = all.slice(0, RW.shown);
  let h = chips.length ? '<div class="rw-chips">'+chips.map(c => '<button type="button" class="rw-chip" data-k="'+c[0]+'" onclick="rwDrop(\''+c[0]+'\')">'+esc(c[1])+' ✕</button>').join('')+'</div>' : '';
  if(!RW.items.length) return h + '<div class="rw-empty">No reviews yet. When guests rate a dish, a drink or the restaurant, it shows up here.</div>';
  h += '<div class="rw-count" id="rw-count">'+rwPlural(all.length, 'review')+(all.length > list.length ? ' · showing '+list.length : '')+'</div>';
  if(!all.length) return h + '<div class="rw-empty">Nothing matches. Change the filters or the search.</div>';
  h += list.map(rwCardHtml).join('');
  if(all.length > list.length) h += '<button type="button" class="m-btn quiet rw-more" onclick="rwMore()">Show more ('+(all.length - list.length)+')</button>';
  if(RW.data && RW.data.more) h += '<div class="rw-small" style="text-align:center;margin-bottom:1rem;">The newest '+RW.data.max+' reviews are here.</div>';
  return h;
}
function rwTurn(r){ const n = r.replies.length; return n === 0 ? 'restaurant' : n === 1 ? 'guest' : n === 2 ? 'restaurant' : null; }
function rwThreadHtml(r){
  if(!r.replies.length) return '';
  return '<div class="rw-thread">'+r.replies.map(function(x){
    return '<div class="rw-turn'+(x.side === 'guest' ? ' guest' : '')+'"><b>'+(x.side === 'guest' ? 'The guest' : esc(x.by || 'The restaurant'))+'</b>'+esc(x.text)+'</div>';
  }).join('')+'</div>';
}
function rwActsHtml(it){
  const r = it.r, turn = rwTurn(r), acts = [];
  if(it.hidden || it.deleted) return rwHiddenActs(it);                                            // r53: the conversation is closed; r53c
  if(turn === 'restaurant') acts.push('<button type="button" class="rw-act" onclick="rwReplyOpen(\''+it.key+'\')">'+(r.replies.length ? 'Reply (last word)' : 'Reply')+'</button>');
  else if(turn === 'guest') acts.push('<span class="rw-act done">Replied ✓ · the guest can answer</span>');
  else acts.push('<span class="rw-act done">Replied ✓</span>');
  if(it.t === 'room') acts.push('<button type="button" class="rw-act" onclick="rwSee(\''+it.key+'\')">'+(RW.see[it.key] ? 'Hide the dishes' : 'See the dishes')+'</button>');
  else if(it.dish && it.dish.slug) acts.push('<a class="rw-act" href="/menu?dish='+encodeURIComponent(it.dish.slug)+'" target="_blank" rel="noopener">Open '+(it.t === 'drink' ? 'drink' : 'dish')+'</a>');
  const M = rwMod();                                                                               // r53
  if(M.canModerate && M.on) acts.push('<button type="button" class="rw-act mod" data-mod="'+it.key+'" onclick="rwModOpen(\''+it.key+'\')">Moderate review</button>');
  if(rwTalkBtn(it)) acts.push(rwTalkBtn(it));                                                     // r53c: shown again, the conversation can be read
  return '<div class="rw-acts">'+acts.join('')+'</div>';
}
function rwReplyHtml(it){
  if(RW.reply !== it.key) return '';
  return '<div class="rw-reply"><textarea id="rw-reply-text" maxlength="1500" placeholder="Write your answer…"></textarea>'
    + '<div class="rw-hint">Everyone can read it under the review. It can\'t be changed or taken back once it\'s posted.</div>'
    + '<div class="rw-acts" style="margin-top:0"><button type="button" class="m-save" id="rw-reply-send"'+(RW.sending ? ' disabled' : '')+' onclick="rwReplySend(\''+it.key+'\')">Post the answer</button>'
    + '<button type="button" class="rw-act" onclick="rwReplyOpen(null)">Cancel</button></div></div>';
}
function rwCardHtml(it){
  const r = it.r;
  if(it.t === 'room'){
    const see = RW.see[it.key] ? '<div class="rw-dishes">'+it.dishList.map(x => '<div><span>'+esc(x.dish ? x.dish.name : 'A dish')+'</span><b>'+rwStarRow(x.stars)+'</b></div>').join('')+'</div>' : '';
    return '<div class="rw-card'+(it.hidden || it.deleted ? ' hidden' : '')+(it.deleted ? ' deleted' : '')+'" data-kind="room" data-key="'+it.key+'">'
      + '<div class="rw-kind">Restaurant</div>'
      + '<div class="rw-who" style="margin-top:.2rem">'+whoHtml(r.name, r.handle)+rwDotHtml(it.visit)+'</div>'
      + '<div class="rw-stars"><span>Hospitality <b>'+rwStarRow(r.roomStars[0])+'</b></span><span>Atmosphere &amp; Vibe <b>'+rwStarRow(r.roomStars[1])+'</b></span></div>'
      + (it.comments.length ? it.comments.map(c => '<div class="rw-text">'+esc(c)+'</div>').join('') : '<div class="rw-none">No comment, only stars.</div>')
      + '<div class="rw-small">'+esc(rwWhen(it.at))+' · '+(it.reviews.length === 1 ? 'rated 1 '+(it.dishList[0].dish && it.dishList[0].dish.category === 'drinks' ? 'drink' : 'dish') : 'rated '+it.reviews.length+' dishes and drinks')+'</div>'
      + rwVisitLine(it.visit) + rwDeletedBox(it) + (it.deleted ? '' : rwHiddenBox(it))
      + rwThreadHtml(r) + rwActsHtml(it) + see + rwReplyHtml(it)
      + '</div>';
  }

  return '<div class="rw-card'+(it.hidden || it.deleted ? ' hidden' : '')+(it.deleted ? ' deleted' : '')+'" data-kind="'+it.t+'" data-key="'+it.key+'">'
    + '<div class="rw-top">'+rwThumb(d)+'<div><div class="rw-dish"><span class="rw-kind">'+(it.t === 'drink' ? 'Drink' : 'Dish')+'</span>'+esc(d ? d.name : 'A dish no longer on the menu')+'</div><div class="rw-when">'+esc(rwWhen(it.at))+'</div></div></div>'
    + '<div class="rw-who">'+whoHtml(r.name, r.handle)+rwDotHtml(it.visit)+'</div>'
    + '<div class="rw-stars"><span>'+(it.t === 'drink' ? 'Drink' : 'Dish')+' <b>'+rwStarRow(it.stars)+'</b></span>'
    +   '<span>Flavor '+(r.dishStars[0]||'–')+' · Worth Every Bite '+(r.dishStars[1]||'–')+' · Signature Style '+(r.dishStars[2]||'–')+'</span></div>'
    + (r.dishComment ? '<div class="rw-text">'+esc(r.dishComment)+'</div>' : '<div class="rw-none">No comment, only stars.</div>')
    + rwVisitLine(it.visit) + rwDeletedBox(it) + (it.deleted ? '' : rwHiddenBox(it))
    + rwThreadHtml(r) + rwActsHtml(it) + rwReplyHtml(it)
    + '</div>';
}
function rwFind(key){ return RW.items.find(x => x.key === key); }
function rwSee(key){ RW.see[key] = !RW.see[key]; const l = document.getElementById('rw-list'); if(l) l.innerHTML = rwListHtml(); }
function rwReplyOpen(key){
  RW.reply = key; RW.sending = false;
  const l = document.getElementById('rw-list'); if(l) l.innerHTML = rwListHtml();
  const t = document.getElementById('rw-reply-text'); if(t) t.focus();
}
async function rwReplySend(key){
  const it = rwFind(key), box = document.getElementById('rw-reply-text');
  if(!it || !box || RW.sending) return;
  const text = box.value.trim();
  if(!text){ showToast('Write your answer first.'); box.focus(); return; }
  RW.sending = true;
  const btn = document.getElementById('rw-reply-send'); if(btn) btn.disabled = true;
  try{
    const { res, data } = await callApi('/api/review-reply', { method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+currentSession },
      body:JSON.stringify({ reviewId: it.r.id, text: text }) });
    if(!res.ok) throw new Error((data && data.error) || 'Could not post the answer. Please try again.');
    it.r.replies.push({ side:'restaurant', text:text, at:new Date().toISOString(), by:(ACCESS && ACCESS.firstName) || null });
    RW.items.forEach(x => { if(x.r === it.r) x._hay = null; });
    RW.reply = null;
    showToast('Your answer is posted.');
  }catch(e){ showToast(e.message); }
  RW.sending = false;
  const l = document.getElementById('rw-list'); if(l) l.innerHTML = rwListHtml();
}

// ── the Filters page (a page of its own; Show … reviews, or the arrow, uses what is chosen) ──
function rwOpenFilters(){ RW.draft = rwCopy(RW.f); RW.page = 'filters'; rwPaintPage(true); }
function rwClosePage(){ RW.page = null; RW.cal = null; RW.mod = null; const p = document.getElementById('rw-page'); if(p) p.remove(); document.body.classList.remove('rw-locked'); }
function rwApply(){ RW.f = rwCopy(RW.draft); RW.shown = RW_STEP; rwClosePage(); rwPaint(); window.scrollTo(0, 0); }
function rwClear(){ RW.draft = rwDefault(); rwPaintPage(); }
function rwBack(){ if(RW.page === 'calendar'){ RW.page = 'filters'; RW.cal = null; rwPaintPage(true); } else rwApply(); }
function rwPaintPage(top){
  let el = document.getElementById('rw-page');
  if(!RW.page){ if(el) el.remove(); return; }
  const keep = el && !top ? (el.querySelector('.rw-pbody') || {}).scrollTop || 0 : 0;
  if(!el){ el = document.createElement('div'); el.id = 'rw-page'; el.className = 'rw-page'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); document.body.appendChild(el); }
  document.body.classList.add('rw-locked');
  el.innerHTML = RW.page === 'calendar' ? rwCalHtml() : RW.page === 'moderate' ? rwModHtml() : RW.page === 'log' ? rwLogHtml() : rwFiltersHtml();
  const body = el.querySelector('.rw-pbody');
  if(body){
    if(RW.page === 'calendar' && top){ const now = body.querySelector('[data-month="'+(RW.cal.from || rwToday()).slice(0,7)+'"]'); if(now) body.scrollTop = Math.max(0, now.offsetTop - 120); else body.scrollTop = body.scrollHeight; }
    else body.scrollTop = keep;
  }
}
function rwCount(f, skip, test){ return RW.items.filter(it => rwMatch(it, f, skip) && test(it)).length; }
function rwBox(state){ return '<span class="rw-box'+(state === 'on' ? ' on' : state === 'part' ? ' part' : '')+'"></span>'; }
function rwArrow(open, red){ return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(open ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6')+'"/></svg>'; }
function rwPicked(f, ids){ if(!f.dishes) return ids.length; return ids.filter(id => f.dishes.includes(id)).length; }
function rwState(f, ids){ const n = rwPicked(f, ids); return !ids.length || n === 0 ? 'off' : n === ids.length ? 'on' : 'part'; }
function rwFiltersHtml(){
  const f = RW.draft, total = rwShown(f).length;

    + ck(f.reply.replied, 'Replied', rwCount(f, 'reply', it => rwReplied(it)), 'data-reply="replied" onclick="rwReplyPick(\'replied\')"')
    + '</div>';

    h += '<div class="rw-pg">Visit</div><div class="rw-three">'
      + ['day','other','none'].map(k => ck(f.visit[k], (k === 'none' ? '' : '<i class="rw-dot '+k+'"></i>')+RW_VISIT_WORDS[k], rwCount(f, 'visit', it => rwVisitKind(it) === k),
                                         'data-visit="'+k+'" onclick="rwVisitPick(\''+k+'\')"')).join('')
      + '</div>';
  }
  const nHidden = rwCount(f, 'hidden', it => !!it.hidden);

  // r53c: reviews their authors deleted — kept for the record, only Seb's Analytics sees them
  const nDeleted = rwCount(f, 'deleted', it => !!it.deleted);
  if(rwMod().platform && (nDeleted || f.deleted)){

  h += '<div class="rw-pg">Dates</div><div class="rw-dates">'
    + '<button type="button" class="rw-date" id="rw-from" onclick="rwOpenCal(\'from\')"><span><small>From</small>'+(f.from ? rwDayWords(f.from, true) : 'The first review')+'</span>'+cal+'</button>'
    + '<button type="button" class="rw-date" id="rw-to" onclick="rwOpenCal(\'to\')"><span><small>To</small>'+(f.to ? rwDayWords(f.to, true) : 'Today')+'</span>'+cal+'</button></div>';
