function toggleDish(id){
  openDishId = String(openDishId)===String(id) ? null : id;
  // r40: a dish opened from elsewhere (a link, the search) shows on its own side, Food or Drinks
  const d = openDishId != null ? rowFor(openDishId) : null;
  if(d && !MG_Q) MG_SIDE = isDrinkRow(d) ? 'drinks' : 'food';
  render();
}

function switchRestaurant(id){
  RESTAURANT = ACCESS.restaurants.find(r=>String(r.id)===String(id)) || RESTAURANT;
  openDishId = null;
  PEOPLE = null;          // the previous restaurant's people are not this one's
  DISHES_ROWS = []; DISHES_LOADED = false; DISHES_ERROR = null;
  rvReset(); rvPaintSheet();
  mountPage();
}

function rowFor(id){ return DISHES_ROWS.find(d=>String(d.id)===String(id)); }

function dirty(id, field){
  const d = rowFor(id); if(!d) return;
  const el = document.getElementById('f-'+id+'-'+field);
  const counter = document.getElementById('c-'+id+'-'+field);
  if(counter && LIMITS[field]){
    const n = el.value.length;
    counter.textContent = n+' / '+LIMITS[field];
    counter.classList.toggle('over', n>LIMITS[field]);
  }
  const changed = collectText(id);
  const save = document.getElementById('save-'+id);
  if(save) save.disabled = !Object.keys(changed).length || anyOver(id);
}

function anyOver(id){
  return Object.keys(LIMITS).some(field=>{
    const el = document.getElementById('f-'+id+'-'+field);
    return el && el.value.length > LIMITS[field];
  });
}

// Only the fields that actually differ get sent, so two managers editing
// different parts of the same dish do not overwrite each other's work.
function collectText(id){
  const d = rowFor(id); if(!d) return {};
  const out = {};
  ['price', 'price_glass', 'price_bottle', 'price_shot', 'price_mixed'].forEach(field => {   // r40: and the drink prices
    const el = document.getElementById('f-'+id+'-'+field);
    if(!el) return;
    // r39: a price may be left empty (no price yet on the menu).
    const v = el.value.trim(), had = d[field] != null && d[field] !== '';
    if(v === ''){ if(had) out[field] = null; }
    else{
      const n = Number(v);
      if(Number.isFinite(n) && (!had || Math.round(n*100)!==Math.round(Number(d[field])*100))) out[field] = n;
    }
  });
  const TEXTY = ['name','description','about','ingredients','modifications','wine','cocktail','allergens_text']
    .concat(CLASSIFY_FIELDS.map(c=>c[0]));
  TEXTY.forEach(field=>{
    const el = document.getElementById('f-'+id+'-'+field);
    if(!el) return;
    const now = el.value.trim();
    const before = (d[field]==null?'':String(d[field])).trim();
    if(now !== before) out[field] = now.length ? now : null;
  });
  return out;
}

function revert(id){ render(); }

async function toggleFlag(id, field){
  const d = rowFor(id); if(!d) return;
  const btn = document.getElementById('sw-'+id+'-'+field);
  const current = field==='sold_out' ? !!d.sold_out_until : !!d[field];
  if(btn) btn.disabled = true;
  const saved = await save(id, { [field]: !current });
  if(btn) btn.disabled = false;
}

function labelFor(f){
  return f==='sold_out' ? 'Sold out' : f==='is_hidden' ? 'Hidden' : f==='is_bartenders_pick' ? 'Bartender\'s Pick' : 'Chef\'s Pick';
}

async function saveText(id){
  const changes = collectText(id);
  if(!Object.keys(changes).length) return;
  const btn = document.getElementById('save-'+id);
  if(btn){ btn.disabled = true; btn.textContent='Saving…'; }
  const saved = await save(id, changes);
  if(btn){ btn.textContent='Save changes'; btn.disabled = true; }
}

// The one path to the server. It replaces the whole row from the response, so
// what the screen shows after a save is what the database actually holds —
// including the Chef's Pick that just moved off another dish.
async function save(id, changes){
  try{
    const {res, data} = await callApi('/api/manager-dish',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
      body:JSON.stringify({dishId:id, changes})
    });
    if(res.status===401){ if(currentSession){ logout(); showToast('Your session expired. Please log in again.'); } return false; }
    if(!res.ok){ showToast(data.error||'Could not save that.'); return false; }

    const i = DISHES_ROWS.findIndex(d=>String(d.id)===String(id));
    if(i>=0) DISHES_ROWS[i] = data.dish;
    // Chef's Pick is exclusive, so the server may have cleared it elsewhere.
    if(data.dish.is_chefs_pick) DISHES_ROWS.forEach(d=>{ if(String(d.id)!==String(id)) d.is_chefs_pick=false; });
    if(data.dish.is_bartenders_pick) DISHES_ROWS.forEach(d=>{ if(String(d.id)!==String(id)) d.is_bartenders_pick=false; });
    render();
    return true;
  }catch(e){
    showToast(e.message || 'Network error. Please try again.');
    return false;
  }
}


// ── RESERVATIONS ──
//
// The Reservations tab. Everything on it comes from /api/reservations, the
// actions whose names start with "staff_", and the server checks this
// account's role on every one of them. The buttons drawn here are only the
// ones the server has already said this account may press: crew get the same
// screen with none at all.
//
// The day is a watch (Sebastian's idea, 23 Sep): the bookings roll past like a
// watch's list, the one in the middle is full size with its buttons, and the
// clock on the left rolls with them — more slowly, by the time between one
// booking and the next. Two tables at 7:00 and the clock waits.

const RV = {
  rid: null, view: 'day',
  days: [], daysFrom: null, daysTo: null, today: null, date: null,
  day: null, fetchedAt: 0, error: null, seq: 0,
  centerId: null, armed: null, armTimer: null, busy: false,
  stops: [], cardIdx: [], cardEls: [], cardGeo: [], tickEls: [[], []], raf: 0, sizeWatch: null,
  sheet: null, sheetResult: {},
  settings: null, settingsError: null, hoursDraft: null, settingsNote: '',
  timer: null, lastScroll: 0, typed: {}, forget: [], hoursBase: null,
  stripFor: null, stripDates: null, dayRaf: 0, dayTimer: null,
  stripTouch: false, stripAim: null, stripWidth: 0, stripWatch: null,   // a finger on the strip; the day the arrows head to; its width
  stripMoved: 0, stripLater: null, stripChose: null,                    // when it last moved; a rebuild waiting for it to be still; the day it chose
  scan: null,             // a table's QR just scanned: {token, booking, …} or {error}
  // Goes up every time the restaurant changes or the session ends. An answer
  // that comes back for an older generation is dropped, so a slow reply about
  // the last restaurant can never be drawn over (or saved into) this one.
  gen: 0,
};
const RV_ROW = 44;            // pixels between two marks on the clock

function rvReset(){
  msgReset();
  if(typeof mpReset === 'function') mpReset();          // r46
  Object.assign(RV, { gen: RV.gen + 1, rid: RESTAURANT ? RESTAURANT.id : null, view: 'day', days: [], daysFrom: null, daysTo: null,
    today: null, date: null, day: null, error: null, centerId: null, armed: null, sheet: null, sheetResult: {},
    settings: null, settingsError: null, hoursDraft: null, hoursBase: null, settingsNote: '', typed: {}, forget: [],
    stripFor: null, stripDates: null, stripTouch: false, stripAim: null, scan: null, reqMailDraft: null });
}

async function rvApi(body){
  const token = currentSession;
  const {res, data} = await callApi('/api/reservations', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify(Object.assign({restaurantId: RESTAURANT.id}, body))
  });
  if(res.status===401){
    // Only if it is still the session this request was sent with: a reply
    // that arrives after a fresh log-in must not throw the new one away.
    if(currentSession && currentSession===token){
      logout();                            // clears the list off the screen too (below)
      showToast('Your session expired. Please log in again.');
    }
    const out = new Error('Please log in again.'); out.status = 401;
    throw out;
  }
  if(!res.ok){ const e = new Error(data.error||'Something went wrong. Please try again.'); e.status = res.status; e.data = data; throw e; }
  return data;
}

// ── DATES AND CLOCKS ──
function rvD(date){ return new Date(date+'T12:00:00Z'); }
function rvAddDays(date, n){ const d = rvD(date); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function rvFmt(date, opts){ return new Intl.DateTimeFormat('en-US', Object.assign({timeZone:'UTC'}, opts)).format(rvD(date)); }
function rvLong(date){ return rvFmt(date, {weekday:'long', month:'long', day:'numeric'}); }
function rvShort(date){ return rvFmt(date, {weekday:'short', month:'short', day:'numeric'}); }
function rvClock(m){
  const mm = ((m % 1440) + 1440) % 1440, h = Math.floor(mm/60);
  return { t: (h % 12 || 12) + ':' + String(mm % 60).padStart(2,'0'), ap: h < 12 ? 'AM' : 'PM' };
}
function rvHm(hhmm){ const c = rvClock(Number(hhmm.slice(0,2))*60 + Number(hhmm.slice(3,5))); return c.t+' '+c.ap; }
// Now, by the server's clock (the phone's may be wrong), in milliseconds.
function rvNowMs(){ return RV.day ? Date.parse(RV.day.now) + (Date.now() - RV.fetchedAt) : Date.now(); }
function rvNowMinutes(){
  const p = {};
  new Intl.DateTimeFormat('en-US', {timeZone: RV.day.timezone, hourCycle:'h23', hour:'2-digit', minute:'2-digit'})
    .formatToParts(new Date(rvNowMs())).forEach(x => { p[x.type] = x.value; });
  const m = Number(p.hour)*60 + Number(p.minute);
  return m < 300 ? m + 1440 : m;      // before 5 AM it is still last night's service
}
function rvTel(phone){
  const raw = String(phone||''), dial = raw.replace(/[^\d+]/g,'');
  if(!dial) return '';                      // r45: an online booking may have no phone (the email is required instead)
  const us = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(dial);
  const shown = us ? '('+us[1]+') '+us[2]+'-'+us[3] : raw;
  return '<a class="rv-tel" href="tel:'+esc(dial)+'">'+esc(shown)+'</a>';
}
function rvPeople(n){ return n+(n===1?' person':' people'); }
// r42 (Sebastian, 22 Oct: "Me + owners and managers"): the guest's email, as a link that opens the phone's mail app.
// The server sends it only to owners, managers and Sebastian; crew never get it, so it never shows for them.
function rvMail(email){
  const e = String(email || '');
  return e ? '<a class="rv-mailto" href="mailto:'+esc(e)+'">'+esc(e)+'</a>' : '';
}
// "Write", next to Call (r29): a text message from the manager's own phone to the number the guest gave, started with a
// short first line. (An email from here would need an address, which the staff never see.)
const WRITE_ICON = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>';
function rvWrite(r){
  const dial = String(r.phone||'').replace(/[^\d+]/g,'');
  if(!dial) return '';
  const first = String(r.name||'').trim().split(/\s+/)[0] || '';
  const text = 'Hi'+(first ? ' '+first : '')+', this is '+((typeof RESTAURANT !== 'undefined' && RESTAURANT && RESTAURANT.name) || 'the restaurant')
    + ' about your request for '+rvPeople(r.party)+' on '+rvShort(r.date)+'. ';
  // r30 (Sebastian, 13 Oct): written like Call — "Write SMS", with SMS in red as the number is — so it reads as a text message.
  return '<span>Write <a class="rv-tel rv-sms" href="sms:'+esc(dial)+'?&body='+encodeURIComponent(text)+'" aria-label="Write to '+esc(first || 'the guest')+' by text message (SMS)">SMS</a></span>';
}
// r30: the chat button of a request (the messages inside the site), at the right of Call and Write SMS.
// Red with the count when the guest wrote something nobody has read. Only for those who answer guests.
function rqSign(r){
  if(!r.chat) return '';
  const n = Number(r.chat.unread) || 0;
  return '<button type="button" class="rv-chat-sign'+(n ? ' new' : '')+'" onclick="rqChatOpen('+Number(r.id)+')" aria-label="Messages with '+esc(whoText(r.name, r.handle))
    + (n ? ' ('+n+' new)' : (r.chat.count ? ' ('+r.chat.count+')' : ''))+'">'+MSG_ICON+(n ? '<b>'+(n>99?'99+':n)+'</b>' : '')+'</button>';
}

// ── LOADING ──
async function rvStart(){
  if(!RESTAURANT) return;
  if(RV.rid !== RESTAURANT.id) rvReset();
  if(NF_DAY){ RV.date = NF_DAY.date; RV.wantCenter = NF_DAY.b || null; RV.view = 'day'; NF_DAY = null; }   // r43: a notification's day
  if(NF_SETTINGS){ NF_SETTINGS = false; RV.view = 'settings'; RV.settings = null; }                       // r43: a change to the settings
  if(NF_MAP){ NF_MAP = false; RV.settings = null; rvOpenMap(); return; }                                 // r48: a change to the rules or rooms
  rvRender();
  if(RV.view === 'settings'){ rvLoadSettings(true); return; }
  await Promise.all([ rvLoadDays(RV.date), rvLoadDay(RV.date, {quiet: !!RV.day}) ]);
  rvKeepFresh();
}

// A page left open all service still shows new bookings: every minute, while
// it is on screen and nobody is in the middle of a tap.
function rvKeepFresh(){
  if(RV.timer) return;
  RV.timer = setInterval(function(){
    if(!currentSession || TAB!=='reservations' || RV.view!=='day' || document.visibilityState!=='visible') return;
    if(RV.sheet || RV.armed || RV.busy || !RV.day) return;
    if(Date.now() - RV.lastScroll < 4000) return;      // a finger is on the evening: next minute
    rvLoadDay(RV.date, {quiet:true});
    rvLoadDays(RV.date, true);
  }, 60000);
}

async function rvLoadDays(around, force){
  const center = around || RV.today;
  if(!force && center && RV.daysFrom && center >= rvAddDays(RV.daysFrom, 3) && center <= rvAddDays(RV.daysTo, -3)) return;
  try{
    const body = {action:'staff_days'};
    if(center){ body.from = rvAddDays(center, -30); body.to = rvAddDays(center, 60); }
    const gen = RV.gen;
    const data = await rvApi(body);
    if(gen !== RV.gen) return;
    RV.days = data.days; RV.daysFrom = data.from; RV.daysTo = data.to; RV.today = data.today;
    if(!RV.date) RV.date = data.today;
    rvPaintDays();
  }catch(e){ /* the carousel just shows no numbers; the day itself still loads */ }
}

async function rvLoadDay(date, opts){
  const quiet = opts && opts.quiet;
  const seq = ++RV.seq, gen = RV.gen;
  const ev = document.getElementById('rv-evening');
  if(!quiet && ev) ev.classList.add('busy');
  try{
    const body = {action:'staff_day'};
    if(date) body.date = date;
    const data = await rvApi(body);
    if(seq !== RV.seq || gen !== RV.gen) return;       // a newer day, or another restaurant, was asked for
    const dayChanged = !RV.day || RV.day.date !== data.date;
    const listChanged = dayChanged || JSON.stringify(RV.day.bookings) !== JSON.stringify(data.bookings);
    RV.day = data; RV.fetchedAt = Date.now(); RV.error = null;
    RV.date = data.date; RV.today = data.today;
    evLoadDay(data.date);                            // r50: that day's events (once a minute at most)
    msgFromDay(data);
    if(dayChanged){
      const scanned = RV.scan && RV.scan.booking && data.bookings.some(b => b.id === RV.scan.booking.id) ? RV.scan.booking.id : null;
      RV.centerId = scanned || rvDefaultCenter(); RV.armed = null;
    }
    // r43: the table a tapped notification is about, in the middle
    if(RV.wantCenter && data.bookings.some(b => b.id === RV.wantCenter)){ RV.centerId = RV.wantCenter; RV.armed = null; RV.wantCenter = null; if(!dayChanged) RV.forceEvening = true; }
    if(!document.getElementById('rv-evening')){ rvRender(); rqShowWanted(); return; }
    rvPaintDays(); rvPaintTop();
    if(listChanged || RV.forceEvening){ RV.forceEvening = false; rvPaintEvening(); }
    else { document.getElementById('rv-evening').classList.remove('busy'); rvRefreshLate(); }
    if(RV.sheet) rvPaintSheet();
    rqShowWanted();
  }catch(e){
    if(seq !== RV.seq || gen !== RV.gen) return;
    if(!quiet || !RV.day){ RV.error = e.message; rvRender(); }
  }
}

// Which booking sits in the middle when a day opens. Today: the first guest
// still expected (a late one before the next one due), or failing that the
// table just gone by. Any other day: the first of the day.
function rvDefaultCenter(){
  const list = RV.day ? RV.day.bookings : [];
  if(!list.length) return null;
  if(RV.day.date === RV.day.today){
    const now = rvNowMinutes();
    const waiting = list.find(b => b.status==='booked' && b.minutes >= now - 120);
    const next = waiting || list.find(b => b.status!=='cancelled' && b.minutes >= now - 45);
    return (next || list[list.length-1]).id;
  }
  return (list.find(b => b.status!=='cancelled') || list[0]).id;
}

// ── DRAWING ──
function rvRender(){
  if(TAB!=='reservations') return;
  const root = document.getElementById('rv-root');
  if(!root) return;
  document.body.classList.toggle('rv-mode', RV.view==='day');
  // r46: the table map, and drawing a room
  if(RV.view==='map'){ root.innerHTML = mpHtml(); mpAfterPaint(); mpPaintFloor(); mpPaintSheet(); mpPaintToast(); return; }
  if(RV.view==='draw'){ root.innerHTML = dwHtml(); dwPaintGrid(); mpPaintToast(); return; }
  if(RV.view==='settings'){
    const kept = rvKeptInputs();
    root.innerHTML = rvSettingsHtml();
    rvFoldCards(root);                               // r48: each title opens and closes its part
    rvPutBack(kept);
    supAfterPaint();
    return;
  }
  if(RV.error && !RV.day){
    root.innerHTML = '<div class="m-err">'+esc(RV.error)+'</div>'
      + '<button class="m-btn" onclick="RV.error=null;rvStart()">Try again</button>';
    return;
  }
  if(!RV.day){ root.innerHTML = '<div class="m-skel"></div><div class="m-skel"></div><div class="m-skel"></div>'; return; }
  root.innerHTML = '<div class="rv-car" id="rv-car"></div><div class="rv-dateline" id="rv-dateline"></div>'
    + '<div id="rv-top"></div><div class="rv-evening" id="rv-evening"></div>';
  rvPaintDays(); rvPaintTop(); rvPaintEvening(); rvPaintSheet();
}

// The days swipe sideways like the evening rolls (Sebastian, 25 Sep): the day
// in the middle is the one shown, bigger and dark; let go and its tables load.
// The arrows move one day. The strip holds a month either side of the day on
// screen; when a swipe comes near either end, it is built again around the day
// shown, once the strip and the finger are still (r22: it used to be built
// again after every day, which stopped a phone's glide in the middle).
const RV_SLOT = 60;            // one day in the strip: 54px wide + 6px gap

// ── SWIPING DAY STRIPS (r22, Sebastian 8 Oct: on his iPhone the strips swung
// right and left and back) ──
// The evening's days and the messages' days work alike. A finger's swipe is
// never moved by the page: when it stops, the day in the middle is the day.
// A tap or an arrow moves the strip with the page's own glide, with the
// snapping off while it glides (Safari's smooth scrolling fought the snapping
// on a phone), and a finger stops that glide at once.
function stripStop(strip){
  if(!strip || !strip._anim) return;
  cancelAnimationFrame(strip._anim); strip._anim = 0;
  strip.style.scrollSnapType = '';
}
function stripGlide(strip, to, smooth){
  stripStop(strip);
  const max = Math.max(0, strip.scrollWidth - strip.clientWidth);
  to = Math.max(0, Math.min(max, Math.round(to)));
  const from = strip.scrollLeft;
  if(!smooth || rvSmooth() !== 'smooth' || Math.abs(to - from) < 2){ strip.scrollLeft = to; return; }
  const t0 = performance.now(), ms = Math.min(420, 220 + Math.abs(to - from) * 0.45);
  strip.style.scrollSnapType = 'none';
  const step = function(now){
    const k = Math.min(1, (now - t0) / ms), ease = 1 - Math.pow(1 - k, 3);
    strip.scrollLeft = from + (to - from) * ease;
    if(k < 1){ strip._anim = requestAnimationFrame(step); return; }
    strip._anim = 0;
    strip.style.scrollSnapType = '';
  };
  strip._anim = requestAnimationFrame(step);
}
// Room either side, so the first and the last day can sit in the middle too.
// With it, day number i is in the middle exactly when the strip is scrolled
// i slots (whole pixels, so the glide ends where the snapping would).
function stripFit(strip, padSel){
  const pads = strip.querySelectorAll(padSel), cells = strip.querySelectorAll('[data-date]');
  if(!cells.length || !strip.clientWidth) return;
  const now = pads.length ? pads[0].offsetWidth : 0;
  const lead = cells[0].offsetLeft - now + cells[0].offsetWidth/2;
  const pad = Math.max(0, Math.round(strip.clientWidth/2 - lead));
  pads.forEach(x => { x.style.width = pad+'px'; });
}

function rvStripBusy(strip){
  return !!(RV.stripTouch || (strip && strip._anim) || Date.now() - (RV.stripMoved || 0) < 400);
}
function rvPaintDays(){
  const car = document.getElementById('rv-car');
  if(!car || !RV.date) return;
  const strip = document.getElementById('rv-strip');
  const i = strip && car.contains(strip) && RV.stripDates ? RV.stripDates.indexOf(RV.date) : -1;
  const busy = i >= 0 && rvStripBusy(strip), mid = i >= 0 ? Math.round(strip.scrollLeft / RV_SLOT) : -1;
  // The strip chose this day and then moved on by itself (an iPhone gliding on
  // without a word): the day in the middle is the day, the strip is not moved.
  const movedOn = i >= 0 && !busy && mid !== i && RV.stripChose === RV.date;
  const edge = i >= 0 && rvStripNearEnd(i);
  if(i < 0 || (edge && !busy && !movedOn)) rvBuildStrip(car);
  else {
    if(edge) rvStripLater();
    if(movedOn) setTimeout(rvStripSettled, 0);
    // A day chosen elsewhere (Today, a scan, the server): the strip goes there.
    else if(!busy && mid !== i){ RV.stripAim = null; stripGlide(strip, i*RV_SLOT, false); }
    rvFillStrip();
  }
  const line = document.getElementById('rv-dateline');
  if(line) line.textContent = rvLong(RV.date) + (RV.date===RV.today ? ' · today' : '');
}
// Near an end, but a finger or the strip is still moving: build it again a
// little later, when both are still.
function rvStripLater(){
  clearTimeout(RV.stripLater);
  RV.stripLater = setTimeout(function(){
    const strip = document.getElementById('rv-strip');
    if(!strip || !RV.stripDates) return;
    if(rvStripBusy(strip)){ rvStripLater(); return; }
    rvPaintDays();
  }, 700);
}

// The days of a strip built around this day: a month either side, within a year of today.
function rvStripDatesFor(day){
  const lo = RV.today ? rvAddDays(RV.today, -365) : null, hi = RV.today ? rvAddDays(RV.today, 365) : null;
  const dates = [];
  for(let k = -30; k <= 30; k++){
    const date = rvAddDays(day, k);
    if((lo && date < lo) || (hi && date > hi)) continue;
    dates.push(date);
  }
  return dates;
}
// Near either end — and building it again would give more days (not at the year's limit).
function rvStripNearEnd(i){
  if(i >= 8 && i <= RV.stripDates.length - 9) return false;
  const fresh = rvStripDatesFor(RV.date);
  return fresh[0] !== RV.stripDates[0] || fresh[fresh.length - 1] !== RV.stripDates[RV.stripDates.length - 1];
}
function rvBuildStrip(car){
  const dates = rvStripDatesFor(RV.date);
  // A keyboard on an arrow keeps its place when the strip is built again.
  const old = document.activeElement, arrow = old && car.contains(old) && old.classList.contains('rv-arrow') ? (old.getAttribute('aria-label') || '') : null;
  const was = document.getElementById('rv-strip');
  if(was) stripStop(was);
  clearTimeout(RV.stripLater);
  RV.stripDates = dates; RV.stripFor = RV.date;
  car.innerHTML = '<button type="button" class="rv-arrow" aria-label="Previous day" onclick="rvStep(-1)">&#8249;</button>'
    + '<div class="rv-strip" id="rv-strip"><div class="rv-strip-pad"></div>'
    + dates.map(date => '<button type="button" class="rv-cday" data-date="'+date+'" aria-label="'+esc(rvLong(date))+'">'
        + '<span></span><b>'+Number(date.slice(8))+'</b><i>&nbsp;</i></button>').join('')
    + '<div class="rv-strip-pad"></div></div>'
    + '<button type="button" class="rv-arrow" aria-label="Next day" onclick="rvStep(1)">&#8250;</button>';
  if(arrow !== null){ const back = car.querySelector('.rv-arrow[aria-label="'+arrow+'"]'); if(back) back.focus({preventScroll:true}); }
  const strip = document.getElementById('rv-strip');
  RV.stripAim = null;
  rvPadStrip(strip);
  strip.scrollLeft = dates.indexOf(RV.date) * RV_SLOT;
  strip.addEventListener('scroll', function(){
    RV.stripMoved = Date.now();
    if(!RV.dayRaf) RV.dayRaf = requestAnimationFrame(function(){ RV.dayRaf = 0; rvPaintStrip(); });
    clearTimeout(RV.dayTimer);
    RV.dayTimer = setTimeout(rvStripSettled, 160);
  }, {passive:true});
  // A finger resting on the strip is not a choice: the day is picked when it
  // lets go (and the strip has stopped), never under a finger that paused.
  // A finger also stops the page's glide at once.
  strip.addEventListener('touchstart', function(){ RV.stripTouch = true; RV.stripAim = null; stripStop(strip); clearTimeout(RV.dayTimer); }, {passive:true});
  const up = function(e){
    if(e && e.touches && e.touches.length) return;      // another finger is still down
    RV.stripTouch = false;
    rvRefitStrip();                                       // a turn of the phone while the finger was down
    clearTimeout(RV.dayTimer); RV.dayTimer = setTimeout(rvStripSettled, 160);
    // An iPhone may glide on and stop without a word: look at the middle again.
    [600, 1200, 2200].forEach(function(ms){ setTimeout(function(){ if(document.getElementById('rv-strip') === strip) rvStripSettled(); }, ms); });
  };
  strip.addEventListener('touchend', up, {passive:true});
  strip.addEventListener('touchcancel', up, {passive:true});
  // A trackpad moving it sideways is a hand; a mouse wheel scrolling the page is not.
  strip.addEventListener('wheel', function(e){ if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ RV.stripAim = null; stripStop(strip); } }, {passive:true});
  // The keyboard: only the day shown takes Tab (so tabbing in never scrolls the
  // strip a month away); ‹ › keys move a day.
  strip.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    rvStep(e.key === 'ArrowLeft' ? -1 : 1);
    const cell = RV.stripAim !== null ? strip.querySelectorAll('.rv-cday')[RV.stripAim] : null;
    if(cell) cell.focus({preventScroll:true});
  });
  strip.addEventListener('click', function(e){
    const cell = e.target.closest('.rv-cday');
    if(!cell) return;
    const i = RV.stripDates.indexOf(cell.dataset.date);
    if(i >= 0 && cell.dataset.date !== RV.date){ RV.stripAim = i; stripGlide(strip, i*RV_SLOT, true); }
  });
  if(window.ResizeObserver){
    if(RV.stripWatch) RV.stripWatch.disconnect();
    RV.stripWatch = new ResizeObserver(function(){ rvRefitStrip(); });
    RV.stripWatch.observe(strip);
  }
  rvFillStrip();
}

// Half the strip on each side, so the first and the last day can sit in the middle.
function rvPadStrip(strip){
  stripFit(strip, '.rv-strip-pad');
  RV.stripWidth = strip.clientWidth;
}

// The phone turned, or the window changed width: the middle moved, so the
// strip is padded again and put back on the day shown (review, 1 Oct).
function rvRefitStrip(){
  const strip = document.getElementById('rv-strip');
  if(!strip || !RV.stripDates || RV.stripTouch || strip.clientWidth === RV.stripWidth) return;
  stripStop(strip);
  rvPadStrip(strip);
  clearTimeout(RV.dayTimer); RV.stripAim = null;
  const i = RV.stripDates.indexOf(RV.date);
  if(i >= 0) strip.scrollLeft = i * RV_SLOT;
  rvPaintStrip();
}

// The numbers under each day, and "Today", without rebuilding anything.
function rvFillStrip(){
  const strip = document.getElementById('rv-strip');
  if(!strip) return;
  const info = {};
  RV.days.forEach(d => { info[d.date] = d; });
  strip.querySelectorAll('.rv-cday').forEach(cell => {
    const date = cell.dataset.date, d = info[date];
    let line = ' ', shut = false;
    if(d){
      if(d.tables) line = d.tables+(d.tables===1?' table':' tables');
      else if(d.open===false){ line = 'Closed'; shut = true; }
      else { line = 'none'; shut = true; }
    }
    cell.querySelector('span').textContent = date===RV.today ? 'Today' : rvFmt(date, {weekday:'short'});
    cell.classList.toggle('today', date===RV.today);
    const i = cell.querySelector('i');
    i.textContent = line; i.className = shut ? 'shut' : '';
  });
  rvPaintStrip();
}

// Bigger and dark in the middle, smaller and fainter towards the edges.
function rvPaintStrip(){
  const strip = document.getElementById('rv-strip');
  if(!strip) return;
  const mid = strip.scrollLeft / RV_SLOT;
  strip.querySelectorAll('.rv-cday').forEach((cell, i) => {
    const d = Math.abs(i - mid), a = Math.min(d, 3);
    // Today is a little bigger and never fades towards the edge: it is the day to find.
    const today = cell.classList.contains('today');
    cell.style.transform = 'scale('+((1.2 - .2*Math.min(a,1) - .05*Math.max(0, a-1)) * (today ? 1.1 : 1))+')';
    cell.style.opacity = Math.max(today ? .9 : .35, 1 - .25*Math.max(0, a - .5));
    const on = d < .5;
    cell.classList.toggle('on', on);
    if(on) cell.setAttribute('aria-current', 'date'); else cell.removeAttribute('aria-current');
    if(cell.tabIndex !== (on ? 0 : -1)) cell.tabIndex = on ? 0 : -1;
  });
}

// The strip stopped (the finger let go, or the glide ended): the day in the middle is the day.
function rvStripSettled(){
  const strip = document.getElementById('rv-strip');
  if(!strip || !RV.stripDates || RV.stripTouch || strip._anim) return;
  RV.stripAim = null;
  const i = Math.max(0, Math.min(RV.stripDates.length - 1, Math.round(strip.scrollLeft / RV_SLOT)));
  const date = RV.stripDates[i];
  if(date && date !== RV.date) rvPick(date, true);
}

function rvSmooth(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'; }

function rvStep(n){
  const strip = document.getElementById('rv-strip');
  if(strip && RV.stripDates){
    // From where the strip is already heading, so three quick taps are three days.
    const from = RV.stripAim !== null ? RV.stripAim : RV.stripDates.indexOf(RV.date);
    const i = from + n;
    if(from >= 0 && i >= 0 && i < RV.stripDates.length){ RV.stripAim = i; stripGlide(strip, i*RV_SLOT, true); return; }
    if(from >= 0){ rvPick(rvAddDays(RV.stripDates[from], n)); return; }
  }
  rvPick(rvAddDays(RV.date, n));
}
// fromStrip: the strip chose it (a swipe, a tap, an arrow, once it stopped).
function rvPick(date, fromStrip){
  if(!date || date===RV.date) return;
  RV.stripChose = fromStrip ? date : null;
  // A year back and a year ahead is more than any restaurant needs from here.
  if(RV.today && (date < rvAddDays(RV.today, -365) || date > rvAddDays(RV.today, 365))) return;
  RV.date = date; RV.armed = null;
  rvPaintDays();
  rvLoadDay(date);
  rvLoadDays(date);
}

function rvPaintTop(){
  const top = document.getElementById('rv-top');
  if(!top || !RV.day) return;
  const d = RV.day, same = d.date === RV.date;
  const c = same ? d.counts : null;
  const tile = (n, label, red) => '<div class="rv-tile'+(red?' red':'')+'"><b>'+(c ? n : '·')+'</b><span>'+label+'</span></div>';
  const q = d.requests || [];
  const capT = rvCapTile(d);                 // r49: "In use now", the fifth tile (today)
  let html = rvScanHtml() + '<div class="rv-tiles'+(capT ? ' five' : '')+'">'
    + tile(c && c.tables, 'Tables') + tile(c && c.people, 'People') + tile(c && c.arrived, 'Arrived')
    + '<button type="button" class="rv-tile'+(q.length?' red':'')+'" onclick="rvOpenRequests()"><b>'+q.length+'</b><span>'+(q.length===1?'Request':'Requests')+'</span></button>'
    + capT + '</div>'
    // r35 (Sebastian, 16 Oct): where the waiter types a guest's code when the QR
    // will not scan — Check In, Show my reward, Show my invite (the six
    // characters under the guest's QR). The page is /checkin.
    // r46 (Sebastian, 29 Oct): that row is now three buttons — Type (the same page), Map, Camera.
    + mpBarHtml();
  if(q.length){
    const r = q[0];
    const unread = q.reduce((n, x) => n + ((x.chat && Number(x.chat.unread)) || 0), 0);
    html += '<div class="rv-banner"><span><b>'+whoHtml(r.name, r.handle)+'</b> asks for <b>'+rvPeople(r.party)+'</b> · '+esc(rvShort(r.date))
      + (q.length>1 ? ' · +'+(q.length-1)+' more' : '')
      + (unread ? ' · <em>'+unread+' new message'+(unread===1?'':'s')+'</em>' : '')+'</span>'
      + '<button type="button" class="rv-act no" style="background:#fff;flex:none;" onclick="rvOpenRequests()">'+(d.canEdit?'Answer':'See')+'</button></div>';
  }
  html += evDayHtml(d.date);                       // r50: the day's events (tap: who has tickets, who is in)
  if(!d.settings.enabled){
    html += '<div class="rv-off">Online booking is switched off. The booking page tells guests to call.'
      + (d.canEdit ? ' Switch it on in <a href="#" onclick="rvOpenSettings();return false;">settings</a>.' : '')+'</div>';
  }
  top.innerHTML = html;
}

function rvLateMinutes(b){
  if(b.status!=='booked' || !RV.day || RV.day.date!==RV.day.today) return 0;
  const late = Math.floor((rvNowMs() - Date.parse(b.at)) / 60000);
  return late >= 5 ? late : 0;
}

function rvCard(b){
  const late = rvLateMinutes(b);
  const chips = (b.status==='seated' ? '<span class="rv-chip in">Arrived'+(b.seatedLabel?' '+esc(b.seatedLabel):'')+'</span>' : '')
    + (b.status==='no_show' ? '<span class="rv-chip ns">No-show</span>' : '')
    + (b.status==='cancelled' ? '<span class="rv-chip cx">Cancelled</span>' : '')
    + (late ? '<span class="rv-chip late">Late · '+late+' min</span>' : '')
    + (b.source==='request' ? '<span class="rv-chip big">Big party</span>' : '');
  const armed = RV.armed && RV.armed.id===b.id ? RV.armed.act : null;
  const btn = (act, cls, text, sure) => '<button type="button" class="rv-act '+cls+(armed===act?' armed':'')+'" data-act="'+act+'">'
    + (armed===act ? sure : text)+'</button>';
  // The armed button turns red and says "Sure?": short, so the row never wraps
  // and the card does not jump under the finger that is about to tap again.
  const acts = (b.canArrive ? btn('seated','go','Arrived') : '')
    + (b.canNoShow ? btn('no_show','no','No-show','Sure?') : '')
    + (b.canUndo ? btn('booked','','Undo') : '')
    + (b.canCancel ? btn('cancelled','','Cancel','Sure?') : '');
  const scanned = RV.scan && RV.scan.booking && RV.scan.booking.id === b.id ? ' scanned' : '';
  return '<div class="rv-w'+(['seated','no_show','cancelled'].includes(b.status)?' faded':'')+scanned+'" data-id="'+b.id+'" data-late="'+late+'">'
    + '<div class="rv-w-in">'
    +   '<div class="rv-when"><span>'+esc(b.label)+'</span><em>'+esc(b.code)+'</em></div>'
    +   '<div class="rv-name"><span class="rv-name-text">'+whoHtml(b.name, b.handle)+chips+'</span>'+msgSign(b)+'</div>'
    +   '<div class="rv-meta">'+rvPeople(b.party)+(b.areaName?' · '+esc(b.areaName):'')+(rvTel(b.phone)?' · '+rvTel(b.phone):'')+'</div>'
    +   (b.email ? '<div class="rv-meta rv-email">'+MAIL_ICON+rvMail(b.email)+'</div>' : '')
    +   (b.notes ? '<div class="rv-note">&ldquo;'+esc(b.notes)+'&rdquo;</div>' : '')
    + '</div>'
    + (acts ? '<div class="rv-acts">'+acts+'</div>' : '')
    + '</div>';
}

function rvPaintEvening(){
  const ev = document.getElementById('rv-evening');
  if(!ev || !RV.day) return;
  ev.classList.remove('busy');
  const list = RV.day.bookings;
  if(!list.length){
    const d = RV.days.find(x => x.date===RV.day.date);
    ev.innerHTML = '<div class="rv-empty">'+(d && d.open===false ? '<b>Closed this day.</b><br>' : '')
      + 'No tables booked for '+esc(rvLong(RV.day.date))+'.</div>';
    RV.stops = []; RV.cardEls = [];
    return;
  }
  ev.innerHTML = '<div class="rv-scroll" id="rv-scroll"><div class="rv-pad"></div>'+list.map(rvCard).join('')+'<div class="rv-pad"></div></div>'
    + '<div class="rv-rail" aria-hidden="true"><div class="rv-wheel"></div><div class="rv-pill"><div class="rv-wheel"></div></div></div>'
    + '<div class="rv-hand"></div>';
  rvFit();
  rvBuildWheel();
  rvMeasure();
  // A card that changes height (the fonts arrive after the first paint, a name
  // wraps differently) moves every card below it. Measure again whenever that
  // happens, or the clock would drift a few pixels off its marks.
  if(RV.sizeWatch) RV.sizeWatch.disconnect();
  if(window.ResizeObserver){
    RV.sizeWatch = new ResizeObserver(function(){ rvMeasure(); rvPaint(); });
    RV.cardEls.forEach(c => RV.sizeWatch.observe(c));
  }
  const sc = document.getElementById('rv-scroll');
  sc.addEventListener('scroll', function(){
    RV.lastScroll = Date.now();
    if(!RV.raf) RV.raf = requestAnimationFrame(function(){ RV.raf = 0; rvPaint(); });
  }, {passive:true});
  sc.addEventListener('click', rvEveningClick);
  rvCenterOn(RV.centerId, false);
  rvPaint();
}

// The evening fills what is left of the screen, so the page itself does not
// scroll: only the bookings do.
function rvFit(){
  const ev = document.getElementById('rv-evening');
  if(!ev) return;
  const top = ev.getBoundingClientRect().top + window.scrollY;
  const h = Math.max(320, Math.round(window.innerHeight - top - 10));
  document.documentElement.style.setProperty('--eh', h+'px');
}

// The clock: a mark every half hour (or every slot, for a restaurant that books
// every 15 or 20 minutes), from an hour before the first table to an hour after
// the last. A long quiet stretch between two tables — lunch and dinner — is
// folded into "···", so the clock never spins through empty hours.
function rvBuildWheel(){
  const list = RV.day.bookings;
  const slot = RV.day.settings.slotMinutes;
  const step = (slot===15 || slot===20) ? slot : 30;
  const times = [...new Set(list.map(b => b.minutes))].sort((a,b) => a-b);
  const first = Math.max(0, Math.floor(times[0]/step)*step - 60);
  const last = Math.ceil(times[times.length-1]/step)*step + 60;
  const folded = x => times.some((t, i) => i < times.length-1 && times[i+1]-t > 120 && x > t+step && x < times[i+1]-step);
  const ticks = [];
  for(let m = first; m <= last; m += step){
    if(folded(m)){ if(!ticks.length || !ticks[ticks.length-1].gap) ticks.push({gap:true}); continue; }
    ticks.push({m: m});
  }
  // Where a time sits on the wheel, as a (fractional) mark number.
  const idxOf = t => {
    let k = -1;
    ticks.forEach((x, i) => { if(!x.gap && x.m <= t) k = i; });
    if(k < 0) return 0;
    const next = ticks[k+1];
    return next && !next.gap ? k + (t - ticks[k].m) / step : k;
  };
  RV.cardIdx = list.map(b => idxOf(b.minutes));
  const busy = t => times.some(x => x >= t && x < t + step);
  const html = ticks.map(x => {
    if(x.gap) return '<div class="rv-tick gap">···</div>';
    const c = rvClock(x.m);
    return '<div class="rv-tick">'+c.t+'<small>'+c.ap+'</small>'+(busy(x.m)?'<i></i>':'')+'</div>';
  }).join('');
  const wheels = document.querySelectorAll('#rv-evening .rv-wheel');
  wheels.forEach(w => { w.innerHTML = html; });
  RV.tickEls = [...wheels].map(w => [...w.children]);
}

function rvMeasure(){
  const sc = document.getElementById('rv-scroll');
  if(!sc) return;
  RV.cardEls = [...sc.querySelectorAll('.rv-w')];
  const H = sc.clientHeight;
  RV.cardGeo = RV.cardEls.map(c => ({ top: c.offsetTop, h: c.offsetHeight }));
  RV.stops = RV.cardGeo.map(g => Math.max(0, g.top + g.h/2 - H/2));
}

function rvCenterOn(id, smooth){
  const sc = document.getElementById('rv-scroll');
  if(!sc || !RV.stops.length) return;
  let i = RV.cardEls.findIndex(c => Number(c.dataset.id)===Number(id));
  if(i < 0) i = 0;
  sc.scrollTo({ top: RV.stops[i], behavior: smooth ? 'smooth' : 'auto' });
}

function rvPaint(){
  const sc = document.getElementById('rv-scroll');
  if(!sc || !RV.stops.length) return;
  const s = sc.scrollTop, H = sc.clientHeight, mid = s + H/2, st = RV.stops, T = RV.cardIdx;
  // The clock, between two bookings, moves by the time between them.
  let ri = T[0];
  if(s >= st[st.length-1]) ri = T[T.length-1];
  else for(let i=0; i<st.length-1; i++){
    if(s <= st[i+1]){
      // Within a pixel or two of a card, the clock sits exactly on its time:
      // the browser rounds the scroll position, and a clock resting a hair off
      // its mark looks wrong.
      let f = Math.min(1, Math.max(0, (s - st[i]) / Math.max(1, st[i+1]-st[i])));
      if(s - st[i] < 2) f = 0; else if(st[i+1] - s < 2) f = 1;
      ri = T[i] + f * (T[i+1] - T[i]);
      break;
    }
  }
  RV.tickEls.forEach((ticks, w) => {
    const lit = w === 1, base = lit ? 26 : H/2;
    ticks.forEach((el, k) => {
      const d = k - ri, a = Math.min(Math.abs(d), 3);
      el.style.top = (base + d*RV_ROW)+'px';
      el.style.fontSize = (1.32 - .2*Math.min(a,1) - .1*Math.max(0,a-1))+'rem';
      el.style.opacity = lit ? 1 : Math.max(.12, 1 - .32*a);
    });
  });
  let best = 0, bestD = 1e9;
  RV.cardEls.forEach((c, i) => {
    const cy = RV.cardGeo[i].top + RV.cardGeo[i].h/2;
    const a = Math.min(Math.abs((cy - mid) / 150), 2.2);
    c.style.transform = 'scale('+(1 - .075*a)+')';
    c.style.opacity = Math.max(.28, 1 - .3*a);
    const acts = c.querySelector('.rv-acts');
    if(acts){ acts.style.opacity = Math.max(.18, 1 - 1.4*a); acts.style.pointerEvents = a < .25 ? 'auto' : 'none'; }
    if(Math.abs(cy - mid) < bestD){ bestD = Math.abs(cy - mid); best = i; }
  });
  RV.cardEls.forEach((c, i) => c.classList.toggle('mid', i===best));
  const midId = RV.cardEls[best] ? Number(RV.cardEls[best].dataset.id) : null;
  if(midId !== RV.centerId){
    RV.centerId = midId;
    if(RV.armed){ const was = RV.armed.id; RV.armed = null; rvRepaintCard(was); }   // rolled away: disarm
  }
}

// A tap on a card that is not in the middle rolls it there — its phone number
// is not dialled and its buttons are not pressed. In the middle, the buttons work.
function rvEveningClick(e){
  const card = e.target.closest('.rv-w');
  if(!card) return;
  const id = Number(card.dataset.id);
  if(!card.classList.contains('mid')){
    e.preventDefault();
    rvCenterOn(id, true);
    return;
  }
  if(e.target.closest('.rv-chat-sign')){ msgOpenThread(id); return; }
  const btn = e.target.closest('.rv-act[data-act]');
  if(btn) rvAct(id, btn.dataset.act, btn);
}

function rvRepaintCard(id){
  const old = document.querySelector('#rv-scroll .rv-w[data-id="'+Number(id)+'"]');
  const b = RV.day && RV.day.bookings.find(x => x.id===Number(id));
  if(!old || !b) return;
  old.outerHTML = rvCard(b);
  const fresh = document.querySelector('#rv-scroll .rv-w[data-id="'+Number(id)+'"]');
  if(fresh && RV.sizeWatch) RV.sizeWatch.observe(fresh);
  rvMeasure(); rvPaint();
}

// "Late · 12 min" is worked out on the phone, so it moves on every minute even
// when the list itself has not changed.
function rvRefreshLate(){
  if(!RV.day) return;
  RV.day.bookings.forEach(b => {
    const card = document.querySelector('#rv-scroll .rv-w[data-id="'+b.id+'"]');
    if(card && Number(card.dataset.late) !== rvLateMinutes(b)) rvRepaintCard(b.id);
  });
}

const RV_DONE = { seated:'Arrived', no_show:'No-show', booked:'Put back', cancelled:'Cancelled' };

async function rvAct(id, act, btn){
  const b = RV.day.bookings.find(x => x.id===id);
  if(!b || RV.busy) return;
  // No-show and Cancel take two taps: one tap on a phone during service is too
  // easy to make by accident, and a cancelled table may go to someone else.
  if((act==='no_show' || act==='cancelled') && !(RV.armed && RV.armed.id===id && RV.armed.act===act)){
    const was = RV.armed && RV.armed.id;
    RV.armed = {id: id, act: act};
    if(was && was!==id) rvRepaintCard(was);
    rvRepaintCard(id);
    clearTimeout(RV.armTimer);
    RV.armTimer = setTimeout(function(){ if(RV.armed && RV.armed.id===id){ RV.armed = null; rvRepaintCard(id); } }, 4000);
    return;
  }
  RV.armed = null; clearTimeout(RV.armTimer);
  RV.busy = true;
  document.querySelectorAll('#rv-scroll .rv-w[data-id="'+id+'"] .rv-act').forEach(x => { x.disabled = true; });
  const gen = RV.gen;
  try{
    const data = await rvApi({action:'staff_mark', id: id, to: act});
    if(gen !== RV.gen) return;
    rvApply(data.booking);
    // Arrived closes the guest's conversation (and Undo opens it): the chat sign follows.
    if(b.chat && (act==='seated' || act==='booked')) rvLoadDay(RV.date, {quiet:true});
  }catch(e){
    if(gen !== RV.gen) return;
    if(e.data && e.data.booking) rvApply(e.data.booking); else rvRepaintCard(id);
    showToast(e.message);
  }finally{
    RV.busy = false;
  }
}

// One booking changed: the card, the numbers and the day in the carousel
// follow, without waiting for the next refresh.
function rvApply(nb){
  if(!RV.day || !nb) return;
  const list = RV.day.bookings, i = list.findIndex(x => x.id===nb.id);
  if(i < 0) return;
  // The card keeps its place on this day's clock (a 12:30 AM table stays at
  // 24:30 here; the answer to a tap does not know which list it is on).
  list[i] = Object.assign({}, list[i], nb, { areaName: nb.areaName || list[i].areaName, minutes: list[i].minutes });
  if(!RV.day.canEdit) Object.assign(list[i], { canArrive: false, canNoShow: false, canUndo: false, canCancel: false });
  const live = list.filter(b => b.status!=='cancelled');
  RV.day.counts = { tables: live.length, people: live.reduce((n,b) => n+b.party, 0),
    arrived: list.filter(b => b.status==='seated' || b.status==='done').length,
    noShows: list.filter(b => b.status==='no_show').length, cancelled: list.length - live.length };
  const d = RV.days.find(x => x.date===RV.day.date);
  if(d) Object.assign(d, { tables: RV.day.counts.tables, people: RV.day.counts.people, arrived: RV.day.counts.arrived });
  RV.centerId = nb.id;
  rvPaintDays(); rvPaintTop(); rvPaintEvening();
}

// A QR scanned while this page is already open in the browser.
window.addEventListener('hashchange', async function(){
  if(!rvScanToken()) return;
  if(!currentSession){ boot(); return; }     // logged out: "Log in to open this table"
  if(!ACCESS || !RESTAURANT) return;
  if(await rvTakeScan() === 'out') return;
  mountPage();
});

window.addEventListener('resize', function(){
  if(TAB!=='reservations' || RV.view!=='day') return;
  rvFit(); rvMeasure(); rvPaint(); rvRefitStrip();
});

// ── A TABLE'S QR CODE, SCANNED AT THE DOOR ──
//
// The guest's QR is a link to manager.html#arrive=<token>. The waiter's phone
// camera opens it; this page asks the server which table it is (staff_scan),
// opens that day with the table in the middle, and shows one blue banner with
// Arrived. The whole crew may press it — the token is the proof the guest is
// there — and the server checks that again (staff_mark with the token).
function rvScanToken(){
  const m = /^#arrive=([0-9a-fA-F]{32})$/.exec(window.location.hash || '');
  return m ? m[1].toLowerCase() : null;
}

// boot() calls this once it knows the account, before drawing the page.
let rvScanSeq = 0;
async function rvTakeScan(){
  const token = rvScanToken();
  if(!token) return false;
  TAB = 'reservations';
  const mine = ++rvScanSeq;
  let data = null, failed = null;
  try{ data = await rvApi({action:'staff_scan', token: token}); }catch(e){ failed = e; }
  // Two QRs scanned one after the other: only the last one's answer counts.
  if(mine !== rvScanSeq) return 'out';
  // The session ended while asking: rvApi has logged out and the login card
  // is up. The QR stays in the address, so logging in opens the table (review, 1 Oct).
  if(failed && failed.status === 401) return 'out';
  // Otherwise the token leaves the address bar now: a refresh, the history or
  // a shared screenshot of the browser should not carry it.
  if(history.replaceState) history.replaceState(null, '', window.location.pathname + window.location.search + '#reservations');
  try{
    if(failed) throw failed;
    const there = ACCESS.restaurants.find(r => Number(r.id) === Number(data.restaurantId));
    if(there && Number(there.id) !== Number(RESTAURANT.id)){
      // A platform admin, or someone at two restaurants: open the table's own.
      RESTAURANT = there;
      openDishId = null; PEOPLE = null; DISHES_ROWS = []; DISHES_LOADED = false; DISHES_ERROR = null;
    }
    rvReset();
    RV.scan = { token: token, booking: data.booking, date: data.date };
    RV.date = data.date;
  }catch(e){
    rvReset();
    RV.scan = { error: e.status === 404 || e.status === 400 ? e.message : 'Could not open this table: ' + e.message };
  }
  return true;
}

function rvScanHtml(){
  const sc = RV.scan;
  if(!sc) return '';
  const x = '<button type="button" class="rv-scan-x" aria-label="Close" onclick="rvScanClose()">&times;</button>';
  if(sc.error) return '<div class="rv-scan bad"><span><b>QR code:</b> '+esc(sc.error)+'</span>'+x+'</div>';
  const live = RV.day && RV.day.bookings.find(b => b.id === sc.booking.id);
  const b = Object.assign({}, sc.booking, live ? { status: live.status, seatedLabel: live.seatedLabel } : {});
  const who = '<b>'+whoHtml(b.name, b.handle)+'</b> · '+rvPeople(b.party);
  const when = (sc.date === RV.today ? 'Today' : esc(rvShort(sc.date))) + ' · ' + esc(b.label) + (b.areaName ? ' · '+esc(b.areaName) : '');
  // r32: the visit's Lucky Bite number; a winner gets the prize in this visit
  // (given by scanning "Show my reward" in the guest's My Visits).
  const lk = sc.visit && sc.visit.recorded && sc.visit.lucky;
  const lucky = lk && lk.won ? '<br><b class="rv-scan-lucky">🎉 Lucky Bite #'+Number(lk.won.luckyNumber).toLocaleString('en-US')+': '+esc(lk.won.title)+'</b>'
                 + ' — give it now: scan “Show my reward” in their My Visits.'
              : lk && lk.number ? ' · Lucky Bite #'+Number(lk.number).toLocaleString('en-US') : '';
  if(sc.done) return '<div class="rv-scan done"><span><b>Arrived ✓</b> '+who+'<br>'+when
    + (sc.visit && sc.visit.recorded ? ' · visit counted' : '')+lucky+'</span>'+x+'</div>';
  if(b.status === 'seated' || b.status === 'done')
    return '<div class="rv-scan warn"><span>'+who+'<br><b>Already arrived'+(b.seatedLabel ? ' at '+esc(b.seatedLabel) : '')+'.</b> This QR code has been used.</span>'+x+'</div>';
  if(b.status === 'cancelled')
    return '<div class="rv-scan bad"><span>'+who+'<br><b>This table was cancelled.</b> '+when+'</span>'+x+'</div>';
  if(sc.booking.canArrive && (b.status === 'booked' || b.status === 'no_show'))
    return '<div class="rv-scan"><span><b>Scanned:</b> '+who+'<br>'+when+'</span>'
      + '<button type="button" class="rv-scan-go" onclick="rvScanArrive(this)">Arrived</button>'+x+'</div>';
  const future = Date.parse(b.at) > rvNowMs();
  return '<div class="rv-scan warn"><span>'+who+'<br><b>'+(future ? 'Not yet:' : 'Too long ago:')+'</b> this table is for '
    + esc(rvShort(sc.date))+' at '+esc(b.label)+'.</span>'+x+'</div>';
}

async function rvScanArrive(btn){
  const sc = RV.scan;
  if(!sc || !sc.booking || RV.busy) return;
  btn.disabled = true; btn.textContent = '…';
  RV.busy = true;
  const gen = RV.gen;
  try{
    const data = await rvApi({action:'staff_mark', id: sc.booking.id, to: 'seated', token: sc.token});
    if(gen !== RV.gen) return;
    sc.done = true; sc.booking = Object.assign({}, sc.booking, data.booking, { canArrive: false });
    sc.visit = data.visit || null;      // r31: the scan was also a visit (a stamp, an invite)
    if(RV.day && RV.day.bookings.some(b => b.id === data.booking.id)){
      rvApply(data.booking);
      rvLoadDay(RV.date, {quiet:true});        // the guest's conversation closed: its chat sign follows
    } else rvPaintTop();
  }catch(e){
    if(gen !== RV.gen) return;
    if(e.data && e.data.booking){
      sc.booking = Object.assign({}, sc.booking, e.data.booking, { canArrive: false });
      if(RV.day && RV.day.bookings.some(b => b.id === e.data.booking.id)) rvApply(e.data.booking);
    }
    showToast(e.message);
    rvPaintTop();
  }finally{
    RV.busy = false;
  }
}

      + '</div>'

    + '<div class="rv-rq-when">'+esc(rvShort(r.date))+' · '+(r.time ? esc(rvHm(r.time)) : 'no time given')+'</div>'
    + (r.occasion ? '<div class="rv-meta">Occasion: '+esc(r.occasion)+'</div>' : '')

    + '<div class="rv-contact"><span>Call '+rvTel(r.phone)+'</span>'+rvWrite(r)+rqSign(r)+'</div>'
    // Crew: whether there is an email, never which one. r42: owners, managers and Sebastian see it (r.email).
    + '<div class="rv-meta rv-mail">'+(r.email ? 'Email: '+rvMail(r.email)+'. If you accept, the confirmation goes there.'
        : r.hasEmail ? 'Email given. If you accept, the confirmation goes there.' : 'No email on this request. If you accept, call them to confirm.')+'</div>'

async function rvAccept(id, btn){
  const r = RV.day.requests.find(x => x.id===id);
  if(!r) return;
  const date = document.getElementById('rq-date-'+id).value;
  const time = document.getElementById('rq-time-'+id).value;
  const areaId = Number(document.getElementById('rq-room-'+id).value);
  btn.disabled = true; btn.textContent = 'Booking…';
  const gen = RV.gen;
  try{
    const data = await rvApi({action:'staff_answer', requestId:id, decision:'accept', date: date, time: time, areaId: areaId});
    if(gen !== RV.gen) return;
    RV.sheetResult[id] = '<div class="rv-rq"><div class="rv-name">'+whoHtml(r.name, r.handle)+' <span class="rv-chip in">Booked</span></div>'
      + '<div class="rv-rq-when">'+esc(rvShort(data.date))+' · '+esc(data.label)+' · '+esc(data.code)+'</div>'
      // r29 (Sebastian, 12 Oct): the line "We emailed … the confirmation." is gone. Only when no email went out is the manager told, because then somebody must call.

async function rvDecline(id, btn){

//
// Every save redraws the settings. A field someone has typed into but not
// saved (a rule, a room, the holiday form) keeps what they typed across that

document.addEventListener('input', rvMarkTyped, true);
document.addEventListener('change', rvMarkTyped, true);
// What was typed is kept in RV, not read back from the screen, so it also
// survives the whole page being redrawn when the phone is picked up again.
function rvMarkTyped(e){
  const t = e.target;
  if(t && t.id && /^rv-(r|a|h|l|s)-/.test(t.id) && t.closest && t.closest('#rv-root')) RV.typed[t.id] = t.type==='checkbox' ? t.checked : t.value;
}
// RV.forget: names ending in "-" are a whole section (rv-r-, rv-h-); any other
// name is one exact field (rv-a-seats-5 is not rv-a-seats-52).
function rvKeptInputs(){
  const gone = id => RV.forget.some(p => p.endsWith('-') ? id.startsWith(p) : id === p);
  Object.keys(RV.typed).forEach(id => { if(gone(id)) delete RV.typed[id]; });
  RV.forget = [];
  return RV.typed;
}
function rvPutBack(kept){
  Object.keys(kept).forEach(id => {
    const el = document.getElementById(id);
    if(!el || el.disabled) return;
    if(el.type==='checkbox') el.checked = kept[id]; else el.value = kept[id];
  });
  const allDay = document.getElementById('rv-h-allday'), hours = document.getElementById('rv-h-hours');
  if(allDay && hours) hours.hidden = allDay.checked;
}

async function rvLoadSettings(keepDraft){

  if(!keepDraft || !DV.loaded) dvLoad();              // r43: your devices and this device's notifications

// ── r43: YOU AND YOUR DEVICES (Sebastian, 26 Oct) ──
// At the top of Settings, for everyone on the team (crew too):
//   · notifications on this device — the kinds he chose: guest messages,
//     big-party requests, new online bookings, cancellations, and the changes
//     the team makes (each one only to those whose role sees it; api/_lib/push.js). The notifications themselves
//     are shown by /sw.js, even with the app closed.
//   · the phones and computers trusted on this account (a code by text message,
//     then 60 days), each with Remove: removed is logged out at once.
// (Sebastian, 26 Oct 22:56: the code only for a new device; the changes the team
// makes come as notifications instead: "Changes by the team".)
const DV_KINDS = [
  ['messages', 'Guest messages', 'A guest writes about a table or a big party'],
  ['requests', 'Big-party requests', 'A guest asks for a big table'],
  ['bookings', 'New online bookings', 'A table booked on the website'],
  ['cancellations', 'Cancellations', 'A guest cancels a table'],
  ['changes', 'Changes by the team', 'Who changed the menu, prices, hours, team or settings, and when'],
];
const DV = { loaded:false, loading:false, error:null, devices:null, trustDays:30, off:false,
             push:{ ready:false, key:null, allowed:[], on:false, kinds:[], busy:false } };

async function myAccess(body){
  const {res, data} = await callApi('/api/my-access', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
    body:JSON.stringify(body)
  });
  if(!res.ok){ const e = new Error(data.error||'Something went wrong. Please try again.'); e.status = res.status; e.data = data; throw e; }
  return data;
}

function dvIos(){ const ua = navigator.userAgent || ''; return /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); }
function dvApp(){ return typeof hfIsApp === 'function' && hfIsApp(); }
function dvWhat(){ return dvApp() ? 'app' : (/Mobi|Android|iPhone/.test(navigator.userAgent || '') ? 'phone' : 'computer'); }
// 'ok', 'ios-browser' (an iPhone in Safari: notifications come to the Home Screen app only), or 'no'.
function dvSupport(){
  if(dvIos() && !dvApp()) return 'ios-browser';
  if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return 'no';
  return 'ok';
}
function dvPerm(){ try{ return 'Notification' in window ? Notification.permission : 'default'; }catch(e){ return 'default'; } }
function dvB64(s){
  const t = String(s||'').replace(/-/g,'+').replace(/_/g,'/'), b = atob(t + '='.repeat((4 - t.length % 4) % 4));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
function dvSameKey(sub, key){
  const k = sub && sub.options && sub.options.applicationServerKey;
  if(!k) return true;
  const a = new Uint8Array(k);
  return a.length === key.length && a.every((x, i) => x === key[i]);
}
async function dvSub(){
  if(dvSupport() !== 'ok') return null;
  try{ const reg = await navigator.serviceWorker.getRegistration('/'); return reg ? await reg.pushManager.getSubscription() : null; }
  catch(e){ return null; }
}
// This browser remembers whose notifications it carries, and which kinds, so a
// subscription the browser replaced (or a new log-in after the 60 days) is saved again.
function dvKept(){ try{ const k = JSON.parse(localStorage.getItem('hf_push')||'null'); return k && Array.isArray(k.kinds) ? k : null; }catch(e){ return null; } }
function dvKeep(kinds){ try{ localStorage.setItem('hf_push', JSON.stringify({ who: ACCESS && ACCESS.tasterId, kinds: kinds })); }catch(e){} }
function dvForget(){ try{ localStorage.removeItem('hf_push'); }catch(e){} }

async function dvLoad(){
  if(DV.loading || !currentSession) return;
  DV.loading = true;
  try{
    const both = await Promise.all([ myAccess({action:'devices'}), myAccess({action:'push_key'}) ]);
    DV.devices = both[0].devices; DV.trustDays = both[0].trustDays || 30;
    DV.push.ready = !!both[1].ready; DV.push.key = both[1].key; DV.push.allowed = both[1].kinds || [];
    DV.error = null; DV.off = false;
    const sub = DV.push.ready ? await dvSub() : null;
    if(sub){
      const st = await myAccess({action:'push_state', subscription: sub.toJSON()});
      DV.push.on = !!st.on; DV.push.kinds = st.kinds || [];
    }else{ DV.push.on = false; DV.push.kinds = []; }
  }catch(e){
    if(e.status === 503 && !(e.data && e.data.reason === 'updating')) DV.off = true;     // migration 30 not run yet
    else DV.error = e.message;                                                         // (or the update still going up)
  }
  DV.loaded = true; DV.loading = false;
  dvPaint();
}
function dvPaint(){ const el = document.getElementById('dv-card'); if(el){ el.outerHTML = dvCardHtml(); rvFoldCards(document.getElementById('rv-root')); } }

function dvCardHtml(){
  const head = '<div class="m-card" id="dv-card"><div class="m-eyebrow">You and your devices</div>';

  if(!DV.loaded) return head + '<div class="m-sub">Loading…</div></div>';
  if(DV.error && !DV.devices) return head + '<div class="m-err" style="margin:0 0 .6rem;">'+esc(DV.error)+'</div>'
    + '<button type="button" class="m-revert" onclick="DV.loaded=false;DV.error=null;dvPaint();dvLoad()">Try again</button></div>';
  return head + dvPushHtml() + dvListHtml() + '</div>';
}

  const P = DV.push, sup = dvSupport(), perm = dvPerm();

  if(!P.ready) return title + '<div class="m-sub">Notifications are not set up yet: Seb’s Analytics adds two keys in Vercel.</div>';
  if(perm === 'denied') return title + '<div class="m-sub dv-warn">Notifications are blocked here. '

    + ' Then come back to this page.</div>';
  if(!P.on) return title

  const rows = DV_KINDS.filter(k => P.allowed.includes(k[0])).map(function(k){

  return title + '<div class="m-sub dv-onnote">On for this '+dvWhat()+'. Choose what comes:</div>' + rows

    + '<button type="button" class="m-revert" id="dv-off" onclick="dvPushOff(this)"'+(P.busy?' disabled':'')+'>Turn off here</button></div>';

// ── r43: A TAPPED NOTIFICATION ──
// /manager#chat=12&at=1 (a table's conversation), #reqchat=5&at=1 (a big party's),
// #day=2026-10-27&b=40&at=1 (the day, that table in the middle) — #request= is r42's.

// at= is the restaurant, for someone at more than one.
let NF_DAY = null, NF_DISH = null, NF_SETTINGS = false, NF_MAP = false;
function nfParse(){
  const m = /^#(chat|reqchat|day|dish|go)=(\d+|\d{4}-\d{2}-\d{2}|team|menu|settings|map|reviews)((?:&(?:b|at|talk)=\d+)*)$/.exec(window.location.hash || '');
  if(!m) return null;
  const out = { kind:m[1], value:m[2], at:null, b:null };
  m[3].split('&').filter(Boolean).forEach(function(p){ const kv = p.split('='); out[kv[0]] = Number(kv[1]); });
  const ok = m[1] === 'day' ? /^\d{4}-\d{2}-\d{2}$/.test(m[2]) : m[1] === 'go' ? /^(team|menu|settings|map|reviews)$/.test(m[2]) : /^\d+$/.test(m[2]);
  if(!ok || (out.b && m[1] !== 'day') || (out.talk && m[2] !== 'reviews')) return null;
  return out;
}
// Where a change notification goes: the tab (Team, Menu), Settings, or one dish open on the Menu.
function nfPlace(n){
  if(n.kind === 'dish'){ NF_DISH = Number(n.value); n = { kind:'go', value:'menu' }; }
  if(n.value === 'settings'){ TAB = 'reservations'; NF_SETTINGS = true; return; }      // rvStart opens Settings
  if(n.value === 'map'){ TAB = 'reservations'; NF_MAP = true; return; }                // r48: rvStart opens the Map
  if(n.value === 'reviews' && n.talk) RVT_AT = Number(n.talk);                          // r53c: the author wrote about a hidden review
  TAB = allowedTabs().includes(n.value) ? n.value : 'reservations';

function nfFromHash(){
  const n = nfParse();
  if(!n || !ACCESS || !RESTAURANT) return false;
  if(history.replaceState) history.replaceState(null, '', window.location.pathname + window.location.search + '#reservations');
  nfAt(n.at);

// ── THE TABLE MAP (r46) ──
//
// Sebastian, 29 Oct (16:55 → 23:10, "I love it! Let's do it!"): under the day's
// tiles, the old "QR code won't scan?" row is now three buttons — Type (the
// guest's code), Map, Camera. Map opens the rooms as they are drawn, with every
// table: free (white), a booking later (its time), within the hour (soft
// blue), within 30 minutes (stronger blue), busy (dark blue with a clock),
// late (red dashed). Tap = the usual thing (busy / free / who is sitting);
// touch and hold = everything else (Reserved, their party is here, join,
// separate, a walk-in anyway). Each room is drawn once (managers): a rectangle
// of squares, Remove / Restore / Bar / Door / Object (with its name), then the
// tables dragged into place.
//
// The server (api/_lib/floor.js) decides who may do what and where each
// booking sits, so every phone shows the same map; this page asks again every
// few seconds while the map is open.

const MP = { data: null, room: null, error: null, seq: 0, gen: 0, busy: false, fetchedAt: 0, offset: 0,
             sheet: null, toast: null, toastTimer: null, placing: null, joining: null,

const MP_ICON = {

  camera: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',

  link: '<svg class="mp-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
};

function mpReset(){
  mpStop();

// Every second: the clocks. Every 10 seconds: the map again (unless a finger or a sheet is busy with it).
function mpStart(){
  if(MP.timer) return;
  MP.ticks = 0;
  MP.timer = setInterval(function(){
    if(TAB!=='reservations' || RV.view!=='map'){ mpStop(); return; }
    if(document.visibilityState!=='visible') return;
    MP.ticks += 1;
    mpTick();
    if(MP.ticks % 10 === 0 && !MP.busy && !MP.sheet && !MP.placing && !MP.joining) mpLoad(true);
    if(MP.ticks % 30 === 0 && !MP.sheet && !MP.lpTimer){ mpPaintFloor(); tlPaint(); }   // r49: every 30 s the colours and the timeline follow the clock
                                                       // (r46 had "else if" here: 30 is a multiple of 10, so it never ran)
  }, 1000);
}
function mpStop(){ if(MP.timer){ clearInterval(MP.timer); MP.timer = null; } }

async function mpLoad(quiet){
  const seq = ++MP.seq, gen = MP.gen;
  try{
    const data = await rvApi({action:'map_get'});
    if(seq !== MP.seq || gen !== MP.gen) return;
    mpTake(data);
  }catch(e){
    if(seq !== MP.seq || gen !== MP.gen) return;
    if(e.status === 401) return;
    if(!quiet || !MP.data){ MP.error = e.message; MP.errorReason = e.data && e.data.reason; mpPaint(); }
  }
}

// A fresh map from the server (after a read or an action).
function mpTake(data){
  const keep = MP.data ? JSON.stringify([MP.data.rooms, MP.data.busy, MP.data.joins, MP.data.place, MP.data.waiting, MP.data.bookings]) : null;
  MP.data = data; MP.rid = RESTAURANT ? RESTAURANT.id : null; MP.error = null;
  MP.offset = Date.parse(data.now) - Date.now(); MP.fetchedAt = Date.now();
  const rooms = data.rooms || [];
  if(!MP.room || !rooms.some(r => r.id === MP.room)) MP.room = (rooms.find(r => r.drawn) || rooms[0] || {}).id || null;
  const now = JSON.stringify([data.rooms, data.busy, data.joins, data.place, data.waiting, data.bookings]);
  if(keep !== now || !document.getElementById(MP.mode === 'timeline' ? 'tl-scroll' : 'mp-floor')) mpPaint();   // r49: the timeline is not drawn again for nothing
  else mpTick();
}
function mpNow(){ return Date.now() + MP.offset; }

// ── THE PIECES OF THE MAP ──
function mpRoom(){ return MP.data && (MP.data.rooms || []).find(r => r.id === MP.room) || null; }
// One place for a party: a table, or tables joined today. Its key is its first table.
function mpUnits(room){
  const joins = (MP.data.joins || []).filter(j => j.areaId === room.id);
  const inJoin = {};
  joins.forEach(j => j.tables.forEach(n => { inJoin[n] = j; }));
  const seatsOf = {};
  room.tables.forEach(t => { seatsOf[t.n] = t.seats; });
  const out = [];
  room.tables.slice().sort((a, b) => a.n - b.n).forEach(t => {
    const j = inJoin[t.n];
    if(!j) out.push({ key: t.n, members: [t.n], seats: t.seats, joinId: null });
    else if(j.tables[0] === t.n) out.push({ key: t.n, members: j.tables.slice(), seats: j.tables.reduce((n, m) => n + (seatsOf[m] || 0), 0), joinId: j.id });
  });
  return out;
}
function mpUnitOf(n){
  const room = mpRoom();
  return room ? mpUnits(room).find(u => u.members.includes(n)) || null : null;
}
function mpName(u){ return (u.members.length > 1 ? 'Tables ' : 'Table ') + u.members.join('+'); }
function mpBookingsOn(key){
  const D = MP.data, out = [];
  (D.bookings || []).forEach(b => { if(D.place[b.id] === key && b.status === 'booked') out.push(b); });
  return out.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
}
function mpBusyOf(u){ return (MP.data.busy || []).find(s => s.tables.some(n => u.members.includes(n))) || null; }
function mpBooking(id){ return (MP.data.bookings || []).find(b => b.id === id) || null; }
function mpShort(label){ return String(label || '').replace(/\s?[AP]M$/i, ''); }
function mpSince(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + ':' + String(sec).padStart(2, '0');
}
// What a place shows now: busy (a clock), late, a booking soon, later, or free.
function mpState(u){
  const now = mpNow(), s = mpBusyOf(u);
  if(s) return { k: 'busy', label: mpSince(now - Date.parse(s.since)), session: s, next: null };
  const next = mpBookingsOn(u.key)[0] || null;
  if(next){
    const d = (Date.parse(next.at) - now) / 60000;
    const k = d < 0 ? 'late' : d <= 30 ? 'half' : d <= 60 ? 'hour' : 'later';
    return { k, label: d < 0 ? 'Late ' + Math.floor(-d) + 'm' : mpShort(next.label), next, pinned: !!(next.pin && u.members.includes(next.pin)) };
  }
  return { k: 'free', label: u.seats + ' seats', next: null };
}
const MP_WORD = { free: 'free', later: 'a booking later', hour: 'a booking within the hour', half: 'a booking within 30 minutes', busy: 'busy', late: 'late' };

function mpCell(room){
  const avail = Math.max(240, (document.getElementById('rv-root') || {}).clientWidth || 340);
  return Math.max(12, Math.min(34, Math.floor(avail / room.cols)));
}
// r47: a long table can be turned (standing along the room): its squares swap.
function mpFoot(seats, turned){ const long = seats <= 4 ? 2 : Math.min(10, Math.ceil(seats / 2)); return turned ? { w: 2, h: long } : { w: long, h: 2 }; }

// The drawing's squares that are not floor: one block per square, and a name in the middle of each group.
function mpBlocksHtml(room, C){
  const cells = room.cells || {}, out = [];
  Object.keys(cells).forEach(k => {
    const [x, y] = k.split(',').map(Number), v = cells[k];
    const cls = v === 'gone' ? 'gone' : v === 'Bar' ? 'bar' : v === 'Door' ? 'door' : 'obj';
    out.push('<div class="mp-blk '+cls+'" style="left:'+(x*C)+'px;top:'+(y*C)+'px;width:'+C+'px;height:'+C+'px"></div>');
  });
  mpGroups(room.cols, room.rows, cells).forEach(g => {
    out.push('<div class="mp-blk-name'+(g.tall?' tall':'')+'" style="left:'+(g.x*C)+'px;top:'+(g.y*C)+'px;width:'+(g.w*C)+'px;height:'+(g.h*C)+'px">'+esc(g.text)+'</div>');
  });
  return out.join('');
}
// Groups of touching squares with the same thing (a bar, a door, one object): where its name goes.
function mpGroups(cols, rows, cells){
  const seen = {}, out = [];
  const val = (x, y) => cells[x+','+y] || '';
  for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
    const v = val(x, y);
    if(!v || v === 'gone' || seen[x+','+y]) continue;
    let x0 = x, x1 = x, y0 = y, y1 = y; const stack = [[x, y]]; seen[x+','+y] = true;
    while(stack.length){
      const [cx, cy] = stack.pop();
      x0 = Math.min(x0, cx); x1 = Math.max(x1, cx); y0 = Math.min(y0, cy); y1 = Math.max(y1, cy);
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => {
        const nx = cx+dx, ny = cy+dy, k = nx+','+ny;
        if(nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[k] && val(nx, ny) === v){ seen[k] = true; stack.push([nx, ny]); }
      });
    }
    const w = x1-x0+1, h = y1-y0+1;
    if(w < 2 && h < 3) continue;
    out.push({ x: x0, y: y0, w, h, tall: w < 2, text: (v.indexOf('Object:') === 0 ? v.slice(7) : v).toUpperCase() });
  }
  return out;
}

function mpPaintFloor(){
  const floor = document.getElementById('mp-floor');
  const room = mpRoom();
  if(!floor || !room || !room.drawn) return;
  const C = mpCell(room);
  floor.style.width = (room.cols*C)+'px'; floor.style.height = (room.rows*C)+'px';
  floor.style.backgroundSize = C+'px '+C+'px';
  const units = mpUnits(room), byNumber = {};
  room.tables.forEach(t => { byNumber[t.n] = t; });
  const count = { free: 0, busy: 0, res: 0, late: 0 };
  let html = mpBlocksHtml(room, C);
  const tablesHtml = [];
  units.forEach(u => {
    const st = mpState(u);
    if(st.k === 'busy') count.busy += 1; else if(st.k === 'free') count.free += 1; else if(st.k === 'late') count.late += 1; else count.res += 1;
    const joined = u.members.length > 1;
    // the band between joined tables, in their colour
    for(let i = 0; i + 1 < u.members.length; i++){
      const a = byNumber[u.members[i]], b = byNumber[u.members[i+1]];
      if(!a || !b) continue;
      const fa = mpFoot(a.seats, a.turned), fb = mpFoot(b.seats, b.turned);
      const ax = (a.x + fa.w/2)*C, ay = (a.y + fa.h/2)*C, bx = (b.x + fb.w/2)*C, by = (b.y + fb.h/2)*C;
      const len = Math.hypot(bx-ax, by-ay), deg = Math.atan2(by-ay, bx-ax)*180/Math.PI;
      html += '<div class="mp-band '+st.k+'" style="left:'+ax+'px;top:'+(ay-Math.max(5, C*0.27))+'px;width:'+len+'px;height:'+Math.max(10, C*0.54)+'px;transform:rotate('+deg+'deg)"></div>';
    }
    u.members.forEach(n => {
      const t = byNumber[n]; if(!t) return;
      const f = mpFoot(t.seats, t.turned);
      const ring = MP.joining !== null ? (u.members.includes(MP.joining) ? ' joining' : ' pick') : MP.placing ? ' pick' : '';
      const aria = (joined ? 'Tables '+u.members.join('+')+', joined' : 'Table '+n)+', '+u.seats+' seats, '+MP_WORD[st.k]
        + (st.next ? ', '+st.next.name+' at '+st.next.label : '') + (st.pinned ? ', Reserved' : '') + '. Touch and hold for more.';
      tablesHtml.push('<button type="button" class="mp-t '+st.k+(t.shape==='round'?' round':'')+ring+'" data-key="'+u.key+'" data-n="'+n+'"'
        + (st.session ? ' data-since="'+esc(st.session.since)+'"' : '') + (st.k==='late' && st.next ? ' data-late="'+esc(st.next.at)+'"' : '')
        + ' style="left:'+(t.x*C+3)+'px;top:'+(t.y*C+3)+'px;width:'+(f.w*C-6)+'px;height:'+(f.h*C-6)+'px;--c:'+C+'px"'
        + ' aria-label="'+esc(aria)+'" onclick="mpTap('+u.key+')" onpointerdown="mpDown(event,'+u.key+')" onpointerup="mpUp()" onpointerleave="mpUp()" onpointercancel="mpUp()"'
        + ' oncontextmenu="mpCtx(event,'+u.key+')">'
        + '<span class="mp-n">'+n+(st.pinned ? MP_ICON.pin : '')+(joined ? MP_ICON.link : '')+'</span>'
        + (st.pinned ? '<span class="mp-res">RESERVED</span>' : '')
        + (st.k === 'late' ? '<span class="mp-l">Late</span><span class="mp-l mp-late">'+esc(st.label.replace(/^Late /, ''))+'</span>'
                           : '<span class="mp-l">'+esc(st.label)+'</span>') + '</button>');
    });
  });
  floor.innerHTML = html + tablesHtml.join('');
  const sum = document.getElementById('mp-sum');
  if(sum) sum.textContent = count.free+' free · '+count.busy+' busy · '+count.res+' reserved'+(count.late ? ' · '+count.late+' late' : '');
  mpPaintTray();
  mpPaintCap();                                         // r48: the seats in use now
}
function mpClock(){ return new Intl.DateTimeFormat('en-US', { timeZone: (MP.data && MP.data.timezone) || 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(new Date(mpNow())); }
// The clocks on busy tables, the minutes on late ones, the time at the top.
function mpTick(){
  const c = document.getElementById('mp-clock');
