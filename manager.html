    + '<div class="mg-scroll">'+msgRowsHtml(d)+'</div>'
    + '<p class="mg-foot">Closed conversations stay here for 90 days after the table, then they are deleted.</p>';
}
function msgRowsHtml(d){
  const list = (d.threads || []).filter(t => MSG.tab === 'open' ? t.open : !t.open);
  return !d.threads ? '<div class="m-skel"></div><div class="m-skel"></div>'
    : list.length ? list.map(msgRow).join('')
    : '<div class="mg-empty">'+(MSG.tab === 'open' ? 'No open conversations' : 'No closed conversations')+' for '+esc(rvLong(d.date))+'.'
      + (MSG.tab === 'open' && d.openCount ? '<br>Days with something new have a red dot.' : '')
      + msgWhereHtml(d)+'</div>';
}
// r23: "Open 4" but nothing on this day: the days that have the open conversations, one tap each.
function msgWhereHtml(d){
  if(MSG.tab !== 'open') return '';
  const days = (d.days || []).filter(x => x.open > 0 && x.date !== d.date);
  if(!days.length) return '';
  return '<div class="mg-where"><span>Open conversations are on:</span>'
    + days.slice(0, 10).map(x => '<button type="button" class="mg-jump" onclick="msgPick(\''+esc(x.date)+'\')">'
        + esc(rvShort(x.date))+' · '+Number(x.open)+'</button>').join('')
    + (days.length > 10 ? '<span>…and '+(days.length - 10)+' more days</span>' : '')+'</div>';
}
// The tabs' words and numbers, changed where they are (a keyboard on a tab keeps it).
function msgTabsPatch(box, d){
  const tabs = box.querySelectorAll('.mg-tab');
  if(tabs.length !== 2) return;
  [['open', 'Open', d.openCount, ''], ['closed', 'Closed', d.closedUnread, ' title="Closed, with a message not read yet"']].forEach((t, k) => {
    const on = MSG.tab === t[0];
    tabs[k].classList.toggle('on', on);
    tabs[k].setAttribute('aria-selected', String(on));
    tabs[k].innerHTML = t[1] + (t[2] ? ' <b class="mg-n"'+t[3]+'>'+t[2]+'</b>' : '');
  });
}

// ── THE MESSAGES' DAY STRIP (r22) ──
// Like the evening's: the day in the middle is the day — a swipe, the arrows
// or a tap. It holds every day a conversation can be on, from 91 days ago
// (they are kept 90 days after the table) to two months ahead (further if a
// table is), and is built once when the list opens. After that only its
// numbers and dots change, so a new message never moves it under a finger.
const MG_SLOT = 56;            // one day: 50px wide + 6px gap
function msgStripDates(d){
  let from = rvAddDays(d.today, -91), to = rvAddDays(d.today, 61);
  (d.days || []).forEach(x => { if(x.date > to) to = x.date; if(x.date < from) from = x.date; });
  if(d.date < from) from = d.date;
  if(d.date > to) to = d.date;
  const out = [];
  for(let date = from; date <= to && out.length < 800; date = rvAddDays(date, 1)) out.push(date);
  return out;
}
function msgStripHtml(d){
  MSG.stripDates = msgStripDates(d); MSG.stripToday = d.today; MSG.stripAim = null;
  return '<div class="mg-strip"><div class="mg-pad"></div>'
    + MSG.stripDates.map(date => '<button type="button" class="mg-day'+(date===d.today ? ' today' : '')+'" data-date="'+date+'" aria-label="'+esc(rvLong(date))+'">'
        + '<span class="mg-wd">'+(date===d.today ? 'Today' : rvFmt(date, {weekday:'short'}))+'</span><b>'+Number(date.slice(8))+'</b><i>&nbsp;</i></button>').join('')
    + '<div class="mg-pad"></div></div>';
}
// The counts under the days (open or closed, as the tab) and the red dots.
function msgFillStrip(strip){
  const d = MSG.data;
  if(!strip || !d) return;
  const info = {};
  (d.days || []).forEach(x => { info[x.date] = x; });
  strip.querySelectorAll('.mg-day').forEach(cell => {
    const date = cell.dataset.date, x = info[date];
    const n = x ? (MSG.tab === 'open' ? x.open : x.closed) : 0;
    const line = n ? n+(n===1?' chat':' chats') : '\u00a0';
    const i = cell.querySelector('i');
    if(i.textContent !== line) i.textContent = line;
    let dot = cell.querySelector('.dot');
    const red = !!(x && x.unread);
    if(red && !dot){ dot = document.createElement('span'); dot.className = 'dot'; cell.insertBefore(dot, cell.firstChild); }
    if(dot && !red) dot.remove();
    cell.setAttribute('aria-label', rvLong(date) + (red ? ', new messages' : ''));
  });
  msgPaintStrip(strip);
}
// Dark in the middle: the day shown, or the one a finger is bringing there.
function msgPaintStrip(strip){
  if(!strip || !MSG.stripDates || !strip.clientWidth) return;
  const k = Math.max(0, Math.min(MSG.stripDates.length - 1, Math.round(strip.scrollLeft / MG_SLOT)));
  strip.querySelectorAll('.mg-day').forEach((cell, i) => {
    const on = i === k;
    if(cell.classList.contains('on') !== on) cell.classList.toggle('on', on);
    if(on) cell.setAttribute('aria-current', 'date'); else cell.removeAttribute('aria-current');
    if(cell.tabIndex !== (on ? 0 : -1)) cell.tabIndex = on ? 0 : -1;
  });
}
function msgStripBusy(strip){
  return !!(MSG.stripTouch || (strip && strip._anim) || Date.now() - (MSG.stripMoved || 0) < 400);
}
function msgStripPlace(strip){
  const k = MSG.stripDates.indexOf(MSG.date);
  if(k >= 0) strip.scrollLeft = k * MG_SLOT;
  msgPaintStrip(strip);
}
function msgStripMake(strip){
  if(MSG.stripWatch) MSG.stripWatch.disconnect();
  MSG.stripTouch = false; MSG.stripAim = null;
  stripFit(strip, '.mg-pad');
  strip._w = strip.clientWidth;
  msgStripPlace(strip);
  msgFillStrip(strip);
  let timer = null, raf = 0;
  const later = function(){ clearTimeout(timer); timer = setTimeout(function(){ msgStripSettled(strip); }, 160); };
  strip.addEventListener('scroll', function(){
    MSG.stripMoved = Date.now();
    if(!raf) raf = requestAnimationFrame(function(){ raf = 0; msgPaintStrip(strip); });
    later();
  }, {passive:true});
  strip.addEventListener('touchstart', function(){ MSG.stripTouch = true; MSG.stripAim = null; stripStop(strip); clearTimeout(timer); }, {passive:true});
  const up = function(e){
    if(e && e.touches && e.touches.length) return;
    MSG.stripTouch = false; later();
    // An iPhone may glide on and stop without a word: look at the middle again.
    [600, 1200, 2200].forEach(function(ms){ setTimeout(function(){ msgStripSettled(strip); }, ms); });
  };
  strip.addEventListener('touchend', up, {passive:true});
  strip.addEventListener('touchcancel', up, {passive:true});
  strip.addEventListener('wheel', function(e){ if(Math.abs(e.deltaX) > Math.abs(e.deltaY)){ MSG.stripAim = null; stripStop(strip); } }, {passive:true});
  // Only the day shown takes Tab; ‹ › keys move a day.
  strip.addEventListener('keydown', function(e){
    if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    msgStep(e.key === 'ArrowLeft' ? -1 : 1);
    const cell = MSG.stripAim !== null ? strip.querySelectorAll('.mg-day')[MSG.stripAim] : null;
    if(cell) cell.focus({preventScroll:true});
  });
  strip.addEventListener('click', function(e){
    const cell = e.target.closest('.mg-day');
    if(!cell) return;
    const k = MSG.stripDates.indexOf(cell.dataset.date);
    if(k < 0) return;
    if(Math.round(strip.scrollLeft / MG_SLOT) === k && !strip._anim){ msgPick(cell.dataset.date); return; }
    MSG.stripAim = k; stripGlide(strip, k * MG_SLOT, true);
  });
  // The phone turned, or the window changed width: padded again, back on the day.
  if(window.ResizeObserver){
    MSG.stripWatch = new ResizeObserver(function(){
      if(!strip.isConnected || MSG.stripTouch || !strip.clientWidth || strip.clientWidth === strip._w) return;
      stripStop(strip); stripFit(strip, '.mg-pad'); strip._w = strip.clientWidth;
      MSG.stripAim = null; msgStripPlace(strip);
    });
    MSG.stripWatch.observe(strip);
  }
}
// The strip stopped (the finger let go, or the glide ended): the day in the middle is the day.
function msgStripSettled(strip){
  if(!strip.isConnected || MSG.stripTouch || strip._anim || !MSG.stripDates) return;
  MSG.stripAim = null;
  const k = Math.max(0, Math.min(MSG.stripDates.length - 1, Math.round(strip.scrollLeft / MG_SLOT)));
  const date = MSG.stripDates[k];
  if(date && date !== MSG.date) msgPick(date, true);
}
// The list already on screen: the tabs, the day's line, the rows and the
// strip's numbers change where they are, and the strip is not moved while a
// finger (or its glide) is on it. False when it has to be built again.
function msgPatchList(host){
  const d = MSG.data, strip = host.querySelector('.mg-strip'), sc = host.querySelector('.mg-scroll');
  const tabs = host.querySelector('.mg-tabs'), line = host.querySelector('.mg-dateline');
  if(!d || !strip || !sc || !tabs || !line || !MSG.stripDates || MSG.stripToday !== d.today) return false;
  const first = MSG.stripDates[0], last = MSG.stripDates[MSG.stripDates.length - 1];
  if(d.date < first || d.date > last || (d.days || []).some(x => x.date < first || x.date > last)) return false;
  const same = host.dataset.date === String(d.date);
  const keepTop = same ? sc.scrollTop : 0;
  msgTabsPatch(tabs, d);
  line.textContent = rvLong(d.date) + (d.date===d.today ? ' · today' : '');
  sc.innerHTML = msgRowsHtml(d);
  sc.scrollTop = keepTop;
  host.dataset.date = String(d.date);
  msgFillStrip(strip);
  const k = MSG.stripDates.indexOf(d.date);
  if(!msgStripBusy(strip) && Math.round(strip.scrollLeft / MG_SLOT) !== k){
    // The strip chose this day and moved on by itself (an iPhone gliding on
    // without a word): the day in the middle is the day. Otherwise the day was
    // chosen elsewhere (the server's day at opening): the strip goes there.
    if(MSG.stripChose === d.date) setTimeout(function(){ msgStripSettled(strip); }, 0);
    else { MSG.stripAim = null; msgStripPlace(strip); }
  }
  return true;
}

function msgRow(t){
  const last = t.preview ? '<em>'+whoHtml(t.lastWho || '', t.lastHandle)+':</em> '+esc(t.preview) : '';
  const foot = t.closed
    ? '<span class="mg-closed'+(t.closed.kind==='staff'?' staff':'')+'">Closed · '+esc(t.closed.short)+'</span>'
      + '<button type="button" class="rv-mini" onclick="msgReopen('+Number(t.id)+',this)" aria-label="Reopen the conversation with '+esc(whoText(t.name, t.handle))+'">Reopen</button>'
    : '<span>'+esc(t.lastLabel)+'</span>';
  return '<div class="mg-row'+(t.unread?' new':'')+'">'
    + '<button type="button" class="mg-row-main" onclick="msgOpenThread('+Number(t.id)+')">'
    + '<span class="mg-row-top"><b>'+whoHtml(t.name, t.handle)+'</b><span>'+esc(t.label)+' · '+rvPeople(t.party)+'</span>'
    + (t.unread ? '<span class="mg-n" aria-label="'+t.unread+' new">'+t.unread+'</span>' : '')+'</span>'
    + (last ? '<span class="mg-row-last">'+last+'</span>' : '')
    + '</button>'
    + '<div class="mg-row-foot">'+foot+'</div></div>';
}

function msgTopHtml(t){
  if(t.kind === 'request') return rqTopHtml(t);
  const b = t.booking;
  const first = String(b.name || '').trim().split(/\s+/)[0] || 'The guest';
  const sub = esc(b.day)+' · '+esc(b.label)+' · '+rvPeople(b.party)+' · '+esc(b.code)+' · '+rvTel(b.phone);
  const state = t.open
    ? '<div class="mg-bar"><span class="mg-state">Open</span><button type="button" class="rv-mini" onclick="msgCloseThread(this)">Close</button></div>'
      + (t.guestCanReopen ? '' : '<div class="mg-warn">'+whoHtml(first, b.handle)+' has used the one reopen after 24 hours. If you close it now, only the restaurant can open it again.</div>')
    : '<div class="mg-shut'+(t.closedNote && t.closedNote.kind==='staff'?' staff':'')+'">&#10003; '+esc(t.closedNote ? t.closedNote.text : 'Closed')
      + '<button type="button" class="rv-mini" onclick="msgReopenThread(this)">Reopen the conversation</button></div>';
  return '<div class="mg-sub">'+sub+'</div>' + state;
}
// The top of a request's conversation: the day asked for, the people, the phone, and where the guest reads it.
function rqTopHtml(t){
  const q = t.request;
  const first = String(q.name || '').trim().split(/\s+/)[0] || 'The guest';
  const sub = esc(q.day)+' · '+(q.time ? esc(q.time) : 'no time given')+' · '+rvPeople(q.party)+' · Request · '+rvTel(q.phone);
  const where = !t.open ? 'This request has been answered.'
    : t.guestReads === 'account' ? whoHtml(first, q.handle)+' reads this in My Reservations on the website.'
    : whoHtml(first, q.handle)+' has no account yet: we email '+(first ? 'them' : 'the guest')+' once to say you wrote, and '
      + 'they read it by logging in with '+rvTel(q.phone)+'.';
  return '<div class="mg-sub">'+sub+'</div><div class="mg-who">'+where+'</div>';
}
function msgBubblesHtml(t){
  return t.messages.map(m => '<div class="mg-bub '+(m.fromGuest?'guest':'staff')+'"><span class="mg-bub-who">'+(m.who==='You' ? 'You' : whoHtml(m.who, m.handle))+' <i>· '+esc(m.label)+'</i></span>'
    + esc(m.body)+'</div>').join('');
}
function msgThreadHtml(){
  const t = MSG.thread, back = MSG.kind === 'request' ? 'requests' : true;
  if(!t) return msgHead('Messages', back) + (MSG.threadError ? '<div class="m-err">'+esc(MSG.threadError)+'</div>' : '<div class="m-skel"></div>');
  const who = msgSubject(t), isReq = t.kind === 'request';
  return msgHead(whoHtml(who.name, who.handle), back)
    + '<div class="mg-top">'+msgTopHtml(t)+'</div>'
    + '<div class="mg-scroll"><div class="mg-msgs">'+msgBubblesHtml(t)+'</div>'
    + '<p class="mg-foot">Kept until '+esc(t.keptUntil)+' (90 days after the '+(isReq ? 'day asked for' : 'table')+'), then deleted.</p></div>'
    + '<p class="mg-live" aria-live="polite"></p>'
    + '<div class="mg-form"'+(isReq && !t.open ? ' hidden' : '')+'><textarea class="mg-input" rows="1" maxlength="1000" aria-label="Your answer" placeholder="Write your answer…"'
    + ' oninput="msgGrow(this)" onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey)){event.preventDefault();msgSend();}"></textarea>'
    + '<button type="button" class="mg-send" aria-label="Send" onclick="msgSend()">'+MSG_SEND+'</button></div>';
}
function msgGrow(input){ input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight + 2) + 'px'; }

function msgBackToList(){ MSG.view = 'list'; MSG.threadId = null; MSG.thread = null; MSG.seq += 1; msgPaint(); msgLoadList(); }
function msgTab(tab){ MSG.tab = tab; msgPaint(); }
function msgPick(date, fromStrip){
  if(!date || date === MSG.date) return;
  MSG.stripChose = fromStrip ? date : null;
  MSG.date = date;
  if(MSG.data) MSG.data = Object.assign({}, MSG.data, {date: date, threads: null});    // loading
  msgPaint(); msgLoadList();
}
function msgStep(n){
  const strip = document.querySelector('#mg-sheet-host .mg-strip');
  if(strip && MSG.stripDates){
    // From where the strip is already heading, so three quick taps are three days.
    const from = MSG.stripAim !== null && MSG.stripAim !== undefined ? MSG.stripAim : MSG.stripDates.indexOf(MSG.date);
    const k = from + n;
    if(from >= 0 && k >= 0 && k < MSG.stripDates.length){ MSG.stripAim = k; stripGlide(strip, k * MG_SLOT, true); return; }
  }
  if(MSG.date) msgPick(rvAddDays(MSG.date, n));
}

async function msgSend(){
  const host = document.getElementById('mg-sheet-host');
  const input = host && host.querySelector('.mg-input'), send = host && host.querySelector('.mg-send');
  if(!input || MSG.sending) return;
  const text = input.value.trim();
  if(!text){ input.focus(); return; }
  MSG.sending = true; send.disabled = true;
  const gen = MSG.gen, id = MSG.threadId;
  try{
    const data = await rvApi(MSG.kind === 'request' ? {action:'staff_req_send', requestId: id, body: text} : {action:'staff_msg_send', id: id, body: text});
    if(gen !== MSG.gen || id !== MSG.threadId) return;
    MSG.seq += 1;                                   // an older answer still on its way is not drawn
    MSG.thread = data;
    input.value = ''; msgGrow(input);
    MSG.sending = false;
    msgPaint(true);
  }catch(e){ showToast(e.message); }
  finally{ MSG.sending = false; const again = document.querySelector('#mg-sheet-host .mg-send'); if(again) again.disabled = false; }
}

function msgCloseThread(btn){
  // Closing answers what is on the screen: the server marks the guest's messages
  // up to the last one drawn as read, so no "new" is left on a chat nobody has to open again.
  const seen = MSG.thread && MSG.thread.messages ? MSG.thread.messages.reduce((n, m) => m.fromGuest ? Math.max(n, Number(m.id) || 0) : n, 0) : 0;
  return msgState('staff_msg_close', MSG.threadId, btn, 'Closed', seen ? { seen: seen } : null);
}
function msgReopenThread(btn){ return msgState('staff_msg_reopen', MSG.threadId, btn, 'Open again'); }
function msgReopen(id, btn){ return msgState('staff_msg_reopen', id, btn, 'Open again'); }
async function msgState(action, id, btn, done, extra){
  if(MSG.busy) return;
  MSG.busy = true; if(btn) btn.disabled = true;
  const gen = MSG.gen;
  try{
    const data = await rvApi(Object.assign({action: action, id: Number(id)}, extra || {}));
    if(gen !== MSG.gen) return;
    showToast(done+' · '+whoText(data.booking.name, data.booking.handle));
    if(MSG.view === 'thread' && Number(id) === MSG.threadId){ MSG.seq += 1; MSG.thread = data; msgPaint(); }
    else { if(action === 'staff_msg_reopen') MSG.tab = 'open'; msgLoadList(); }
  }catch(e){ showToast(e.message); if(btn) btn.disabled = false; }
  finally{ MSG.busy = false; }
}

// Escape closes the window, as the × does.
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && MSG.open) msgClose(); });

// Logging out — from the corner menu, or a session that expired — must not
// leave the day's guests (names and phones) on the screen. taster.js's
// logout() knows nothing about this page, so this page wraps it.
(function(){
  const plain = window.logout;
  if(typeof plain !== 'function') return;
  window.logout = function(){
    const out = plain.apply(this, arguments);
    try{ rvReset(); rvPaintSheet(); msgHide(); PEOPLE = null; DISHES_ROWS = []; DISHES_LOADED = false; supReset(); boot(); }catch(e){}
    return out;
  };
})();

loadSession();
boot();
</script>
</body>
