// ── TAP, AND TOUCH AND HOLD ──
function mpDown(e, key){
  if(e && e.button && e.button !== 0) return;
  clearTimeout(MP.lpTimer); MP.lpFired = false;
  MP.lpTimer = setTimeout(function(){ MP.lpTimer = null; MP.lpFired = true; mpMenu(key); }, MP_HOLD_MS);
}
function mpUp(){ clearTimeout(MP.lpTimer); MP.lpTimer = null; }   // r49: null = no finger down (the 30 s repaint waits)
function mpCtx(e, key){ if(e) e.preventDefault(); clearTimeout(MP.lpTimer); MP.lpTimer = null; MP.lpFired = true; mpMenu(key); }

function mpTap(key){
  if(MP.lpFired){ MP.lpFired = false; return; }
  if(MP.busy || !MP.data) return;
  const u = mpUnitOf(key);
  if(!u) return;
  if(MP.joining !== null){ mpJoinWith(u); return; }
  if(MP.placing){ const b = mpBooking(MP.placing); if(b) mpDo({action:'map_pin', bookingId: b.id, table: u.key}); return; }
  const st = mpState(u), D = MP.data;
  if(st.k === 'busy'){
    const s = st.session, who = s.bookingId ? mpBooking(s.bookingId) : null;
    mpOpenSheet(mpName(u), u.seats+' seats · '+mpRoom().name+' · busy '+mpSince(mpNow() - Date.parse(s.since)),
      [who ? who.name+' · '+rvPeople(who.party)+' · booked '+who.label : 'A walk-in, since '+mpClockAt(s.since)+'.'],
      [mpOpt('Table is free', 'main', () => mpFree(u, s))]);
    return;
  }
  const soon = mpBookingsOn(u.key).find(b => Date.parse(b.at) - mpNow() < D.settings.holdMinutes*60000);
  if(soon){
    const opts = [];
    if(D.can.bookings) opts.push(mpOpt(soon.first+'\u2019s party · '+rvPeople(soon.party)+' · '+mpShort(soon.label), 'main', () => mpSeat(u, soon)));
    opts.push(mpOpt('A walk-in', D.can.bookings ? '' : 'main', () => mpSeat(u, null)));
    mpOpenSheet('Who is sitting at '+mpName(u).toLowerCase()+'?', u.seats+' seats · '+mpRoom().name,
      D.can.bookings ? [] : [soon.first+'\u2019s party ('+mpShort(soon.label)+')? Scan their QR code with the Camera, or ask a manager: crew don\u2019t change bookings.'], opts);
    return;
  }
  mpSeat(u, null);
}
function mpClockAt(iso){ return new Intl.DateTimeFormat('en-US', { timeZone: MP.data.timezone, hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); }

function mpMenu(key){
  if(MP.busy || !MP.data) return;
  MP.sheetAt = Date.now();          // a held finger is still down: see mpFresh
  const u = mpUnitOf(key);
  if(!u) return;
  const D = MP.data, room = mpRoom(), st = mpState(u), can = D.can;
  const joinOpts = [mpOpt('Join with another table', '', () => mpStartJoin(u))];
  if(u.members.length > 1) joinOpts.push(mpOpt('Separate the tables', '', () => mpSeparate(u)));
  if(st.k === 'busy'){
    mpOpenSheet(mpName(u), u.seats+' seats · '+room.name, [], [mpOpt('Table is free', 'main', () => mpFree(u, st.session))].concat(joinOpts));
    return;
  }
  const r = st.next;
  if(r){
    const kept = st.pinned;
    const lines = [kept ? 'Reserved for '+r.first+': this table is kept for them and does not move.'
                        : 'Not Reserved: if this table gets busy, '+r.first+' moves to another free table.'];
    let opts = [];
    if(can.bookings){
      opts.push(kept ? mpOpt('Remove Reserved ('+r.first+' can move)', '', () => mpDo({action:'map_pin', bookingId: r.id, table: null}))
                     : mpOpt('Reserved for '+r.first+' (keep this table)', 'main', () => mpDo({action:'map_pin', bookingId: r.id, table: u.key})));
      opts.push(mpOpt(r.first+'\u2019s party is here', '', () => mpSeat(u, r)));
    } else lines.push('Only a manager can change a booking.');
    opts = opts.concat(joinOpts);
    if(can.bookings) opts.push(mpOpt('Seat a walk-in here anyway', 'red', () => mpSeat(u, null, true)));
    if(can.bookings && st.k === 'late') opts.push(mpOpt('No-show ('+r.first+')', 'red', () => mpNoShow(r)));
    mpOpenSheet(mpName(u), u.seats+' seats · '+room.name+' · '+r.first+' at '+mpShort(r.label), lines, opts);
    return;
  }
  // free: a walk-in, join, or keep a booking of this room here
  let opts = [mpOpt('Seat a walk-in', 'main', () => mpSeat(u, null))].concat(joinOpts);
  if(can.bookings){
    const could = (D.bookings || []).filter(b => b.status === 'booked' && (!b.areaId || b.areaId === room.id) && b.party <= u.seats && !(b.pin && u.members.includes(b.pin)))
      .sort((a, b) => Date.parse(a.at) - Date.parse(b.at)).slice(0, 3);
    opts = opts.concat(could.map(b => mpOpt('Reserved for '+b.first+' ('+mpShort(b.label)+' · '+b.party+')', '', () => mpDo({action:'map_pin', bookingId: b.id, table: u.key}))));
  }
  mpOpenSheet(mpName(u), u.seats+' seats · '+room.name+' · free', [], opts);
}

// "No table yet": tap one, then the table (a manager). The tables glow while choosing.
function mpPick(id){
  const b = mpBooking(id);
  if(!b) return;
  if(!MP.data.can.bookings){ mpShowToast('A manager chooses a table for '+b.first+'.'); return; }
  if(MP.placing === id){ MP.placing = null; mpHideToast(); mpPaintFloor(); return; }
  MP.placing = id; MP.joining = null;
  mpShowToast('Tap a table for '+b.first+' ('+rvPeople(b.party)+', '+mpShort(b.label)+'). Too small? Touch and hold a table to join two.', null, 60000);
  mpPaintFloor();
}

// ── THE ACTIONS (each answer is the whole map again) ──
async function mpDo(body, quiet){
  if(MP.busy) return null;
  MP.busy = true; MP.sheet = null; mpPaintSheet();
  const gen = MP.gen;
  try{
    const data = await rvApi(body);
    if(gen !== MP.gen) return null;
    MP.placing = null; MP.joining = null;
    mpTake(data);
    mpPaintFloor();
    // r47 (Sebastian: no black messages): a few words only when there is something to undo
    const said = quiet ? null : mpSaid(data.done);
    if(said && said.text) mpShowToast(said.text, said.undo); else mpHideToast();
    return data;
  }catch(e){
    if(gen !== MP.gen) return null;
    if(e.data && e.data.rooms) mpTake(e.data);
    MP.placing = null; MP.joining = null;
    mpPaintFloor();
    // a walk-in a booking needs: a manager may seat them anyway, from the message itself
    if(e.status === 409 && e.data && e.data.reason === 'needed' && body.action === 'map_seat' && !body.force && MP.data && MP.data.can.bookings){
      mpShowToast(e.message, function(){ return mpDo(Object.assign({}, body, {force: true})); }, 12000, 'Seat anyway', true);
      return null;
    }
    if(e.status !== 401) mpShowToast(e.message, null, 7000, null, true);
    return null;
  }finally{
    MP.busy = false;
  }
}
// What just happened, in words, and how to undo it.
function mpSaid(done){
  if(!done) return { text: null };
  const name = (tables) => (tables.length > 1 ? 'Tables ' : 'Table ') + tables.join('+');
  if(done.kind === 'seat'){
    let text = done.walkIn ? name(done.tables)+' busy' : done.who+' · '+name(done.tables).toLowerCase();
    (done.moved || []).forEach(m => { text += ' · '+m.who+' → '+m.to.join('+'); });
    (done.noTable || []).forEach(w => { text += ' · '+w+': no table'; });
    const unpinned = done.unpinned || [];
    return { text, undo: async function(){
      const ok = await mpDo({action:'map_unseat', sessionId: done.sessionId}, true);
      for(const p of unpinned){ if(ok) await mpDo({action:'map_pin', bookingId: p.bookingId, table: p.table}, true); }
    } };
  }
  if(done.kind === 'free') return { text: name(done.tables || [])+' free', undo: function(){ return mpDo({action:'map_reopen', sessionId: done.sessionId}, true); } };
  if(done.kind === 'pin') return { text: done.table ? 'Reserved for '+done.who : done.who+': not Reserved', undo: function(){ return mpDo({action:'map_pin', bookingId: done.bookingId, table: done.was}, true); } };
  if(done.kind === 'join'){
    let text = 'Tables '+done.tables.join('+')+' joined';
    (done.came || []).forEach(c => { text += ' · '+c.who+' sits there'; });
    return { text, undo: function(){ return mpDo({action:'map_separate', joinId: done.joinId}, true); } };
  }
  if(done.kind === 'separate'){
    const t = done.tables || [];
    return { text: t.length < 2 ? null : 'Tables '+t.join('+')+' separated', undo: t.length < 2 ? null : async function(){
      let a = [t[0]];
      for(let i = 1; i < t.length; i++){ if(!(await mpDo({action:'map_join', a: a, b: [t[i]]}, true))) return; a = a.concat([t[i]]); }
    } };
  }
  return { text: null };
}
function mpMinutes(m){ return m < 60 ? m+' min' : Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'; }

function mpSeat(u, booking, force){ return mpDo(Object.assign({action:'map_seat', tables: u.members}, booking ? {bookingId: booking.id} : {}, force ? {force: true} : {})); }
function mpFree(u, s){ return mpDo({action:'map_free', sessionId: s.id}); }
function mpSeparate(u){ return mpDo({action:'map_separate', joinId: u.joinId}); }
function mpStartJoin(u){
  MP.sheet = null; mpPaintSheet();
  MP.joining = u.key; MP.placing = null;
  mpShowToast('Tap the table to join with '+mpName(u).toLowerCase()+'.', null, 60000);
  mpPaintFloor();
}
function mpJoinWith(u){
  const a = mpUnitOf(MP.joining);
  if(!a || a.key === u.key){ MP.joining = null; mpHideToast(); mpPaintFloor(); return; }
  return mpDo({action:'map_join', a: a.members, b: u.members});
}
async function mpNoShow(b){
  MP.sheet = null; mpPaintSheet();
  try{
    await rvApi({action:'staff_mark', id: b.id, to: 'no_show'});
    mpLoad(true);
  }catch(e){ mpShowToast(e.message, null, 7000, null, true); }
}

let MP_OPTS = [];
function mpOpt(label, kind, go){ return { label, kind: kind || '', go }; }
function mpOpenSheet(title, sub, lines, opts){

    + '</div>';

// The finger that held a table lifts where the sheet just appeared: not a tap on the sheet.
function mpFresh(){ return Date.now() - (MP.sheetAt || 0) < 500; }
function mpScrimTap(){ if(!mpFresh()) mpCloseSheet(); }
function mpOptGo(i){ if(mpFresh()) return; const o = MP_OPTS[i]; if(o && o.go) o.go(); }

function mpShowToast(text, undo, ms, label, bad){
  MP.toast = { text, undo: undo || null, label: label || 'Undo', bad: !!bad };
  clearTimeout(MP.toastTimer);
  MP.toastTimer = setTimeout(mpHideToast, ms || (undo ? 9000 : 5000));
  mpPaintToast();
}
function mpHideToast(){
  clearTimeout(MP.toastTimer); MP.toast = null;
  if(MP.joining !== null || MP.placing){ MP.joining = null; MP.placing = null; mpPaintFloor(); }
  mpPaintToast();
}
function mpPaintToast(){
  let host = document.getElementById('mp-toast');
  if(!host){ host = document.createElement('div'); host.id = 'mp-toast'; host.setAttribute('role', 'status'); document.body.appendChild(host); }
  const T = MP.toast;
  if(!T || TAB!=='reservations' || (RV.view!=='map' && RV.view!=='draw')){ host.innerHTML = ''; host.className = ''; return; }
  host.className = 'on' + (T.bad ? ' bad' : '');
  host.innerHTML = '<span>'+esc(T.text)+'</span>'
    + (T.undo ? '<button type="button" class="mp-undo" onclick="mpUndo()">'+esc(T.label || 'Undo')+'</button>' : '')
    + '<button type="button" class="mp-toast-x" aria-label="Close the message" onclick="mpHideToast()">&times;</button>';
}
async function mpUndo(){
  const T = MP.toast;
  if(!T || !T.undo || MP.busy) return;
  const go = T.undo;
  MP.toast = null; mpPaintToast();
  await go();
}

  if(TAB==='reservations' && RV.view==='map') mpPaintFloor();
  if(TAB==='reservations' && RV.view==='draw') dwPaint();

// ── DRAWING A ROOM (r46) ──
//
// Two steps, like the pictures Sebastian approved: 1 the shape (a rectangle of
// squares; Remove, Restore, Bar, Door, Object with its name — tap a square or
// drag across several), 2 the tables (add round or square, drag into place,
// tap one to change its number, seats or shape). Save sends the whole room;
// the server checks it all again.

const DW = { areaId: null, name: '', step: 'shape', cols: 12, rows: 16, cells: {}, tables: [], version: 0,
             tool: 'gone', objName: '', objSel: null, sel: null, drag: null, paint: null, msg: '', bad: false, saving: false, others: {}, back: 'map' };

async function dwOpen(areaId, from){
  DW.back = from === 'settings' ? 'settings' : 'map';
  if(!MP.data || MP.rid !== (RESTAURANT && RESTAURANT.id)){
    try{ mpTake(await rvApi({action:'map_get'})); }
    catch(e){ showToast(e.message); return; }
  }
  const room = (MP.data.rooms || []).find(r => r.id === areaId);
  if(!room){ showToast('That room is not there any more.'); return; }
  if(!MP.data.can.draw){ showToast('Only a manager can draw the rooms.'); return; }
  mpStop(); MP.sheet = null; mpPaintSheet(); mpHideToast();
  const others = {};
  (MP.data.rooms || []).forEach(r => { if(r.id !== areaId) r.tables.forEach(t => { others[t.n] = r.name; }); });
  Object.assign(DW, { areaId, name: room.name, step: 'shape', version: room.version || 0, others,
    cols: room.drawn ? room.cols : 12, rows: room.drawn ? room.rows : 16,
    cells: Object.assign({}, room.cells || {}), tables: room.tables.map(t => Object.assign({}, t)),
    tool: 'gone', objName: '', objSel: null, sel: null, drag: null, paint: null, msg: '', bad: false, saving: false });
  RV.view = 'draw';
  render();
  window.scrollTo(0, 0);
}
function dwBack(){
  if(DW.step === 'tables'){ DW.step = 'shape'; DW.sel = null; DW.msg = ''; dwPaint(); return; }
  dwLeave();
}
function dwLeave(){
  if(DW.back === 'settings'){ RV.view = 'settings'; render(); rvLoadSettings(true); return; }
  RV.view = 'map'; MP.room = DW.areaId; render(); mpLoad(true); mpStart();
}
function dwPaint(){
  if(TAB!=='reservations' || RV.view!=='draw') return;
  const root = document.getElementById('rv-root');
  if(!root) return;
  const y = window.scrollY;
  root.innerHTML = dwHtml();
  dwPaintGrid();
  window.scrollTo(0, y);
}
function dwHtml(){
  const shape = DW.step === 'shape';
  const head = '<div class="mp-head"><button type="button" class="rv-back" onclick="dwBack()">&#8249; '+(shape ? (DW.back === 'settings' ? 'Settings' : 'Map') : 'Shape')+'</button>'
    + '<div class="mp-title">'+esc(DW.name)+' · '+(shape ? 'shape' : 'tables')+'</div><div class="mp-clock">'+(shape ? '1' : '2')+' OF 2</div></div>';
  if(shape){
    const TOOLS = [['gone','Remove'],['floor','Restore'],['Bar','Bar'],['Door','Door'],['Object','Object']];
    return head + '<p class="dw-hint">Pick a tool, then tap a square — or drag from one corner to another to fill a rectangle. No table can go on a bar, a door or an object.</p>'
      + '<div class="dw-tools">' + TOOLS.map(([k, w]) => '<button type="button" class="dw-tool'+(DW.tool===k?' on':'')+'" onclick="dwTool(\''+k+'\')" aria-pressed="'+(DW.tool===k)+'"><i class="'+k.toLowerCase()+'"></i>'+w+'</button>').join('') + '</div>'
      + (DW.tool === 'Object' ? dwObjectsHtml() : '')
      + '<div class="dw-size"><span>Wide</span><button type="button" class="dw-pm" aria-label="One square narrower" onclick="dwSize(\'cols\',-1)">−</button><b>'+DW.cols+'</b><button type="button" class="dw-pm" aria-label="One square wider" onclick="dwSize(\'cols\',1)">+</button>'
      + '<span>Long</span><button type="button" class="dw-pm" aria-label="One square shorter" onclick="dwSize(\'rows\',-1)">−</button><b>'+DW.rows+'</b><button type="button" class="dw-pm" aria-label="One square longer" onclick="dwSize(\'rows\',1)">+</button>'
      + '<button type="button" class="rv-mini dw-turn-room" onclick="dwTurnRoom()">&#8635; Turn the room</button>'
      + '<button type="button" class="rv-mini" onclick="dwStartOver()">Start over</button></div>'
      + '<div class="mp-floor-wrap"><div class="dw-grid" id="dw-grid"></div></div>'
      + '<div class="mp-sum" id="dw-sum"></div>'
      + '<div class="dw-msg'+(DW.bad?' bad':'')+'" role="status">'+esc(DW.msg)+'</div>'
      + '<div class="dw-foot"><button type="button" class="m-save dw-next" onclick="dwNext()">Next: add the tables &#8250;</button></div>';
  }
  const t = DW.sel !== null ? DW.tables.find(x => x.n === DW.sel) : null;
  const seats = DW.tables.reduce((n, x) => n + x.seats, 0);
  return head + '<p class="dw-hint">Drag each table to its place. Tap one to change its number, seats or shape.</p>'
    + '<div class="mp-floor-wrap"><div class="mp-floor dw-floor" id="dw-grid"></div></div>'
    + '<div class="dw-add"><button type="button" class="rv-mini" onclick="dwAdd(\'round\')">+ Round table</button><button type="button" class="rv-mini" onclick="dwAdd(\'square\')">+ Square table</button>'
    + '<span>'+DW.tables.length+' table'+(DW.tables.length===1?'':'s')+' · '+seats+' seats</span></div>'
    + (t ? '<div class="dw-edit"><label for="dw-num">Table</label><input id="dw-num" class="m-input" inputmode="numeric" maxlength="3" value="'+t.n+'" onchange="dwNumber(this.value)">'
         + '<div class="dw-seats"><button type="button" class="dw-pm" aria-label="Fewer seats" onclick="dwSeats(-1)">−</button><b>'+t.seats+' seats</b><button type="button" class="dw-pm" aria-label="More seats" onclick="dwSeats(1)">+</button></div>'
         + '<div class="dw-shape"><button type="button" class="rv-mini'+(t.shape==='round'?' on':'')+'" onclick="dwShape(\'round\')">Round</button><button type="button" class="rv-mini'+(t.shape==='square'?' on':'')+'" onclick="dwShape(\'square\')">Square</button>'
         + (t.seats > 4 ? '<button type="button" class="rv-mini dw-turn" onclick="dwTurn()" aria-label="Turn table '+t.n+'">&#8635; Turn</button>' : '')
         + '<button type="button" class="rv-mini red" onclick="dwRemove()">Remove</button></div></div>' : '')
    + '<div class="dw-msg'+(DW.bad?' bad':'')+'" role="status">'+esc(DW.msg)+'</div>'
    + '<div class="dw-foot two"><button type="button" class="m-save" onclick="dwSave(this)"'+(DW.saving?' disabled':'')+'>Save the room</button>'
    + '<button type="button" class="m-btn" onclick="dwLeave()">Cancel</button></div>';
}
function dwCell(){
  const avail = Math.max(240, (document.getElementById('rv-root') || {}).clientWidth || 340);
  return Math.max(12, Math.min(34, Math.floor(avail / DW.cols)));
}
function dwPaintGrid(){
  const g = document.getElementById('dw-grid');
  if(!g) return;
  const C = dwCell(), room = { cols: DW.cols, rows: DW.rows, cells: DW.cells };
  g.style.width = (DW.cols*C)+'px'; g.style.height = (DW.rows*C)+'px';
  if(DW.step === 'shape'){
    let html = '';
    for(let y = 0; y < DW.rows; y++) for(let x = 0; x < DW.cols; x++){
      const v = DW.cells[x+','+y] || '';
      html += '<button type="button" class="dw-sq '+dwCls(v)+'" data-x="'+x+'" data-y="'+y+'" style="left:'+(x*C)+'px;top:'+(y*C)+'px;width:'+C+'px;height:'+C+'px"'
        + ' aria-label="Square '+(x+1)+', '+(y+1)+': '+esc(!v ? 'floor' : v === 'gone' ? 'not part of the room' : v.replace(/^Object:/, ''))+'"></button>';
    }
    mpGroups(DW.cols, DW.rows, DW.cells).forEach(gr => {
      html += '<div class="mp-blk-name'+(gr.tall?' tall':'')+'" style="left:'+(gr.x*C)+'px;top:'+(gr.y*C)+'px;width:'+(gr.w*C)+'px;height:'+(gr.h*C)+'px">'+esc(gr.text)+'</div>';
    });
    g.innerHTML = html;
    g.onpointerdown = dwPaintStart;
    const floor = DW.rows*DW.cols - Object.keys(DW.cells).length, count = {};
    Object.values(DW.cells).forEach(v => { if(v !== 'gone'){ const k = v.replace(/^Object:/, ''); count[k] = (count[k]||0)+1; } });
    const sum = document.getElementById('dw-sum');
    if(sum) sum.textContent = DW.cols+' × '+DW.rows+' squares · '+floor+' floor'+(Object.keys(count).length ? ' · '+Object.keys(count).map(k => k+' '+count[k]).join(' · ') : '');
    return;
  }
  g.style.backgroundSize = C+'px '+C+'px';
  let html = mpBlocksHtml(room, C);
  DW.tables.forEach(t => {
    const f = mpFoot(t.seats, t.turned), drag = DW.drag && DW.drag.n === t.n ? DW.drag : null;
    const x = drag ? drag.x : t.x, y = drag ? drag.y : t.y, ok = !drag || dwFits(t, x, y);
    html += '<button type="button" class="dw-t'+(t.shape==='round'?' round':'')+(DW.sel===t.n?' sel':'')+(drag?(ok?' moving':' moving bad'):'')+'" data-n="'+t.n+'"'
      + ' style="left:'+(x*C+3)+'px;top:'+(y*C+3)+'px;width:'+(f.w*C-6)+'px;height:'+(f.h*C-6)+'px;--c:'+C+'px"'
      + ' aria-label="Table '+t.n+', '+t.seats+' seats, '+t.shape+'. Drag to move, tap to change."><span class="mp-n">'+t.n+'</span><span class="mp-l">'+t.seats+' seats</span></button>';
  });
  g.innerHTML = html;
  g.onpointerdown = dwDragStart;
}

// Shape: tap or drag across squares. The first square decides: painting it, or taking it off.
function dwTool(k){ DW.tool = k; dwPaint(); }
function dwSize(field, d){
  const lo = 4, hi = field === 'cols' ? 30 : 40;
  DW[field] = Math.max(lo, Math.min(hi, DW[field] + d));
  Object.keys(DW.cells).forEach(k => { const [x, y] = k.split(',').map(Number); if(x >= DW.cols || y >= DW.rows) delete DW.cells[k]; });
  dwPaint();
}
function dwStartOver(){ DW.cells = {}; DW.msg = ''; dwPaint(); }
// r47: the whole room a quarter turn to the right — squares, bar, door, objects and tables with it (twice = 180°)
function dwTurnRoom(){
  if(DW.rows > 30){ DW.msg = 'A room this long cannot be turned (30 squares wide at most).'; DW.bad = true; dwPaint(); return; }
  const C = DW.cols, R = DW.rows, cells = {};
  Object.keys(DW.cells).forEach(k => { const [x, y] = k.split(',').map(Number); cells[(R - 1 - y)+','+x] = DW.cells[k]; });
  DW.tables.forEach(t => {
    const f = mpFoot(t.seats, t.turned);
    const nx = R - t.y - f.h, ny = t.x;
    t.x = nx; t.y = ny; if(t.seats > 4) t.turned = !t.turned;
  });
  DW.cols = R; DW.rows = C; DW.cells = cells;
  DW.msg = 'Turned a quarter to the right. Tap again to keep turning: twice = upside down.'; DW.bad = false;
  dwPaint();
}
function dwValue(){
  if(DW.tool === 'floor') return null;
  if(DW.tool === 'Object'){
    if(DW.objSel !== null) return 'Object:' + DW.objSel;     // a chosen object: paint more of it (the box only renames)
    let name = String(DW.objName || '').trim().replace(/[<>"\\]/g, '').slice(0, 24);
    // no name typed: "Object 1", "Object 2"… (each new object its own; rename it any time)
    if(!name){ const have = dwObjects(); let k = 1; while(have.includes('Object '+k)) k += 1; name = 'Object '+k; }
    DW.objName = name;
    return 'Object:' + name;
  }
  return DW.tool;
}
// r47 (Sebastian, 30 Oct: "give me the option to name two or more different objects"): the objects of this room,
// each a chip; "+ New object" starts another one; Rename gives the chosen one a new name everywhere it is.
function dwObjects(){
  const seen = [];
  Object.values(DW.cells).forEach(v => { if(v.indexOf('Object:') === 0 && !seen.includes(v.slice(7))) seen.push(v.slice(7)); });
  return seen;
}
function dwObjectsHtml(){
  const list = dwObjects(); DW.objList = list;
  if(DW.objSel !== null && !list.includes(DW.objSel)){ DW.objSel = null; DW.objName = ''; }   // its last square was taken off
  return '<div class="dw-objs" role="group" aria-label="Objects in this room"><span class="dw-objs-h">Objects</span>'
    + list.map((n, i) => '<button type="button" class="dw-obj'+(DW.objSel === n ? ' on' : '')+'" aria-pressed="'+(DW.objSel === n)+'" onclick="dwPickObj('+i+')">'+esc(n)+'</button>').join('')
    + '<button type="button" class="dw-obj new'+(DW.objSel === null ? ' on' : '')+'" onclick="dwNewObj()">+ New object</button></div>'
    + '<div class="dw-name"><label for="dw-obj">'+(DW.objSel === null ? 'New object' : 'Name')+'</label>'
    + '<input id="dw-obj" class="m-input" maxlength="24" placeholder="Piano, Column, Plants…" value="'+esc(DW.objName)+'" oninput="DW.objName=this.value">'
    + (DW.objSel !== null ? '<button type="button" class="rv-mini" onclick="dwRenameObj()">Rename</button>' : '<span>then tap squares</span>') + '</div>';
}
function dwPickObj(i){ const n = (DW.objList || [])[i]; if(n === undefined) return; DW.objSel = n; DW.objName = n; DW.msg = ''; DW.bad = false; dwPaint(); }
function dwNewObj(){
  DW.objSel = null; DW.objName = ''; DW.msg = ''; DW.bad = false; dwPaint();
  const i = document.getElementById('dw-obj'); if(i) i.focus();
}
function dwRenameObj(){
  const from = DW.objSel, to = String(DW.objName || '').trim().replace(/[<>"\\]/g, '').slice(0, 24);
  if(from === null) return;
  if(!to){ DW.msg = 'Write the new name first.'; DW.bad = true; dwPaint(); return; }
  Object.keys(DW.cells).forEach(k => { if(DW.cells[k] === 'Object:'+from) DW.cells[k] = 'Object:'+to; });
  DW.objSel = to; DW.objName = to; DW.msg = ''; DW.bad = false; dwPaint();
}
function dwSquareAt(e){
  const el = document.elementFromPoint(e.clientX, e.clientY);
  return el && el.classList && el.classList.contains('dw-sq') ? el : null;
}
function dwCls(v){ return !v ? 'floor' : v === 'gone' ? 'gone' : v === 'Bar' ? 'bar' : v === 'Door' ? 'door' : 'obj'; }
// A tap fills one square; a drag fills the rectangle from the first square to the finger (shown as it goes,
// written when the finger lifts). The first square decides: painting the tool, or taking it off.
function dwPaintStart(e){
  const sq = dwSquareAt(e);
  if(!sq) return;
  e.preventDefault();
  const x0 = Number(sq.dataset.x), y0 = Number(sq.dataset.y), want = dwValue();
  DW.paint = { erase: want === null || DW.cells[x0+','+y0] === want, want, x0, y0, x1: x0, y1: y0 };
  dwPaintPreview();
  const g = document.getElementById('dw-grid');
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
  g.onpointermove = function(ev){
    const P = DW.paint, s = dwSquareAt(ev);
    if(!P || !s) return;
    const x = Number(s.dataset.x), y = Number(s.dataset.y);
    if(x !== P.x1 || y !== P.y1){ P.x1 = x; P.y1 = y; dwPaintPreview(); }
  };
  g.onpointerup = g.onpointercancel = function(){
    const P = DW.paint; DW.paint = null; g.onpointermove = null;
    if(P){
      const [a, b, c, d] = dwRect(P);
      for(let y = b; y <= d; y++) for(let x = a; x <= c; x++){ if(P.erase) delete DW.cells[x+','+y]; else DW.cells[x+','+y] = P.want; }
      if(DW.tool === 'Object' && !P.erase){ DW.objSel = P.want.slice(7); DW.objName = DW.objSel; dwPaint(); return; }
      if(DW.tool === 'Object'){ dwPaint(); return; }
    }
    dwPaintGrid();
  };
}
function dwRect(P){ return [Math.min(P.x0, P.x1), Math.min(P.y0, P.y1), Math.max(P.x0, P.x1), Math.max(P.y0, P.y1)]; }
function dwPaintPreview(){
  const P = DW.paint; if(!P) return;
  const [a, b, c, d] = dwRect(P);
  document.querySelectorAll('#dw-grid .dw-sq').forEach(el => {
    const x = Number(el.dataset.x), y = Number(el.dataset.y), inside = x >= a && x <= c && y >= b && y <= d;
    el.className = 'dw-sq ' + dwCls(inside ? (P.erase ? '' : P.want) : (DW.cells[x+','+y] || '')) + (inside ? ' pv' : '');
  });
}
function dwNext(){
  if(DW.rows*DW.cols - Object.keys(DW.cells).length < 4){ DW.msg = 'Leave some floor for the tables.'; DW.bad = true; dwPaint(); return; }
  DW.step = 'tables'; DW.msg = ''; DW.bad = false;
  const stuck = DW.tables.filter(t => !dwFits(t, t.x, t.y));
  if(stuck.length){ DW.msg = 'Table'+(stuck.length>1?'s ':' ')+stuck.map(t => t.n).join(', ')+' '+(stuck.length>1?'are':'is')+' on something now: drag '+(stuck.length>1?'them':'it')+' to the floor.'; DW.bad = true; }
  dwPaint();
}

// Tables: where one may stand (inside, on the floor, on top of no other).
function dwFits(t, x, y, ignore){
  const f = mpFoot(t.seats, t.turned);
  if(x < 0 || y < 0 || x + f.w > DW.cols || y + f.h > DW.rows) return false;
  for(let i = 0; i < f.w; i++) for(let j = 0; j < f.h; j++) if(DW.cells[(x+i)+','+(y+j)]) return false;
  return !DW.tables.some(o => {
    if(o.n === t.n || o === ignore) return false;
    const g = mpFoot(o.seats, o.turned);
    return x < o.x + g.w && o.x < x + f.w && y < o.y + g.h && o.y < y + f.h;
  });
}
function dwFreeNumber(){
  const used = new Set(DW.tables.map(t => t.n).concat(Object.keys(DW.others).map(Number)));
  let n = 1; while(used.has(n)) n += 1;
  return n;
}
function dwAdd(shape){
  const t = { n: dwFreeNumber(), seats: shape === 'round' ? 2 : 4, shape, x: 0, y: 0 };
  for(let y = 0; y < DW.rows; y++) for(let x = 0; x < DW.cols; x++){
    if(dwFits(t, x, y)){ t.x = x; t.y = y; DW.tables.push(t); DW.sel = t.n; DW.msg = 'Table '+t.n+' added. Drag it to its place.'; DW.bad = false; dwPaint(); return; }
  }
  DW.msg = 'There is no free space left in this room.'; DW.bad = true; dwPaint();
}
function dwDragStart(e){
  const el = e.target.closest ? e.target.closest('.dw-t') : null;
  if(!el) return;
  e.preventDefault();
  const n = Number(el.dataset.n), t = DW.tables.find(x => x.n === n), C = dwCell();
  const g = document.getElementById('dw-grid'), box = g.getBoundingClientRect();
  const offX = Math.floor((e.clientX - box.left) / C) - t.x, offY = Math.floor((e.clientY - box.top) / C) - t.y;
  DW.drag = { n, x: t.x, y: t.y, moved: false, sx: e.clientX, sy: e.clientY };
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
  g.onpointermove = function(ev){
    const d = DW.drag; if(!d) return;
    if(Math.abs(ev.clientX - d.sx) + Math.abs(ev.clientY - d.sy) > 6) d.moved = true;
    if(!d.moved) return;
    const x = Math.floor((ev.clientX - box.left) / C) - offX, y = Math.floor((ev.clientY - box.top) / C) - offY;
    if(x !== d.x || y !== d.y){ d.x = x; d.y = y; dwPaintGrid(); }
  };
  g.onpointerup = g.onpointercancel = function(){
    const d = DW.drag; DW.drag = null; g.onpointermove = null;
    if(!d) return;
    if(!d.moved){ DW.sel = DW.sel === n ? null : n; DW.msg = ''; DW.bad = false; dwPaint(); return; }
    if(dwFits(t, d.x, d.y)){ t.x = d.x; t.y = d.y; DW.msg = ''; DW.bad = false; }
    else { DW.msg = 'No room for table '+t.n+' there.'; DW.bad = true; }
    dwPaint();
  };
}
function dwSelected(){ return DW.tables.find(x => x.n === DW.sel) || null; }
function dwNumber(v){
  const t = dwSelected(); if(!t) return;
  const n = Number(String(v).trim());
  if(!Number.isInteger(n) || n < 1 || n > 999){ DW.msg = 'A table number is 1 to 999.'; DW.bad = true; dwPaint(); return; }
  if(n !== t.n && DW.tables.some(x => x.n === n)){ DW.msg = 'Table '+n+' is already in this room.'; DW.bad = true; dwPaint(); return; }
  if(DW.others[n]){ DW.msg = 'Table '+n+' is in '+DW.others[n]+'. Each number is used once in the restaurant.'; DW.bad = true; dwPaint(); return; }
  t.n = n; DW.sel = n; DW.msg = ''; DW.bad = false; dwPaint();
}
function dwSeats(d){
  const t = dwSelected(); if(!t) return;
  const seats = Math.max(1, Math.min(20, t.seats + d));
  if(!dwFits(Object.assign({}, t, { seats }), t.x, t.y, t)){ DW.msg = 'No room for '+seats+' seats here: drag the table to a bigger space first.'; DW.bad = true; dwPaint(); return; }
  t.seats = seats; if(seats <= 4) t.turned = false; DW.msg = ''; DW.bad = false; dwPaint();
}
function dwShape(s){ const t = dwSelected(); if(t){ t.shape = s; dwPaint(); } }
// r47: a long table stands along the room or lies across it (where it is, if there is room)
function dwTurn(){
  const t = dwSelected(); if(!t) return;
  if(!dwFits(Object.assign({}, t, { turned: !t.turned }), t.x, t.y, t)){ DW.msg = 'No room to turn table '+t.n+' here: drag it to a bigger space first.'; DW.bad = true; dwPaint(); return; }
  t.turned = !t.turned; DW.msg = ''; DW.bad = false; dwPaint();
}
function dwRemove(){ DW.tables = DW.tables.filter(x => x.n !== DW.sel); DW.sel = null; DW.msg = ''; dwPaint(); }

async function dwSave(btn){
  const stuck = DW.tables.filter(t => !dwFits(t, t.x, t.y));
  if(stuck.length){ DW.msg = 'Table '+stuck[0].n+' is on something or outside the room: drag it to the floor first.'; DW.bad = true; dwPaint(); return; }
  DW.saving = true; if(btn) btn.disabled = true;
  try{
    const data = await rvApi({action:'map_save', areaId: DW.areaId, version: DW.version, cols: DW.cols, rows: DW.rows, cells: DW.cells,
                              tables: DW.tables.map(t => ({ n: t.n, seats: t.seats, shape: t.shape, x: t.x, y: t.y, turned: !!t.turned && t.seats > 4 }))});
    DW.saving = false;
    mpTake(data);

    dwLeave();
  }catch(e){

}

let RV_OPEN = {};
try{ RV_OPEN = JSON.parse(sessionStorage.getItem('hf_rv_open') || '{}') || {}; }catch(e){ RV_OPEN = {}; }
function rvFoldKey(eb){ return eb.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'card'; }
// Every card with a title (.m-eyebrow) directly in this box: the title becomes a button; closed until opened.
function rvFoldCards(box){
  if(!box) return;
  box.querySelectorAll(':scope > .m-card').forEach(card => {
    if(card.classList.contains('rv-fold')) return;
    const eb = card.querySelector(':scope > .m-eyebrow');
    if(!eb) return;
    const key = rvFoldKey(eb), open = !!RV_OPEN[key];
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'rv-fold-h'; btn.setAttribute('aria-expanded', String(open));
    btn.innerHTML = '<span class="mg-caret" aria-hidden="true">▸</span><span class="m-eyebrow" role="heading" aria-level="3"></span>';
    btn.lastChild.textContent = eb.textContent;
    btn.addEventListener('click', function(){ rvFoldTap(key); });
    card.replaceChild(btn, eb);
    card.classList.add('rv-fold'); card.dataset.fold = key;
    card.classList.toggle('open', open);
  });
}
function rvFoldTap(key, open){
  const now = open === undefined ? !RV_OPEN[key] : !!open;
  if(now) RV_OPEN[key] = true; else delete RV_OPEN[key];
  try{ sessionStorage.setItem('hf_rv_open', JSON.stringify(RV_OPEN)); }catch(e){}
  document.querySelectorAll('.m-card.rv-fold').forEach(c => {
    if(c.dataset.fold !== key) return;
    c.classList.toggle('open', now);
    const b = c.querySelector(':scope > .rv-fold-h'); if(b) b.setAttribute('aria-expanded', String(now));
  });
}

function capLevel(p){ return p >= 85 ? 'full' : p >= 60 ? 'mid' : 'low'; }
function capPct(u){ return u.of ? Math.round(100 * u.used / u.of) : 0; }
function capSignHtml(label, u, short){
  const p = capPct(u);
  return '<div class="cap-sign" role="img" aria-label="'+esc(label)+': '+p+'% full, '+u.used+' of '+u.of+' seats in use">'
    + '<div class="cap-top"><span class="cap-l">'+esc(label)+'</span><b class="cap-p '+capLevel(p)+'">'+p+'%</b></div>'
    + '<div class="cap-bar"><i class="'+capLevel(p)+'" style="width:'+Math.min(100, p)+'%"></i></div>'
    + '<div class="cap-n">'+u.used+' of '+u.of+' seats'+(short ? '' : ' in use')+'</div></div>';
}
// The map: the room shown, and (with two drawn rooms or more) all of them — every busy table counts its seats.
function mpUse(room){
  const seatsOf = {};
  room.tables.forEach(t => { seatsOf[t.n] = t.seats; });
  const of = room.tables.reduce((n, t) => n + t.seats, 0);
  let used = 0;
  (MP.data.busy || []).forEach(b => { if(b.areaId === room.id) b.tables.forEach(n => { used += seatsOf[n] || 0; }); });
  return { used: Math.min(used, of), of };
}
function mpPaintCap(){
  const el = document.getElementById('mp-cap');
  if(!el || !MP.data) return;
  const room = mpRoom();
  if(!room || !room.drawn){ el.innerHTML = ''; return; }
  const drawn = (MP.data.rooms || []).filter(r => r.drawn && r.active !== false);
  const all = drawn.reduce((s, r) => { const u = mpUse(r); return { used: s.used + u.used, of: s.of + u.of }; }, { used: 0, of: 0 });
  el.innerHTML = capSignHtml('Now · '+room.name, mpUse(room))
    + (drawn.length > 1 ? '<div class="cap-all">All rooms: <b>'+capPct(all)+'%</b> · '+all.used+' of '+all.of+' seats</div>' : '');
}

// ── THE CAMERA, INSIDE THE PAGE ──
// The guest's QR is a link: <site>/manager#arrive=<token> (a table) or <site>/checkin?t=<token> (a visit, a prize, an
// invite). The camera reads it here and opens it here (any address of ours: the token is what the server checks).
// BarcodeDetector where the phone has it (Android's Chrome); elsewhere (iPhone) jsQR, this site's own copy, loaded the
// first time the camera opens. Nothing is sent anywhere: the picture never leaves the phone.
const CAM = { stream: null, timer: 0, detector: null, busy: false, said: 0, lib: null };
function camHost(){
  let host = document.getElementById('cam-host');
  if(!host){ host = document.createElement('div'); host.id = 'cam-host'; document.body.appendChild(host); }
  return host;
}
function camWhat(text){
  let u;
  try{ u = new URL(String(text || '').trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  const arrive = /^#arrive=([0-9a-fA-F]{32})$/.exec(u.hash || '');
  if(/^\/manager(\.html)?$/.test(u.pathname) && arrive) return { kind: 'arrive', token: arrive[1].toLowerCase() };
  const ticket = /^#ticket=([0-9a-fA-F]{32})$/.exec(u.hash || '');                    // r50: an event ticket
  if(/^\/manager(\.html)?$/.test(u.pathname) && ticket) return { kind: 'ticket', token: ticket[1].toLowerCase() };
  const t = u.searchParams.get('t');
  if(/^\/checkin(\.html)?$/.test(u.pathname) && t && /^[A-Za-z0-9_-]{8,128}$/.test(t)) return { kind: 'checkin', token: t };
  return null;
}
async function camOpen(){
  const host = camHost();
  host.innerHTML = '<div class="cam" role="dialog" aria-label="Scan a guest’s QR code">'
    + '<video id="cam-video" playsinline muted autoplay></video><div class="cam-frame" aria-hidden="true"></div>'
    + '<div class="cam-top"><b>Scan a guest’s QR code</b><span id="cam-say">Opening the camera…</span></div>'
    + '<div class="cam-foot"><a class="cam-btn" href="/checkin">Type the code</a><button type="button" class="cam-btn main" onclick="camClose()">Close</button></div></div>';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camNoCamera('This browser cannot open the camera here.'); return; }
  try{
    CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  }catch(e){
    camNoCamera(e && e.name === 'NotAllowedError'
      ? 'The camera is blocked for this page. On an iPhone: Settings → Apps → Safari → Camera → Allow (in the app on your Home Screen, tap Camera again and choose Allow).'
      : 'The camera did not open' + (e && e.name ? ' (' + e.name + ')' : '') + '.');
    return;
  }
  if(!document.getElementById('cam-video')){ camStop(); return; }          // closed while asking
  const v = document.getElementById('cam-video');
  v.srcObject = CAM.stream;
  try{ await v.play(); }catch(e){}
  camSay('Point it at the QR code on the guest’s phone or in their email.');
  try{
    if('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) CAM.detector = new BarcodeDetector({ formats: ['qr_code'] });
  }catch(e){ CAM.detector = null; }
  if(!CAM.detector && !window.jsQR){
    try{ await camLoadLib(); }catch(e){ camNoCamera('The QR reader did not load. Check the connection and try again.'); return; }
  }
  camLoop();
}
function camLoadLib(){
  if(CAM.lib) return CAM.lib;
  CAM.lib = new Promise(function(ok, no){
    const s = document.createElement('script'); s.src = '/jsqr.min.js'; s.async = true;
    s.onload = function(){ window.jsQR ? ok() : no(new Error('jsQR')); };
    s.onerror = function(){ CAM.lib = null; no(new Error('jsQR')); };
    document.head.appendChild(s);
  });
  return CAM.lib;
}
function camSay(text, bad){ const el = document.getElementById('cam-say'); if(el){ el.textContent = text; el.classList.toggle('bad', !!bad); } }
function camNoCamera(why){
  camStop();
  const host = camHost();
  host.innerHTML = '<div class="rv-scrim" onclick="camClose()"></div>'
    + '<div class="rv-sheet mp-sheet" role="dialog" aria-label="Scan a guest’s QR code"><div class="rv-grab"></div>'
    + '<div class="mp-sheet-t">Scan a guest’s QR code</div>'
    + '<div class="mp-add-err" role="alert" style="margin-bottom:.6rem;">'+esc(why)+'</div>'
    + '<ol class="mp-steps"><li>Open your phone’s <b>Camera</b> app.</li><li>Point it at the QR code on the guest’s phone or in their email.</li>'
    + '<li>Tap the link that appears: this page opens with their table and an <b>Arrived</b> button.</li></ol>'
    + '<div class="mp-opts"><button type="button" class="mp-opt" onclick="camOpen()">Try again</button><button type="button" class="mp-opt quiet" onclick="camClose()">Close</button></div></div>';
}
function camLoop(){
  clearTimeout(CAM.timer);
  CAM.timer = setTimeout(async function(){
    const v = document.getElementById('cam-video');
    if(!v || !CAM.stream) return;
    if(v.readyState >= 2 && v.videoWidth && !CAM.busy){
      CAM.busy = true;
      let text = null;
      try{ text = await camRead(v); }catch(e){ text = null; }
      CAM.busy = false;
      if(text && camFound(text)) return;
    }
    camLoop();
  }, 160);
}
let CAM_CANVAS = null;
async function camRead(v){
  if(CAM.detector){
    const got = await CAM.detector.detect(v);
    return got && got[0] ? got[0].rawValue : null;
  }
  if(!window.jsQR) return null;
  const w = v.videoWidth, h = v.videoHeight, k = Math.min(1, 720 / Math.max(w, h));
  const cw = Math.round(w * k), ch = Math.round(h * k);
  if(!CAM_CANVAS) CAM_CANVAS = document.createElement('canvas');
  CAM_CANVAS.width = cw; CAM_CANVAS.height = ch;
  const g = CAM_CANVAS.getContext('2d', { willReadFrequently: true });
  g.drawImage(v, 0, 0, cw, ch);
  const img = g.getImageData(0, 0, cw, ch);
  const code = window.jsQR(img.data, cw, ch, { inversionAttempts: 'dontInvert' });
  return code ? code.data : null;
}
// A QR read: a table → this page with the table and Arrived; a visit, a prize or an invite → the check-in page.
// r52: the event's poster (its QR opens the event page, /e/<key> or /event?k=…) is not a ticket — say what to ask for.
function camPoster(text){
  let u;
  try{ u = new URL(String(text || '').trim()); }catch(e){ return false; }
  if(!/^https?:$/.test(u.protocol)) return false;
  return /^\/e\/[A-Za-z0-9_-]{4,64}\/?$/.test(u.pathname) || (/^\/event(\.html)?$/.test(u.pathname) && !!u.searchParams.get('k'));
}
function camFound(text){
  const w = camWhat(text);
  if(!w){
    if(Date.now() - CAM.said > 2500){
      CAM.said = Date.now();
      if(camPoster(text)) camSay('This is the event’s poster. Ask for the guest’s ticket QR (in their email).', true);
      else camSay('That QR code is not a table, a visit or a reward here.', true);
    }
    return false;
  }
  if(navigator.vibrate) try{ navigator.vibrate(60); }catch(e){}
  camClose();
  if(w.kind === 'checkin'){ window.location.assign('/checkin?t=' + encodeURIComponent(w.token)); return true; }
  const hash = (w.kind === 'ticket' ? '#ticket=' : '#arrive=') + w.token;
  if(window.location.hash === hash) window.dispatchEvent(new HashChangeEvent('hashchange'));
  else window.location.hash = hash;
  return true;
}
function camStop(){
  clearTimeout(CAM.timer); CAM.timer = 0; CAM.busy = false;
  if(CAM.stream){ CAM.stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} }); CAM.stream = null; }
}
function camClose(){ camStop(); const host = document.getElementById('cam-host'); if(host) host.innerHTML = ''; }
document.addEventListener('visibilitychange', function(){ if(document.visibilityState !== 'visible' && CAM.stream) camClose(); });
window.addEventListener('pagehide', function(){ camStop(); });

// ── r49 · THE TIMELINE (Sebastian, 29 Oct design "the same night as a timeline", approved; 2 Nov: "we had that before,
// the map and the timeline, what happened with it?") and the capacity hour by hour on top of it (30 Oct 16:54).
// Map | Timeline at the top of the Map page. Each line is a table; a booking keeps its table for the hold (90 min);
// busy tables run from when they sat down; the red line is now. On top, hour by hour: how full the rooms shown will be
// (the seats of the tables taken at the busiest quarter of that hour — the busy ones, and the ones a booking holds).
// Tap a bar: who, when, and "See it on the map".
const TL = { room: 'all', K: 1.5, sx: 0, sy: 0, kept: false };   // 1.5 px per minute (90 px an hour); where the timeline was scrolled
try{ MP.mode = sessionStorage.getItem('hf_mp_mode') === 'timeline' ? 'timeline' : 'map'; }catch(e){ MP.mode = 'map'; }
function mpModeHtml(){
  const b = (k, w) => '<button type="button" class="mp-mode-b'+(MP.mode===k?' on':'')+'" aria-pressed="'+(MP.mode===k)+'" onclick="mpSetMode(\''+k+'\')">'+w+'</button>';
  return '<div class="mp-mode" role="group" aria-label="Map or timeline">' + b('map', 'Map') + b('timeline', 'Timeline') + '</div>';
}
function mpSetMode(k){
  if(MP.mode === k) return;
  MP.mode = k; MP.placing = null; MP.joining = null; TL.kept = false; mpHideToast();
  try{ sessionStorage.setItem('hf_mp_mode', k); }catch(e){}
  mpPaint();
}
// the restaurant's clock: minutes of the local day for a moment (one offset for the night: good enough for a service)
function tlOffset(ms){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: MP.data.timezone || 'America/New_York', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute) - Math.floor(ms / 60000) * 60000;
}
function tlHourLabel(ms, off){ const h = new Date(ms + off).getUTCHours(); return (h % 12 || 12) + (h < 12 ? ' AM' : ' PM'); }
function tlKind(atMs, now){ const d = (atMs - now) / 60000; return d < 0 ? 'late' : d <= 30 ? 'half' : d <= 60 ? 'hour' : 'later'; }
// Everything the timeline draws, from the map's own data (the same placement every phone sees).
function tlModel(){
  const D = MP.data, now = mpNow(), HOLD = (Number(D.settings && D.settings.holdMinutes) || 90) * 60000, H = 3600000;
  const rooms = (D.rooms || []).filter(r => r.drawn && (TL.room === 'all' || TL.room === r.id));
  const off = tlOffset(now);
  const byId = {}; (D.bookings || []).forEach(b => { byId[b.id] = b; });
  const unitTables = (room, key) => { const u = mpUnits(room).find(x => x.key === key); return u ? u.members : [key]; };
  // the bars, per table
  const rows = {};                                              // "room:table" → bars
  const add = (room, n, bar) => { (rows[room.id+':'+n] = rows[room.id+':'+n] || []).push(bar); };
  let first = now - 60 * 60000, last = now + 3 * H;
  rooms.forEach(room => {
    (D.busy || []).filter(s => s.areaId === room.id).forEach(s => {
      const since = Date.parse(s.since), end = Math.max(now, since + HOLD), b = s.bookingId ? byId[s.bookingId] : null;
      first = Math.min(first, since); last = Math.max(last, end);
      s.tables.forEach(n => add(room, n, { s: since, e: end, k: 'busy', who: b, session: s, table: n }));
    });
    (D.bookings || []).forEach(b => {
      const key = D.place[b.id];
      if(b.status !== 'booked' || key === undefined || key === null) return;
      const members = unitTables(room, key);
      if(!room.tables.some(t => t.n === members[0])) return;
      const at = Date.parse(b.at);
      last = Math.max(last, at + HOLD);
      members.forEach(n => add(room, n, { s: at, e: at + HOLD, k: tlKind(at, now), who: b, table: n, members }));
    });
  });
  const waiting = (D.waiting || []).map(id => byId[id]).filter(b => b && b.status === 'booked'
    && (TL.room === 'all' || !b.areaId || b.areaId === TL.room));
  waiting.forEach(b => { last = Math.max(last, Date.parse(b.at) + HOLD); });
  const blocks = evRoomBlocks().filter(x => rooms.some(r => r.id === x.area));      // r50: events that take the whole room
  blocks.forEach(x => { last = Math.max(last, x.e); });
  const start = Math.floor((first + off) / H) * H - off, end = Math.min(start + 16 * H, Math.ceil((last + off) / H) * H - off);
  // capacity, hour by hour (from this hour on): the seats of the tables taken at the busiest quarter of the hour
  const seatsAll = rooms.reduce((n, r) => n + r.tables.reduce((m, t) => m + t.seats, 0), 0);
  const taken = (t) => {
    let used = 0;
    rooms.forEach(room => room.tables.forEach(tb => {
      if(blocks.some(x => x.area === room.id && x.s <= t && t < x.e) || (rows[room.id+':'+tb.n] || []).some(x => x.s <= t && t < x.e)) used += tb.seats;
    }));
    return used;
  };
  const hours = [];
  for(let h = start; h < end; h += H){
    const past = h + H <= now;
    let most = 0;
    if(!past) for(let q = 0; q < 4; q++){ const t = Math.max(now, h + q * 15 * 60000); if(t < h + H) most = Math.max(most, taken(t)); }
    hours.push({ at: h, label: tlHourLabel(h, off), past, used: most, pct: seatsAll ? Math.round(100 * Math.min(most, seatsAll) / seatsAll) : 0 });
  }
  return { now, off, start, end, rooms, rows, waiting, hours, seatsAll, HOLD, blocks };
}
function tlX(ms, M){ return Math.round((ms - M.start) / 60000 * TL.K); }
function tlBarHtml(bar, M, extraCls){
  const x = tlX(Math.max(bar.s, M.start), M) + 1, w = Math.max(34, tlX(Math.min(bar.e, M.end), M) - tlX(Math.max(bar.s, M.start), M) - 2);
  const mins = Math.max(0, Math.floor((M.now - bar.s) / 60000));
  const who = bar.who ? bar.who.first : 'Walk-in';
  const label = bar.k === 'busy' ? who + ' · ' + mpMinutes(mins)
    : who + ' · ' + bar.who.party + (bar.who.pin ? ' · Reserved' : '') + (bar.members && bar.members.length > 1 ? ' · ' + bar.members.join('+') : '');
  const id = bar.k === 'busy' ? 's' + bar.session.id : 'b' + bar.who.id;
  return '<button type="button" class="tl-bar '+bar.k+(extraCls||'')+'" style="left:'+x+'px;width:'+w+'px" data-bar="'+id+'" data-n="'+(bar.table || '')+'"'
    + ' aria-label="'+esc((bar.table ? 'Table '+bar.table+': ' : '')+label)+'" onclick="tlTap(\''+id+'\','+(bar.table || 0)+')">'+esc(label)+'</button>';
}
function tlHtml(){
  const D = MP.data;
  const drawn = (D.rooms || []).filter(r => r.drawn);
  if(TL.room !== 'all' && !drawn.some(r => r.id === TL.room)) TL.room = 'all';
  const chips = '<div class="tl-rooms">' + [['all', 'All']].concat(drawn.map(r => [r.id, r.name])).map(([id, name]) =>
    '<button type="button" class="mp-room'+(TL.room===id?' on':'')+'" onclick="tlPickRoom('+(id === 'all' ? '\'all\'' : id)+')">'+esc(name)+'</button>').join('') + '</div>';
  if(!drawn.length) return chips.replace('<div class="tl-rooms">', '<div class="tl-rooms" hidden>') + '<div class="mp-undrawn"><b>No room is drawn yet.</b><br>The timeline shows the tables of the rooms drawn on the Map.</div>';
  const hold = Number(D.settings && D.settings.holdMinutes) || 90;
  return chips + '<div class="tl-note">Each line is a table. A booking keeps its table '+hold+' minutes; two can’t overlap.</div>'
    + '<div class="tl-scroll" id="tl-scroll"></div>'
    + '<div class="mp-legend tl-legend"><span><i class="later"></i>Later</span><span><i class="hour"></i>1 hour</span><span><i class="half"></i>30 min</span>'
    + '<span><i class="busy"></i>Busy</span><span><i class="late"></i>Late</span><span class="tl-leg-cap">% = how full, hour by hour</span></div>';
}
function tlPaint(){
  const box = document.getElementById('tl-scroll');
  if(!box || !MP.data) return;
  const M = tlModel(), W = tlX(M.end, M), LEFT = 62;
  let html = '<div class="tl-grid" style="width:'+(LEFT + W)+'px">';
  // the head: the hours, and under them how full each hour will be
  html += '<div class="tl-head"><div class="tl-corner"><span>Full</span></div><div class="tl-hours" style="width:'+W+'px">';
  M.hours.forEach(h => {
    const x = tlX(h.at, M);
    html += '<div class="tl-h" style="left:'+x+'px">'+esc(h.label)+'</div>'
      + '<div class="tl-cap '+(h.past ? 'past' : capLevel(h.pct))+'" style="left:'+(x + 3)+'px;width:'+(TL.K * 60 - 6)+'px"'
      + (h.past ? ' aria-label="'+esc(h.label)+': past"' : ' aria-label="'+esc(h.label)+': '+h.pct+'% full, '+h.used+' of '+M.seatsAll+' seats"')+'>'
      + (h.past ? '·' : '<i style="width:'+Math.min(100, h.pct)+'%"></i><b>'+h.pct+'%</b>')+'</div>';
  });
  html += '<div class="tl-now-chip" style="left:'+tlX(M.now, M)+'px">'+esc(mpClock().replace(/\s?[AP]M$/, ''))+'</div></div></div>';
  // the lines: hour lines, the now line
  M.hours.forEach(h => { html += '<div class="tl-vline" style="left:'+(LEFT + tlX(h.at, M))+'px"></div>'; });
  html += '<div class="tl-nowline" style="left:'+(LEFT + tlX(M.now, M))+'px"></div>';
  // "No table yet"
  if(M.waiting.length){
    html += '<div class="tl-group red"><span>No table yet · '+M.waiting.length+'</span></div>';
    M.waiting.forEach(b => {
      const at = Date.parse(b.at);
      html += '<div class="tl-row"><div class="tl-n">–</div><div class="tl-lane" style="width:'+W+'px">'
        + tlBarHtml({ s: at, e: at + M.HOLD, k: tlKind(at, M.now), who: b, table: 0 }, M, ' waiting') + '</div></div>';
    });
  }
  M.rooms.forEach(room => {
    html += '<div class="tl-group"><span>'+esc(room.name)+' · '+room.tables.length+'</span></div>';
    M.blocks.filter(b => b.area === room.id && b.e > M.start && b.s < M.end).forEach(b => {          // r50: the event's band
      const x = tlX(Math.max(b.s, M.start), M) + 1, w = Math.max(60, tlX(Math.min(b.e, M.end), M) - tlX(Math.max(b.s, M.start), M) - 2);
      html += '<div class="tl-row tl-ev-row"><div class="tl-n">EVENT</div><div class="tl-lane" style="width:'+W+'px">'
        + '<div class="tl-evbar" style="left:'+x+'px;width:'+w+'px" title="'+esc(b.name)+'">'+esc(b.hours+' · '+b.name+' · the whole room')+'</div></div></div>';
    });
    room.tables.slice().sort((a, b) => a.n - b.n).forEach(t => {
      html += '<div class="tl-row" data-row="'+t.n+'"><div class="tl-n"><b>'+t.n+'</b><small>'+t.seats+'</small></div><div class="tl-lane" style="width:'+W+'px">'
        + (M.rows[room.id+':'+t.n] || []).map(bar => tlBarHtml(bar, M)).join('') + '</div></div>';
    });
  });
  html += '</div>';
  box.innerHTML = html;
  // the map asks again every 10 seconds and draws itself again when something changed: the timeline stays where the
  // finger left it (the first time, and after Map | Timeline or a room chip: now, a third from the left)
  if(TL.kept){ box.scrollLeft = TL.sx; box.scrollTop = TL.sy; } else tlScrollToNow();
  box.onscroll = function(){ TL.sx = box.scrollLeft; TL.sy = box.scrollTop; TL.kept = true; };
}
function tlScrollToNow(){
  const box = document.getElementById('tl-scroll');
  if(!box || !MP.data) return;
  const M = tlModel();
  box.scrollLeft = Math.max(0, tlX(M.now, M) - (box.clientWidth - 62) * 0.35);
  TL.sx = box.scrollLeft; TL.sy = box.scrollTop; TL.kept = true;
}
function tlPickRoom(id){ if(TL.room === id) return; TL.room = id; TL.kept = false; mpCloseSheet(); mpPaint(); }
// A bar tapped: who, when — and the map with that room.
function tlTap(id, table){
  const D = MP.data, now = mpNow(), byId = {};
  (D.bookings || []).forEach(b => { byId[b.id] = b; });
  const room = (D.rooms || []).find(r => r.tables.some(t => t.n === table)) || null;
  const t = room ? room.tables.find(x => x.n === table) : null;
  const where = t ? t.seats + ' seats · ' + room.name : '';
  const toMap = room ? [mpOpt('See it on the map', 'main', function(){ mpCloseSheet(); MP.room = room.id; mpSetMode('map'); })] : [];
  if(id[0] === 's'){
    const s = (D.busy || []).find(x => 's' + x.id === id); if(!s) return;
    const b = s.bookingId ? byId[s.bookingId] : null, mins = Math.max(0, Math.floor((now - Date.parse(s.since)) / 60000));
    mpOpenSheet((s.tables.length > 1 ? 'Tables ' : 'Table ') + s.tables.join('+'), where + ' · busy ' + mpMinutes(mins),
      [b ? b.name + ' · ' + rvPeople(b.party) + ' · since ' + mpClockAt(s.since) : 'A walk-in, since ' + mpClockAt(s.since)], toMap);
    return;
  }
  const b = byId[id.slice(1)]; if(!b) return;
  const late = Math.floor((now - Date.parse(b.at)) / 60000);
  const key = D.place[b.id];
  if(key === undefined || key === null){
    mpOpenSheet(b.name, rvPeople(b.party) + ' · ' + mpShort(b.label),
      ['No table can take ' + rvPeople(b.party) + ' at ' + b.label + ' yet. On the map, tap this booking under "No table yet", then a table.'],
      [mpOpt('See it on the map', 'main', function(){ mpCloseSheet(); if(b.areaId) MP.room = b.areaId; mpSetMode('map'); })]);
    return;
  }
  mpOpenSheet('Table ' + (table || key), where,
    [b.name + ' · ' + rvPeople(b.party) + ' · ' + b.label + (late > 0 ? ' · late ' + late + ' min' : '')
      + (b.pin ? ' · Reserved: kept on this table' : ' · not Reserved: moves if this table gets busy')], toMap);
}

// ── r49 · the day: "In use now" as a fifth tile (Sebastian, 2 Nov, his picture: next to Tables · People · Arrived ·
// Requests; the r48 row under Type · Map · Camera is gone — the hours are on the Timeline). Today only.
function rvCapTile(d){
  if(!d || d.date !== RV.date || d.date !== d.today) return '';
  const seats = (d.areas || []).reduce((n, a) => n + (Number(a.seats) || 0), 0);
  if(!seats) return '';
  const u = d.inUse ? { used: d.inUse.used, of: d.inUse.of || seats }
                    : { used: (d.bookings || []).filter(b => b.status === 'seated').reduce((n, b) => n + b.party, 0), of: seats };
  const p = capPct(u), lv = capLevel(p);
  return '<div class="rv-tile cap-tile" role="img" aria-label="In use now: '+p+'% full, '+u.used+' of '+u.of+' seats">'
    + '<b class="'+lv+'">'+p+'%</b><span>In use</span>'      // r49 (2 Nov 11:21): the word on the same line as the other tiles' words
    + '<span class="cap-mini"><i class="'+lv+'" style="width:'+Math.min(100, p)+'%"></i></span><small>'+u.used+' of '+u.of+' seats</small></div>';
}

// ── r50 · EVENT TICKETS (Sebastian, 30 Oct 16:42; design approved 2 Nov: "It looks brilliant!") ──
// A 4th tab, Events: "+ New event", each event with its day and hours, room, price, how many sold, Edit · Guests ·
// Share the link. Settings → Tickets · Square: the restaurant connects its own Square account (the money goes there;
// no fee for Seb's Analytics). One ticket per person, each with its own QR, used once at the door: the Camera (or a
// phone's camera app) opens it here → "Let in". "Take the whole room": the event shows on the day, the Map and the
// Timeline, and online booking skips that room for its hours. The server: api/_lib/events.js.
const EV = { rid:null, loaded:false, loading:false, error:null, reason:null, list:[], square:null, rooms:[], canEdit:false,
             view:'list', form:null, fieldErr:null, busy:false, conflicts:null, guests:null, guestsId:null, pastOpen:false };
const EV_DAYS = {};                 // date → { list, at } (the events of a service day: the day screen, the Map, the Timeline)
const SQ = { rid:null, loaded:false, loading:false, data:null, locations:null, note:null, error:null, busy:false };
const EV_STATE = { draft:'Draft · only your team sees it', on_sale:'On sale', sold_out:'Sold out', closed:'Sales closed', over:'Over',
                   cancelled:'Cancelled', not_on_sale:'Not on sale · connect Square' };
const evMoney = c => '$' + (Number(c) / 100).toFixed(2).replace(/\.00$/, '');

async function evStart(){
  if(EV.rid !== RESTAURANT.id) Object.assign(EV, { rid:RESTAURANT.id, loaded:false, list:[], view:'list', form:null, guests:null, error:null });
  if(EV.loading) return;
  EV.loading = true; EV.error = null; evPaint();
  try{
    const d = await rvApi({action:'ev_list'});
    if(EV.rid !== RESTAURANT.id) return;
    Object.assign(EV, { list:d.events || [], square:d.square || null, rooms:d.rooms || [], canEdit:!!d.canEdit, loaded:true, tz:d.timezone || null });
  }catch(e){ EV.error = e.message; EV.reason = e.data && e.data.reason; }

function evPaint(){

}
function evHtml(){

  if(EV.view === 'edit' && EV.form) return evFormHtml();
  if(EV.view === 'guests') return evGuestsHtml();
  const now = Date.now();
  const live = EV.list.filter(e => e.status !== 'cancelled' && Date.parse(e.endsAt) > now);

  return evSquareBanner()
    + (EV.conflicts ? evConflictsHtml(EV.conflicts) : '')

    + (past.length ? '<button type="button" class="ev-past-h" aria-expanded="'+EV.pastOpen+'" onclick="EV.pastOpen=!EV.pastOpen;evPaint()"><span class="mg-caret">▸</span> Past and cancelled · '+past.length+'</button>'

function evSquareBanner(){

function evSwitch(k){ if(!EV.form) return; evKeep(); EV.form[k] = !EV.form[k]; if(k === 'takeRoom' && EV.form.takeRoom && !EV.form.areaId) EV.fieldErr = { field:'areaId', error:'To take the whole room, choose the room.' }; evPaint(); }

function evBack(){ if(EV.form && EV.form.photoNew) URL.revokeObjectURL(EV.form.photoNew.url); EV.view = 'list'; EV.form = null; EV.guests = null; EV.fieldErr = null; evPaint(); window.scrollTo(0, 0); evStart(); }
async function evSave(publish){
  const f = EV.form; if(!f || EV.busy) return;
  document.querySelectorAll('#ev-root [data-f]').forEach(el => { if(el.tagName !== 'BUTTON') f[el.dataset.f] = el.value; });
  EV.busy = true; EV.fieldErr = null; evPaint();
  try{
    const d = await rvApi({ action:'ev_save', event:{ id:f.id, name:f.name, date:f.date, start:f.start, end:f.end, areaId:f.areaId === '' ? null : Number(f.areaId),
      takeRoom:!!f.takeRoom, price:f.price, total:Number(f.total), taxMode:f.taxMode, taxRate:f.taxMode === 'none' ? '0' : f.taxRate, max:Number(f.max),
      closeHours:Number(f.closeHours), about:f.about, included:f.included, adultsOnly:!!f.adultsOnly } });
    let saved = d.event;
    f.id = saved.id;
    const photoProblem = await evPhotoAfterSave(f, saved.id);         // r51: the photo goes with the saved event
    if(photoProblem) showToast('The event is saved, but not its photo: ' + photoProblem);
    if(publish){
      try{ saved = (await rvApi({ action:'ev_status', id:saved.id, to:'published' })).event; }

    }

    EV.view = 'list'; EV.form = null; EV.busy = false;

  }catch(e){

  }

async function evCancelEvent(id){

async function evOpenGuests(id){

  if(TAB === 'events'){ EV.view = 'guests'; EV.guests = null; evPaint(); window.scrollTo(0, 0); }

  }catch(e){ EV.guests = { error:e.message }; }
  if(TAB === 'events' && EV.view === 'guests') evPaint(); else evGuestsSheet();

function evGuestsBody(g){
  if(!g) return '<div class="m-skel"></div>';
  if(g.error) return '<div class="m-err">'+esc(g.error)+'</div>';
  const sold = g.orders.filter(o => o.status === 'paid').reduce((n, o) => n + o.tickets.filter(t => t.status === 'valid').length, 0);
  const inside = g.orders.reduce((n, o) => n + o.tickets.filter(t => t.usedAt && t.status === 'valid').length, 0);
  let html = '<div class="ev-g-h"><div class="ev-name">'+esc(g.event.name)+'</div><div class="ev-when">'+esc(g.event.hours)+'</div>'
    + '<div class="ev-nums"><b>'+inside+' of '+sold+' inside</b></div></div>';
  if(!g.orders.length) return html + '<div class="m-empty">No tickets sold yet.</div>';
  g.orders.forEach(o => {
    html += '<div class="ev-order '+o.status+'" data-order="'+o.id+'"><div class="ev-o-top"><b>'+esc(o.name)+'</b><span>'+o.quantity+' '+(o.quantity === 1 ? 'ticket' : 'tickets')+'</span></div>'
      + '<div class="ev-o-sub">'
      + (o.status === 'paid' ? 'Paid '+esc(o.paid || '') : o.status === 'refunded' ? 'Refunded '+esc(o.refunded || '') : 'Paying on Square now…')
      + (o.refunded && o.status === 'paid' ? ' · '+esc(o.refunded)+' refunded' : '')
      + (o.phone ? ' · '+rvTel(o.phone) : '')
      + (o.email ? ' · '+esc(o.email) : '') + '</div>'
      + (o.overLimit ? '<div class="ev-o-warn">Paid after the event filled up: over the limit.</div>' : '')
      + (o.emailProblem ? '<div class="ev-o-warn">The email with the tickets did not go: '+esc(o.emailProblem)+'</div>' : '');
    if(o.status === 'paid'){
      html += '<div class="ev-tix">' + o.tickets.map(t => {
        if(t.status === 'void') return '<span class="ev-tk void">'+t.seq+' · cancelled'+(g.canEdit ? ' <button type="button" class="rv-link" onclick="evVoid('+t.id+',false)">Bring back</button>' : '')+'</span>';
        if(t.usedAt){
          const undo = Date.now() - Date.parse(t.usedAt) < 15 * 60000 ? ' <button type="button" class="rv-link" onclick="evUnadmit('+t.id+')">Undo</button>' : '';
          return '<span class="ev-tk in">'+t.seq+' · In '+esc(t.usedClock)+undo+'</span>';
        }
        return '<span class="ev-tk"><button type="button" class="ev-let" data-tk="'+t.id+'" onclick="evLetIn('+t.id+')">Let '+t.seq+' in</button>'
          + (g.canEdit ? '<button type="button" class="rv-link" onclick="evVoid('+t.id+',true)">Cancel</button>' : '')+'</span>';
      }).join('') + '</div>';
    }
    html += '</div>';
  });
  return html;
}

  return '<button type="button" class="rv-back" onclick="evBack()">&#8249; Events</button>' + evGuestsBody(EV.guests);

// ── at the door: a ticket's QR (the Camera, or a phone's camera app → manager#ticket=…) ──
function evTicketToken(){ const m = /^#ticket=([0-9a-fA-F]{32})$/.exec(window.location.hash || ''); return m ? m[1].toLowerCase() : null; }
function evStateWords(d){
  const who = d.name ? d.name + ' · ' + d.event : '';
  switch(d.state){
    case 'ok':       return { t:'Ticket '+d.seq+' of '+d.of, sub:who, line:d.day+' · '+d.hours, cls:'go' };
    case 'in':       return { t:'In ✓', sub:who, line:'Ticket '+d.seq+' of '+d.of+' · let in at '+d.usedClock, cls:'go' };
    case 'used':     return { t:'Already used', sub:'at '+(d.usedClock || '?')+' · Ticket '+d.seq+' of '+d.of, line:who, cls:'stop' };
    case 'void':     return { t:'This ticket was cancelled', sub:who, line:'Refunded or cancelled: it does not open the door.', cls:'stop' };
    case 'event_cancelled': return { t:'This event was cancelled', sub:who, line:'', cls:'stop' };
    case 'not_now':  return { t:'Not now', sub:who, line:'This ticket is for '+d.day+' · '+d.hours+'.', cls:'stop' };
    case 'other_restaurant': return { t:'Another restaurant’s ticket', sub:'It does not open the door here.', line:'', cls:'stop' };
    default:         return { t:'Not a ticket here', sub:'This QR code does not open any ticket.', line:'', cls:'stop' };
  }
}
function evDoor(d, token){
  const w = evStateWords(d);
  const opts = [];
  if(d.state === 'ok') opts.push('<button type="button" class="mp-opt main" id="ev-let" onclick="evAdmitToken(\''+token+'\')">Let in</button>');
  if(d.state === 'in') opts.push('<button type="button" class="mp-opt" onclick="evUndoDoor('+d.ticketId+',\''+token+'\')">Undo</button>');
  opts.push('<button type="button" class="mp-opt quiet" onclick="evCloseSheet()">'+(d.state === 'ok' ? 'Cancel' : 'Close')+'</button>');
  evSheet('<div class="ev-door '+w.cls+'"><div class="mp-sheet-t">'+esc(w.t)+'</div><div class="mp-sheet-s">'+esc(w.sub)+'</div>'
    + (w.line ? '<div class="mp-sheet-line">'+esc(w.line)+'</div>' : '') + '</div><div class="mp-opts">'+opts.join('')+'</div>', 'Ticket', 'ev-door-sheet');
}
let evScanSeq = 0;
async function evScanToken(token){
  const mine = ++evScanSeq;
  evSheet('<div class="mp-sheet-t">Reading the ticket…</div>', 'Ticket');
  try{
    const d = await rvApi({ action:'ev_scan', token:token });
    if(mine !== evScanSeq) return;
    evDoor(d, token);
  }catch(e){ if(e.status !== 401) evSheet('<div class="mp-sheet-t">Could not read the ticket</div><div class="mp-sheet-s">'+esc(e.message)+'</div><div class="mp-opts"><button type="button" class="mp-opt quiet" onclick="evCloseSheet()">Close</button></div>', 'Ticket'); }
}
async function evAdmitToken(token){
  const b = document.getElementById('ev-let'); if(b) b.disabled = true;
  try{ const d = await rvApi({ action:'ev_admit', token:token }); evDoor(d, token); }
  catch(e){ showToast(e.message); if(b) b.disabled = false; }
  evRefreshDay();
}
async function evUndoDoor(ticketId, token){
  try{ await rvApi({ action:'ev_unadmit', ticketId:ticketId }); }catch(e){ showToast(e.message); }
  evScanToken(token); evRefreshDay();
}
// boot() and the hash: a ticket's QR in the address → the token leaves the address bar, the sheet opens.
function evTakeTicket(){
  const token = evTicketToken();
  if(!token) return false;
  if(history.replaceState) history.replaceState(null, '', window.location.pathname + window.location.search + '#' + TAB);
  evScanToken(token);
  return true;
}
window.addEventListener('hashchange', function(){
  if(!evTicketToken()) return;
  if(!currentSession){ boot(); return; }
  if(!ACCESS || !RESTAURANT) return;
  evTakeTicket();
});

// ── the events of a day: on the day screen, the Map and the Timeline ──
function evDayList(date){ const x = EV_DAYS[date]; return x ? x.list : []; }
async function evLoadDay(date, force){
  if(!date || !RESTAURANT) return;
  const key = RESTAURANT.id + ':' + date, x = EV_DAYS[date];
  if(!force && x && x.key === key && Date.now() - x.at < 60000) return;
  EV_DAYS[date] = { key, list:x && x.key === key ? x.list : [], at:Date.now() };
  try{
    const d = await rvApi({ action:'ev_day', date:date });
    const before = JSON.stringify(EV_DAYS[date].list);
    EV_DAYS[date] = { key, list:d.events || [], at:Date.now() };
    if(before !== JSON.stringify(d.events || [])) evRepaintPlaces();
  }catch(e){ /* no events shown: the day still works */ }
}
function evRefreshDay(){ if(RV.date) evLoadDay(RV.date, true); if(MP.data) evLoadDay(MP.data.today, true); }
function evRepaintPlaces(){
  if(TAB === 'reservations' && RV.view === 'day' && RV.day) rvPaintTop();
