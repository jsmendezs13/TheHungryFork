<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manager · The Hungry Fork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red: #B01015; --red-dark: #7E0A0E; --red-light: #F7E3E1;
    --white: #FCF9F4; --off-white: #F5EEE3; --text: #2B211A;
    --muted: #8A7B6E; --border: #E9E0D3; --star-on: #D9A441;
    --star-off: #DCD2C4; --green: #4C7A4C; --ink: #2B211A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --shadow-sm: 0 1px 3px rgba(43,33,26,.06);
    --shadow-md: 0 10px 30px rgba(43,33,26,.10);
    --shadow-lg: 0 20px 50px rgba(43,33,26,.18);
  }
  body { font-family:var(--sans); color:var(--text); background:var(--off-white); line-height:1.65; -webkit-font-smoothing:antialiased; padding-bottom:4rem; }

  .m-topbar { position:sticky; top:0; z-index:120; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; background:rgba(21,13,9,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .m-home { color:rgba(252,249,244,.8); text-decoration:none; font-size:.8rem; letter-spacing:.06em; white-space:nowrap; }
  .m-topbar-title { font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--white); }
  .m-topbar-spacer { width:64px; }

  .m-wrap { max-width:720px; margin:0 auto; padding:1.5rem 1rem 0; }

  .m-card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:1.4rem 1.2rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; }
  .m-eyebrow { font-size:.66rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:.5rem; }
  .m-h { font-family:var(--serif); font-size:1.6rem; font-weight:600; line-height:1.2; margin-bottom:.4rem; }
  .m-sub { font-size:.86rem; font-weight:300; color:var(--muted); line-height:1.6; }

  .m-btn { background:var(--ink); color:var(--white); border:none; border-radius:999px; padding:.85rem 1.6rem; font-size:.78rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); transition:background .2s, transform .15s; }
  .m-btn:hover { background:#463629; transform:translateY(-1px); }
  .m-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }

  .m-select { width:100%; border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; }
  .m-select:focus { border-color:var(--red); }

  .m-role { display:inline-block; font-size:.6rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; padding:.2rem .6rem; border-radius:999px; background:var(--off-white); color:var(--muted); border:1px solid var(--border); }
  .m-role.platform { background:var(--ink); color:var(--white); border-color:var(--ink); }
  .m-role.owner { background:var(--red-light); color:var(--red-dark); border-color:rgba(176,16,21,.25); }

  /* ── DISH ROW ── */
  .m-dish { background:var(--white); border:1px solid var(--border); border-radius:14px; margin-bottom:.7rem; box-shadow:var(--shadow-sm); overflow:hidden; transition:opacity .2s; }
  .m-dish.is-hidden { opacity:.55; }
  .m-dish-head { display:flex; align-items:center; gap:.85rem; padding:.95rem 1rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-dish-emoji { font-size:1.6rem; line-height:1; flex:none; }
  .m-dish-id { flex:1; min-width:0; }
  .m-dish-name { font-family:var(--serif); font-size:1.15rem; font-weight:600; line-height:1.25; }
  .m-dish-meta { font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .m-dish-caret { color:var(--muted); font-size:.8rem; flex:none; transition:transform .25s; }
  .m-dish.open .m-dish-caret { transform:rotate(90deg); }

  .m-flags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.35rem; }
  .m-flag { font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; }
  .m-flag.sold { background:#F6E2E1; color:var(--red-dark); }
  .m-flag.hid  { background:var(--off-white); color:var(--muted); }
  .m-flag.pick { background:#EDE3C9; color:#7A5B12; }

  .m-dish-body { display:none; padding:0 1rem 1.1rem; border-top:1px solid var(--border); }
  .m-dish.open .m-dish-body { display:block; }

  .m-switch-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 0; border-bottom:1px solid var(--border); }
  .m-switch-label { font-size:.88rem; }
  .m-switch-note { font-size:.72rem; color:var(--muted); line-height:1.5; margin-top:.1rem; }
  .m-switch { flex:none; width:50px; height:29px; border-radius:999px; border:none; background:var(--star-off); position:relative; cursor:pointer; transition:background .22s; padding:0; }
  .m-switch::after { content:''; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.28); transition:transform .22s; }
  .m-switch.on { background:var(--green); }
  .m-switch.on::after { transform:translateX(21px); }
  .m-switch.on.warn { background:var(--red); }
  .m-switch:disabled { opacity:.5; cursor:not-allowed; }

  .m-field { margin-top:.95rem; }
  .m-field-label { font-size:.66rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem; }
  .m-input, .m-textarea { width:100%; border:1px solid var(--border); border-radius:10px; padding:.65rem .85rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; transition:border-color .2s; }
  .m-input:focus, .m-textarea:focus { border-color:var(--red); }
  .m-textarea { resize:vertical; min-height:80px; line-height:1.6; }
  .m-count { font-size:.68rem; color:var(--muted); text-align:right; margin-top:.2rem; }
  .m-count.over { color:var(--red); font-weight:600; }

  .m-actions { display:flex; align-items:center; gap:.7rem; margin-top:1rem; }
  .m-save { background:var(--red); color:#fff; border:none; border-radius:999px; padding:.7rem 1.4rem; font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-save:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .m-revert { background:none; border:none; color:var(--muted); font-size:.76rem; text-decoration:underline; cursor:pointer; font-family:var(--sans); }

  /* ── ALLERGEN CHECKLIST ── */
  .m-group { border-top:1px solid var(--border); margin-top:1.1rem; padding-top:.9rem; }
  .m-group-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-group-title { font-family:var(--serif); font-size:1.02rem; font-weight:600; }
  .m-group-sum { font-size:.7rem; color:var(--muted); }
  .m-group-caret { color:var(--muted); font-size:.75rem; transition:transform .25s; }
  .m-group.open .m-group-caret { transform:rotate(90deg); }
  .m-group-body { display:none; padding-top:.7rem; }
  .m-group.open .m-group-body { display:block; }

  .m-alg-note { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.75rem .85rem; font-size:.76rem; line-height:1.6; margin-bottom:.9rem; }
  .m-alg-sub { font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:.9rem 0 .5rem; }
  .m-alg-sub:first-child { margin-top:0; }
  .m-alg-grid { display:grid; grid-template-columns:1fr 1fr; gap:.4rem .6rem; }
  @media (max-width:420px) { .m-alg-grid { grid-template-columns:1fr; } }
  .m-alg { display:flex; align-items:center; gap:.5rem; padding:.42rem .55rem; border:1px solid var(--border); border-radius:9px; background:#fff; cursor:pointer; font-size:.82rem; -webkit-tap-highlight-color:transparent; }
  .m-alg input { accent-color:var(--red); width:16px; height:16px; flex:none; margin:0; }
  .m-alg.on { border-color:rgba(176,16,21,.45); background:#FDF4F3; font-weight:500; }
  .m-alg.major { border-left:3px solid var(--red); }

  .m-alg-count { display:inline-block; font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; background:#F6E2E1; color:var(--red-dark); }
  .m-alg-count.none { background:var(--off-white); color:var(--muted); }

  .m-locked { margin-top:1rem; padding:.8rem .9rem; background:var(--off-white); border-radius:10px; font-size:.76rem; color:var(--muted); line-height:1.65; }

  /* ── PEOPLE ── */
  .m-person { display:flex; align-items:center; gap:.8rem; padding:.75rem 0; border-bottom:1px solid var(--border); }
  .m-person:last-child { border-bottom:none; }
  .m-person-id { flex:1; min-width:0; }
  .m-person-name { font-size:.92rem; font-weight:500; }
  .m-person-sub { font-size:.72rem; color:var(--muted); margin-top:.1rem; }
  .m-person-x { flex:none; background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:.3rem .75rem; font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-person-x:hover { border-color:var(--red); color:var(--red); }
  .m-person-x:disabled { opacity:.4; cursor:not-allowed; }
  .m-add-row { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .m-add-row .m-input { flex:1 1 160px; }
  .m-add-row .m-select { flex:0 1 130px; }
  .m-codes { display:flex; align-items:center; gap:.45rem; font-size:.7rem; color:var(--muted); margin-top:.25rem; }
  .m-codes input { accent-color:var(--red); margin:0; }

  .m-empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.9rem; }
  .m-err { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.85rem 1rem; font-size:.85rem; margin-bottom:1rem; }

  .m-skel { height:74px; background:linear-gradient(90deg,#fff 25%,var(--off-white) 50%,#fff 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px; margin-bottom:.7rem; border:1px solid var(--border); }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── HEADER, TABS ── */
  body.rv-mode { padding-bottom:0; }
  .m-head-card { padding:1rem 1.1rem; }
  .m-head-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
  .m-head-row .m-h { margin:0; font-size:1.35rem; }
  .m-head-row .m-eyebrow { margin-bottom:.2rem; }
  .m-tabs { display:flex; align-items:center; gap:.4rem; margin:0 0 .9rem; }
  .m-tabbar { flex:1; display:flex; background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px; }
  .m-tab { flex:1 1 auto; text-align:center; border:none; background:none; font-family:var(--sans); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:.6rem .55rem; border-radius:999px; color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-tab.on { background:var(--ink); color:var(--white); }
  .m-gear { flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; -webkit-tap-highlight-color:transparent; }
  .m-gear.on { background:var(--ink); color:var(--white); border-color:var(--ink); }

  /* The corner menu's list is invisible while it is closed, but it is still a
     tall box in the top-right corner, and it swallowed taps on the gear and the
     › arrow under it. menu.html has the same two lines. */
  #hf-corner:not(.open), #hf-corner:not(.open) .hf-corner-items { pointer-events:none; }
  #hf-corner .hf-corner-toggle { pointer-events:auto; }

  /* ── RESERVATIONS: THE DAYS ── */
  :root { --blue:#2F5DA8; --blue-light:#E4ECF8; --amber:#8A5A0B; --amber-light:#F6EBD6; }
  .rv-car { display:flex; align-items:center; gap:.35rem; margin-bottom:.35rem; }
  .rv-arrow { flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:#fff; font-size:1.05rem; line-height:1; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 0 2px; font-family:var(--sans); }
  .rv-arrow:disabled { opacity:.3; cursor:default; }
  .rv-strip { flex:1; display:flex; align-items:center; justify-content:center; gap:.35rem; overflow:hidden; padding:.35rem 0; min-width:0; }
  .rv-cday { flex:none; width:50px; text-align:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:.4rem 0; opacity:.82; font-family:var(--sans); color:var(--text); cursor:pointer; transition:transform .2s, opacity .2s; -webkit-tap-highlight-color:transparent; }
  .rv-cday.far { opacity:.45; transform:scale(.92); }
  .rv-cday.blank { visibility:hidden; }
  .rv-cday b { display:block; font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-cday span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-cday i { display:block; font-style:normal; font-size:.56rem; color:var(--red); font-weight:600; margin-top:.1rem; white-space:nowrap; }
  .rv-cday i.shut { color:var(--muted); font-weight:500; }
  .rv-cday.on { width:66px; opacity:1; transform:none; background:var(--ink); border-color:var(--ink); color:var(--white); padding:.6rem 0; box-shadow:0 8px 20px rgba(43,33,26,.25); }
  .rv-cday.on b { font-size:1.55rem; }
  .rv-cday.on span { color:rgba(252,249,244,.75); } .rv-cday.on i { color:#FF9C92; } .rv-cday.on i.shut { color:rgba(252,249,244,.6); }
  .rv-dateline { text-align:center; font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.7rem; }

  .rv-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-bottom:.8rem; }
  .rv-tile { background:#fff; border:1px solid var(--border); border-radius:12px; padding:.55rem .3rem; text-align:center; font-family:var(--sans); color:var(--text); }
  button.rv-tile { cursor:pointer; }
  .rv-tile b { display:block; font-family:var(--serif); font-size:1.45rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-tile span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-tile.red b { color:var(--red); }
  .rv-banner { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--red-light); border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:12px; padding:.6rem .85rem; font-size:.8rem; margin-bottom:.8rem; line-height:1.45; }
  .rv-banner b { font-weight:600; }
  .rv-off { background:var(--off-white); border:1px dashed var(--border); color:var(--muted); border-radius:12px; padding:.55rem .85rem; font-size:.76rem; margin-bottom:.8rem; line-height:1.5; }

  /* ── RESERVATIONS: THE EVENING, AS A WATCH ── */
  .rv-evening { position:relative; margin:0 -1rem; transition:opacity .2s; }
  .rv-evening.busy { opacity:.45; }
  .rv-scroll { height:var(--eh, 360px); overflow-y:auto; scroll-snap-type:y mandatory; padding:0 1rem 0 calc(1rem + 62px);
               -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 42px, #000 calc(100% - 42px), transparent 100%);
                       mask-image:linear-gradient(to bottom, transparent 0, #000 42px, #000 calc(100% - 42px), transparent 100%);
               scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .rv-scroll::-webkit-scrollbar { display:none; }
  .rv-pad { height:calc(var(--eh, 360px) / 2 - 40px); }
  .rv-w { scroll-snap-align:center; background:#fff; border:1px solid var(--border); border-radius:14px; padding:.75rem .9rem .8rem;
          margin-bottom:.55rem; box-shadow:var(--shadow-sm); transform-origin:50% 50%; will-change:transform, opacity; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rv-w.mid { box-shadow:0 10px 26px rgba(43,33,26,.14); border-color:#DCCFBE; cursor:default; }
  .rv-w.faded .rv-w-in { opacity:.6; }
  .rv-when { display:flex; justify-content:space-between; gap:.5rem; font-size:.6rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-variant-numeric:lining-nums; }
  .rv-when em { font-style:normal; letter-spacing:.08em; opacity:.8; }
  .rv-name { font-weight:600; font-size:.98rem; margin-top:.05rem; line-height:1.35; overflow-wrap:anywhere; }
  .rv-meta { font-size:.76rem; color:var(--muted); margin-top:.05rem; }
  .rv-tel { color:var(--red); text-decoration:none; font-weight:500; white-space:nowrap; }
  .rv-note { font-size:.74rem; color:var(--text); background:var(--off-white); border-radius:8px; padding:.3rem .5rem; margin-top:.35rem; overflow-wrap:anywhere; }
  .rv-chip { display:inline-block; font-size:.56rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; margin-left:.3rem; vertical-align:2px; white-space:nowrap; }
  .rv-chip.in { background:var(--blue-light); color:var(--blue); }
  .rv-chip.ns { background:#F6E2E1; color:var(--red-dark); }
  .rv-chip.cx { background:var(--off-white); color:var(--muted); border:1px solid var(--border); }
  .rv-chip.late { background:var(--amber-light); color:var(--amber); }
  .rv-chip.big { background:#EDE3C9; color:#7A5B12; }
  .rv-acts { display:flex; gap:.35rem; margin-top:.55rem; flex-wrap:wrap; }
  .rv-act { font-family:var(--sans); font-size:.62rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; border-radius:999px; padding:.5rem .75rem; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rv-act.go { background:var(--blue); border-color:var(--blue); color:#fff; }
  .rv-act.no { color:var(--red-dark); border-color:rgba(176,16,21,.35); }
  .rv-act.armed { background:var(--red); border-color:var(--red); color:#fff; }
  .rv-act:disabled { opacity:.5; cursor:wait; }
  .rv-empty { margin:1.5rem 0 0; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.6; padding:2rem 1rem; background:var(--white); border:1px dashed var(--border); border-radius:14px; }
  .rv-rail { position:absolute; left:1rem; top:0; width:54px; height:var(--eh, 360px); pointer-events:none; overflow:hidden;
             -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 30px), transparent 100%);
                     mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 30px), transparent 100%); }
  .rv-pill { position:absolute; left:0; width:54px; height:52px; top:calc(var(--eh, 360px) / 2 - 26px); border-radius:14px; background:var(--ink); box-shadow:0 8px 20px rgba(43,33,26,.25); overflow:hidden; }
  .rv-wheel { position:absolute; left:0; top:0; width:54px; }
  .rv-tick { position:absolute; left:0; width:54px; height:44px; margin-top:-22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
             font-family:var(--serif); font-weight:600; line-height:1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; color:var(--text); }
  .rv-tick small { font-family:var(--sans); font-size:.5rem; letter-spacing:.14em; font-weight:600; color:var(--muted); margin-top:.18rem; }
  .rv-tick.gap { font-family:var(--sans); letter-spacing:.2em; color:var(--muted); }
  .rv-pill .rv-tick { color:var(--white); }
  .rv-pill .rv-tick small { color:rgba(252,249,244,.7); }
  .rv-tick i { position:absolute; right:3px; top:7px; width:5px; height:5px; border-radius:50%; background:var(--red); }
  .rv-pill .rv-tick i { background:#FF9C92; }
  .rv-hand { position:absolute; left:calc(1rem + 54px); width:8px; top:calc(var(--eh, 360px) / 2 - 1px); height:2px; background:var(--ink); border-radius:2px; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .rv-w { will-change:auto; } }

  /* ── SHEET (big-party requests) ── */
  .rv-scrim { position:fixed; inset:0; background:rgba(21,13,9,.45); z-index:300; }
  .rv-sheet { position:fixed; left:0; right:0; bottom:0; z-index:301; max-height:88vh; overflow-y:auto; background:var(--white); border-radius:20px 20px 0 0; padding:.6rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 1.4rem); box-shadow:var(--shadow-lg); max-width:720px; margin:0 auto; }

<script>
// ── manager.html ──
//
// The dashboard a restaurant uses to run itself without calling Sebastian, in
// three tabs: Reservations (the day, arrived / no-show, big-party requests,
// hours, holidays, rooms and rules), Menu (sold out, hidden, Chef's Pick, price
// and the written details) and Team (who can manage the restaurant).
// Crew see only Reservations, with no buttons.
//
// Nothing on this page is a security boundary. It hides buttons the account
// may not use, but every save goes to /api/manager-dish, which re-checks the
// caller's role against the database before it writes a single column. If
// somebody unhides a button in their console, the server still says no.

const SUPABASE_URL = 'https://pkdwrjwsqrlfdxgqmpva.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZHdyandzcXJsZmR4Z3FtcHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjczMTksImV4cCI6MjA5ODM0MzMxOX0.eeD6NYU4u-heag5LbkZJT-jENI3AuodlMzebOsxOv2c';

const LIMITS = { name:80, description:600, about:4000, modifications:1000, wine:400, cocktail:400, ingredients:1000, allergens_text:1000 };

let ACCESS = null;         // what this account may do, straight from the server
let RESTAURANT = null;     // the one being managed right now
let DISHES_ROWS = [];      // raw dish rows for that restaurant
let openDishId = null;
let DISHES_LOADED = false; // the menu is loaded when the Menu tab is first opened
let DISHES_ERROR = null;

// Which tab is showing. The address remembers it (#reservations, #menu, #team),
// so the corner menu's "Manage Reservations" and a refresh land in the right place.
const TABS = { reservations:'Reservations', menu:'Menu', team:'Team' };
let TAB = tabFromHash() || 'reservations';
function tabFromHash(){ const t = (location.hash||'').replace('#',''); return TABS[t] ? t : null; }

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function wrap(){return document.getElementById('m-wrap');}


// A serverless function that crashes returns Vercel's plain-text error page,
// not JSON, and res.json() then throws "Unexpected token 'A'…" — an error
// about the error, which says nothing about what broke. Read the body once,
// try to parse it, and if it is not JSON report the status and what the
// server actually said.
async function callApi(path, options){
  const res = await fetch(path, options);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){}
  if(data === null && !res.ok){
    const snippet = text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
    throw new Error('The server returned '+res.status+' instead of data'
      + (snippet ? ' — "'+snippet+'"' : '')
      + '. Check the function logs in Vercel.');
  }
  return { res, data: data || {} };
}

// ── STALE SCREEN ──
//
// Sebastian noticed that removing someone did not change their screen until
// they logged out. He was right, and it is worth being precise about what it
// means: every save goes to /api, which re-reads the roles table on that
// request, so a removed manager can already do nothing. The page just has not
// been told yet.
//
// Still, a dashboard that looks like it works and refuses everything is a bad
// way to find out. So the page re-asks whenever it comes back to the front —
// which is when someone picks their phone up again — and no more than once a
// minute, because a page left open all service should not poll.
let lastChecked = 0;
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible') return;
  if(!currentSession) return;
  if(Date.now() - lastChecked < 60000) return;
  boot();
});

// ── LOAD ──
async function boot(){
  lastChecked = Date.now();
  const w = wrap();
  if(!currentSession){
    w.innerHTML =
      '<div class="m-card">'
    + '<div class="m-eyebrow">Restaurant access</div>'
    + '<div class="m-h">Log in to manage your restaurant</div>'
    + '<div class="m-sub">Use the same phone number and PIN you use on the site. If your account has not been given access yet, ask Seb\'s Analytics to add it.</div>'
    + '<div style="margin-top:1.2rem;"><button class="m-btn" onclick="openTasterModal()">Log In</button></div>'
    + '</div>';
    return;
  }

  w.innerHTML = '<div class="m-skel"></div><div class="m-skel"></div>';

  let data;
  try{
    const {res, data:payload} = await callApi('/api/my-access', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession}
    });
    data = payload;
    if(res.status===401){ logout(); boot(); return; }
    if(!res.ok) throw new Error(data.error||'Could not load your access.');
  }catch(e){
    w.innerHTML = '<div class="m-err">'+esc(e.message||'Could not reach the server.')+'</div>';
    return;
  }

  ACCESS = data;

  if(!ACCESS.restaurants.length){
    // Two very different reasons for an empty list, and saying the wrong one
    // sends you looking in the wrong place. A platform admin sees every
    // restaurant there is, so an empty list means there are none — not that
    // the account lacks permission.
    const reason = ACCESS.isPlatformAdmin
      ? '<div class="m-eyebrow">Nothing to manage</div>'
        + '<div class="m-h">Hi '+esc(ACCESS.firstName||'there')+'</div>'
        + '<div class="m-sub">You are the platform admin, so you see every restaurant — and right now the <strong>restaurants</strong> table has no rows in it. Add the restaurant, then reload.</div>'
      : '<div class="m-eyebrow">No access yet</div>'
        + '<div class="m-h">Hi '+esc(ACCESS.firstName||'there')+'</div>'
        + '<div class="m-sub">This account has no role at any restaurant yet. Ask your manager or Seb\'s Analytics to add it, then reload this page.</div>';
    w.innerHTML = '<div class="m-card">' + reason + '</div>';
    return;
  }

  RESTAURANT = ACCESS.restaurants.find(r=>String(r.id)===String(RESTAURANT&&RESTAURANT.id)) || ACCESS.restaurants[0];
  mountPage();
}

// Draws the page for the current tab and loads what that tab needs.
function mountPage(){
  render();
  if(TAB==='reservations') rvStart();
  else if(TAB==='menu' && !DISHES_LOADED) loadDishes();
  else if(TAB==='team') loadPeople();
}

function levelHere(){ return RESTAURANT ? Number(RESTAURANT.level)||0 : 0; }
// Crew (1) see Reservations only; everyone above sees all three.
function allowedTabs(){ return levelHere() >= 2 ? ['reservations','menu','team'] : ['reservations']; }

function switchTab(t){
  if(!allowedTabs().includes(t) || t===TAB) return;
  TAB = t;
  if(history.replaceState) history.replaceState(null, '', '#'+t);
  if(t!=='reservations'){ RV.view = 'day'; document.body.classList.remove('rv-mode'); rvPaintSheet(); }
  window.scrollTo(0, 0);
  mountPage();
}

window.addEventListener('hashchange', function(){
  const t = tabFromHash();
  if(t && ACCESS && RESTAURANT && t!==TAB) switchTab(t);
});

async function loadDishes(){
  DISHES_ERROR = null;
  try{
    // Hidden dishes must appear here — hiding one on the public menu is not the
    // same as losing the switch that brings it back.
    const res = await fetch(SUPABASE_URL+'/rest/v1/dishes?restaurant_id=eq.'+RESTAURANT.id
      +'&select=id,slug,name,emoji,price,description,about,modifications,wine,cocktail,ingredients,restaurant_category,is_chefs_pick,is_hidden,sold_out_until,sort_order'
      +'&order=sort_order.asc',
      {headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    if(!res.ok) throw new Error('Could not load the menu ('+res.status+').');
    DISHES_ROWS = await res.json();
    DISHES_LOADED = true;
  }catch(e){
    DISHES_ERROR = e.message;
  }
  if(TAB==='menu') render();
}

// ── RENDER ──
function header(){
  const picker = ACCESS.restaurants.length>1
    ? '<div class="m-field" style="margin-top:1rem;">'
      + '<div class="m-field-label">Restaurant</div>'
      + '<select class="m-select" id="m-rest" onchange="switchRestaurant(this.value)">'
      + ACCESS.restaurants.map(r=>'<option value="'+r.id+'"'+(String(r.id)===String(RESTAURANT.id)?' selected':'')+'>'+esc(r.name)+'</option>').join('')
      + '</select></div>'
    : '';
  const roleClass = RESTAURANT.role==='platform'?'platform':(RESTAURANT.role==='owner'?'owner':'');
  const roleLabel = RESTAURANT.role==='platform'?'Platform admin':RESTAURANT.role;
  return '<div class="m-card m-head-card">'
    + '<div class="m-head-row"><div>'
    +   '<div class="m-eyebrow">Signed in as '+esc(ACCESS.firstName||'')+'</div>'
    +   '<div class="m-h">'+esc(RESTAURANT.name||'Restaurant')+'</div>'
    + '</div><span class="m-role '+roleClass+'">'+esc(roleLabel)+'</span></div>'
    + picker
    + '</div>';
}

function tabsBar(){
  const tabs = allowedTabs();
  const gear = TAB==='reservations'
    ? '<button type="button" class="m-gear'+(RV.view==='settings'?' on':'')+'" aria-label="Numbers and settings" title="Numbers and settings" onclick="rvOpenSettings()">'
      + '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>'
    : '';
  if(tabs.length < 2) return gear ? '<div class="m-tabs"><div class="m-tabbar"><span class="m-tab on">Reservations</span></div>'+gear+'</div>' : '';
  return '<div class="m-tabs"><div class="m-tabbar" role="tablist">'
    + tabs.map(t => '<button type="button" role="tab" class="m-tab'+(t===TAB?' on':'')+'" aria-selected="'+(t===TAB)+'" onclick="switchTab(\''+t+'\')">'+TABS[t]+'</button>').join('')
    + '</div>'+gear+'</div>';
}

function render(){
  if(!allowedTabs().includes(TAB)) TAB = 'reservations';
  document.body.classList.toggle('rv-mode', TAB==='reservations' && RV.view==='day');
  const top = header() + tabsBar();
  if(TAB==='team'){
    wrap().innerHTML = top + peopleSection();
    return;
  }
  if(TAB==='menu'){
    if(DISHES_ERROR){ wrap().innerHTML = top + '<div class="m-err">'+esc(DISHES_ERROR)+'</div>'; return; }
    if(!DISHES_LOADED){ wrap().innerHTML = top + '<div class="m-skel"></div><div class="m-skel"></div><div class="m-skel"></div>'; return; }
    wrap().innerHTML = top + (DISHES_ROWS.length ? DISHES_ROWS.map(dishCard).join('')
                                                 : '<div class="m-empty">This restaurant has no dishes yet.</div>');
    return;
  }
  wrap().innerHTML = top + '<div id="rv-root"></div>';
  rvRender();
}

function dishCard(d){
  const open = String(d.id)===String(openDishId);
  const soldOut = !!d.sold_out_until;
  const flags = []
    .concat(soldOut ? '<span class="m-flag sold">Sold out</span>' : [])
    .concat(d.is_hidden ? '<span class="m-flag hid">Hidden</span>' : [])
    .concat(d.is_chefs_pick ? '<span class="m-flag pick">Chef\'s Pick</span>' : [])
    // Visible from the list, because a dish with no allergens declared is the
    // one that needs attention.
    .concat(allergenCount(d) === 0 ? '<span class="m-flag sold">No allergens set</span>' : []);

  return '<div class="m-dish'+(open?' open':'')+(d.is_hidden?' is-hidden':'')+'" id="dish-'+d.id+'">'
    + '<div class="m-dish-head" onclick="toggleDish('+d.id+')">'
    +   '<span class="m-dish-emoji">'+esc(d.emoji||'🍽️')+'</span>'
    +   '<div class="m-dish-id">'
    +     '<div class="m-dish-name">'+esc(d.name)+'</div>'
    +     '<div class="m-dish-meta">$'+Number(d.price||0).toFixed(2)+' &middot; '+esc(d.restaurant_category||'')+'</div>'
    +     (flags.length?'<div class="m-flags">'+flags.join('')+'</div>':'')
    +   '</div>'
    +   '<span class="m-dish-caret">&#9656;</span>'
    + '</div>'
    + '<div class="m-dish-body">'
    +   switchRow(d.id,'sold_out',soldOut,'Sold out','Comes off the menu as sold out and stays that way until you switch it back. Nothing resets it overnight.',true)
    +   switchRow(d.id,'is_hidden',!!d.is_hidden,'Hidden from the menu','Nobody sees this dish on the site at all. Use it for a dish that is off for the season.',false)
    +   switchRow(d.id,'is_chefs_pick',!!d.is_chefs_pick,'Chef\'s Pick','Only one dish at a time. Turning this on takes it off whichever dish has it now.',false)
    +   textFields(d)
    +   '<div class="m-actions">'
    +     '<button class="m-save" id="save-'+d.id+'" onclick="saveText('+d.id+')" disabled>Save changes</button>'
    +     '<button class="m-revert" onclick="revert('+d.id+')">Undo</button>'
    +   '</div>'
    +   '<div class="m-locked"><strong>Photos are not editable here.</strong> Photography is work Seb\'s Analytics is paid for &mdash; message Seb to change a dish photo. Everything else about this dish is yours to edit.</div>'
    + '</div>'
    + '</div>';
}

function switchRow(dishId, field, on, label, note, warn){
  return '<div class="m-switch-row">'
    + '<div><div class="m-switch-label">'+label+'</div><div class="m-switch-note">'+note+'</div></div>'
    + '<button class="m-switch'+(on?' on':'')+(warn?' warn':'')+'" id="sw-'+dishId+'-'+field+'"'
    +   ' role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+label+'"'
    +   ' onclick="toggleFlag('+dishId+',\''+field+'\')"></button>'
    + '</div>';
}

function textFields(d){
  const f = (field,label,value,type)=>{
    const id = 'f-'+d.id+'-'+field;
    const control = type==='area'
      ? '<textarea class="m-textarea" id="'+id+'" oninput="dirty('+d.id+',\''+field+'\')" maxlength="'+(LIMITS[field]+200)+'">'+esc(value||'')+'</textarea>'
      : '<input class="m-input" id="'+id+'" value="'+esc(value==null?'':value)+'" oninput="dirty('+d.id+',\''+field+'\')"'
        + (type==='price'?' type="number" step="0.01" min="0" max="10000" inputmode="decimal"':'')+'>';
    const counter = LIMITS[field] ? '<div class="m-count" id="c-'+d.id+'-'+field+'">'+String(value||'').length+' / '+LIMITS[field]+'</div>' : '';
    return '<div class="m-field"><div class="m-field-label">'+label+'</div>'+control+counter+'</div>';
  };
  return f('name','Dish name',d.name,'text')
    + f('price','Price',d.price,'price')
    + f('description','Short description',d.description,'area')
    + f('about','About this dish',d.about,'area')
    + f('ingredients','Ingredients (comma separated)',d.ingredients,'area')
    + f('modifications','Modifications',d.modifications,'area')
    + f('wine','Wine pairing',d.wine,'text')
    + f('cocktail','Cocktail pairing',d.cocktail,'text')
    + classifySection(d)
    + allergenSection(d);
}


// ── ALLERGENS ──
// The same 30 keys as api/_lib/dish-fields.js, with names a person can read.
// The major nine come first because they cause most serious reactions and a
// manager in a rush should meet them before 'buckwheat'.
const ALLERGEN_GROUPS = [
  { title: 'The major nine', major: true, items: [
    ['allergen_milk_dairy','Milk / dairy'], ['allergen_eggs','Eggs'],
    ['allergen_fish','Fish'], ['allergen_crustaceans','Crustaceans (shrimp, crab)'],
    ['allergen_tree_nuts','Tree nuts'], ['allergen_peanuts','Peanuts'],
    ['allergen_wheat','Wheat'], ['allergen_soy','Soy'], ['allergen_sesame','Sesame'],
  ]},
  { title: 'Also commonly declared', items: [
    ['allergen_molluscs','Molluscs (clams, squid)'], ['allergen_gluten_cereals','Gluten cereals'],
    ['allergen_celery','Celery'], ['allergen_mustard','Mustard'],
    ['allergen_sulphites','Sulphites'], ['allergen_lupin','Lupin'],
  ]},
  { title: 'Everything else', items: [
    ['allergen_coconut','Coconut'], ['allergen_corn_maize','Corn / maize'],
    ['allergen_other_seeds','Other seeds'], ['allergen_other_legumes','Other legumes'],
    ['allergen_buckwheat','Buckwheat'], ['allergen_rice','Rice'],
    ['allergen_fruits','Fruits'], ['allergen_vegetables','Vegetables'],
    ['allergen_garlic_onion','Garlic / onion'], ['allergen_spices_herbs','Spices / herbs'],
    ['allergen_meat_alpha_gal','Red meat (alpha-gal)'], ['allergen_gelatin_collagen','Gelatin / collagen'],
    ['allergen_yeast','Yeast'], ['allergen_additives_preservatives','Additives / preservatives'],
    ['allergen_other','Other'],
  ]},
];
const ALLERGEN_KEYS = ALLERGEN_GROUPS.flatMap(g => g.items.map(i => i[0]));

// How the dish is classified. Plain short labels, used for search and for the
// research later — not descriptions.
const CLASSIFY_FIELDS = [
  ['dish_type','Dish type'], ['cuisine_origin','Cuisine origin'],
  ['main_ingredient','Main ingredient'], ['protein_type','Protein type'],
  ['cooking_method','Cooking method'], ['flavor_profile','Flavour profile'],
  ['meal_moment','Meal moment'], ['temperature','Temperature'],
  ['spice_level','Spice level'], ['portion_format','Portion format'],
];

// Which collapsible sections are open, by dish. Kept outside the render so a
// save does not fold everything up again mid-edit.
let openGroups = {};
function groupOpen(dishId, key){ return !!(openGroups[dishId] && openGroups[dishId][key]); }
function toggleGroup(dishId, key){
  openGroups[dishId] = openGroups[dishId] || {};
  openGroups[dishId][key] = !openGroups[dishId][key];
  render();
}

function allergenCount(d){ return ALLERGEN_KEYS.filter(k => d[k] === true).length; }

function allergenSection(d){
  const n = allergenCount(d);
  const open = groupOpen(d.id, 'alg');
  const body =
      '<div class="m-alg-note"><strong>This is the restaurant\'s own declaration.</strong> '
    + 'Tick everything the dish contains, including anything it touches in the kitchen. '
    + 'A customer with that allergy sees a warning on this dish. '
    + 'Leaving a box unticked is read as &ldquo;not present&rdquo; &mdash; so if you are unsure, tick it.</div>'
    + ALLERGEN_GROUPS.map(g =>
        '<div class="m-alg-sub">'+g.title+'</div>'
      + '<div class="m-alg-grid">'
      + g.items.map(([key,label])=>{
          const on = d[key] === true;
          return '<label class="m-alg'+(on?' on':'')+(g.major?' major':'')+'">'
            + '<input type="checkbox"'+(on?' checked':'')+' onchange="toggleAllergen('+d.id+',\''+key+'\',this.checked)">'
            + '<span>'+label+'</span></label>';
        }).join('')
      + '</div>'
      ).join('')
    + '<div class="m-field"><div class="m-field-label">Anything else worth saying</div>'
    + '<textarea class="m-textarea" id="f-'+d.id+'-allergens_text" oninput="dirty('+d.id+',\'allergens_text\')" '
    + 'placeholder="e.g. fried in the same oil as shellfish">'+esc(d.allergens_text||'')+'</textarea>'
    + '<div class="m-count" id="c-'+d.id+'-allergens_text">'+String(d.allergens_text||'').length+' / 1000</div></div>';

  return '<div class="m-group'+(open?' open':'')+'">'
    + '<div class="m-group-head" onclick="toggleGroup('+d.id+',\'alg\')">'
    +   '<div><span class="m-group-title">Allergens</span> '
    +   '<span class="m-alg-count'+(n?'':' none')+'">'+(n?n+' ticked':'none set')+'</span></div>'
    +   '<span class="m-group-caret">&#9656;</span>'
    + '</div>'
    + '<div class="m-group-body">'+body+'</div>'
    + '</div>';
}

function classifySection(d){
  const open = groupOpen(d.id, 'cls');
  const filled = CLASSIFY_FIELDS.filter(([k]) => d[k]).length;
  const body = CLASSIFY_FIELDS.map(([key,label]) =>
      '<div class="m-field"><div class="m-field-label">'+label+'</div>'
    + '<input class="m-input" id="f-'+d.id+'-'+key+'" value="'+esc(d[key]==null?'':d[key])+'" '

    + '<div class="m-group-head" onclick="toggleGroup('+d.id+',\'cls\')">'

    +   '<span class="m-group-sum">'+filled+' of '+CLASSIFY_FIELDS.length+' filled</span></div>'

// An allergen saves the moment it is ticked. No Save button between a manager
// remembering the dish has sesame in it and the warning reaching a customer.
async function toggleAllergen(dishId, key, checked){
  const d = rowFor(dishId); if(!d) return;
  const saved = await save(dishId, { [key]: !!checked });
  if(saved) showToast(checked ? 'Allergen added' : 'Allergen removed');
}


// ── PEOPLE ──
// The page draws only what the server says this account may do; the server
// decides again on every request. api/roles.js has the rule: you may grant or
// remove a role strictly below your own level.
let PEOPLE = null;

const ROLE_LABEL = { owner:'Owner', manager:'Manager', crew:'Crew' };
const ROLE_LEVEL = { crew:1, manager:2, owner:3 };

async function loadPeople(){
  try{
    const {res, data} = await callApi('/api/roles', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
      body:JSON.stringify({action:'list', restaurantId:RESTAURANT.id})
    });
    if(!res.ok) throw new Error(data.error||'Could not load the people list.');
    PEOPLE = data;
  }catch(e){
    PEOPLE = {error:e.message};
  }
  if(TAB==='team') render();
}

function peopleSection(){
  if(!PEOPLE) return '<div class="m-card"><div class="m-eyebrow">People</div><div class="m-sub">Loading…</div></div>';
  if(PEOPLE.error) return '<div class="m-card"><div class="m-eyebrow">People</div><div class="m-err" style="margin:0;">'+esc(PEOPLE.error)+'</div></div>';

  // You may appoint any role below your own. Platform admin (4) can appoint
  // owners; an owner (3) cannot.
  const grantable = Object.keys(ROLE_LEVEL).filter(r => PEOPLE.myLevel > ROLE_LEVEL[r])
                          .sort((a,b)=>ROLE_LEVEL[b]-ROLE_LEVEL[a]);

  const list = PEOPLE.people.length
    ? PEOPLE.people.map(p =>
        '<div class="m-person">'

      +   '<div class="m-person-sub">'+(p.username?esc(p.username)+' · ':'')+(p.phoneEnds?'ends '+esc(p.phoneEnds):'')+'</div>'
      +   (p.role==='crew'
            ? '<label class="m-codes"><input type="checkbox"'+(p.canIssueCodes?' checked':'')
              + ' onchange="setCodes('+p.id+',this.checked)"> can give out loyalty codes '
              + '<span style="opacity:.7;">(not active yet)</span></label>'
            : '')
      + '</div>'
      + '<button class="m-person-x" onclick="removePerson('+Number(p.id)+')"'
      +   (p.canRemove?'':' disabled title="Your role cannot remove this person"')+'>Remove</button>'
      + '</div>').join('')
    : '<div class="m-sub" style="padding:.5rem 0;">Nobody has a role here yet.</div>';

  const adder = grantable.length
    ? '<div class="m-add-row">'
      + '<input class="m-input" id="add-phone" type="tel" placeholder="Phone number" inputmode="tel">'
      + '<select class="m-select" id="add-role">'
      +   grantable.map(r=>'<option value="'+r+'">'+ROLE_LABEL[r]+'</option>').join('')
      + '</select>'
      + '<button class="m-btn" id="add-btn" onclick="addPerson()">Add</button>'
      + '</div>'
      + '<div class="m-sub" style="margin-top:.6rem;font-size:.76rem;">'
      + 'They need an account on the site already &mdash; adding a number that has never signed up would leave a permission waiting for whoever claims that number next.'
      + '</div>'
    : '<div class="m-sub" style="margin-top:.8rem;">Your role cannot appoint anyone here.</div>';

  return '<div class="m-card">'
    + '<div class="m-eyebrow">People</div>'
    + '<div class="m-h" style="font-size:1.25rem;margin-bottom:.8rem;">Who can manage '+esc(RESTAURANT.name||'this restaurant')+'</div>'

    + '</div>';
