<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manager · The Hungry Fork</title>
<!-- r38 (Sebastian, 16 Oct): this page as an app on the staff's phones. Share → Add to Home Screen (iPhone) or
     ⋮ → Add to Home screen / Install app (Android) puts the "HF Staff" icon on the phone; it opens this page full
     screen, without the browser's bars. Only this page offers it: the guests' pages stay as they are. The clock
     bar on top stays black (it never covers the page). staff-app.json says the rest (name, icons, colors). -->
<link rel="manifest" href="/staff-app.json">
<link rel="apple-touch-icon" href="/staff-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HF Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --red: #B01015; --red-dark: #7E0A0E; --red-light: #F7E3E1;
    --white: #FCF9F4; --off-white: #F5EEE3; --text: #2B211A;
    --muted: #8A7B6E; --border: #E9E0D3; --star-on: #D9A441;
    --star-off: #DCD2C4; --green: #4C7A4C; --ink: #2B211A;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --shadow-sm: 0 1px 3px rgba(43,33,26,.06);
    --shadow-md: 0 10px 30px rgba(43,33,26,.10);
    --shadow-lg: 0 20px 50px rgba(43,33,26,.18);
  }
  body { font-family:var(--sans); color:var(--text); background:var(--off-white); line-height:1.65; -webkit-font-smoothing:antialiased; padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6.5rem); }   /* r29: room under the last card for the round chat button */

  .m-topbar { position:sticky; top:0; z-index:120; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px; background:rgba(21,13,9,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .m-home { color:rgba(252,249,244,.8); text-decoration:none; font-size:.8rem; letter-spacing:.06em; white-space:nowrap; }
  .m-topbar-title { font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--white); }
  .m-topbar-spacer { width:64px; }

  .m-wrap { max-width:720px; margin:0 auto; padding:1.5rem 1rem 0; }

  .m-card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:1.4rem 1.2rem; box-shadow:var(--shadow-sm); margin-bottom:1rem; }
  .m-eyebrow { font-size:.66rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:.5rem; }
  .m-h { font-family:var(--serif); font-size:1.6rem; font-weight:600; line-height:1.2; margin-bottom:.4rem; }
  .m-sub { font-size:.86rem; font-weight:300; color:var(--muted); line-height:1.6; }

  .m-btn { background:var(--ink); color:var(--white); border:none; border-radius:999px; padding:.85rem 1.6rem; font-size:.78rem; font-weight:500; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); transition:background .2s, transform .15s; }
  .m-btn:hover { background:#463629; transform:translateY(-1px); }
  .m-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; transform:none; }

  .m-select { width:100%; border:1px solid var(--border); border-radius:10px; padding:.7rem .9rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; }
  .m-select:focus { border-color:var(--red); }

  .m-role { display:inline-block; flex:none; font-size:.6rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; padding:.3rem .7rem; border-radius:999px; background:var(--off-white); color:var(--muted); border:1px solid var(--border); text-align:center; white-space:nowrap; line-height:1.4; }
  .m-role.platform { background:var(--ink); color:var(--white); border-color:var(--ink); }
  .m-role.owner { background:var(--red-light); color:var(--red-dark); border-color:rgba(176,16,21,.25); }

  /* ── DISH ROW ── */
  .m-dish { background:var(--white); border:1px solid var(--border); border-radius:14px; margin-bottom:.7rem; box-shadow:var(--shadow-sm); overflow:hidden; transition:opacity .2s; }
  .m-dish.is-hidden { opacity:.55; }
  .m-dish-head { display:flex; align-items:center; gap:.85rem; padding:.95rem 1rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-dish-emoji { font-size:1.6rem; line-height:1; flex:none; }
  /* r29 (Sebastian, 12 Oct): the dish's own small photo instead of the emoji (the emoji comes back if the photo cannot be loaded) */
  .m-dish-thumb { flex:none; width:54px; height:54px; border-radius:12px; overflow:hidden; background:var(--off-white); border:1px solid var(--border); display:block; }
  .m-dish-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
  .m-dish-id { flex:1; min-width:0; }
  .m-dish-name { font-family:var(--serif); font-size:1.15rem; font-weight:600; line-height:1.25; }
  .m-dish-meta { font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .m-dish-caret { color:var(--muted); font-size:.8rem; flex:none; transition:transform .25s; }
  .m-dish.open .m-dish-caret { transform:rotate(90deg); }

  .m-flags { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.35rem; }
  .m-flag { font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; }
  .m-flag.sold { background:#F6E2E1; color:var(--red-dark); }
  .m-flag.hid  { background:var(--off-white); color:var(--muted); }
  .m-flag.pick { background:#EDE3C9; color:#7A5B12; }

  .m-dish-body { display:none; padding:0 1rem 1.1rem; border-top:1px solid var(--border); }
  .m-dish.open .m-dish-body { display:block; }

  .m-switch-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 0; border-bottom:1px solid var(--border); }
  .m-switch-label { font-size:.88rem; }
  .m-switch-note { font-size:.72rem; color:var(--muted); line-height:1.5; margin-top:.1rem; }
  .m-switch { flex:none; width:50px; height:29px; border-radius:999px; border:none; background:var(--star-off); position:relative; cursor:pointer; transition:background .22s; padding:0; }
  .m-switch::after { content:''; position:absolute; top:3px; left:3px; width:23px; height:23px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.28); transition:transform .22s; }
  .m-switch.on { background:var(--green); }
  .m-switch.on::after { transform:translateX(21px); }
  .m-switch.on.warn { background:var(--red); }
  .m-switch:disabled { opacity:.5; cursor:not-allowed; }

  .m-field { margin-top:.95rem; }
  .m-field-label { font-size:.66rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.35rem; }
  .m-input, .m-textarea { min-width:0; max-width:100%; width:100%; border:1px solid var(--border); border-radius:10px; padding:.65rem .85rem; font-size:.9rem; font-family:var(--sans); color:var(--text); background:#fff; outline:none; transition:border-color .2s; }
  .m-input:focus, .m-textarea:focus { border-color:var(--red); }
  .m-textarea { resize:vertical; min-height:80px; line-height:1.6; }
  .m-count { font-size:.68rem; color:var(--muted); text-align:right; margin-top:.2rem; }
  .m-count.over { color:var(--red); font-weight:600; }

  .m-actions { display:flex; align-items:center; gap:.7rem; margin-top:1rem; }
  .m-save { background:var(--red); color:#fff; border:none; border-radius:999px; padding:.7rem 1.4rem; font-size:.72rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-save:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
  .m-revert { background:none; border:none; color:var(--muted); font-size:.76rem; text-decoration:underline; cursor:pointer; font-family:var(--sans); }

  /* ── ALLERGEN CHECKLIST ── */
  .m-group { border-top:1px solid var(--border); margin-top:1.1rem; padding-top:.9rem; }
  .m-group-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-group-title { font-family:var(--serif); font-size:1.02rem; font-weight:600; }
  .m-group-sum { font-size:.7rem; color:var(--muted); }
  .m-group-caret { color:var(--muted); font-size:.75rem; transition:transform .25s; }
  .m-group.open .m-group-caret { transform:rotate(90deg); }
  .m-group-body { display:none; padding-top:.7rem; }
  .m-group.open .m-group-body { display:block; }

  .m-alg-note { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.75rem .85rem; font-size:.76rem; line-height:1.6; margin-bottom:.9rem; }
  .m-alg-sub { font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:.9rem 0 .5rem; }
  .m-alg-sub:first-child { margin-top:0; }
  .m-alg-grid { display:grid; grid-template-columns:1fr 1fr; gap:.4rem .6rem; }
  @media (max-width:420px) { .m-alg-grid { grid-template-columns:1fr; } }
  .m-alg { display:flex; align-items:center; gap:.5rem; padding:.42rem .55rem; border:1px solid var(--border); border-radius:9px; background:#fff; cursor:pointer; font-size:.82rem; -webkit-tap-highlight-color:transparent; }
  .m-alg input { accent-color:var(--red); width:16px; height:16px; flex:none; margin:0; }
  .m-alg.on { border-color:rgba(176,16,21,.45); background:#FDF4F3; font-weight:500; }
  .m-alg.major { border-left:3px solid var(--red); }

  .m-alg-count { display:inline-block; font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; background:#F6E2E1; color:var(--red-dark); }
  .m-alg-count.none { background:var(--off-white); color:var(--muted); }

  .m-locked { margin-top:1rem; padding:.8rem .9rem; background:var(--off-white); border-radius:10px; font-size:.76rem; color:var(--muted); line-height:1.65; }

  /* ── PEOPLE ── */
  .m-person { display:flex; align-items:center; gap:.8rem; padding:.75rem 0; border-bottom:1px solid var(--border); }
  .m-person:last-child { border-bottom:none; }
  .m-person-id { flex:1; min-width:0; }
  .m-person-name { font-size:.92rem; font-weight:500; }
  .m-person-sub { font-size:.72rem; color:var(--muted); margin-top:.1rem; }
  .m-person-x { flex:none; background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:.3rem .75rem; font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); }
  .m-person-x:hover { border-color:var(--red); color:var(--red); }
  .m-person-x:disabled { opacity:.4; cursor:not-allowed; }
  .m-add-row { display:flex; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .m-add-row .m-input { flex:1 1 160px; }
  .m-add-row .m-select { flex:0 1 130px; }
  .m-codes { display:flex; align-items:center; gap:.45rem; font-size:.7rem; color:var(--muted); margin-top:.25rem; }
  .m-codes input { accent-color:var(--red); margin:0; }

  .m-empty { text-align:center; padding:3rem 1rem; color:var(--muted); font-size:.9rem; }
  .m-err { background:#F6E2E1; border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:10px; padding:.85rem 1rem; font-size:.85rem; margin-bottom:1rem; }

  .m-skel { height:74px; background:linear-gradient(90deg,#fff 25%,var(--off-white) 50%,#fff 75%); background-size:200% 100%; animation:sk 1.2s infinite; border-radius:14px; margin-bottom:.7rem; border:1px solid var(--border); }
  @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* ── HEADER, TABS ── */
  body.rv-mode { padding-bottom:0; }
  .m-head-card { padding:1rem 1.1rem; }
  .m-head-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; }
  .m-head-row .m-h { margin:0; font-size:1.35rem; }
  .m-head-row .m-eyebrow { margin-bottom:.2rem; }
  .m-tabs { display:flex; align-items:center; gap:.4rem; margin:0 0 .9rem; }
  .m-tabbar { flex:1; display:flex; background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px; }
  .m-tab { flex:1 1 auto; text-align:center; border:none; background:none; font-family:var(--sans); font-size:.68rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:.6rem .55rem; border-radius:999px; color:var(--muted); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .m-tab.on { background:var(--ink); color:var(--white); }
  .m-gear { flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; -webkit-tap-highlight-color:transparent; }
  .m-gear.on { background:var(--ink); color:var(--white); border-color:var(--ink); }
  /* r34: a red dot on the settings button: support messages not read yet */
  .m-gear { position:relative; }
  .m-gear-dot { position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding:0 4px; border-radius:999px; background:var(--red); color:#fff; border:2px solid var(--white);
                font-size:.6rem; font-weight:700; line-height:1; display:flex; align-items:center; justify-content:center; font-family:var(--sans); box-sizing:border-box; }
  /* r34: Settings → the sanitary inspection grade */
  .rv-g-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:.85rem 0 .5rem; }
  .rv-g-tile { height:98px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border-radius:12px; border:1px solid #E2D6C6; background:#fff;
               color:var(--text); font-family:var(--sans); font-size:.72rem; font-weight:500; cursor:pointer; padding:4px 0; min-width:0; -webkit-tap-highlight-color:transparent; }
  .rv-g-tile img { width:56px; height:56px; object-fit:contain; display:block; }
  .rv-g-tile .rv-g-none { width:50px; height:50px; margin:3px 0; border-radius:50%; border:1.5px dashed #CDBFAE; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .rv-g-tile.on { border:1.5px solid var(--red); background:var(--red-light); color:var(--red-dark); font-weight:600; }
  .rv-g-tile:disabled { cursor:default; }
  .rv-g-sees { font-size:.78rem; color:var(--text); margin:.15rem 0 .2rem; }
  .rv-g-note { font-size:.74rem; color:var(--muted); line-height:1.55; margin:.45rem 0 .2rem; }
  .rv-g-note a { color:var(--blue); font-weight:600; }
  /* r34: Settings → Support: the restaurant's conversation with Seb's Analytics */
  .sp-sub { font-size:.82rem; color:var(--muted); line-height:1.55; margin-top:.3rem; }
  .sp-msgs { max-height:440px; overflow-y:auto; background:var(--off-white); border-radius:12px; padding:.75rem .7rem; margin:.85rem 0 .75rem; display:flex; flex-direction:column; gap:.5rem; overscroll-behavior:contain; }
  .sp-msgs .mg-bub { max-width:88%; }
  .sp-empty { color:var(--muted); font-size:.82rem; line-height:1.55; text-align:center; padding:1.1rem .6rem; }
  .sp-seen { align-self:flex-end; font-size:.62rem; color:var(--muted); margin-top:-.3rem; }
  .sp-text { display:block; width:100%; min-height:96px; resize:vertical; font-family:var(--sans); font-size:.88rem; line-height:1.5; padding:.65rem .8rem;
             border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--text); }
  .sp-text:focus { outline:none; border-color:var(--red); }
  .sp-row { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-top:.55rem; }
  .sp-count { font-size:.7rem; color:var(--muted); }
  .sp-count.over { color:var(--red); font-weight:600; }
  .sp-waiting { margin-top:.75rem; font-size:.76rem; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; }
  .sp-wait { font-family:var(--sans); font-size:.76rem; font-weight:600; border:1px solid rgba(176,16,21,.35); background:var(--red-light); color:var(--red-dark); border-radius:999px; padding:.35rem .75rem; cursor:pointer; }
  .sp-foot { font-size:.72rem; color:var(--muted); line-height:1.55; margin-top:.75rem; }

  /* The corner menu's list is invisible while it is closed, but it is still a
     tall box in the top-right corner, and it swallowed taps on the gear and the
     › arrow under it. menu.html has the same two lines. */
  #hf-corner:not(.open), #hf-corner:not(.open) .hf-corner-items { pointer-events:none; }
  #hf-corner .hf-corner-toggle { pointer-events:auto; }

  /* ── RESERVATIONS: THE DAYS ── */
  :root { --blue:#2F5DA8; --blue-light:#E4ECF8; --amber:#8A5A0B; --amber-light:#F6EBD6; }
  .rv-car { display:flex; align-items:center; gap:.35rem; margin-bottom:.35rem; }
  .rv-arrow { flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:#fff; font-size:1.05rem; line-height:1; color:var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 0 2px; font-family:var(--sans); }
  .rv-arrow:disabled { opacity:.3; cursor:default; }
  /* The days swipe like the evening: a strip that scrolls sideways and snaps,
     the day in the middle bigger and dark. Every day is the same width, so the
     snapping never shifts; "bigger" is a transform, painted as it rolls. */
  .rv-strip { position:relative; flex:1; display:flex; align-items:center; gap:6px; overflow-x:auto; overflow-y:hidden; padding:.75rem 0; min-width:0;
              scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
              -webkit-mask-image:linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
                      mask-image:linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%); }
  .rv-strip::-webkit-scrollbar { display:none; }
  .rv-strip-pad { flex:none; width:1px; height:1px; }
  .rv-cday { flex:none; width:54px; text-align:center; background:#fff; border:1px solid var(--border); border-radius:12px; padding:.4rem 0; font-family:var(--sans); color:var(--text); cursor:pointer;
             scroll-snap-align:center; transform-origin:50% 50%; will-change:transform, opacity; -webkit-tap-highlight-color:transparent; }
  .rv-cday b { display:block; font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-cday span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-cday i { display:block; font-style:normal; font-size:.56rem; color:var(--red); font-weight:600; margin-top:.1rem; white-space:nowrap; }
  .rv-cday i.shut { color:var(--muted); font-weight:500; }
  .rv-cday.on { background:var(--ink); border-color:var(--ink); color:var(--white); box-shadow:0 8px 20px rgba(43,33,26,.25); }
  .rv-cday.on span { color:rgba(252,249,244,.75); } .rv-cday.on i { color:#FF9C92; } .rv-cday.on i.shut { color:rgba(252,249,244,.6); }
  /* r27 (Sebastian, 12 Oct): today is blue here too, as in Messages, so where we are is easy to find.
     Light blue when another day is shown; solid blue when today is the day in the middle. */
  .m-eyebrow .reviewer-handle { text-transform:none; letter-spacing:.02em; }   /* "Signed in as SANTIAGO (Santi_V)": the handle keeps its own letters */
  .rv-cday.today { z-index:1; background:var(--blue-light); border-color:var(--blue); box-shadow:0 0 0 1px var(--blue); }
  .rv-cday.today span { color:var(--blue); font-weight:700; }
  .rv-cday.today b { color:var(--blue); }
  .rv-cday.today i, .rv-cday.today i.shut { color:#1F3F75; }
  .rv-cday.today.on { background:var(--blue); border-color:var(--blue); box-shadow:0 8px 20px rgba(47,93,168,.4); }
  .rv-cday.today.on span, .rv-cday.today.on b, .rv-cday.today.on i, .rv-cday.today.on i.shut { color:#fff; }
  .rv-dateline { text-align:center; font-size:.64rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:.7rem; }

  .rv-tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; margin-bottom:.8rem; }
  .rv-tile { background:#fff; border:1px solid var(--border); border-radius:12px; padding:.55rem .3rem; text-align:center; font-family:var(--sans); color:var(--text); }
  button.rv-tile { cursor:pointer; }
  .rv-tile b { display:block; font-family:var(--serif); font-size:1.45rem; font-weight:600; line-height:1.1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; }
  .rv-tile span { font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .rv-tile.red b { color:var(--red); }
  .rv-banner { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--red-light); border:1px solid rgba(176,16,21,.25); color:var(--red-dark); border-radius:12px; padding:.6rem .85rem; font-size:.8rem; margin-bottom:.8rem; line-height:1.45; }

  /* ── RESERVATIONS: THE EVENING, AS A WATCH ── */
  .rv-evening { position:relative; margin:0 -1rem; transition:opacity .2s; }
  .rv-evening.busy { opacity:.45; }
  .rv-scroll { height:var(--eh, 360px); overflow-y:auto; scroll-snap-type:y mandatory; padding:0 1rem 0 calc(1rem + 62px);
               -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 42px, #000 calc(100% - 42px), transparent 100%);
                       mask-image:linear-gradient(to bottom, transparent 0, #000 42px, #000 calc(100% - 42px), transparent 100%);
               scrollbar-width:none; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  .rv-scroll::-webkit-scrollbar { display:none; }
  .rv-pad { height:calc(var(--eh, 360px) / 2 - 40px); }
  .rv-w { scroll-snap-align:center; background:#fff; border:1px solid var(--border); border-radius:14px; padding:.75rem .9rem .8rem;
          margin-bottom:.55rem; box-shadow:var(--shadow-sm); transform-origin:50% 50%; will-change:transform, opacity; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .rv-w.faded .rv-w-in { opacity:.6; }
  .rv-when { display:flex; justify-content:space-between; gap:.5rem; font-size:.6rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-variant-numeric:lining-nums; }
  .rv-when em { font-style:normal; letter-spacing:.08em; opacity:.8; }
  .rv-name { font-weight:600; font-size:.98rem; margin-top:.05rem; line-height:1.35; overflow-wrap:anywhere; }
  .rv-meta { font-size:.76rem; color:var(--muted); margin-top:.05rem; }
  .rv-tel { color:var(--red); text-decoration:none; font-weight:500; white-space:nowrap; }
  /* r29: "Write" next to Call on a big-party request, and what the card says about the guest's email */
  .rv-contact { display:flex; align-items:center; flex-wrap:wrap; gap:.4rem .8rem; margin-top:.4rem; font-size:.84rem; color:var(--muted); }
  .rv-write { display:inline-flex; align-items:center; gap:.35rem; min-height:34px; padding:0 .8rem; border-radius:999px; border:1px solid var(--blue); background:var(--blue-light);
              color:var(--blue); font-size:.74rem; font-weight:600; letter-spacing:.06em; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  .rv-write svg { flex:none; }
  .rv-mail { margin-top:.3rem; }
  /* r30 (Sebastian, 13 Oct): "Call (number)" and "Write SMS", the number and SMS in red, and the chat button at the
     right of the same line, as on the day's cards. The name and its handle run on one line (.rv-name-text). */
  .rv-rq .rv-contact { gap:.3rem 1rem; }
  .rv-rq .rv-contact .rv-chat-sign { margin:0 0 0 auto; }
  .rv-sms { letter-spacing:.04em; }
  .rv-rq .rv-name { align-items:center; }
  .rv-banner em { font-style:normal; font-weight:700; color:var(--red); white-space:nowrap; }
  /* r30: a phone's date and time fields keep to their box (iPhones draw them wider than asked unless their own look is
     switched off), and a date field never shares a line with another field on a phone. */
  .m-input[type=date], .m-input[type=time] { -webkit-appearance:none; appearance:none; min-height:2.75rem; line-height:1.3; }
  .m-input[type=date]::-webkit-date-and-time-value, .m-input[type=time]::-webkit-date-and-time-value { text-align:left; }
  .rv-stack { display:grid; grid-template-columns:minmax(0,1fr); gap:.5rem; }
  @media (max-width:560px) { .rv-form-row.has-date { grid-template-columns:minmax(0,1fr); } }
  /* r30: the Menu tab in groups (Starters, Entrées, …) */
  /* r36: Top Rated on the menu (the Menu tab) */
  .tr-card { padding:1.15rem 1.1rem .9rem; }
  .tr-lead { font-size:.8rem; color:var(--muted); line-height:1.5; margin-bottom:.4rem; }
  .tr-row { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.7rem 0; border-bottom:1px solid var(--border); }
  .tr-row:last-of-type { border-bottom:none; }
  .tr-name { min-width:0; }

  .tr-name small { display:block; font-size:.74rem; color:var(--muted); margin-top:.1rem; }
  .tr-row.off .tr-name b { color:var(--muted); }

  .tr-step { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:999px; background:#FBF7F1; }
  .tr-b { width:34px; height:32px; border:none; background:none; font-size:1.15rem; font-weight:600; color:var(--red); cursor:pointer; padding:0; }
  .tr-b:disabled { color:var(--star-off); cursor:default; }
  .tr-n { min-width:1.4rem; text-align:center; font-weight:700; font-size:.95rem; }
  .tr-note { font-size:.72rem; color:var(--muted); margin-top:.55rem; }
  .tr-err { font-size:.78rem; color:var(--red); margin-top:.55rem; }
  .m-switch:disabled { opacity:.45; cursor:default; }
  /* r36: Change the order (option B) */
  .m-dish-group.has-btn { margin-bottom:.7rem; }
  .m-dish-group.has-btn::after { display:none; }
  .m-dish-group > span { flex:1; }
  .dg-arrange { flex:none; margin-left:auto; border:1px solid var(--border); background:var(--white); border-radius:999px; padding:.42rem .8rem; font-family:var(--sans);
    font-size:.58rem; font-weight:700; letter-spacing:.12em; color:var(--red); text-transform:uppercase; cursor:pointer; }
  .dg-arrange.done { background:var(--red); color:#fff; border-color:var(--red); min-width:74px; }
  .dg-arrange:disabled { opacity:.7; cursor:default; }
  .arr-hint { font-size:.76rem; color:var(--muted); margin:-.2rem 0 .7rem; }
  .arr-err { font-size:.8rem; color:var(--red); margin:-.2rem 0 .7rem; }
  .arr-list { position:relative; }
  .arr-card { cursor:default; transition:box-shadow .15s, border-color .15s; }
  .arr-card .m-dish-head { cursor:default; padding:.7rem .4rem .7rem 1rem; }
  .arr-handle { flex:none; margin-left:auto; width:48px; height:48px; border:none; background:none; color:#9A8B7C; font-size:1.45rem; line-height:1; cursor:grab;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; border-radius:10px; }
  .arr-handle:focus-visible { outline:2px solid var(--red); }
  .arr-card.arr-lift { position:relative; z-index:30; border-color:var(--red); box-shadow:0 14px 30px rgba(40,20,10,.28); overflow:visible; }
  .arr-card.arr-lift .arr-handle { cursor:grabbing; color:var(--red); }
  .arr-card.arr-lift::before { content:''; position:absolute; left:1rem; right:1rem; top:-.5rem; height:4px; border-radius:4px; background:var(--red); }
  .m-dish-group { display:flex; align-items:center; gap:.7rem; margin:1.4rem 0 .6rem; font-family:var(--sans); font-size:.62rem; font-weight:600;
                  letter-spacing:.2em; text-transform:uppercase; color:var(--red); }
  .m-dish-group:first-child { margin-top:.2rem; }
  .m-dish-group::after { content:''; flex:1; height:1px; background:var(--border); }
  .m-dish-group small { font-size:.62rem; color:var(--muted); letter-spacing:.08em; font-weight:500; }
  .rv-note { font-size:.74rem; color:var(--text); background:var(--off-white); border-radius:8px; padding:.3rem .5rem; margin-top:.35rem; overflow-wrap:anywhere; }
  .rv-chip { display:inline-block; font-size:.56rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; padding:.16rem .5rem; border-radius:999px; margin-left:.3rem; vertical-align:2px; white-space:nowrap; }
  .rv-chip.in { background:var(--blue-light); color:var(--blue); }
  .rv-chip.ns { background:#F6E2E1; color:var(--red-dark); }
  .rv-chip.cx { background:var(--off-white); color:var(--muted); border:1px solid var(--border); }
  .rv-chip.late { background:var(--amber-light); color:var(--amber); }
  .rv-chip.big { background:#EDE3C9; color:#7A5B12; }
  .rv-acts { display:flex; gap:.35rem; margin-top:.55rem; flex-wrap:wrap; }
  .rv-act { font-family:var(--sans); font-size:.62rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; border-radius:999px; padding:.5rem .75rem; border:1px solid var(--border); background:#fff; color:var(--text); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rv-act.go { background:var(--blue); border-color:var(--blue); color:#fff; }
  .rv-act.no { color:var(--red-dark); border-color:rgba(176,16,21,.35); }
  .rv-act.armed { background:var(--red); border-color:var(--red); color:#fff; }
  .rv-act:disabled { opacity:.5; cursor:wait; }
  .rv-empty { margin:1.5rem 0 0; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.6; padding:2rem 1rem; background:var(--white); border:1px dashed var(--border); border-radius:14px; }
  .rv-rail { position:absolute; left:1rem; top:0; width:54px; height:var(--eh, 360px); pointer-events:none; overflow:hidden;
             -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 30px), transparent 100%);
                     mask-image:linear-gradient(to bottom, transparent 0, #000 30px, #000 calc(100% - 30px), transparent 100%); }
  .rv-pill { position:absolute; left:0; width:54px; height:52px; top:calc(var(--eh, 360px) / 2 - 26px); border-radius:14px; background:var(--ink); box-shadow:0 8px 20px rgba(43,33,26,.25); overflow:hidden; }
  .rv-wheel { position:absolute; left:0; top:0; width:54px; }
  .rv-tick { position:absolute; left:0; width:54px; height:44px; margin-top:-22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
             font-family:var(--serif); font-weight:600; line-height:1; font-variant-numeric:lining-nums; font-feature-settings:"lnum" 1; color:var(--text); }
  .rv-tick small { font-family:var(--sans); font-size:.5rem; letter-spacing:.14em; font-weight:600; color:var(--muted); margin-top:.18rem; }
  .rv-tick.gap { font-family:var(--sans); letter-spacing:.2em; color:var(--muted); }
  .rv-pill .rv-tick { color:var(--white); }
  .rv-pill .rv-tick small { color:rgba(252,249,244,.7); }
  .rv-tick i { position:absolute; right:3px; top:7px; width:5px; height:5px; border-radius:50%; background:var(--red); }
  .rv-pill .rv-tick i { background:#FF9C92; }
  .rv-hand { position:absolute; left:calc(1rem + 54px); width:8px; top:calc(var(--eh, 360px) / 2 - 1px); height:2px; background:var(--ink); border-radius:2px; pointer-events:none; }
  @media (prefers-reduced-motion: reduce) { .rv-w { will-change:auto; } }

  /* ── A TABLE'S QR, SCANNED AT THE DOOR ── */
  .rv-scan { display:flex; align-items:center; justify-content:space-between; gap:.6rem; background:var(--blue-light); border:1px solid var(--blue); color:#1F3F75;
             border-radius:12px; padding:.65rem .75rem .65rem .85rem; margin-bottom:.8rem; font-size:.84rem; line-height:1.45; }
  .rv-scan b { font-weight:600; }
  .rv-scan.done { background:var(--blue-light); }
  .rv-scan-lucky { color:var(--red); }
  .rv-scan.warn { background:var(--amber-light); border-color:#E6D2A8; color:var(--amber); }
  .rv-scan.bad { background:var(--red-light); border-color:rgba(176,16,21,.35); color:var(--red-dark); }
  .rv-scan-go { flex:none; background:var(--blue); border:none; color:#fff; border-radius:999px; padding:.65rem 1.05rem; font-family:var(--sans); font-size:.7rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; }
  .rv-scan-go:disabled { opacity:.55; cursor:wait; }

  .rv-w.scanned { border-color:var(--blue); box-shadow:0 0 0 2px rgba(47,93,168,.35), 0 10px 26px rgba(43,33,26,.14); }

  /* ── SHEET (big-party requests) ── */
  .rv-scrim { position:fixed; inset:0; background:rgba(21,13,9,.45); z-index:300; }
  .rv-sheet { position:fixed; left:0; right:0; bottom:0; z-index:301; max-height:88vh; overflow-y:auto; background:var(--white); border-radius:20px 20px 0 0; padding:.6rem 1.1rem calc(env(safe-area-inset-bottom,0px) + 1.4rem); box-shadow:var(--shadow-lg); max-width:720px; margin:0 auto; }
  .rv-grab { width:44px; height:5px; border-radius:999px; background:var(--border); margin:0 auto .8rem; }
  .rv-sheet-head { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.6rem; }
  .rv-sheet-head .m-h { font-size:1.35rem; margin:0; }
  .rv-x { border:none; background:none; font-size:1.5rem; line-height:1; color:var(--muted); cursor:pointer; padding:.2rem .4rem; }
  .rv-rq { border:1px solid var(--border); border-radius:14px; padding:.85rem .9rem; margin-bottom:.7rem; background:#fff; }
  .rv-rq-when { font-size:.8rem; margin-top:.2rem; }
  .rv-rq-form { margin-top:.7rem; padding-top:.7rem; border-top:1px solid var(--border); }
  /* r29 (Sebastian, 12 Oct: "they look laid over each other"): minmax(0,1fr) and min-width:0 — a phone's date or time field
     has a width of its own, and a plain 1fr column grows to hold it and runs under its neighbour. */
  .rv-form-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.5rem; }
  .rv-form-row > .m-field, .rv-room-grid > .m-field { min-width:0; }
  .rv-public { margin:.55rem 0 .2rem; padding:.55rem .75rem; border-radius:10px; background:var(--blue-light); color:var(--text); font-size:.76rem; line-height:1.5; }
  .rv-public b { color:var(--blue); font-weight:600; }
  .rv-form-row[hidden] { display:none; }   /* "Closed all day" hides Opens/Closes: the grid above would beat hidden */
  .rv-form-row .m-field { margin-top:.6rem; }

  /* ── SETTINGS AND NUMBERS ── */
  .rv-back { border:none; background:none; color:var(--red); font-family:var(--sans); font-size:.74rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; padding:.2rem 0 .8rem; }
  .rv-nums { width:100%; border-collapse:collapse; font-size:.8rem; margin-top:.3rem; }

  .rv-nums td b { font-weight:600; }

  /* r33 (Sebastian, 14 Oct): the prize is picked from five tiles (his choice,
     option B), and every reward has the restaurant's own terms. */
  .rv-l-pick { margin:.6rem 0 .1rem; }
  .rv-l-tiles { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .rv-l-tile { height:70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border-radius:12px; border:1px solid #E2D6C6; background:#fff; color:var(--text); font-family:var(--sans); font-size:.69rem; font-weight:500; cursor:pointer; padding:0; min-width:0; -webkit-tap-highlight-color:transparent; }

  .rv-l-terms { margin:.75rem 0 .2rem; }

  .rv-l-stat { font-size:.78rem; color:var(--muted); line-height:1.6; padding-top:.3rem; }

  .rv-l-list { margin-top:.8rem; border-top:1px solid var(--border); }
  .rv-l-item { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.8rem; }
  .rv-l-item b { display:block; font-weight:500; }
  .rv-l-item span { display:block; color:var(--muted); font-size:.74rem; }
  .rv-l-item em { font-style:normal; font-size:.66rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; padding:.25rem .55rem; border-radius:999px; background:var(--off-white); color:var(--muted); }
  .rv-l-item em.rv-l-ready { background:var(--red-light); color:var(--red-dark); }

  .rv-rule { display:flex; align-items:center; justify-content:space-between; gap:.8rem; padding:.6rem 0; border-bottom:1px solid var(--border); }
  .rv-rule:last-of-type { border-bottom:none; }

  .rv-codebar { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin:0 0 .9rem; padding:.5rem .6rem .5rem .85rem; background:var(--white);

  .rv-code-link { display:inline-flex; align-items:center; gap:.4rem; text-decoration:none; color:var(--text); padding:.4rem .8rem; }
  .rv-mini { border:1px solid var(--border); background:#fff; color:var(--muted); border-radius:999px; padding:.28rem .7rem; font-size:.64rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-family:var(--sans); flex:none; }

  .rv-readonly { font-size:.74rem; color:var(--muted); background:var(--off-white); border-radius:10px; padding:.6rem .8rem; margin-bottom:1rem; line-height:1.55; }

  /* ═══ GUEST MESSAGES (r21, Sebastian 8 Oct: pictures 13 and 17) ═══ */
  /* The card: the code moves beside the time; the chat sign takes the right of the name line. */
  .rv-when { justify-content:flex-start; gap:.7rem; }
  .rv-name { display:flex; align-items:flex-start; gap:.5rem; }
  .rv-name-text { flex:1; min-width:0; }

  .rv-chat-sign svg { width:20px; height:20px; }

<script>
// r36 (Sebastian, 16 Oct): the way back. "‹ Site" goes back to the page you came from, as you left it (the
// browser's own Back, so that page comes back where it was), and says which page: "‹ Manager", "‹ Menu"…
// Opened from outside the site (a QR code, an email, a typed address) it stays "‹ Site" and goes home. A page
// that opened in a new tab (its address has nt=1) closes that tab, which shows the page that opened it. Places
// this page adds to the browser's history (a #hash, a dish) are skipped. The same lines on every page (the tests
// check they match).
(function(){
  var NAMES={'':'Site',index:'Site',menu:'Menu',manager:'Manager',reservations:'Reservations',checkin:'Check In',rewards:'Reward terms',terms:'Terms',privacy:'Privacy',invite:'Invite'};
  function page(p){return String(p||'').replace(/^\/+|\/+$/g,'').replace(/\.html$/,'');}
  var from=null,depth=0,H=window.history,newTab=/[?&]nt=1(&|$)/.test(location.search);
  try{
    var r=document.referrer?new URL(document.referrer):null,rp=r?page(r.pathname):'';
    // (the home page with ?dish= in its address only passes the visitor on to the menu: it is not a page to go back to)
    if(r&&r.origin===location.origin&&rp!==page(location.pathname)&&Object.prototype.hasOwnProperty.call(NAMES,rp)
       &&!((rp===''||rp==='index')&&/[?&]dish=/.test(r.search)))from=r;
  }catch(e){}
  try{
    var push=H.pushState,rep=H.replaceState;
    var mark=function(s){if(s===null||s===undefined)s={};if(typeof s==='object'&&!Array.isArray(s)){s=Object.assign({},s);s.hfDepth=depth;}return s;};
    if(H.state&&typeof H.state.hfDepth==='number')depth=H.state.hfDepth;
    rep.call(H,mark(H.state),'');
    H.pushState=function(s,t,u){depth++;return push.call(H,mark(s),t,u);};
    H.replaceState=function(s,t,u){return rep.call(H,mark(s),t,u);};
    window.addEventListener('popstate',function(){var s=H.state;if(s&&typeof s.hfDepth==='number')depth=s.hfDepth;});
    window.addEventListener('hashchange',function(){var s=H.state;if(s&&typeof s.hfDepth==='number')depth=s.hfDepth;else{depth++;rep.call(H,mark(s),'');}});
  }catch(e){}
  function go(){location.href=from?from.href:'/';}
  window.hfBackFrom=from?NAMES[page(from.pathname)]:null;
  window.hfBackCan=function(){return !!from&&H.length>depth+1;};
  window.hfBack=function(){
    if(!from){location.href='/';return;}
    if(H.length<=depth+1){if(newTab){try{window.close();}catch(e){}}setTimeout(go,newTab?300:0);return;}
    var t=setTimeout(go,900);
    window.addEventListener('pagehide',function(){clearTimeout(t);});
    H.go(-(depth+1));
  };
  function paint(){
    var els=document.querySelectorAll('[data-hf-back]');
    for(var i=0;i<els.length;i++){
      var a=els[i],name=window.hfBackFrom;
      if(from)a.setAttribute('href',from.href);
      if(a.getAttribute('data-hf-back')==='icon')a.setAttribute('aria-label',name?'Back to '+name:'Home');
      else a.textContent='‹ '+(name||'Site');
      if(!a.hfBack){a.hfBack=1;a.addEventListener('click',function(ev){if(!from||ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.altKey)return;ev.preventDefault();window.hfBack();});}
    }
  }
  paint();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',paint);
})();

// caller's role against the database before it writes a single column. If

const SUPABASE_URL = 'https://pkdwrjwsqrlfdxgqmpva.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrZHdyandzcXJsZmR4Z3FtcHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NjczMTksImV4cCI6MjA5ODM0MzMxOX0.eeD6NYU4u-heag5LbkZJT-jENI3AuodlMzebOsxOv2c';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function callApi(path, options){
  const res = await fetch(path, options);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){}
  if(data === null && !res.ok){
    const snippet = text.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);

      + (snippet ? ' — "'+snippet+'"' : '')

  RESTAURANT = ACCESS.restaurants.find(r=>String(r.id)===String(RESTAURANT&&RESTAURANT.id)) || ACCESS.restaurants[0];
  // A table's QR in the address: open that table. 'out' = the session ended
  // while asking; the login card is already up and the QR waits for the log-in.
  if(await rvTakeScan() === 'out') return;
  mountPage();
  // The role icon in the header, with guest messages waiting, comes here.
  if(window.location.hash === '#messages') msgOpenFromHash();
  if(/^#support/.test(window.location.hash)) supFromHash();     // r34: the link in a support email
  supStart();
}

// Draws the page for the current tab and loads what that tab needs.
function mountPage(){
  render();
  if(TAB==='reservations') rvStart();
  else if(TAB==='menu' && !DISHES_LOADED) loadDishes();
  if(TAB==='menu' && TR.rid!==RESTAURANT.id) trLoad();          // r36: the Top Rated caves
  else if(TAB==='team') loadPeople();

function levelHere(){ return RESTAURANT ? Number(RESTAURANT.level)||0 : 0; }
// Crew (1) see Reservations only; everyone above sees all three.
function allowedTabs(){ return levelHere() >= 2 ? ['reservations','menu','team'] : ['reservations']; }

function switchTab(t){
  if(!allowedTabs().includes(t) || t===TAB) return;

  if(history.replaceState) history.replaceState(null, '', '#'+t);
  if(t!=='reservations'){ RV.view = 'day'; document.body.classList.remove('rv-mode'); rvPaintSheet(); }

window.addEventListener('hashchange', function(){

async function loadDishes(){

// ── TOP RATED ON THE MENU (r36, Sebastian 16 Oct 12:45) ──
// The menu has four Top Rated caves: Starters, Entrées, Salads and Drinks, each with the best rated dishes of
// that part of the menu. Here the manager chooses how many each shows (1 to 10) or switches it off. Every
// change is saved by itself a moment later (several taps, one save). The server: api/_lib/menuset.js.
const TR_KINDS = [['starters','Starters','starters'], ['entree','Entrées','entrées'], ['salads','Salads','salads'], ['drinks','Drinks','drinks']];
let TR = { rid:null, loaded:false, ready:true, failed:false, top:null, last:{}, error:'', note:'', timer:null, busy:false, again:false };
async function trLoad(){
  const rid = RESTAURANT.id;
  clearTimeout(TR.timer);
  TR = { rid:rid, loaded:false, ready:true, failed:false, top:null, last:{}, error:'', note:'', timer:null, busy:false, again:false };
  trPaint();
  try{
    const d = await rvApi({action:'menu_settings'});
    if(TR.rid !== rid) return;
    TR.top = d.top; TR.ready = d.ready !== false; TR.error = d.ready === false ? (d.error || '') : '';
  }catch(e){
    if(TR.rid !== rid) return;
    TR.failed = true; TR.error = e.message; TR.top = {starters:5, entree:5, salads:5, drinks:5};
  }
  TR.loaded = true;
  TR_KINDS.forEach(k => { TR.last[k[0]] = TR.top[k[0]] > 0 ? TR.top[k[0]] : 5; });
  trPaint();
}
function trCardHtml(){ return '<div class="m-card tr-card" id="tr-card">'+trInner()+'</div>'; }
function trInner(){
  const head = '<div class="m-eyebrow">Top Rated on the menu</div>'
    + '<div class="tr-lead">The best rated dishes of each part of the menu, in their own cave. Choose how many each one shows, or switch it off.</div>';
  if(!TR.loaded) return head + '<div class="tr-note">Loading…</div>';
  const locked = !TR.ready || TR.failed;
  return head + TR_KINDS.map(function(k){
      const n = TR.top[k[0]], on = n > 0;
      const sub = !on ? 'Not on the menu' : (n === 1 ? 'The best rated of the '+k[2] : 'The best '+n+' '+k[2]);
      return '<div class="tr-row'+(on?'':' off')+'" id="tr-row-'+k[0]+'">'
        + '<div class="tr-name"><b>Top Rated '+k[1]+'</b><small id="tr-sub-'+k[0]+'">'+sub+'</small></div>'
        + '<div class="tr-ctrl">'
        +   (on ? '<span class="tr-step"><button type="button" class="tr-b" id="tr-minus-'+k[0]+'" aria-label="One dish fewer" onclick="trStep(\''+k[0]+'\',-1)"'+(locked||n<=1?' disabled':'')+'>&minus;</button>'
               + '<span class="tr-n" id="tr-n-'+k[0]+'" aria-live="polite">'+n+'</span>'
               + '<button type="button" class="tr-b" id="tr-plus-'+k[0]+'" aria-label="One dish more" onclick="trStep(\''+k[0]+'\',1)"'+(locked||n>=10?' disabled':'')+'>+</button></span>' : '')
        +   '<button type="button" class="m-switch'+(on?' on':'')+'" id="tr-sw-'+k[0]+'" role="switch" aria-checked="'+on+'" aria-label="Top Rated '+k[1]+' on the menu" onclick="trSwitch(\''+k[0]+'\')"'+(locked?' disabled':'')+'></button>'
        + '</div></div>';
    }).join('')
    + (TR.error ? '<div class="tr-err" id="tr-err">'+esc(TR.error)+'</div>' : '')
    + '<div class="tr-note" id="tr-note">'+esc(TR.note || 'Up to 10 dishes each. A dish nobody has rated in the last twelve months is not in them.')+'</div>';
}
function trPaint(){ const c = document.getElementById('tr-card'); if(c) c.innerHTML = trInner(); }
function trSet(k, n){
  if(!TR.loaded || !TR.ready || TR.failed) return;
  TR.top[k] = Math.max(0, Math.min(10, n));
  if(TR.top[k] > 0) TR.last[k] = TR.top[k];
  TR.note = 'Saving…'; TR.error = '';
  trPaint();
  clearTimeout(TR.timer);
  TR.timer = setTimeout(trSave, 600);
}
function trSwitch(k){ trSet(k, TR.top[k] > 0 ? 0 : (TR.last[k] || 5)); }
function trStep(k, d){ if(TR.top[k] > 0) trSet(k, Math.max(1, Math.min(10, TR.top[k] + d))); }
async function trSave(){
  if(TR.busy){ TR.again = true; return; }
  const rid = TR.rid, sent = Object.assign({}, TR.top);
  TR.busy = true;
  try{
    await rvApi({action:'menu_top_save', top:sent});
    if(TR.rid !== rid) return;
    TR.note = TR.again ? 'Saving…' : 'Saved. The menu shows it now.'; TR.error = '';
  }catch(e){
    if(TR.rid !== rid) return;
    TR.error = e.message; TR.note = '';
  }finally{ if(TR.rid === rid) TR.busy = false; }
  trPaint();
  if(TR.again){ TR.again = false; trSave(); }
}

// r30 (Sebastian, 13 Oct: "not all mixed together"): the dishes in groups, in the menu's own order — Starters,
// Entrées, Salads, Sides, Drinks — each under its heading with how many dishes it has. Inside a group the
// menu's order (sort_order) stays. A category the menu does not know yet gets its own group at the end.
const DISH_GROUPS = [['chefs-pick', "Chef's Pick"], ['starters', 'Starters'], ['appetizers', 'Appetizers'], ['entree', 'Entrées'], ['salads', 'Salads'],
                     ['sides', 'Sides'], ['desserts', 'Desserts'], ['drinks', 'Drinks']];
// r36 (Sebastian, 16 Oct, option B): "Change the order" beside a group's name puts that group in order mode:
// each dish a short card with ☰; hold ☰ and drag the dish where it goes; "Done" saves. The menu shows each
// part in that order (the fish before the steak).
const dishKeyOf = d => String(d.restaurant_category || '').trim().toLowerCase();
function dishGroupsHtml(rows){
  const known = DISH_GROUPS.map(g => g[0]);
  const keyOf = dishKeyOf;
  const extra = [...new Set(rows.map(keyOf).filter(k => known.indexOf(k) < 0))];
  const label = k => k ? k.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Other';
  return DISH_GROUPS.concat(extra.map(k => [k, label(k)])).map(function(g){
    const list = rows.filter(d => keyOf(d) === g[0]);
    if(!list.length) return '';
    const arranging = ARR && ARR.key === g[0];
    const btn = list.length < 2 ? ''
      : arranging ? '<button type="button" class="dg-arrange done" id="dg-done" onclick="arrDone()"'+(ARR.saving?' disabled':'')+'>'+(ARR.saving?'Saving…':'Done')+'</button>'
      : '<button type="button" class="dg-arrange" data-group="'+esc(g[0])+'" onclick="arrStart(this.dataset.group)">Change the order</button>';
    const head = btn ? '<div class="m-dish-group has-btn"><span role="heading" aria-level="3">'+esc(g[1])+' <small>'+list.length+'</small></span>'+btn+'</div>'
                     : '<div class="m-dish-group" role="heading" aria-level="3">'+esc(g[1])+' <small>'+list.length+'</small></div>';
    if(!arranging) return head + list.map(dishCard).join('');
    const byId = {}; list.forEach(d => { byId[d.id] = d; });
    return head
      + '<div class="arr-hint" id="arr-hint">Hold <b>☰</b> and drag a dish to its place. Tap <b>Done</b> to save.</div>'
      + (ARR.error ? '<div class="arr-err" id="arr-err">'+esc(ARR.error)+'</div>' : '')
      + '<div class="arr-list" id="arr-list">' + ARR.ids.map(id => byId[id] ? arrCard(byId[id]) : '').join('') + '</div>';
  }).join('');
}

// ── CHANGE THE ORDER (r36) ──
let ARR = null;          // { key, ids (in the new order), orig, saving, error }
let ARR_DRAG = null;
function arrRows(key){ return DISHES_ROWS.filter(d => dishKeyOf(d) === key); }
async function arrStart(key){
  if(ARR && ARR.key === key) return;
  if(ARR && ARR.saving) return;
  if(ARR && arrChanged()){ const ok = await arrDone(); if(!ok) return; }
  const ids = arrRows(key).map(d => d.id);
  ARR = { key:key, ids:ids, orig:ids.slice(), saving:false, error:'' };
  openDishId = null;
  render();
  const g = document.getElementById('arr-list');
  if(g){ const top = g.getBoundingClientRect().top + window.scrollY - 150; if(top < window.scrollY) window.scrollTo(0, Math.max(0, top)); }
}
function arrChanged(){ return !!ARR && ARR.ids.join() !== ARR.orig.join(); }
function arrCard(d){
  return '<div class="m-dish arr-card'+(d.is_hidden?' is-hidden':'')+'" id="arr-'+d.id+'" data-id="'+d.id+'">'
    + '<div class="m-dish-head">'
    +   dishThumb(d)
    +   '<div class="m-dish-id"><div class="m-dish-name">'+esc(d.name)+'</div>'
    +   '<div class="m-dish-meta">$'+Number(d.price||0).toFixed(2)+' &middot; '+esc(d.restaurant_category||'')+(d.is_hidden?' &middot; hidden':'')+'</div></div>'
    +   '<button type="button" class="arr-handle" aria-label="Move '+esc(d.name)+' (drag, or the arrow keys)" onpointerdown="arrDown(event,'+d.id+')" onkeydown="arrKey(event,'+d.id+')">☰</button>'
    + '</div></div>';
}
function arrSync(){
  const list = document.getElementById('arr-list');
  if(list && ARR) ARR.ids = [...list.querySelectorAll('.arr-card')].map(c => Number(c.dataset.id));
}
function arrDown(ev, id){
  if(!ARR || ARR.saving || (ev.button !== undefined && ev.button > 0)) return;
  const card = document.getElementById('arr-'+id), list = document.getElementById('arr-list');
  if(!card || !list) return;
  ev.preventDefault();
  const h = ev.currentTarget;
  try{ h.setPointerCapture(ev.pointerId); }catch(e){}
  ARR_DRAG = { card:card, list:list, handle:h, startY:ev.clientY, y:ev.clientY, raf:null };
  card.classList.add('arr-lift');
  h.addEventListener('pointermove', arrMove);
  h.addEventListener('pointerup', arrUp);
  h.addEventListener('pointercancel', arrUp);
  ARR_DRAG.raf = requestAnimationFrame(arrEdge);
}
function arrMove(ev){ if(!ARR_DRAG) return; ev.preventDefault(); ARR_DRAG.y = ev.clientY; arrPlace(); }
// The card follows the finger; when its middle passes a neighbour's middle, it takes that place.
function arrPlace(){
  const D = ARR_DRAG; if(!D) return;
  D.card.style.transform = 'translateY('+(D.y - D.startY)+'px) rotate(-1.2deg)';
  const cards = [...D.list.querySelectorAll('.arr-card')], i = cards.indexOf(D.card);
  const r = D.card.getBoundingClientRect(), mid = r.top + r.height/2;
  const prev = cards[i-1], next = cards[i+1];
  let move = null;
  if(prev){ const p = prev.getBoundingClientRect(); if(mid < p.top + p.height/2) move = () => D.list.insertBefore(D.card, prev); }
  if(!move && next){ const n = next.getBoundingClientRect(); if(mid > n.top + n.height/2) move = () => D.list.insertBefore(D.card, next.nextSibling); }
  if(!move) return;
  const before = D.card.offsetTop; move(); D.startY += D.card.offsetTop - before;
  arrPlace();
}
// Near the top or the bottom of the screen the page scrolls by itself, so a dish can go anywhere in a long list.
function arrEdge(){
  const D = ARR_DRAG; if(!D) return;
  const topEdge = 120, h = window.innerHeight;
  let v = 0;
  if(D.y < topEdge) v = -Math.ceil((topEdge - D.y) / 6);
  else if(D.y > h - 70) v = Math.ceil((D.y - (h - 70)) / 6);
  if(v){ const was = window.scrollY; window.scrollBy(0, v); const moved = window.scrollY - was; if(moved){ D.startY -= moved; arrPlace(); } }
  D.raf = requestAnimationFrame(arrEdge);
}
function arrUp(){
  const D = ARR_DRAG; if(!D) return;
  ARR_DRAG = null;
  cancelAnimationFrame(D.raf);
  D.handle.removeEventListener('pointermove', arrMove);
  D.handle.removeEventListener('pointerup', arrUp);
  D.handle.removeEventListener('pointercancel', arrUp);
  D.card.style.transform = '';
  D.card.classList.remove('arr-lift');
  arrSync();
}
// Without a finger or a mouse: the arrow keys move the dish one place.
function arrKey(ev, id){
  if(!ARR || ARR.saving || (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown')) return;
  ev.preventDefault();
  const card = document.getElementById('arr-'+id), list = document.getElementById('arr-list');
  if(!card || !list) return;
  if(ev.key === 'ArrowUp' && card.previousElementSibling) list.insertBefore(card, card.previousElementSibling);
  if(ev.key === 'ArrowDown' && card.nextElementSibling) list.insertBefore(card.nextElementSibling, card);
  arrSync();
  const h = card.querySelector('.arr-handle'); if(h) h.focus();
}
// Done: the new order goes to the server (only if something moved). The screen keeps it only once it is saved.
async function arrDone(){
  if(!ARR || ARR.saving) return false;
  arrSync();
  if(!arrChanged()){ ARR = null; render(); return true; }
  ARR.saving = true; ARR.error = ''; render();
  const key = ARR.key, ids = ARR.ids.slice();
  try{
    await rvApi({action:'dish_order_save', ids:ids});
  }catch(e){
    if(ARR && ARR.key === key){ ARR.saving = false; ARR.error = e.message; render(); }
    return false;
  }
  // The group's dishes take the same places in the list, in the new order; the other groups do not move.
  const moved = ids.map(id => rowFor(id)).filter(Boolean);
  moved.forEach((d, i) => { d.sort_order = i + 1; });
  let k = 0;
  DISHES_ROWS = DISHES_ROWS.map(d => moved.indexOf(d) >= 0 ? moved[k++] : d);
  ARR = null;
  render();
  showToast('New order saved. The menu shows it now.');
  return true;
}

// The dish's small photo (the plate picture, or the open-cut one if there is no plate), through Vercel's image
// service like the menu; a photo that cannot be loaded gives the emoji back.
function dishThumb(d){
  const emoji = esc(d.emoji || '🍽️');
  const file = String(d.image || d.image_open || '');
  if(!file) return '<span class="m-dish-emoji">'+emoji+'</span>';
  const src = typeof hfImgSrc === 'function' ? hfImgSrc(file, 54) : file;
  return '<span class="m-dish-thumb" data-emoji="'+emoji+'"><img src="'+esc(src)+'" data-orig="'+esc(file)+'" alt="" width="54" height="54" loading="lazy" decoding="async" onerror="dishThumbBad(this)"></span>';

function dishThumbBad(img){
  if(typeof hfImgBack === 'function' && hfImgBack(img)) return;          // the original file, once
  const box = img.parentNode;
  if(box){ box.className = 'm-dish-emoji'; box.textContent = box.getAttribute('data-emoji') || '🍽️'; }

    // Visible from the list, because a dish with no allergens declared is the

    .concat(allergenCount(d) === 0 ? '<span class="m-flag sold">No allergens set</span>' : []);

  return '<div class="m-dish'+(open?' open':'')+(d.is_hidden?' is-hidden':'')+'" id="dish-'+d.id+'">'

    +   dishThumb(d)
    +   '<div class="m-dish-id">'
    +     '<div class="m-dish-name">'+esc(d.name)+'</div>'
    +     '<div class="m-dish-meta">$'+Number(d.price||0).toFixed(2)+' &middot; '+esc(d.restaurant_category||'')+'</div>'
    +     (flags.length?'<div class="m-flags">'+flags.join('')+'</div>':'')
    +   '</div>'
    +   '<span class="m-dish-caret">&#9656;</span>'
    + '</div>'
    + '<div class="m-dish-body">'
    +   switchRow(d.id,'sold_out',soldOut,'Sold out','Comes off the menu as sold out and stays that way until you switch it back. Nothing resets it overnight.',true)
    +   switchRow(d.id,'is_hidden',!!d.is_hidden,'Hidden from the menu','Nobody sees this dish on the site at all. Use it for a dish that is off for the season.',false)
    +   switchRow(d.id,'is_chefs_pick',!!d.is_chefs_pick,'Chef\'s Pick','Only one dish at a time. Turning this on takes it off whichever dish has it now.',false)
    +   textFields(d)
    +   '<div class="m-actions">'
    +     '<button class="m-save" id="save-'+d.id+'" onclick="saveText('+d.id+')" disabled>Save changes</button>'
    +     '<button class="m-revert" onclick="revert('+d.id+')">Undo</button>'
    +   '</div>'
    +   '<div class="m-locked"><strong>Photos are not editable here.</strong> Photography is work Seb\'s Analytics is paid for &mdash; message Seb to change a dish photo. Everything else about this dish is yours to edit.</div>'
    + '</div>'
    + '</div>';
}

function switchRow(dishId, field, on, label, note, warn){
  return '<div class="m-switch-row">'
    + '<div><div class="m-switch-label">'+label+'</div><div class="m-switch-note">'+note+'</div></div>'
    + '<button class="m-switch'+(on?' on':'')+(warn?' warn':'')+'" id="sw-'+dishId+'-'+field+'"'
    +   ' role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="'+label+'"'
    +   ' onclick="toggleFlag('+dishId+',\''+field+'\')"></button>'
    + '</div>';
}

function textFields(d){
  const f = (field,label,value,type)=>{
    const id = 'f-'+d.id+'-'+field;
    const control = type==='area'
      ? '<textarea class="m-textarea" id="'+id+'" oninput="dirty('+d.id+',\''+field+'\')" maxlength="'+(LIMITS[field]+200)+'">'+esc(value||'')+'</textarea>'
      : '<input class="m-input" id="'+id+'" value="'+esc(value==null?'':value)+'" oninput="dirty('+d.id+',\''+field+'\')"'
        + (type==='price'?' type="number" step="0.01" min="0" max="10000" inputmode="decimal"':'')+'>';
    const counter = LIMITS[field] ? '<div class="m-count" id="c-'+d.id+'-'+field+'">'+String(value||'').length+' / '+LIMITS[field]+'</div>' : '';
    return '<div class="m-field"><div class="m-field-label">'+label+'</div>'+control+counter+'</div>';
  };
  return f('name','Dish name',d.name,'text')
    + f('price','Price',d.price,'price')
    + f('description','Short description',d.description,'area')
    + f('about','About this dish',d.about,'area')
    + f('ingredients','Ingredients (comma separated)',d.ingredients,'area')
    + f('modifications','Modifications',d.modifications,'area')
    + f('wine','Wine pairing',d.wine,'text')
    + f('cocktail','Cocktail pairing',d.cocktail,'text')
    + classifySection(d)
    + allergenSection(d);
}

    ['allergen_sulphites','Sulphites'], ['allergen_lupin','Lupin'],

  { title: 'Everything else', items: [

// How the dish is classified. Plain short labels, used for search and for the

// Which collapsible sections are open, by dish. Kept outside the render so a

let openGroups = {};
function groupOpen(dishId, key){ return !!(openGroups[dishId] && openGroups[dishId][key]); }
function toggleGroup(dishId, key){

function allergenCount(d){ return ALLERGEN_KEYS.filter(k => d[k] === true).length; }

function allergenSection(d){

// An allergen saves the moment it is ticked. No Save button between a manager
// remembering the dish has sesame in it and the warning reaching a customer.
async function toggleAllergen(dishId, key, checked){
  const d = rowFor(dishId); if(!d) return;

async function addPerson(){
  const phoneEl = document.getElementById('add-phone');
  const roleEl  = document.getElementById('add-role');
  const btn     = document.getElementById('add-btn');
  const phone = (phoneEl.value||'').trim();
  if(!phone){ showToast('Enter a phone number'); return; }

  btn.disabled = true; btn.textContent = 'Adding…';
  try{
    const {res, data} = await callApi('/api/roles', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
      body:JSON.stringify({action:'grant', restaurantId:RESTAURANT.id, phone, role:roleEl.value})
    });

    else {
      showToast(whoText(data.added.name, data.added.username)+' is now '+ROLE_LABEL[data.added.role]);
      phoneEl.value='';
      await loadPeople();

async function removePerson(roleId){
  const who = PEOPLE && PEOPLE.people ? PEOPLE.people.find(x => Number(x.id)===Number(roleId)) : null;
  if(!confirm('Remove '+(who ? whoText(who.name, who.username) : 'this person')+'?')) return;
  try{
    const {res, data} = await callApi('/api/roles', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
      body:JSON.stringify({action:'revoke', restaurantId:RESTAURANT.id, roleId})
    });
    if(!res.ok){ showToast(data.error||'Could not remove that person.'); return; }
    showToast('Removed');
    loadPeople();
  }catch(e){ showToast(e.message||'Network error.'); }
}

// ── INTERACTION ──
function toggleDish(id){
  openDishId = String(openDishId)===String(id) ? null : id;
  render();
}

function switchRestaurant(id){
  RESTAURANT = ACCESS.restaurants.find(r=>String(r.id)===String(id)) || RESTAURANT;
  openDishId = null;
  PEOPLE = null;          // the previous restaurant's people are not this one's
  DISHES_ROWS = []; DISHES_LOADED = false; DISHES_ERROR = null;
  rvReset(); rvPaintSheet();
  mountPage();
}

function rowFor(id){ return DISHES_ROWS.find(d=>String(d.id)===String(id)); }

function dirty(id, field){
  const d = rowFor(id); if(!d) return;
  const el = document.getElementById('f-'+id+'-'+field);
  const counter = document.getElementById('c-'+id+'-'+field);
  if(counter && LIMITS[field]){
    const n = el.value.length;
    counter.textContent = n+' / '+LIMITS[field];
    counter.classList.toggle('over', n>LIMITS[field]);
  }
  const changed = collectText(id);
  const save = document.getElementById('save-'+id);
  if(save) save.disabled = !Object.keys(changed).length || anyOver(id);
}

function anyOver(id){
  return Object.keys(LIMITS).some(field=>{
    const el = document.getElementById('f-'+id+'-'+field);
    return el && el.value.length > LIMITS[field];
  });
}

// Only the fields that actually differ get sent, so two managers editing
// different parts of the same dish do not overwrite each other's work.
function collectText(id){
  const d = rowFor(id); if(!d) return {};
  const out = {};
  const priceEl = document.getElementById('f-'+id+'-price');
  if(priceEl){
    const n = Number(priceEl.value);
    if(priceEl.value!=='' && Number.isFinite(n) && Math.round(n*100)!==Math.round(Number(d.price||0)*100)) out.price = n;
  }
  const TEXTY = ['name','description','about','ingredients','modifications','wine','cocktail','allergens_text']
    .concat(CLASSIFY_FIELDS.map(c=>c[0]));
  TEXTY.forEach(field=>{
    const el = document.getElementById('f-'+id+'-'+field);
    if(!el) return;
    const now = el.value.trim();
    const before = (d[field]==null?'':String(d[field])).trim();
    if(now !== before) out[field] = now.length ? now : null;
  });
  return out;
}

function revert(id){ render(); }

async function toggleFlag(id, field){
  const d = rowFor(id); if(!d) return;
  const btn = document.getElementById('sw-'+id+'-'+field);
  const current = field==='sold_out' ? !!d.sold_out_until : !!d[field];
  if(btn) btn.disabled = true;
  const saved = await save(id, { [field]: !current });
  if(btn) btn.disabled = false;
  if(saved) showToast(labelFor(field)+(!current?' on':' off')+' · '+d.name);
}

function labelFor(f){
  return f==='sold_out' ? 'Sold out' : f==='is_hidden' ? 'Hidden' : 'Chef\'s Pick';
}

async function saveText(id){
  const changes = collectText(id);
  if(!Object.keys(changes).length) return;
  const btn = document.getElementById('save-'+id);
  if(btn){ btn.disabled = true; btn.textContent='Saving…'; }
  const saved = await save(id, changes);
  if(btn){ btn.textContent='Save changes'; btn.disabled = true; }
  if(saved) showToast('Saved');
}

// The one path to the server. It replaces the whole row from the response, so
// what the screen shows after a save is what the database actually holds —
// including the Chef's Pick that just moved off another dish.
async function save(id, changes){
  try{
    const {res, data} = await callApi('/api/manager-dish',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession},
      body:JSON.stringify({dishId:id, changes})
    });
    if(res.status===401){ showToast('Your session expired. Please log in again.'); logout(); boot(); return false; }
    if(!res.ok){ showToast(data.error||'Could not save that.'); return false; }

    const i = DISHES_ROWS.findIndex(d=>String(d.id)===String(id));
    if(i>=0) DISHES_ROWS[i] = data.dish;
    // Chef's Pick is exclusive, so the server may have cleared it elsewhere.
    if(data.dish.is_chefs_pick) DISHES_ROWS.forEach(d=>{ if(String(d.id)!==String(id)) d.is_chefs_pick=false; });
    render();
    return true;
  }catch(e){
    showToast(e.message || 'Network error. Please try again.');
    return false;
  }
}
