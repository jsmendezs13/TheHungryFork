<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hungry Fork — Menu</title>
<style>body{background:#150D09;}</style>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var d=p.get('dish'), c=p.get('cat');
  var h='#/menu';
  if(d)h='#/dish/'+encodeURIComponent(d);
  else if(c)h='#/menu/'+encodeURIComponent(c);
  location.replace('index.html'+h);
})();
</script>
</head>
<body><noscript><a href="index.html" style="color:#fff;font-family:sans-serif;">Open The Hungry Fork</a></noscript></body>
</html>
